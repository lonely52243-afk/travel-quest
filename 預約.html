<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>交修件預約檢驗系統</title>
<style>
  :root {
    --bg-main: #15325c;
    --card-bg: #ffffff;
    --text-title: #15325c;
    --text-main: #333333;
    --text-sub: #888888;
    --border-color: #15325c;
    --btn-bg: #15325c;
    --btn-text: #ffffff;
  }
  
  * { box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #viewLogin {
    margin: auto; width: 100%; max-width: 400px; text-align: center;
    padding: 40px 24px; border-radius: 20px; background: var(--card-bg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  #viewLogin h2 { color: var(--text-title); font-size: 28px; font-weight: bold; margin: 0 0 8px 0; letter-spacing: 2px; }
  #viewLogin p.subtitle { color: var(--text-sub); font-size: 15px; margin-bottom: 24px; }

  .container { width: 100%; max-width: 600px; margin: 0 auto; }

  .card {
    background: var(--card-bg); border-radius: 16px; padding: 24px;
    margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  h2, h3 { color: var(--text-title); margin-top: 0; font-weight: bold; }
  h2 { font-size: 24px; }
  h3 { font-size: 18px; margin-bottom: 16px; border-bottom: 2px solid #eef2f6; padding-bottom: 10px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .topbar h2 { margin: 0; color: #ffffff; }

  label { font-size: 14px; font-weight: 600; color: var(--text-title); margin-bottom: 8px; display: block; }
  
  input, select {
    font-size: 16px; width: 100%; padding: 12px 16px;
    border: 2px solid var(--border-color); border-radius: 10px; margin-bottom: 16px;
    background-color: #fff; color: var(--text-main); font-family: inherit;
    appearance: none; -webkit-appearance: none; outline: none;
  }
  
  input:focus, select:focus { box-shadow: 0 0 0 3px rgba(21, 50, 92, 0.2); }

  button {
    font-size: 16px; font-weight: bold; width: 100%; padding: 14px;
    border: none; border-radius: 10px; background-color: var(--btn-bg); color: var(--btn-text);
    cursor: pointer; transition: all 0.2s; letter-spacing: 1px; font-family: inherit;
  }
  button:active { background-color: #0d213f; transform: scale(0.98); }
  
  button.btn-secondary {
    background-color: transparent; border: 2px solid var(--border-color);
    color: var(--border-color); width: auto; padding: 8px 16px; font-size: 14px;
  }

  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row > select { flex: 1; margin-bottom: 0; }
  .row > button { flex: 0 0 auto; width: auto; padding: 0 16px; height: 50px; margin-bottom: 16px; border-radius: 10px; background-color: #4a6b95; }
  
  .hidden { display: none !important; }
  
  .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
  .status-pending { background: #ffe5e5; color: #d93025; }
  .status-done { background: #e6f4ea; color: #1e8e3e; }
  
  .list-item { border-bottom: 1px dashed #ddd; padding-bottom: 16px; margin-bottom: 16px; }
  .list-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .item-title { font-size: 17px; font-weight: bold; color: var(--text-title); margin-bottom: 8px; }
  .item-detail { font-size: 14px; color: #555; margin-bottom: 4px; }

  /* 分頁標籤 (Tabs) */
  .tabs { display: flex; background: rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .tab-btn { flex: 1; background: transparent; color: #ffffff; border: none; padding: 12px 0; border-radius: 8px; font-size: 15px; transition: all 0.3s ease; }
  .tab-btn.active { background: #ffffff; color: var(--bg-main); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: #ffffff; color: #333; padding: 12px 24px; border-radius: 30px;
    font-size: 14px; font-weight: bold; opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.error { background: #d93025; color: white; }

  #loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(21, 50, 92, 0.8); display: flex; justify-content: center; align-items: center;
    z-index: 999; font-weight: bold; color: #ffffff; font-size: 18px;
  }

  /* 分析報表 */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat-box { background: #f4f6f9; padding: 16px; border-radius: 12px; text-align: center; border: 1px solid #eef2f6; }
  .stat-box span { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
  .stat-box strong { font-size: 24px; color: var(--text-title); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 16px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; }
  th { color: var(--text-title); font-weight: bold; background-color: #f9f9f9; }
  
  .month-group { border: 1px solid #eef2f6; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .month-title { background: #f4f6f9; padding: 12px 16px; font-weight: bold; color: var(--text-title); display: flex; justify-content: space-between; cursor: pointer; }
  .month-details { padding: 12px 16px; background: #fff; }
  .month-details table { margin-bottom: 0; }
</style>
</head>
<body>

<div id="toast"></div>
<div id="loading" class="hidden">處理中...</div>

<!-- 登入畫面 -->
<div id="viewLogin" class="hidden">
  <h2>交修件預約檢驗</h2>
  <p class="subtitle">請輸入進入密碼</p>
  <input id="pwd" type="text" placeholder="" autocomplete="off">
  <button onclick="doLogin()">進 入</button>
</div>

<!-- 主系統介面 -->
<div class="container hidden" id="mainSystem">
  
  <!-- 受檢者畫面 -->
  <div id="viewReceiver" class="hidden">
    <div class="topbar">
      <h2>受檢者</h2>
      <button class="btn-secondary" onclick="logout()" style="border-color:#fff; color:#fff;">登出</button>
    </div>

    <div class="tabs">
      <button id="rc-tab-btn-new" class="tab-btn active" onclick="switchReceiverTab('new')">填寫預約</button>
      <button id="rc-tab-btn-history" class="tab-btn" onclick="switchReceiverTab('history')">我的紀錄</button>
    </div>

    <div id="rc-tab-content-new" class="tab-content">
      <div class="card">
        <h3>新增交修件</h3>
        <label>料號</label>
        <div class="row">
          <select id="rc_partNoSel" onchange="onPartChange()"></select>
          <button onclick="toggleNewPart()">＋新</button>
        </div>
        <input id="rc_partNoNew" class="hidden" placeholder="輸入新料號">
        
        <label>名稱</label>
        <div class="row">
          <select id="rc_nameSel"></select>
          <button onclick="toggleNewName()">＋新</button>
        </div>
        <input id="rc_nameNew" class="hidden" placeholder="輸入新名稱">

        <label>序號</label>
        <input id="rc_serialNo" placeholder="請輸入序號">
        
        <label>預計需要多少時間？</label>
        <input id="rc_estimateTime" placeholder="例如：5小時、4小時、半天">
        
        <label>備註（選填）</label>
        <input id="rc_remark" placeholder="請輸入備註">
        
        <button onclick="submitRepair()" style="margin-top: 8px;">送出登記</button>
      </div>
    </div>

    <div id="rc-tab-content-history" class="tab-content hidden">
      <div class="card">
        <h3>我的登記紀錄</h3>
        <select id="rc_history_filter" onchange="loadReceiverList()" style="margin-bottom: 16px;">
          <option value="">全部紀錄</option>
          <option value="待檢驗">只看待檢驗</option>
          <option value="檢驗完畢">只看已完畢</option>
        </select>
        <div id="rc_list">載入中...</div>
      </div>
    </div>
  </div>

  <!-- 檢驗官畫面 -->
  <div id="viewInspector" class="hidden">
    <div class="topbar">
      <h2>檢驗官</h2>
      <button class="btn-secondary" onclick="logout()" style="border-color:#fff; color:#fff;">登出</button>
    </div>

    <div class="tabs">
      <button id="tab-btn-analysis" class="tab-btn" onclick="switchTab('analysis')">數據分析</button>
      <button id="tab-btn-pending" class="tab-btn" onclick="switchTab('pending')">待檢驗</button>
      <button id="tab-btn-finished" class="tab-btn" onclick="switchTab('finished')">已完畢</button>
    </div>

    <div id="tab-content-analysis" class="tab-content hidden">
      <div class="card">
        <h3>📊 歷史與月份分析</h3>
        <div id="ins_stats">載入中...</div>
      </div>
    </div>

    <div id="tab-content-pending" class="tab-content hidden">
      <div class="card">
        <h3>⏳ 待處理清單</h3>
        <div id="ins_list_pending">載入中...</div>
      </div>
    </div>

    <div id="tab-content-finished" class="tab-content hidden">
      <div class="card">
        <h3>✅ 已完畢清單</h3>
        <div id="ins_list_finished">載入中...</div>
      </div>
    </div>
  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwy46G8by0ME2KJAgqSZshWB0-gljqoUo3l11qSw9Sf45In07QczcYQ-zfwuWyQLTv9/exec';
let me = { role: '' };
let currentInspectorItems = []; // 暫存清單資料以利複製

window.onload = function() {
  const saved = sessionStorage.getItem('sys_user');
  if (saved) { me = JSON.parse(saved); enterSystem(); } 
  else { document.getElementById('viewLogin').classList.remove('hidden'); }
};

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'show error' : 'show';
  setTimeout(() => t.className = '', 3000);
}

function toggleLoading(show) {
  document.getElementById('loading').classList.toggle('hidden', !show);
}

async function callAPI(action, data = {}) {
  const payload = { action: action, ...data };
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    const json = await res.json();
    return json.data;
  } catch (err) {
    showToast('連線失敗，請檢查網路', true);
    return null;
  }
}

async function doLogin(){
  const pwd = document.getElementById('pwd').value.trim();
  if(!pwd) { showToast('請輸入密碼', true); return; }
  
  toggleLoading(true);
  const res = await callAPI('login', { password: pwd });
  toggleLoading(false);
  
  if(!res || !res.ok){
    showToast(res ? res.msg : '登入失敗', true);
    return;
  }
  
  me.role = res.role;
  sessionStorage.setItem('sys_user', JSON.stringify(me)); 
  enterSystem();
}

function enterSystem() {
  document.getElementById('viewLogin').classList.add('hidden');
  document.getElementById('mainSystem').classList.remove('hidden');

  if(me.role === '受檢者'){
    document.getElementById('viewReceiver').classList.remove('hidden');
    loadPartOptions();
    switchReceiverTab('new'); 
  } else {
    document.getElementById('viewInspector').classList.remove('hidden');
    switchTab('pending'); 
  }
}

function logout(){ 
  sessionStorage.removeItem('sys_user');
  location.reload(); 
}

/* --- 受檢者功能 --- */
function switchReceiverTab(tab) {
  document.querySelectorAll('#viewReceiver .tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('rc-tab-btn-' + tab).classList.add('active');
  
  document.getElementById('rc-tab-content-new').classList.add('hidden');
  document.getElementById('rc-tab-content-history').classList.add('hidden');
  document.getElementById('rc-tab-content-' + tab).classList.remove('hidden');

  if (tab === 'history') { loadReceiverList(); }
}

async function loadPartOptions(){
  const list = await callAPI('getPartOptions');
  if(!list) return;
  const sel = document.getElementById('rc_partNoSel');
  sel.innerHTML = '<option value="">-- 選擇料號 --</option>' +
    list.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
}

async function onPartChange(){
  const sel = document.getElementById('rc_partNoSel').value;
  const nameSel = document.getElementById('rc_nameSel');
  const nameNew = document.getElementById('rc_nameNew');
  
  if(!sel){ 
    nameSel.innerHTML = '<option value="">-- 先選料號 --</option>'; 
    nameSel.classList.remove('hidden');
    nameNew.classList.add('hidden');
    return; 
  }
  
  nameSel.innerHTML = '<option value="">讀取中...</option>';
  nameSel.classList.remove('hidden');
  nameNew.classList.add('hidden');
  
  const list = await callAPI('getNameOptions', { partNo: sel });
  
  if (list && list.length > 0) {
    nameSel.innerHTML = list.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
    nameSel.value = list[0]; 
  } else {
    nameSel.innerHTML = '<option value="">-- 請新增名稱 --</option>';
    toggleNewName(); 
  }
}

function getPartValue(){
  const sel = document.getElementById('rc_partNoSel').value;
  return sel || document.getElementById('rc_partNoNew').value.trim();
}

function getNameValue(){
  const sel = document.getElementById('rc_nameSel').value;
  return sel || document.getElementById('rc_nameNew').value.trim();
}

function toggleNewPart(){
  const isHidden = document.getElementById('rc_partNoNew').classList.contains('hidden');
  document.getElementById('rc_partNoNew').classList.toggle('hidden');
  document.getElementById('rc_partNoSel').value = '';
  if (!isHidden) { document.getElementById('rc_partNoNew').value = ''; }
}

function toggleNewName(){
  const isHidden = document.getElementById('rc_nameNew').classList.contains('hidden');
  document.getElementById('rc_nameNew').classList.toggle('hidden');
  if (isHidden) { document.getElementById('rc_nameSel').value = ''; } 
  else { document.getElementById('rc_nameNew').value = ''; }
}

async function submitRepair(){
  const payload = {
    category: '感測', account: '感測',
    partNo: getPartValue(),
    name: getNameValue(),
    serialNo: document.getElementById('rc_serialNo').value.trim(),
    estimateTime: document.getElementById('rc_estimateTime').value.trim(),
    remark: document.getElementById('rc_remark').value
  };
  
  if(!payload.partNo || !payload.serialNo || !payload.estimateTime){
    showToast('請填寫料號、序號與預計耗時', true);
    return;
  }
  
  toggleLoading(true);
  const res = await callAPI('addRepair', { payload: payload });
  toggleLoading(false);
  
  if(res && res.ok){
    showToast('已成功登記！');
    document.getElementById('rc_serialNo').value = '';
    document.getElementById('rc_estimateTime').value = '';
    document.getElementById('rc_remark').value = '';
    document.getElementById('rc_partNoNew').value = '';
    document.getElementById('rc_nameNew').value = '';
    document.getElementById('rc_partNoNew').classList.add('hidden');
    document.getElementById('rc_nameNew').classList.add('hidden');
    
    loadPartOptions();
    switchReceiverTab('history'); 
  } else {
    showToast(res ? res.msg : '登記失敗，請重試', true);
  }
}

async function loadReceiverList(){
  const filter = document.getElementById('rc_history_filter').value;
  const items = await callAPI('listRepairs', { role: '受檢者', filter: filter });
  const box = document.getElementById('rc_list');
  if(!items || !items.length){ box.innerHTML = '<p style="color:#888;text-align:center;">尚無相關紀錄</p>'; return; }
  
  box.innerHTML = items.map(it=>`
    <div class="list-item">
      <div class="item-title">${esc(it.partNo)} <span style="font-weight:normal;font-size:14px;color:#888;">| ${esc(it.name)}</span></div>
      <div class="item-detail">序號：${esc(it.serialNo)}</div>
      <div class="item-detail" style="color:#d93025;">預計耗時：${esc(it.estimateTime) || '未填'}</div>
      <div class="item-detail">排定檢驗：${it.inspectTime ? `<b>${fmt(it.inspectTime)}</b>` : '<span style="color:#aaa;">尚未排定</span>'}</div>
      ${it.remark ? `<div class="item-detail">備註：${esc(it.remark)}</div>` : ''}
      <div style="margin-top:8px;">
        <span class="status-badge ${it.status === '待檢驗' ? 'status-pending' : 'status-done'}">${it.status}</span>
        ${it.finishedAt ? `<span style="font-size:12px;color:#888;margin-left:8px;">完畢: ${fmt(it.finishedAt)}</span>` : ''}
      </div>
    </div>
  `).join('');
}

/* --- 檢驗官功能 --- */
function switchTab(tabId) {
  document.querySelectorAll('#viewInspector .tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('tab-btn-' + tabId).classList.add('active');
  
  document.querySelectorAll('#viewInspector .tab-content').forEach(el => el.classList.add('hidden'));
  document.getElementById('tab-content-' + tabId).classList.remove('hidden');
  
  if(tabId === 'analysis') { loadStats(); } 
  else if(tabId === 'pending') { loadInspectorList('待檢驗', 'ins_list_pending'); } 
  else if(tabId === 'finished') { loadInspectorList('檢驗完畢', 'ins_list_finished'); }
}

async function loadInspectorList(filter, targetId){
  const box = document.getElementById(targetId);
  box.innerHTML = '<p style="color:#888;text-align:center;">載入中...</p>';
  
  const items = await callAPI('listRepairs', { role: '檢驗官', filter: filter });
  
  if(!items || !items.length){ box.innerHTML = '<p style="color:#888;text-align:center;">目前沒有資料</p>'; return; }
  
  currentInspectorItems = items; // 存起來供複製使用
  
  box.innerHTML = items.map(it=>`
    <div class="list-item">
      <div class="item-title">${esc(it.partNo)} <span style="font-weight:normal;font-size:14px;color:#888;">| ${esc(it.name)}</span></div>
      <div class="item-detail">序號：${esc(it.serialNo)}</div>
      <div class="item-detail" style="color:#d93025; font-weight:bold;">預計耗時：${esc(it.estimateTime) || '未填'}</div>
      
      ${it.inspectTime ? `<div class="item-detail" style="color:#1e8e3e;">已排定：<b>${fmt(it.inspectTime)}</b></div>` : ''}

      <div style="margin-top:8px;">
        <span class="status-badge ${it.status === '待檢驗' ? 'status-pending' : 'status-done'}">${it.status}</span>
      </div>
      
      ${it.status === '待檢驗'
        ? `
        <div style="margin-top: 12px; background: #f4f6f9; padding: 12px; border-radius: 8px;">
          <label style="margin-bottom:4px; font-size:12px; color:#555;">安排要看的時間：</label>
          <input type="datetime-local" id="sch_${it.id}" value="${it.inspectTime ? it.inspectTime.slice(0,16) : ''}" style="margin-bottom: 8px; padding: 8px;">
          
          <div style="display:flex; gap:8px; margin-bottom: 8px;">
            <button onclick="schedule('${it.id}', this)" style="background-color: #4a6b95;">儲存時間</button>
            <button onclick="finish('${it.id}', this)" style="background-color: #1e8e3e;">標記完畢</button>
          </div>
          
          <!-- ★ 新增：複製通知按鈕 ★ -->
          <button onclick="copyNotification('${it.id}', this)" style="background-color: #ffffff; color: #15325c; border: 2px solid #15325c; padding: 10px;">
            📋 複製通知內容給當事人
          </button>
        </div>
        ` 
        : ''}
    </div>
  `).join('');
}

async function schedule(id, btn){
  const input = document.getElementById('sch_' + id).value;
  if(!input) { showToast('請選擇時間', true); return; }
  
  btn.textContent = '儲存中...';
  btn.disabled = true;
  const res = await callAPI('scheduleRepair', { id: id, scheduleTime: input, account: me.role });
  if(res && res.ok) {
    showToast('已更新排定時間！');
    loadInspectorList('待檢驗', 'ins_list_pending'); 
  } else {
    showToast('操作失敗', true);
    btn.textContent = '儲存時間';
    btn.disabled = false;
  }
}

async function finish(id, btn){
  btn.textContent = '處理中...';
  btn.disabled = true;
  const res = await callAPI('finishRepair', { id: id, account: me.role });
  if(res && res.ok) {
    showToast('已標記完畢！');
    loadInspectorList('待檢驗', 'ins_list_pending'); 
  } else {
    showToast('操作失敗', true);
    btn.textContent = '標記完畢';
    btn.disabled = false;
  }
}

/* --- ★ 複製通知功能 ★ --- */
function copyNotification(id, btn) {
  const item = currentInspectorList.find(i => i.id === id);
  if (!item) return;

  // 取得目前輸入框裡選定的時間 (如果沒選則顯示未排定)
  const inputTime = document.getElementById('sch_' + id).value;
  const timeStr = inputTime ? fmt(inputTime) : '尚未排定';

  // 組合要複製的文字
  const text = `【交修件檢驗通知】\n料號：${item.partNo}\n名稱：${item.name}\n序號：${item.serialNo}\n預計查看時間：${timeStr}`;

  // 複製到剪貼簿
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('✅ 已複製，可直接貼上！');
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.top = "0";
  textArea.style.left = "0";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try {
    document.execCommand('copy');
    showToast('✅ 已複製，可直接貼上！');
  } catch (err) {
    showToast('複製失敗，請手動選取', true);
  }
  document.body.removeChild(textArea);
}

async function loadStats(){
  const box = document.getElementById('ins_stats');
  box.innerHTML = '載入中...';
  
  const st = await callAPI('getStats');
  if(!st) {
    box.innerHTML = '<p style="color:#888;text-align:center;">無法載入分析資料</p>';
    return;
  }
  
  let monthHtml = '';
  const months = Object.keys(st.monthlyPartStats || {}).sort().reverse(); 
  
  if (months.length === 0) {
    monthHtml = '<p style="color:#888;text-align:center;padding:10px;">尚無月份資料</p>';
  } else {
    months.forEach(m => {
      const totalCount = st.byMonth[m] || 0;
      let partRows = '';
      
      const partsInMonth = Object.entries(st.monthlyPartStats[m] || {}).sort((a,b)=>b[1]-a[1]);
      partsInMonth.forEach(([part, count]) => {
        partRows += `<tr><td>${esc(part)}</td><td><strong>${count}</strong> 件</td></tr>`;
      });

      monthHtml += `
        <details class="month-group">
          <summary class="month-title">
            <span>📅 ${m}</span>
            <span style="color:#15325c;">總計 ${totalCount} 件</span>
          </summary>
          <div class="month-details">
            <table>
              <thead><tr><th>品相 (料號)</th><th>數量</th></tr></thead>
              <tbody>${partRows}</tbody>
            </table>
          </div>
        </details>
      `;
    });
  }

  box.innerHTML = `
    <div class="stats-grid">
      <div class="stat-box">
        <span>歷史總筆數</span>
        <strong>${st.total || 0}</strong>
      </div>
      <div class="stat-box">
        <span>平均等待時間</span>
        <strong>${st.avgWaitHours || 0} <span style="font-size:14px;font-weight:normal;">小時</span></strong>
      </div>
    </div>
    
    <div style="font-size:15px; font-weight:bold; color:#15325c; margin: 20px 0 12px 0;">
      每月檢驗數量與品相明細 (點擊展開)
    </div>
    ${monthHtml}
  `;
}

function fmt(iso){
  if(!iso) return '';
  return iso.replace('T',' ').slice(0,16);
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
