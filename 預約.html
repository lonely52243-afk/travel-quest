<meta name="apple-mobile-web-app-title" content="交修預約">
<title>交修件預約檢驗系統</title>
<style>
  :root {
    --bg-main:#FCF9F2; --card-bg:#FFFFFF; --text-title:#1A202C; --text-main:#4A5568; --text-sub:#8A94A6;
    --border:#E2E8F0; --yellow:#FFC107; --yellow-soft:#FFF9E6; --ink:#1A202C;
    --purple:#7E57C2; --red:#E53E3E; --green:#38A169; --blue:#3182CE; --gray:#718096;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Roboto,sans-serif;
    background:var(--bg-main); color:var(--text-main); margin:0; line-height:1.5; min-height:100vh;
    padding:16px 16px calc(96px + env(safe-area-inset-bottom));
  }
  .container { width:100%; max-width:600px; margin:0 auto; }
  .hidden { display:none !important; }
  h2,h3 { color:var(--text-title); margin:0; font-weight:800; }
  h3 { font-size:17px; margin-bottom:14px; padding-bottom:12px; border-bottom:1px dashed var(--border); }
  p { margin:0; }

  .card { background:var(--card-bg); border-radius:16px; padding:18px; margin-bottom:14px; border:1px solid var(--border); }

  /* 按鈕 */
  button { font-family:inherit; font-size:15px; font-weight:700; padding:12px 14px; border:2px solid var(--ink); border-radius:12px;
    background:var(--yellow); color:var(--ink); cursor:pointer; box-shadow:0 2px 0 var(--ink); transition:transform .08s, box-shadow .08s; }
  button:active { transform:translateY(2px); box-shadow:none; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .btn-block { width:100%; }
  .btn-secondary { background:var(--card-bg); border:1px solid var(--border); color:var(--text-main); box-shadow:none; font-weight:600; }
  .btn-green { background:var(--green); color:#fff; }
  .btn-danger { background:#fff; color:var(--red); border:1px solid #FED7D7; box-shadow:none; font-weight:700; }
  .btn-sm { padding:8px 12px; font-size:14px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

  /* 表單 */
  label.lb { font-size:14px; font-weight:700; color:var(--text-title); margin-bottom:6px; display:block; }
  label.lb i { color:var(--red); font-style:normal; margin-left:2px; }
  .hint { font-size:12px; color:var(--text-sub); margin:-10px 0 14px; }
  input,select,textarea { font-family:inherit; font-size:16px; width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:12px;
    margin-bottom:16px; background:var(--card-bg); color:var(--text-title); outline:none; }
  input:focus,select:focus,textarea:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(255,193,7,.35); }
  input.err,select.err { border-color:var(--red); background:#FFF5F5; }
  input[type=checkbox] { width:22px; height:22px; margin:0; padding:0; accent-color:var(--ink); box-shadow:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:-8px 0 14px; }
  .chip { padding:6px 12px; font-size:13px; font-weight:600; border-radius:20px; background:#F8FAFC; border:1px solid var(--border); color:var(--text-main); box-shadow:none; }
  .chip.active { background:var(--yellow-soft); border-color:var(--ink); color:var(--ink); }

  /* 頂欄 */
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px; }
  .topbar-title { display:flex; align-items:center; gap:8px; min-width:0; }
  .topbar-title h2 { font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { font-size:13px; background:var(--purple); color:#fff; padding:2px 10px; border-radius:8px; font-weight:700; white-space:nowrap; }
  .topbar-actions { display:flex; gap:6px; flex-shrink:0; }
  .icon-btn { width:38px; height:38px; padding:0; border-radius:10px; background:var(--card-bg); border:1px solid var(--border); box-shadow:none; font-size:17px; color:var(--text-title); }
  .spin { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* 底部導覽 */
  .bottom-nav { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border); display:flex; z-index:50;
    padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -4px 14px rgba(0,0,0,.04); }
  .nav-btn { flex:1; background:transparent; border:none; box-shadow:none; border-radius:0; padding:9px 0 8px; color:var(--text-sub);
    font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
  .nav-btn:active { transform:none; background:#F8FAFC; }
  .nav-btn .ico { font-size:20px; line-height:1; }
  .nav-btn.active { color:var(--ink); }
  .nav-btn.active::before { content:""; position:absolute; top:0; left:25%; right:25%; height:3px; background:var(--yellow); border-radius:0 0 4px 4px; }
  .nav-badge { position:absolute; top:4px; left:calc(50% + 8px); background:var(--red); color:#fff; font-size:11px; min-width:18px; height:18px; line-height:18px; border-radius:9px; padding:0 5px; }

  /* 標籤 */
  .tag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; font-weight:700; white-space:nowrap; }
  .tag-purple { background:var(--purple); color:#fff; }
  .tag-red { background:#FFF5F5; color:var(--red); border:1px solid #FED7D7; }
  .tag-green { background:#F0FFF4; color:var(--green); border:1px solid #C6F6D5; }
  .tag-yellow { background:var(--yellow-soft); color:#9C6B00; border:1px solid #FFE08A; }
  .tag-gray { background:#F7FAFC; color:var(--gray); border:1px solid var(--border); }

  /* 清單 */
  .list-item { padding:12px 14px; margin-bottom:10px; border-radius:12px; border:1px solid var(--border); background:var(--card-bg); border-left-width:6px; display:flex; gap:12px; }
  .list-item.status-pending { border-left-color:var(--red); }
  .list-item.status-done { border-left-color:var(--green); }
  .list-item.status-cancel { border-left-color:#CBD5E0; opacity:.7; }
  .list-checkbox { margin-top:4px; flex-shrink:0; }
  .list-content { flex:1; min-width:0; }
  .item-title { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
  .item-title-text { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:16px; font-weight:800; color:var(--text-title); min-width:0; word-break:break-all; }
  .item-row { display:flex; justify-content:space-between; gap:12px; font-size:14px; margin-bottom:3px; }
  .item-row span:first-child { color:var(--text-sub); white-space:nowrap; }
  .item-row span:last-child { font-weight:700; color:var(--text-title); text-align:right; word-break:break-all; }
  .item-foot { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .btn-expand { width:34px; height:34px; padding:0; border-radius:8px; background:#F8FAFC; border:1px solid var(--border); box-shadow:none; font-size:16px; flex-shrink:0; }
  .expand-area { margin-top:12px; background:#F8FAFC; padding:14px; border-radius:12px; border:1px solid var(--border); }
  .expand-area input { margin-bottom:10px; }
  .expand-area .chips { margin:0 0 12px; }

  /* 批次與摘要 */
  .summary { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .searchbox input { margin-bottom:12px; }
  .batch-panel { background:#fff; border:2px solid var(--ink); border-radius:16px; padding:14px; margin-bottom:14px; box-shadow:0 4px 12px rgba(0,0,0,.08); position:sticky; top:8px; z-index:40; }
  .batch-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:800; font-size:15px; }
  .batch-header label { display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-title); }
  .batch-panel input[type=datetime-local] { margin-bottom:10px; padding:10px; font-size:15px; }

  .empty { text-align:center; padding:28px 12px; color:var(--text-sub); }
  .empty b { display:block; font-size:34px; margin-bottom:6px; }

  /* 統計 */
  .stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat-box { background:var(--bg-main); padding:14px 6px; border-radius:12px; text-align:center; border:1px solid var(--border); }
  .stat-box span { display:block; font-size:12px; color:var(--text-sub); margin-bottom:4px; font-weight:600; }
  .stat-box strong { font-size:22px; color:var(--text-title); font-weight:800; }
  .stat-box small { font-size:12px; font-weight:600; }
  details.month { margin-bottom:10px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
  details.month summary { padding:13px 14px; background:var(--yellow-soft); cursor:pointer; font-weight:800; display:flex; justify-content:space-between; color:var(--text-title); list-style:none; }
  details.month summary::-webkit-details-marker { display:none; }
  .part-row { padding:9px 14px; border-top:1px dashed var(--border); font-size:14px; }
  .part-row .top { display:flex; justify-content:space-between; font-weight:700; color:var(--text-title); }
  .bar { height:6px; background:#EDF2F7; border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--purple); border-radius:3px; }

  /* 月曆 */
  .cal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:6px; }
  .cal-head h4 { margin:0; font-size:18px; color:var(--text-title); font-weight:800; flex:1; text-align:center; }
  .cal-head button { width:40px; height:40px; padding:0; background:#fff; border:1px solid var(--border); box-shadow:none; }
  .cal-head .today-btn { width:auto; padding:0 12px; font-size:13px; }
  .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-dn { font-size:12px; color:var(--text-sub); font-weight:700; margin-bottom:4px; }
  .cal-dn.sun { color:var(--red); } .cal-dn.sat { color:var(--blue); }
  .cal-cell { aspect-ratio:.82; display:flex; flex-direction:column; align-items:center; border-radius:8px; cursor:pointer; font-size:14px; font-weight:700;
    color:var(--text-title); background:#fff; border:1px solid var(--border); padding:3px; overflow:hidden; }
  .cal-cell.blank { background:transparent; border:none; cursor:default; }
  .cal-cell.sun { color:var(--red); } .cal-cell.sat { color:var(--blue); }
  .cal-cell.today { border:2px solid var(--ink); }
  .cal-cell.selected { background:var(--yellow-soft); border:2px solid var(--ink); }
  .cal-tags { display:flex; flex-direction:column; gap:2px; width:100%; margin-top:2px; }
  .cal-tag { font-size:9px; padding:1px 2px; border-radius:4px; background:var(--purple); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .cal-tag.done { background:var(--green); }
  .cal-more { font-size:10px; color:var(--text-sub); font-weight:700; }
  .day-title { font-size:15px; font-weight:800; color:var(--text-title); margin:16px 0 10px; padding-top:14px; border-top:1px dashed var(--border); }

  /* 彈窗 / 提示 */
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-120px); background:var(--ink); color:#fff; padding:12px 22px; border-radius:30px;
    font-size:14px; font-weight:700; opacity:0; transition:all .3s; z-index:2000; text-align:center; max-width:90vw; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  #toast.error { background:var(--red); }
  #loading { position:fixed; inset:0; background:rgba(252,249,242,.85); display:flex; flex-direction:column; gap:12px; justify-content:center; align-items:center; z-index:1500; font-weight:800; color:var(--text-title); }
  .spinner { width:34px; height:34px; border:4px solid var(--border); border-top-color:var(--ink); border-radius:50%; animation:spin .8s linear infinite; }
  .modal { position:fixed; inset:0; background:rgba(26,32,44,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:1800; }
  .modal-box { background:#fff; border-radius:20px; padding:22px; width:100%; max-width:420px; max-height:88vh; overflow:auto; }
  .modal-box h3 { border:none; padding:0; margin-bottom:10px; }
  .modal-box p { margin-bottom:16px; }
  .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .guide-ico { font-size:46px; text-align:center; margin-bottom:6px; }
  .guide-title { font-size:19px; font-weight:800; color:var(--text-title); text-align:center; margin-bottom:8px; }
  .guide-text { text-align:center; margin-bottom:16px !important; font-size:15px; }
  .dots { display:flex; justify-content:center; gap:6px; margin-bottom:16px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--border); }
  .dots i.on { background:var(--ink); width:22px; border-radius:4px; }
  .menu-btn { width:100%; margin-bottom:10px; background:#fff; border:1px solid var(--border); box-shadow:none; text-align:left; font-weight:700; }

  .center-card { max-width:400px; margin:40px auto 0; text-align:center; }
  .center-card .logo { font-size:44px; margin-bottom:6px; }
  .center-card p.sub { color:var(--text-sub); margin:6px 0 22px; font-size:14px; }
  .pwd-wrap { position:relative; }
  .pwd-wrap input { text-align:center; padding-right:48px; }
  .pwd-wrap button { position:absolute; right:6px; top:6px; width:38px; height:38px; padding:0; background:transparent; border:none; box-shadow:none; font-size:18px; }
  .pick-btn { width:100%; margin-bottom:10px; background:#fff; border:1px solid var(--border); box-shadow:none; text-align:left; padding:14px 16px; }
  .pick-btn.last { border:2px solid var(--ink); background:var(--yellow-soft); }
  .pick-btn small { display:block; color:var(--text-sub); font-weight:600; margin-top:2px; }
  .success { text-align:center; }
  .success .big { font-size:50px; }
  .success .sum { text-align:left; background:var(--bg-main); border-radius:12px; padding:12px 14px; margin:14px 0; font-size:14px; }
  .logo-img { width:84px; height:84px; display:block; margin:0 auto 8px; }
  .ill { width:100%; max-width:300px; border-radius:16px; display:block; margin:0 auto 14px; }
  .empty-img { width:150px; display:block; margin:0 auto 8px; }
  .done-img { width:150px; display:block; margin:0 auto; }
  .footer { text-align:center; color:var(--text-sub); font-size:12px; margin-top:20px; }
</style>
</head>
<body>

<div id="toast"></div>
<div id="loading" class="hidden"><div class="spinner"></div><span>處理中…</span></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

  <!-- 檢驗官：已完畢 -->
  <section id="page-finished" class="page hidden">
    <div class="card">
      <h3>✅ 已完畢清單</h3>
      <div class="searchbox"><input id="q_finished" type="search" placeholder="🔍 搜尋料號／名稱／序號／預約人" oninput="renderFinished()"></div>
      <div id="list_finished"></div>
    </div>
  </section>

  <!-- 檢驗官：分析 -->
  <section id="page-analysis" class="page hidden">
    <div class="card"><h3>📊 我的統計</h3><div id="ins_stats"></div></div>
  </section>

  <!-- 共用：月曆 -->
  <section id="page-cal" class="page hidden">
    <div class="card">
      <div class="cal-head">
        <button onclick="changeMonth(-1)" aria-label="上個月">‹</button>
        <h4 id="cal-title"></h4>
        <button class="today-btn" onclick="calToday()">今天</button>
        <button onclick="changeMonth(1)" aria-label="下個月">›</button>
      </div>
      <div class="calendar-grid" id="cal-grid"></div>
      <div id="cal-detail"></div>
    </div>
  </section>

  <div class="footer">吱吱製作</div>
</div>

<nav id="bottomNav" class="bottom-nav hidden"></nav>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwy46G8by0ME2KJAgqSZshWB0-gljqoUo3l11qSw9Sf45In07QczcYQ-zfwuWyQLTv9/exec';
const ST_PENDING = '待檢驗', ST_DONE = '檢驗完畢', ST_CANCEL = '已撤銷';

/* ---------- 小工具 ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toInput = d => `${dKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const WD = ['日', '一', '二', '三', '四', '五', '六'];
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function fmt(s) { return s ? String(s).replace('T', ' ').slice(0, 16) : ''; }
function fmtNice(s) {
  if (!s) return '';
  const d = new Date(s); if (isNaN(d)) return fmt(s);
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())}（${WD[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const store = k => ({
  get: (key, def) => { try { const v = k.getItem(key); return v === null ? def : v; } catch (e) { return def; } },
  set: (key, val) => { try { k.setItem(key, val); } catch (e) {} },
  del: key => { try { k.removeItem(key); } catch (e) {} }
});
const LS = store(window.localStorage), SS = store(window.sessionStorage);

let me = { role: '', inspectorName: '', pwd: '' };
try { const sv = JSON.parse(SS.get('sys_user', 'null')); if (sv) me = Object.assign(me, sv); } catch (e) {}
function saveMe() { SS.set('sys_user', JSON.stringify(me)); }

let allItems = [], loaded = false, lastLoad = 0, refreshing = false;
let curTab = '', allInspectors = [], catalog = {};
let selectedIds = new Set(), expandedIds = new Set();
let histScope = 'mine', histFilter = '';
let nameAuto = false, submitting = false;
let cal = { year: new Date().getFullYear(), month: new Date().getMonth(), sel: '' };

function showToast(msg, isError) {
  const t = $('toast'); t.textContent = msg; t.className = isError ? 'show error' : 'show';
  clearTimeout(showToast.t); showToast.t = setTimeout(() => { t.className = ''; }, 3000);
}
function toggleLoading(on) { $('loading').classList.toggle('hidden', !on); }

async function callAPI(action, data) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action, pwd: me.pwd }, data || {}))
    });
    const json = await res.json();
    if (!json.ok) {
      if (json.msg === 'AUTH') { showToast('登入已失效，請重新登入', true); setTimeout(logout, 1200); }
      else showToast(json.msg || '系統發生錯誤', true);
      return null;
    }
    return json.data;
  } catch (err) { showToast('連線失敗，請檢查網路後再試', true); return null; }
}

/* ---------- 彈窗 ---------- */
function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
function askConfirm(title, msg, okText) {
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="modal-actions"><button class="btn-secondary" id="cfNo">取消</button><button id="cfYes">${esc(okText || '確定')}</button></div>`);
    $('cfNo').onclick = () => { closeModal(); res(false); };
    $('cfYes').onclick = () => { closeModal(); res(true); };
  });
}

/* ---------- 新手導覽 ---------- */
const GUIDES = {
  '受檢者': [
    { i: '👋', t: '歡迎使用', d: '這裡可以替要送修的零件，預約檢驗官檢驗。三步驟就能完成。' },
    { i: '📝', t: '① 填寫預約', d: '到「預約」頁填預約人、選檢驗官、料號、序號與預計時間。料號和名稱可以直接點選舊的，也能輸入新的。預約人和檢驗官會自動記住。' },
    { i: '⏳', t: '② 等檢驗官排時間', d: '送出後到「紀錄」查看進度。紅色是待檢驗，綠色是已完畢。檢驗官排好時間後，會顯示在這裡和月曆。' },
    { i: '↩️', t: '③ 登記錯了怎麼辦？', d: '在「紀錄」找到自己的待檢驗案件，按「撤銷」就能取消。已經完畢的不能撤銷。' },
    { i: '💡', t: '小提醒', d: '右上角 ⟳ 可重新整理、？ 可再看這份說明。同一個料號＋序號在待檢驗中，不能重複登記。' }
  ],
  '檢驗官': [
    { i: '👋', t: '歡迎使用', d: '這裡會列出指派給您的交修件，您可以排時間、通知對方、標記完成。' },
    { i: '⏳', t: '待檢驗', d: '每張卡片右上角的 ⚙️ 可展開：設定檢驗時間（有快速按鈕）、複製通知文字、標記完畢。紅標「已逾時」代表排定時間已過。' },
    { i: '☑️', t: '批次處理', d: '勾選多筆後，上方面板可一次「約時間」、「複製」通知、或「完成」。「全選」只會選到目前搜尋出來的項目。' },
    { i: '📅', t: '月曆與分析', d: '月曆看每天排了哪些案件，點日期看明細。「分析」看每月完成數量與平均等待時間。' },
    { i: '💡', t: '小提醒', d: '名字選錯了？按右上角 ⋯ 就能切換身分。⟳ 重新整理、？ 再看這份說明。' }
  ]
};
let guideIdx = 0, guideAuto = false;
function openGuide(auto) { guideIdx = 0; guideAuto = !!auto; renderGuide(); }
function renderGuide() {
  const g = GUIDES[me.role]; if (!g) return;
  const s = g[guideIdx], last = guideIdx === g.length - 1;
  openModal(`<div class="guide-ico">${s.i}</div><div class="guide-title">${esc(s.t)}</div><p class="guide-text">${esc(s.d)}</p>
    <div class="dots">${g.map((_, k) => `<i class="${k === guideIdx ? 'on' : ''}"></i>`).join('')}</div>
    <div class="modal-actions"><button class="btn-secondary" onclick="closeGuide()">${last ? '關閉' : '跳過'}</button>
    <button onclick="${last ? 'closeGuide()' : 'nextGuide()'}">${last ? '開始使用' : '下一步'}</button></div>`);
}
function nextGuide() { guideIdx++; renderGuide(); }
function closeGuide() { closeModal(); LS.set('guide_seen_' + me.role, '1'); }

function openMenu() {
  openModal(`<h3>選單</h3>
    ${me.role === '檢驗官' ? '<button class="menu-btn" onclick="closeModal();switchInspectorIdentity()">🔁 切換檢驗官身分</button>' : ''}
    <button class="menu-btn" onclick="closeModal();openGuide(false)">❓ 使用說明</button>
    <button class="menu-btn" onclick="logout()">🚪 登出</button>
    <button class="btn-secondary btn-block" onclick="closeModal()">關閉</button>`);
}

/* ---------- 登入 / 身分 ---------- */
window.onload = function () {
  $('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && me.role && curTab && Date.now() - lastLoad > 60000) refreshData(true);
  });
  if (me.role && me.pwd) enterSystem(); else $('viewLogin').classList.remove('hidden');
};
function togglePwd() { const p = $('pwd'); p.type = p.type === 'password' ? 'text' : 'password'; }

async function doLogin() {
  const pwd = $('pwd').value.trim();
  if (!pwd) { $('pwd').classList.add('err'); return showToast('請輸入密碼', true); }
  $('pwd').classList.remove('err');
  $('btnLogin').disabled = true; toggleLoading(true);
  const res = await callAPI('login', { pwd: pwd });
  toggleLoading(false); $('btnLogin').disabled = false;
  if (!res || !res.ok) { if (res) { $('pwd').classList.add('err'); showToast(res.msg || '登入失敗', true); } return; }
  me.role = res.role; me.pwd = pwd; me.inspectorName = '';
  saveMe(); enterSystem();
}

function enterSystem() {
  $('viewLogin').classList.add('hidden');
  if (me.role === '檢驗官' && !me.inspectorName) return showInspectorSelector();
  startApp();
}

async function showInspectorSelector() {
  $('viewSelectInspector').classList.remove('hidden');
  $('app').classList.add('hidden'); $('bottomNav').classList.add('hidden');
  const box = $('inspector_options_box');
  box.innerHTML = '<div class="empty">載入中…</div>';
  allInspectors = await callAPI('getInspectors') || [];
  if (!allInspectors.length) { box.innerHTML = '<p style="color:var(--red);margin-bottom:14px;">尚未設定檢驗官，或連線失敗。請檢查試算表「Inspectors」分頁。</p>'; return; }
  const last = LS.get('last_inspector', '');
  box.innerHTML = allInspectors.map((i, k) =>
    `<button class="pick-btn ${i.name === last ? 'last' : ''}" onclick="selectInspector(${k})"><b>${esc(i.name)}</b>${i.name === last ? '　（上次選擇）' : ''}<small>單位：${esc(i.unit)}</small></button>`).join('');
}
function selectInspector(k) {
  me.inspectorName = allInspectors[k].name; LS.set('last_inspector', me.inspectorName); saveMe();
  $('viewSelectInspector').classList.add('hidden'); allItems = []; loaded = false; lastLoad = 0; selectedIds.clear();
  startApp();
}
function switchInspectorIdentity() { me.inspectorName = ''; saveMe(); showInspectorSelector(); }
function logout() { SS.del('sys_user'); location.reload(); }

/* ---------- 啟動與導覽 ---------- */
function startApp() {
  $('app').classList.remove('hidden');
  $('roleBadge').textContent = me.role;
  $('whoName').textContent = me.role === '檢驗官' ? me.inspectorName : '';
  const tabs = me.role === '檢驗官'
    ? [['pending', '⏳', '待檢驗'], ['finished', '✅', '已完畢'], ['cal', '📅', '月曆'], ['analysis', '📊', '分析']]
    : [['new', '📝', '預約'], ['history', '📋', '紀錄'], ['cal', '📅', '月曆']];
  const nav = $('bottomNav'); nav.classList.remove('hidden');
  nav.innerHTML = tabs.map(t => `<button class="nav-btn" id="nav-${t[0]}" onclick="go('${t[0]}')"><span class="ico">${t[1]}</span>${t[2]}${t[0] === 'pending' ? '<span class="nav-badge hidden" id="pendBadge"></span>' : ''}</button>`).join('');
  if (me.role === '受檢者') {
    $('f_booker').value = LS.get('booker', '');
    $('estChips').innerHTML = ['2小時', '4小時', '半天', '1天', '2天'].map(x => `<button type="button" class="chip" onclick="setEst('${x}')">${x}</button>`).join('');
    $('f_part').addEventListener('input', onPartInput);
    $('f_part').addEventListener('change', onPartChange);
    $('f_name').addEventListener('input', () => { nameAuto = false; });
    histScope = LS.get('booker', '') ? 'mine' : 'all';
    loadInspectorsForReceiver(); loadCatalog();
  }
  go(me.role === '檢驗官' ? 'pending' : 'new');
  if (!LS.get('guide_seen_' + me.role, '')) openGuide(true);
}

function go(tab) {
  curTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.id === 'nav-' + tab));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('hidden', p.id !== 'page-' + tab));
  window.scrollTo({ top: 0 });
  if (tab === 'cal') { const n = new Date(); if (!cal.sel) { cal.year = n.getFullYear(); cal.month = n.getMonth(); } }
  renderCurrent();
  if (tab !== 'new' && Date.now() - lastLoad > 60000) refreshData(true);
}

async function refreshData(silent) {
  if (refreshing || !me.role) return;
  if (me.role === '檢驗官' && !me.inspectorName) return;
  refreshing = true; $('btnRefresh').classList.add('spin');
  const data = await callAPI('listRepairs', { role: me.role, filter: '', inspectorName: me.inspectorName });
  refreshing = false; $('btnRefresh').classList.remove('spin');
  if (data) {
    allItems = data; loaded = true; lastLoad = Date.now();
    const ids = new Set(allItems.filter(i => i.status === ST_PENDING).map(i => i.id));
    selectedIds.forEach(id => { if (!ids.has(id)) selectedIds.delete(id); });
    if (!silent) showToast('已更新');
  }
  renderCurrent();
}

function renderCurrent() {
  const pend = allItems.filter(i => i.status === ST_PENDING).length;
  const b = $('pendBadge'); if (b) { b.textContent = pend > 99 ? '99+' : pend; b.classList.toggle('hidden', !pend); }
  if (curTab === 'history') renderHistory();
  else if (curTab === 'pending') renderPending();
  else if (curTab === 'finished') renderFinished();
  else if (curTab === 'analysis') renderAnalysis();
  else if (curTab === 'cal') renderCal();
}

function emptyBox(icon, text) { return `<div class="empty"><b>${icon}</b>${text}</div>`; }
const LOADING = '<div class="empty"><b>⏳</b>載入中…</div>';

/* ---------- 時間輔助 ---------- */
function timeTag(it) {
  if (!it.inspectTime) return '<span class="tag tag-gray">未排定</span>';
  if (it.status !== ST_PENDING) return '';
  const d = new Date(it.inspectTime), n = new Date();
  if (d < n) return '<span class="tag tag-red">已逾時</span>';
  if (dKey(d) === dKey(n)) return '<span class="tag tag-yellow">今天</span>';
  const t = new Date(n); t.setDate(t.getDate() + 1);
  if (dKey(d) === dKey(t)) return '<span class="tag tag-purple">明天</span>';
  return '';
}
function statusTag(s) { return `<span class="tag ${s === ST_PENDING ? 'tag-red' : s === ST_DONE ? 'tag-green' : 'tag-gray'}">${esc(s)}</span>`; }
function titleHtml(it) { return `<span class="tag tag-purple">${esc(it.partNo)}</span><span>${esc(it.name)}</span>`; }
function matchQ(it, q) {
  if (!q) return true; q = q.toLowerCase();
  return [it.partNo, it.name, it.serialNo, it.bookingPerson].some(v => String(v || '').toLowerCase().includes(q));
}

/* ---------- 受檢者：預約 ---------- */
async function loadInspectorsForReceiver() {
  if (!allInspectors.length) allInspectors = await callAPI('getInspectors') || [];
  const sel = $('f_target'), keep = LS.get('target', '');
  sel.innerHTML = '<option value="">-- 請選擇檢驗官 --</option>' + allInspectors.map(i => `<option value="${esc(i.name)}">[${esc(i.unit)}] ${esc(i.name)}</option>`).join('');
  if (keep && allInspectors.some(i => i.name === keep)) sel.value = keep;
}
async function loadCatalog() {
  const c = await callAPI('getCatalog');
  if (c) { catalog = c; $('dl_part').innerHTML = Object.keys(catalog).map(p => `<option value="${esc(p)}"></option>`).join(''); }
}
function onPartInput() {
  const names = catalog[$('f_part').value.trim()] || [];
  $('dl_name').innerHTML = names.map(n => `<option value="${esc(n)}"></option>`).join('');
}
function onPartChange() {
  const names = catalog[$('f_part').value.trim()] || [];
  onPartInput();
  const nm = $('f_name');
  if (names.length && (!nm.value.trim() || nameAuto)) { nm.value = names[0]; nameAuto = true; }
}
function setEst(v) { $('f_est').value = v; $('f_est').classList.remove('err'); }

async function submitRepair() {
  if (submitting) return;
  const p = {
    bookingPerson: $('f_booker').value.trim(), targetInspector: $('f_target').value,
    partNo: $('f_part').value.trim(), name: $('f_name').value.trim(), serialNo: $('f_serial').value.trim(),
    estimateTime: $('f_est').value.trim(), remark: $('f_remark').value.trim()
  };
  const fields = [['bookingPerson', 'f_booker', '預約人'], ['targetInspector', 'f_target', '檢驗官'], ['partNo', 'f_part', '料號'], ['name', 'f_name', '名稱'], ['serialNo', 'f_serial', '序號'], ['estimateTime', 'f_est', '預計時間']];
  const miss = [];
  fields.forEach(f => { const bad = !p[f[0]]; $(f[1]).classList.toggle('err', bad); if (bad) miss.push(f); });
  if (miss.length) { showToast('請填寫：' + miss.map(m => m[2]).join('、'), true); $(miss[0][1]).focus(); return; }
  if (allItems.some(i => i.status === ST_PENDING && i.partNo === p.partNo && i.serialNo === p.serialNo)) {
    $('f_serial').classList.add('err'); return showToast('⚠️ 這個料號＋序號已在待檢驗中', true);
  }
  submitting = true; $('btnSubmit').disabled = true; $('btnSubmit').textContent = '送出中…'; toggleLoading(true);
  const res = await callAPI('addRepair', { payload: p });
  toggleLoading(false); submitting = false; $('btnSubmit').disabled = false; $('btnSubmit').textContent = '送出登記';
  if (res && res.ok) {
    LS.set('booker', p.bookingPerson); LS.set('target', p.targetInspector);
    $('doneSum').innerHTML = `<div>料號：<b>${esc(p.partNo)}</b></div><div>名稱：<b>${esc(p.name)}</b></div><div>序號：<b>${esc(p.serialNo)}</b></div><div>檢驗官：<b>${esc(p.targetInspector)}</b></div><div>預計耗時：<b>${esc(p.estimateTime)}</b></div>`;
    $('newForm').classList.add('hidden'); $('submitDone').classList.remove('hidden');
    ['f_serial', 'f_est', 'f_remark'].forEach(id => { $(id).value = ''; });
    histScope = 'mine'; lastLoad = 0; loadCatalog(); refreshData(true);
  } else if (res) showToast(res.msg || '登記失敗', true);
}
function newAgain() { $('submitDone').classList.add('hidden'); $('newForm').classList.remove('hidden'); $('f_serial').focus(); }

/* ---------- 受檢者：紀錄 ---------- */
function isMine(it) { const b = LS.get('booker', '').trim(); return !!b && String(it.bookingPerson).trim() === b; }
function setHist(kind, v) { if (kind === 'scope') histScope = v; else histFilter = v; renderHistory(); }
function chipRow(items, cur, fn) {
  return items.map(x => `<button class="chip ${cur === x[0] ? 'active' : ''}" onclick="${fn}('${x[0]}')">${x[1]}</button>`).join('');
}
function renderHistory() {
  window.hs = v => setHist('scope', v); window.hf = v => setHist('filter', v);
  $('histScopeChips').innerHTML = chipRow([['mine', '我的'], ['all', '全部人']], histScope, 'hs');
  $('histFilterChips').innerHTML = chipRow([['', '全部'], [ST_PENDING, '待檢驗'], [ST_DONE, '已完畢']], histFilter, 'hf');
  const box = $('rc_list');
  if (!loaded) return box.innerHTML = LOADING;
  if (histScope === 'mine' && !LS.get('booker', '')) return box.innerHTML = emptyBox('📝', '還沒有預約人資料<br>先到「預約」頁登記一筆，這裡就會出現您的紀錄');
  let items = allItems.slice();
  if (histScope === 'mine') items = items.filter(isMine);
  if (histFilter) items = items.filter(i => i.status === histFilter);
  items.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  if (!items.length) return box.innerHTML = emptyBox('📭', '目前沒有紀錄');
  box.innerHTML = items.map(it => `
    <div class="list-item ${it.status === ST_PENDING ? 'status-pending' : it.status === ST_DONE ? 'status-done' : 'status-cancel'}">
      <div class="list-content">
        <div class="item-title"><div class="item-title-text">${titleHtml(it)}</div></div>
        <div class="item-row"><span>預約人</span><span style="color:var(--purple)">${esc(it.bookingPerson) || '未填'}</span></div>
        <div class="item-row"><span>指派給</span><span style="color:var(--purple)">${esc(it.targetInspector)}</span></div>
        <div class="item-row"><span>序號</span><span>${esc(it.serialNo)}</span></div>
        <div class="item-row"><span>預計耗時</span><span style="color:var(--red)">${esc(it.estimateTime) || '未填'}</span></div>
        <div class="item-row"><span>排定時間</span><span>${it.inspectTime ? fmtNice(it.inspectTime) : '尚未排定'}</span></div>
        ${it.status === ST_DONE && it.finishedAt ? `<div class="item-row"><span>完畢時間</span><span style="color:var(--green)">${fmtNice(it.finishedAt)}</span></div>` : ''}
        ${it.remark ? `<div class="item-row"><span>備註</span><span>${esc(it.remark)}</span></div>` : ''}
        <div class="item-foot">${statusTag(it.status)}${timeTag(it)}
          ${it.status === ST_PENDING && isMine(it) ? `<button class="btn-danger btn-sm" style="margin-left:auto" onclick="cancelOne('${esc(it.id)}')">撤銷</button>` : ''}</div>
      </div>
    </div>`).join('');
}
async function cancelOne(id) {
  if (!await askConfirm('撤銷這筆登記？', '撤銷後檢驗官就看不到這筆了。', '撤銷')) return;
  toggleLoading(true);
  const res = await callAPI('cancelRepair', { id: id, bookingPerson: LS.get('booker', '') });
  toggleLoading(false);
  if (res && res.ok) { showToast('已撤銷'); lastLoad = 0; refreshData(true); loadCatalog(); }
  else if (res) showToast(res.msg || '撤銷失敗', true);
}

/* ---------- 檢驗官：待檢驗 ---------- */
function visiblePending() {
  const q = $('q_pending').value.trim();
  const list = allItems.filter(i => i.status === ST_PENDING && matchQ(i, q));
  list.sort((a, b) => {
    if (a.inspectTime && b.inspectTime) return a.inspectTime.localeCompare(b.inspectTime);
    if (a.inspectTime) return -1; if (b.inspectTime) return 1;
    return String(a.createdAt).localeCompare(String(b.createdAt));
  });
  return list;
}

function cardPending(it) {
  const id = esc(it.id), open = expandedIds.has(it.id);
  return `<div class="list-item status-pending">
    <input type="checkbox" class="list-checkbox" ${selectedIds.has(it.id) ? 'checked' : ''} onchange="toggleItemSelect('${id}',this.checked)" aria-label="選取">
    <div class="list-content">
      <div class="item-title"><div class="item-title-text">${titleHtml(it)}</div><button class="btn-expand" onclick="toggleExpand('${id}')" aria-label="展開操作">⚙️</button></div>
      <div class="item-row"><span>預約人</span><span style="color:var(--purple)">${esc(it.bookingPerson) || '未填'}</span></div>
      <div class="item-row"><span>序號</span><span>${esc(it.serialNo)}</span></div>
      <div class="item-row"><span>預計耗時</span><span style="color:var(--red)">${esc(it.estimateTime) || '未填'}</span></div>
      <div class="item-row"><span>排定時間</span><span>${it.inspectTime ? fmtNice(it.inspectTime) : '尚未排定'}</span></div>
      ${it.remark ? `<div class="item-row"><span>備註</span><span>${esc(it.remark)}</span></div>` : ''}
      <div class="item-foot">${statusTag(it.status)}${timeTag(it)}</div>
      <div id="expand_${id}" class="expand-area ${open ? '' : 'hidden'}">
        <input type="datetime-local" id="sch_${id}" value="${esc(String(it.inspectTime).slice(0, 16))}">
        <div class="chips">
          <button type="button" class="chip" onclick="quickTime('${id}',0,14)">今天 14:00</button>
          <button type="button" class="chip" onclick="quickTime('${id}',1,9)">明天 09:00</button>
          <button type="button" class="chip" onclick="quickTime('${id}',1,14)">明天 14:00</button>
        </div>
        <div class="grid2" style="margin-bottom:10px;">
          <button class="btn-sm" onclick="saveSchedule('${id}',this)">儲存時間</button>
          <button class="btn-secondary btn-sm" onclick="copyOne('${id}')">📋 複製通知</button>
        </div>
        <button class="btn-green btn-block btn-sm" onclick="finishOne('${id}')">✔ 標記檢驗完畢</button>
      </div>
    </div></div>`;
}
function toggleExpand(id) {
  const el = $('expand_' + id); if (!el) return;
  el.classList.toggle('hidden'); if (el.classList.contains('hidden')) expandedIds.delete(id); else expandedIds.add(id);
}
function quickTime(id, dayOff, hh) {
  const d = new Date(); d.setDate(d.getDate() + dayOff); d.setHours(hh, 0, 0, 0); $('sch_' + id).value = toInput(d);
}
function toggleItemSelect(id, on) { if (on) selectedIds.add(id); else selectedIds.delete(id); updateSelectedCount(); }
function toggleSelectAll(on) {
  visiblePending().forEach(i => { if (on) selectedIds.add(i.id); else selectedIds.delete(i.id); });
  document.querySelectorAll('#list_pending .list-checkbox').forEach(c => { c.checked = on; });
  updateSelectedCount();
}
function updateSelectedCount() {
  $('selected-count').textContent = `已選 ${selectedIds.size} 筆`;
  const vis = visiblePending();
  $('chk_selectAll').checked = vis.length > 0 && vis.every(i => selectedIds.has(i.id));
}
async function afterWrite(msg) { selectedIds.clear(); showToast(msg); lastLoad = 0; await refreshData(true); }

async function pastCheck(timeVal) {
  if (new Date(timeVal) < new Date()) return await askConfirm('時間已經過了', '選的時間比現在早，確定要這樣安排嗎？', '確定安排');
  return true;
}
async function saveSchedule(id, btn) {
  const v = $('sch_' + id).value;
  if (!v) return showToast('請先選擇時間', true);
  if (!await pastCheck(v)) return;
  btn.disabled = true;
  const res = await callAPI('scheduleRepair', { id: id, scheduleTime: v, account: me.inspectorName });
  btn.disabled = false;
  if (res && res.ok) afterWrite('已更新時間！'); else if (res) showToast(res.msg || '操作失敗', true);
}
async function finishOne(id) {
  if (!await askConfirm('標記檢驗完畢？', '完成後會移到「已完畢」，無法在這裡復原。', '確定完畢')) return;
  toggleLoading(true);
  const res = await callAPI('finishRepair', { id: id, account: me.inspectorName });
  toggleLoading(false);
  if (res && res.ok) afterWrite('已標記完畢！'); else if (res) showToast(res.msg || '操作失敗', true);
}
async function batchScheduleAction() {
  if (!selectedIds.size) return showToast('請先勾選案件', true);
  const v = $('batch_time').value;
  if (!v) return showToast('請先選擇時間', true);
  if (!await pastCheck(v)) return;
  toggleLoading(true);
  const res = await callAPI('batchSchedule', { ids: Array.from(selectedIds), scheduleTime: v, account: me.inspectorName });
  toggleLoading(false);
  if (res && res.ok) afterWrite(`已為 ${res.count} 筆安排時間！`); else if (res) showToast(res.msg || '操作失敗', true);
}
async function batchFinishAction() {
  if (!selectedIds.size) return showToast('請先勾選案件', true);
  if (!await askConfirm('批次完成', `確定把 ${selectedIds.size} 筆標記為檢驗完畢？`, '確定完畢')) return;
  toggleLoading(true);
  const res = await callAPI('batchFinish', { ids: Array.from(selectedIds), account: me.inspectorName });
  toggleLoading(false);
  if (res && res.ok) afterWrite(`已標記 ${res.count} 筆完畢！`); else if (res) showToast(res.msg || '操作失敗', true);
}

function noticeText(it, timeStr) {
  return `【交修件檢驗通知】\n預約人：${it.bookingPerson || '未填'}\n料號：${it.partNo}\n名稱：${it.name}\n序號：${it.serialNo}\n預計查看時間：${timeStr}`;
}
function copyOne(id) {
  const it = allItems.find(i => i.id === id); if (!it) return;
  const inp = $('sch_' + id), t = (inp && inp.value) || it.inspectTime;
  copyText(noticeText(it, t ? fmt(t) : '尚未排定'));
}
function copySelected() {
  if (!selectedIds.size) return showToast('請先勾選案件', true);
  const bt = $('batch_time').value;
  const txt = allItems.filter(i => selectedIds.has(i.id)).map(it => {
    const t = bt || it.inspectTime; return noticeText(it, t ? fmt(t) : '尚未排定');
  }).join('\n------------\n');
  copyText(txt);
}
function copyText(text) {
  const fb = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); showToast('✅ 已複製通知文字'); } catch (e) { showToast('複製失敗，請手動複製', true); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => showToast('✅ 已複製通知文字')).catch(fb);
  else fb();
}

/* ---------- 檢驗官：已完畢 / 分析 ---------- */
function renderFinished() {
  const box = $('list_finished');
  if (!loaded) return box.innerHTML = LOADING;
  const q = $('q_finished').value.trim();
  const all = allItems.filter(i => i.status === ST_DONE);
  const list = all.filter(i => matchQ(i, q)).sort((a, b) => String(b.finishedAt).localeCompare(String(a.finishedAt)));
  if (!all.length) return box.innerHTML = emptyBox('📭', '還沒有完成的案件');
  if (!list.length) return box.innerHTML = emptyBox('🔍', '沒有符合搜尋的案件');
  const shown = list.slice(0, 200);
  box.innerHTML = shown.map(it => `
    <div class="list-item status-done"><div class="list-content">
      <div class="item-title"><div class="item-title-text">${titleHtml(it)}</div></div>
      <div class="item-row"><span>預約人</span><span style="color:var(--purple)">${esc(it.bookingPerson)}</span></div>
      <div class="item-row"><span>序號</span><span>${esc(it.serialNo)}</span></div>
      <div class="item-row"><span>登記時間</span><span>${fmtNice(it.createdAt)}</span></div>
      <div class="item-row"><span>完畢時間</span><span style="color:var(--green)">${fmtNice(it.finishedAt)}</span></div>
      <div class="item-foot">${statusTag(it.status)}</div>
    </div></div>`).join('') + (list.length > shown.length ? `<p class="empty">僅顯示最近 ${shown.length} 筆，請用搜尋縮小範圍</p>` : '');
}

function renderAnalysis() {
  const box = $('ins_stats');
  if (!loaded) return box.innerHTML = LOADING;
  const done = allItems.filter(i => i.status === ST_DONE);
  const pend = allItems.filter(i => i.status === ST_PENDING).length;
  const waits = done.filter(i => i.createdAt && i.finishedAt).map(i => (new Date(i.finishedAt) - new Date(i.createdAt)) / 36e5).filter(h => h >= 0);
  const avg = waits.length ? waits.reduce((a, b) => a + b, 0) / waits.length : 0;
  const avgTxt = !waits.length ? '—' : avg < 48 ? `${avg.toFixed(1)}<small> 小時</small>` : `${(avg / 24).toFixed(1)}<small> 天</small>`;
  const mk = dKey(new Date()).slice(0, 7);
  const byMonth = {};
  done.forEach(i => {
    const m = String(i.finishedAt || i.createdAt).slice(0, 7); if (!m) return;
    if (!byMonth[m]) byMonth[m] = { total: 0, parts: {} };
    byMonth[m].total++; byMonth[m].parts[i.partNo] = (byMonth[m].parts[i.partNo] || 0) + 1;
  });
  const months = Object.keys(byMonth).sort().reverse();
  const monthHtml = months.length ? months.map((m, idx) => {
    const parts = byMonth[m].parts, mx = Math.max.apply(null, Object.keys(parts).map(p => parts[p]));
    return `<details class="month" ${idx === 0 ? 'open' : ''}><summary><span>📅 ${esc(m)}</span><span>共 ${byMonth[m].total} 件</span></summary>
      ${Object.keys(parts).sort((a, b) => parts[b] - parts[a]).map(p => `<div class="part-row"><div class="top"><span>${esc(p)}</span><span style="color:var(--purple)">${parts[p]} 件</span></div><div class="bar"><i style="width:${Math.round(parts[p] / mx * 100)}%"></i></div></div>`).join('')}</details>`;
  }).join('') : emptyBox('📊', '完成案件後，這裡會出現每月統計');
  box.innerHTML = `<div class="stats-grid">
    <div class="stat-box"><span>待檢驗</span><strong>${pend}</strong></div>
    <div class="stat-box"><span>本月完成</span><strong>${byMonth[mk] ? byMonth[mk].total : 0}</strong></div>
    <div class="stat-box"><span>平均等待</span><strong>${avgTxt}</strong></div></div>
    <p style="font-size:12px;color:var(--text-sub);margin:-8px 0 14px;">平均等待＝從登記到標記完畢的時間；月份依完畢日期計算。</p>
    <div style="font-size:15px;font-weight:800;color:var(--text-title);margin-bottom:10px;">每月完成明細（累計 ${done.length} 件）</div>${monthHtml}`;
}

/* ---------- 月曆（共用） ---------- */
function changeMonth(delta) {
  let m = cal.month + delta, y = cal.year;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  cal.month = m; cal.year = y; cal.sel = ''; renderCal();
}
function calToday() { const n = new Date(); cal.year = n.getFullYear(); cal.month = n.getMonth(); cal.sel = dKey(n); renderCal(); }
function renderCal() {
  $('cal-title').textContent = `${cal.year}年${cal.month + 1}月`;
  const items = allItems.filter(i => i.inspectTime && i.status !== ST_CANCEL);
  const map = {}; items.forEach(i => { const k = i.inspectTime.slice(0, 10); (map[k] = map[k] || []).push(i); });
  const first = new Date(cal.year, cal.month, 1).getDay(), days = new Date(cal.year, cal.month + 1, 0).getDate();
  const todayKey = dKey(new Date());
  let html = WD.map((d, i) => `<div class="cal-dn ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('');
  for (let i = 0; i < first; i++) html += '<div class="cal-cell blank"></div>';
  for (let d = 1; d <= days; d++) {
    const key = `${cal.year}-${pad(cal.month + 1)}-${pad(d)}`, ev = map[key] || [], wd = new Date(cal.year, cal.month, d).getDay();
    const tags = ev.slice(0, 2).map(e => `<div class="cal-tag ${e.status === ST_DONE ? 'done' : ''}">${esc(e.partNo)}</div>`).join('') + (ev.length > 2 ? `<div class="cal-more">+${ev.length - 2}</div>` : '');
    html += `<div class="cal-cell ${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''} ${key === todayKey ? 'today' : ''}" data-d="${key}" onclick="selectDate('${key}')"><div>${d}</div><div class="cal-tags">${tags}</div></div>`;
  }
  $('cal-grid').innerHTML = html;
  if (!cal.sel || cal.sel.slice(0, 7) !== `${cal.year}-${pad(cal.month + 1)}`) cal.sel = (todayKey.slice(0, 7) === `${cal.year}-${pad(cal.month + 1)}`) ? todayKey : `${cal.year}-${pad(cal.month + 1)}-01`;
  selectDate(cal.sel);
}
function selectDate(key) {
  cal.sel = key;
  document.querySelectorAll('.cal-cell').forEach(c => c.classList.toggle('selected', c.dataset.d === key));
  const ev = allItems.filter(i => i.inspectTime && i.status !== ST_CANCEL && i.inspectTime.slice(0, 10) === key).sort((a, b) => a.inspectTime.localeCompare(b.inspectTime));
  const wd = WD[new Date(key).getDay()];
  const head = `<div class="day-title">${key.slice(5).replace('-', '/')}（${wd}）${loaded ? (ev.length ? `共 ${ev.length} 筆` : '沒有排定的案件') : '載入中…'}</div>`;
  const insp = me.role === '檢驗官';
  $('cal-detail').innerHTML = head + ev.map(it => `
    <div class="list-item ${it.status === ST_PENDING ? 'status-pending' : 'status-done'}"><div class="list-content">
      <div class="item-title"><div class="item-title-text">${titleHtml(it)}</div></div>
      <div class="item-row"><span>時間</span><span>${esc(it.inspectTime.slice(11, 16))}</span></div>
      <div class="item-row"><span>${insp ? '預約人' : '檢驗官'}</span><span style="color:var(--purple)">${esc(insp ? it.bookingPerson : it.targetInspector)}</span></div>
      ${insp ? '' : `<div class="item-row"><span>預約人</span><span>${esc(it.bookingPerson)}</span></div>`}
      <div class="item-row"><span>序號</span><span>${esc(it.serialNo)}</span></div>
      <div class="item-foot">${statusTag(it.status)}</div></div></div>`).join('');
}
</script>
</body>
