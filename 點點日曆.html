<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --card2: #f0f3f8;
    --card-hover: #e8edf5;
    --accent: #ff4d6d;
    --accent2: #3b82f6;
    --holiday: #e63946;
    --holiday-bg: #ffe5e8;
    --duty: #3b82f6;
    --duty2: #60a5fa;
    --today: #f59e0b;
    --today-bg: #fffbeb;
    --text: #1f2937;
    --muted: #9ca3af;
    --border: #e5e9f0;
    --radius: 16px;
  }

  html, body { width: 100%; overflow-x: hidden; }

  body {
    font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 16px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #fff;
    border: 2px solid #ffd0d8;
    color: var(--accent);
    font-size: 22px;
    font-weight: 900;
    padding: 18px 24px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    letter-spacing: 6px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    box-shadow: 0 2px 14px rgba(255,77,109,0.12);
    text-indent: 6px;
  }

  .brand:hover {
    background: #fff5f7;
    border-color: var(--accent);
    box-shadow: 0 4px 20px rgba(255,77,109,0.2);
  }

  .sync-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(255,77,109,0.9);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .brand-text { outline: none; min-width: 60px; text-align: center; }
  .brand-text:focus { border-bottom: 2px dashed rgba(255,77,109,0.5); }

  .brand-hint {
    position: absolute;
    right: 16px;
    font-size: 11px;
    color: rgba(255,77,109,0.4);
    font-weight: 400;
    letter-spacing: 0;
    text-indent: 0;
  }

  .tagline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 0 4px;
    font-size: 12px;
    color: #9ca3af;
    letter-spacing: 2px;
    font-weight: 500;
  }

  .tagline-item { position: relative; }

  .tagline-dot {
    color: #ffb3c0;
    font-weight: 900;
    font-size: 14px;
    line-height: 1;
  }

  .signature {
    text-align: center;
    font-size: 10px;
    color: #d1d5db;
    letter-spacing: 5px;
    font-weight: 400;
    font-style: italic;
    margin: 4px 0 16px;
    user-select: none;
  }

  .signature::before {
    content: '· ';
    opacity: 0.5;
    font-style: normal;
  }

  .signature::after {
    content: ' ·';
    opacity: 0.5;
    font-style: normal;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  .year-month {
    display: flex;
    align-items: center;
    gap: 14px;
    justify-content: center;
  }

  .year-select {
    background: #fff;
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }

  .year-select:hover { border-color: var(--accent); }

  .month-label {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
    min-width: 90px;
    text-align: center;
  }

  .bottom-bar {
    margin: 0 0 14px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .bottom-bar .mini-btn { justify-content: center; }

  .reset-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
  }

  .text-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  .text-btn:active { color: var(--holiday); }

  .reset-sep { color: #d1d5db; font-size: 12px; }

  /* ---------- 存到桌面／分享給朋友 ---------- */
  .app-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  .app-bar.one { grid-template-columns: 1fr; }

  .app-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 13px 8px;
    background: #fff5f7;
    color: var(--accent);
    border: 2px solid #ffd0d8;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s;
  }

  .app-btn:active { background: #ffe5ea; transform: scale(0.98); }

  .install-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  .install-head img {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(255,77,109,0.18);
  }

  .install-head h2 { margin: 0; }

  .install-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .install-note {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin: -8px 0 16px;
    line-height: 1.6;
  }

  /* App 模式：避開瀏海與底部橫條 */
  @media (display-mode: standalone) {
    body {
      padding-top: calc(12px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
  }

  .mini-btn {
    background: #fff;
    color: #6b7280;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    touch-action: manipulation;
  }

  .mini-btn:hover {
    background: var(--card2);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .mini-btn.danger:hover {
    border-color: var(--holiday);
    color: var(--holiday);
  }

  .mini-btn.on {
    border-color: var(--accent);
    color: var(--accent);
  }

  @media (hover: none) {
    .mini-btn:hover {
      background: #fff;
      border-color: var(--border);
      color: #6b7280;
      transform: none;
    }
    .mini-btn.danger:hover {
      border-color: var(--border);
      color: #6b7280;
    }
    .mini-btn.on, .mini-btn.on:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  }

  /* ---------- 快速標記面板 ---------- */
  .quick-panel {
    display: none;
    background: #fff;
    border: 2px solid #ffd0d8;
    border-radius: 14px;
    padding: 12px;
    margin: 0 0 14px;
  }

  .quick-panel.open { display: block; }

  .quick-panel textarea {
    width: 100%;
    min-height: 96px;
    padding: 10px 12px;
    line-height: 1.5;
    font-size: 16px;
    font-family: inherit;
    background: var(--card2);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    outline: none;
    resize: vertical;
  }

  .quick-panel textarea:focus { border-color: var(--accent); }
  .quick-panel textarea::placeholder { color: var(--muted); }

  .quick-preview {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin: 8px 2px 10px;
    min-height: 18px;
  }

  .quick-preview.ok { color: var(--accent2); }

  .quick-btns { display: flex; gap: 8px; }

  .quick-btns button {
    flex: 1;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .quick-go { background: var(--accent); color: #fff; }
  .quick-clear { background: var(--card2); color: var(--text); }
  .quick-paste { background: #fff5f7; color: var(--accent); border: 2px solid #ffd0d8 !important; }

  /* 輸入框一定要能選字、長按出現「貼上」 */
  input, textarea {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .calendar {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 4px 28px rgba(31,41,55,0.09);
    overflow: hidden;
    touch-action: pan-y;
    overscroll-behavior: contain;
    position: relative;
  }

  .calendar-track {
    display: flex;
    width: 300%;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }

  .calendar-track.no-anim { transition: none; }

  .calendar-panel {
    width: 33.3333%;
    flex-shrink: 0;
    padding: 14px;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 8px;
  }

  .weekdays div {
    text-align: center;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .weekdays div:first-child { color: var(--holiday); }
  .weekdays div:last-child { color: var(--accent2); }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
  }

  .day {
    min-height: 74px;
    background: var(--card2);
    border-radius: 14px;
    padding: 10px;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    display: flex;

<script>
  const STORAGE_KEY = 'duty_calendar_notes';
  const IMG_NAME_KEY = 'duty_calendar_imgname';
  const HELP_KEY = 'duty_calendar_help_seen';

  function openHelp() {
    document.getElementById('helpOverlay').classList.add('active');
  }

  function closeHelp() {
    document.getElementById('helpOverlay').classList.remove('active');
    try { localStorage.setItem(HELP_KEY, '1'); } catch {}
  }

  /* ---------- App 模式／存到桌面 ---------- */
  let deferredInstall = null;

  function isAppMode() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
           window.navigator.standalone === true;
  }

  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function appUrl() {
    return window.location.origin + window.location.pathname;
  }

  // 安卓 Chrome 需要 manifest 才會用 App 模式開
  function initManifest() {
    if (window.location.protocol === 'file:') return;
    const icon = document.getElementById('appIcon').href;
    const base = appUrl();
    const manifest = {
      name: '點點月曆',
      short_name: '點點月曆',
      start_url: base,
      scope: base.replace(/[^\/]*$/, ''),
      display: 'standalone',
      background_color: '#f5f7fa',
      theme_color: '#f5f7fa',
      icons: [
        { src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' }
      ]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstall = e;
  });

  window.addEventListener('appinstalled', () => {
    deferredInstall = null;
    closeInstall();
    showToast('✅ 已存到桌面');
  });

  function openInstall() {
    document.getElementById('installIcon').src = document.getElementById('appIcon').href;
    const steps = document.getElementById('installSteps');
    const note = document.getElementById('installNote');
    const go = document.getElementById('installGo');
    const ua = navigator.userAgent;
    const inLine = /Line\//i.test(ua);

    let html = '';
    note.textContent = '';
    go.style.display = 'none';

    if (inLine) {
      html =
        '<li><span class="help-icon">⋯</span><span>點右下角 <b>⋯</b></span></li>' +
        '<li><span class="help-icon">🧭</span><span>選 <b>用預設瀏覽器開啟</b></span></li>' +
        '<li><span class="help-icon">📲</span><span>開啟後再按一次 <b>存到桌面</b></span></li>';
    } else if (isIOS()) {
      html =
        '<li><span class="help-icon">⬆️</span><span>點下方 <b>分享</b> 按鈕</span></li>' +
        '<li><span class="help-icon">➕</span><span>選 <b>加入主畫面</b></span></li>' +
        '<li><span class="help-icon">✅</span><span>右上角按 <b>新增</b></span></li>';
      note.textContent = '請用 Safari 開啟這個網頁再操作';
    } else if (deferredInstall) {
      html =
        '<li><span class="help-icon">📲</span><span>按下方 <b>立即安裝</b></span></li>' +
        '<li><span class="help-icon">✅</span><span>桌面就會出現圖示</span></li>';
      go.style.display = '';
    } else {
      html =
        '<li><span class="help-icon">⋮</span><span>點右上角 <b>⋮</b></span></li>' +
        '<li><span class="help-icon">➕</span><span>選 <b>加到主畫面</b> 或 <b>安裝應用程式</b></span></li>' +
        '<li><span class="help-icon">✅</span><span>按 <b>新增</b></span></li>';
      note.textContent = '請用 Chrome 開啟這個網頁再操作';
    }

    steps.innerHTML = html;
    document.getElementById('installOverlay').classList.add('active');
  }

  function closeInstall() {
    document.getElementById('installOverlay').classList.remove('active');
  }

  async function doInstall() {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch {}
    deferredInstall = null;
    closeInstall();
  }

  /* ---------- 分享給朋友：只傳月曆網址，不帶標記 ---------- */
  async function shareApp() {
    const url = appUrl();
    const text = '點點月曆：記錄留守、監控的小月曆，存到桌面就像 App';
    if (navigator.share) {
      try {
        await navigator.share({ title: '點點月曆', text: text, url: url });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    try {
      await navigator.clipboard.writeText(url);
      showToast('✅ 已複製網址，貼給朋友即可');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✅ 已複製網址，貼給朋友即可');
      } catch {
        showToast('複製失敗：' + url);
      }
      document.body.removeChild(ta);
    }
  }

      '2028-05-29': '補假',
      '2028-09-28': '教師節',
      '2028-10-03': '中秋節',
      '2028-10-10': '國慶日',
      '2028-10-25': '光復節',
      '2028-12-25': '行憲紀念日'
    }
  };

  function getHolidays(year) { return HOLIDAYS[year] || {}; }
  function loadBrand() { return localStorage.getItem(BRAND_KEY) || DEFAULT_BRAND; }
  function saveBrand(n) { localStorage.setItem(BRAND_KEY, n); }
  function loadNotes() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
  function saveNotes(n) { localStorage.setItem(STORAGE_KEY, JSON.stringify(n)); }
  function dateKey(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  const soundFiles = {};
  function loadSound(name, file) {
    const a = new Audio(file);
    a.volume = 0.5;
    let ok = null;
    a.addEventListener('canplaythrough', () => { ok = true; });
    a.addEventListener('error', () => { ok = false; });
    setTimeout(() => { if (ok === null) ok = false; }, 500);
    soundFiles[name] = { audio: a, available: () => ok === true };
  }
  loadSound('mark',   'mark.mp3');
  loadSound('unmark', 'unmark.mp3');
  loadSound('hold',   'hold.mp3');
  loadSound('flip',   'flip.mp3');

  function tryPlayFile(name) {
    const s = soundFiles[name];
    if (s && s.available()) {
      try {
        s.audio.currentTime = 0;
        s.audio.play().catch(() => {});
        return true;
      } catch {}
    }
    return false;
  }

  function synthDing() {
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.06);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.36);

      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(2637, now);
      gain2.gain.setValueAtTime(0.0001, now);
      gain2.gain.exponentialRampToValueAtTime(0.08, now + 0.005);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.21);
    } catch {}
  }

  function synthTick() {
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.05);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } catch {}
  }

  function synthDull() {
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(240, now + 0.18);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    } catch {}
  }

  function synthFlip() {
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;
      const dur = 0.22;
      const bufferSize = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        const t = i / bufferSize;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2);
      }

      const source = ctx.createBufferSource();
      source.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(2400, now);
      filter.frequency.exponentialRampToValueAtTime(1200, now + dur);
      filter.Q.value = 0.8;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      source.start(now);
      source.stop(now + dur);
    } catch {}
  }

  function playMark()   { if (!tryPlayFile('mark'))   synthDing(); }
  function playUnmark() { if (!tryPlayFile('unmark')) synthTick(); }
  function playHold()   { if (!tryPlayFile('hold'))   synthDull(); }
  function playFlip()   { if (!tryPlayFile('flip'))   synthFlip(); }

  function initBrand() {
    const el = document.getElementById('brandText');
    el.textContent = loadBrand();
    document.title = loadBrand();
    el.addEventListener('blur', () => {
      let n = el.textContent.trim() || DEFAULT_BRAND;
      el.textContent = n; saveBrand(n); document.title = n;
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  }

  function focusBrand() {
    const el = document.getElementById('brandText');
    const r = document.createRange(), s = window.getSelection();
    r.selectNodeContents(el); r.collapse(false);
    s.removeAllRanges(); s.addRange(r); el.focus();
  }

  function getOffsetMonth(y, m, delta) {
    let nm = m + delta, ny = y;
    if (nm > 11) { nm = 0; ny++; }
    if (nm < 0) { nm = 11; ny--; }
    return { y: ny, m: nm };
  }

  function renderMonthTo(containerId, year, month) {
    const notes = loadNotes();
    const holidays = getHolidays(year);
    const daysEl = document.getElementById(containerId);
    daysEl.innerHTML = '';

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day empty';
      daysEl.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(year, month, d);
      const dayEl = document.createElement('div');
      dayEl.className = 'day';

      const dow = new Date(year, month, d).getDay();
      if (dow === 0) dayEl.classList.add('sunday');
      if (dow === 6) dayEl.classList.add('saturday');
      if (key === todayKey) dayEl.classList.add('today');
      if (holidays[key]) dayEl.classList.add('holiday');

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = d;
      dayEl.appendChild(numEl);

      if (notes[key]) {
        const badgeWrap = document.createElement('div');
        badgeWrap.className = 'duty-badge';
        const dot = document.createElement('div');
        dot.className = 'duty-dot';
        dot.textContent = notes[key].slice(0, 1);
        badgeWrap.appendChild(dot);
        dayEl.appendChild(badgeWrap);
      }

      bindDayEvents(dayEl, key, d, year, month);
      daysEl.appendChild(dayEl);
    }

    const totalCells = firstDay + daysInMonth;
    const TOTAL = 42;
    for (let i = totalCells; i < TOTAL; i++) {
      const empty = document.createElement('div');
      empty.className = 'day empty';
      daysEl.appendChild(empty);
    }
  }

  /* ---------- 事件綁定：短按用瀏覽器原生 click（安卓最穩），長按另外計時 ---------- */
  function bindDayEvents(el, key, day, year, month) {
    let timer = null;
    let longPressed = false;
    let sx = 0, sy = 0;
    const LONG = 500;
    const TOL = 12;

    const clearTimer = () => {
      if (timer) { clearTimeout(timer); timer = null; }
    };

    el.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      longPressed = false;
      sx = e.clientX;
      sy = e.clientY;
      clearTimer();
      timer = setTimeout(() => {
        timer = null;
        longPressed = true;
        if (navigator.vibrate) navigator.vibrate(15);
        playHold();
        openModal(key, day, year, month);
      }, LONG);
    });

    el.addEventListener('pointermove', (e) => {
      if (!timer) return;
      if (Math.abs(e.clientX - sx) > TOL || Math.abs(e.clientY - sy) > TOL) clearTimer();
    });

    el.addEventListener('pointerup', clearTimer);
    el.addEventListener('pointercancel', clearTimer);
    el.addEventListener('pointerleave', clearTimer);

    el.addEventListener('click', () => {
      if (longPressed) { longPressed = false; return; }
      if (Date.now() < suppressClickUntil) return;
      toggleMark(key);
    });

    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function toggleMark(key) {
    const notes = loadNotes();
    if (notes[key]) {
      delete notes[key];
      playUnmark();
    } else {
      notes[key] = DEFAULT_MARK;
      playMark();
    }
    saveNotes(notes);
    render();
  }

  function render() {
    document.getElementById('monthLabel').textContent = `${currentMonth + 1} 月`;

    const prev = getOffsetMonth(currentYear, currentMonth, -1);
    const next = getOffsetMonth(currentYear, currentMonth, 1);

    renderMonthTo('daysPrev', prev.y, prev.m);
    renderMonthTo('days', currentYear, currentMonth);
    renderMonthTo('daysNext', next.y, next.m);

    const track = document.getElementById('calendarTrack');
    track.classList.add('no-anim');
    track.style.transform = 'translateX(-33.3333%)';
    requestAnimationFrame(() => track.classList.remove('no-anim'));

    updateQuickPreview();
  }

  /* ---------- 快速標記：貼一段文字，自動抓出日期 ---------- */
  function toggleQuick() {
    const panel = document.getElementById('quickPanel');
    const btn = document.getElementById('quickBtn');
    const open = !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    btn.classList.toggle('on', open);
    if (open) updateQuickPreview();
  }

  async function pasteQuick() {
    const input = document.getElementById('quickInput');
    try {
      const text = await navigator.clipboard.readText();
      if (!text || !text.trim()) {
        showToast('剪貼簿是空的，先去複製文字');
        return;
      }
      input.value = text;
      updateQuickPreview();
      showToast('已貼上');
    } catch {
      // 讀不到剪貼簿時，改用手機原生輸入框（桌面 App 模式也能長按貼上）
      const text = prompt('長按下方輸入框，選「貼上」');
      if (text && text.trim()) {
        input.value = text;
        updateQuickPreview();
      }
    }
  }

  function parseDays(text, year, month) {
    const max = new Date(year, month + 1, 0).getDate();
    let s = text.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    s = s.replace(/\d+\s*[\/／]\s*(\d+)/g, ' $1 ');   // 10/8 → 只留 8
    s = s.replace(/\d+\s*[年月]/g, ' ');              // 拿掉「10月」「2026年」
    s = s.replace(/\d{3,}/g, ' ');                     // 拿掉年份、電話之類長數字
    const set = new Set();
    (s.match(/\d+/g) || []).forEach(n => {
      const d = parseInt(n, 10);
      if (d >= 1 && d <= max) set.add(d);
    });
    return [...set].sort((a, b) => a - b);
  }

  function quickMark(text) {
    return /監/.test(text) ? '監' : DEFAULT_MARK;
  }

  function updateQuickPreview() {
    const input = document.getElementById('quickInput');
    const pv = document.getElementById('quickPreview');
    if (!input || !pv) return;
    const text = input.value;
    if (!text.trim()) {
      pv.textContent = `會標記到 ${currentYear} 年 ${currentMonth + 1} 月`;
      pv.classList.remove('ok');
      return;
    }
    const days = parseDays(text, currentYear, currentMonth);
    if (days.length) {
      pv.textContent = `${currentMonth + 1} 月 → ${days.join('、')} 日（標「${quickMark(text)}」）`;
      pv.classList.add('ok');
    } else {
      pv.textContent = '找不到日期';
      pv.classList.remove('ok');
    }
  }

  function clearQuick() {
    document.getElementById('quickInput').value = '';
    updateQuickPreview();
  }

  function closeQuick() {
    const input = document.getElementById('quickInput');
    input.value = '';
    input.blur();
    updateQuickPreview();
    document.getElementById('quickPanel').classList.remove('open');
    document.getElementById('quickBtn').classList.remove('on');
  }

  function applyQuick() {
    const input = document.getElementById('quickInput');
    const text = input.value;
    const days = parseDays(text, currentYear, currentMonth);
    if (!days.length) {
      showToast('沒有找到日期');
      return;
    }
    const mark = quickMark(text);
    const notes = loadNotes();
    days.forEach(d => { notes[dateKey(currentYear, currentMonth, d)] = mark; });
    saveNotes(notes);
    playMark();
    input.value = '';
    input.blur();
    document.getElementById('quickPanel').classList.remove('open');
    document.getElementById('quickBtn').classList.remove('on');
    render();
    showToast(`✅ 已標記 ${currentMonth + 1} 月 ${days.join('、')} 日`);
  }

  /* ---------- 產圖：把本月畫成 PNG ---------- */
  let imgBlob = null;
  let imgFileName = '';

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrapText(ctx, text, maxW) {
    const lines = [];
    let line = '';
    for (const ch of text) {
      if (line && ctx.measureText(line + ch).width > maxW) {
        lines.push(line);
        line = ch;
      } else {
        line += ch;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function makeImage() {
    let last = '';
    try { last = localStorage.getItem(IMG_NAME_KEY) || ''; } catch {}
    const input = prompt('圖片上要寫誰的名字？（例：王學長）', last);
    if (input === null) return;
    const who = input.trim();
    try { localStorage.setItem(IMG_NAME_KEY, who); } catch {}

    const canvas = drawMonthImage(who);
    document.getElementById('imgPreview').src = canvas.toDataURL('image/png');
    imgFileName = `${who || '月曆'}_${currentYear}年${currentMonth + 1}月.png`;
    imgBlob = null;

    const shareBtn = document.getElementById('imgShareBtn');
    shareBtn.style.display = 'none';
    canvas.toBlob((blob) => {
      imgBlob = blob;
      try {
        const file = new File([blob], imgFileName, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          shareBtn.style.display = '';
        }
      } catch {}
    }, 'image/png');

    document.getElementById('imgOverlay').classList.add('active');
  }

  function drawMonthImage(who) {
    const y = currentYear, m = currentMonth;
    const notes = loadNotes();
    const holidays = getHolidays(y);
    const firstDay = new Date(y, m, 1).getDay();
    const dim = new Date(y, m + 1, 0).getDate();
    const rows = Math.ceil((firstDay + dim) / 7);

    const FONT = '"PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif';
    const W = 1080, PAD = 48, GAP = 12;
    const cellW = (W - PAD * 2 - GAP * 6) / 7;
    const cellH = cellW * 1.05;

    // 統計：依標記文字分組
    const groups = {};
    for (let d = 1; d <= dim; d++) {
      const v = notes[dateKey(y, m, d)];
      if (v) (groups[v] = groups[v] || []).push(d);
    }
    const summary = Object.keys(groups).map(k => `${k}（${groups[k].length} 天）：${groups[k].join('、')}`);

    const measure = document.createElement('canvas').getContext('2d');
    measure.font = `700 34px ${FONT}`;
    let sumLines = [];
    summary.forEach(s => { sumLines = sumLines.concat(wrapText(measure, s, W - PAD * 2 - 56)); });
    if (!sumLines.length) sumLines = ['本月沒有標記'];
    const LINE_H = 52;

    // 版面高度
    const titleTop = PAD + 12;
    const monthTop = titleTop + 64 + 14;
    const boxTop = monthTop + 44 + 28;
    const boxH = 28 * 2 + sumLines.length * LINE_H - (LINE_H - 36);
    const weekTop = boxTop + boxH + 32;
    const gridTop = weekTop + 56 + 8;
    const gridH = rows * cellH + (rows - 1) * GAP;
    const footTop = gridTop + gridH + 36;
    const H = footTop + 26 + PAD;

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.textBaseline = 'top';

    // 背景
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4d6d';
    ctx.fillRect(0, 0, W, 12);

    // 標題
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1f2937';
    ctx.font = `900 64px ${FONT}`;
    ctx.fillText(who || loadBrand(), W / 2, titleTop);
    ctx.fillStyle = '#ff4d6d';
    ctx.font = `800 44px ${FONT}`;
    ctx.fillText(`${y} 年 ${m + 1} 月`, W / 2, monthTop);

    // 統計框
    ctx.fillStyle = '#fff5f7';
    rr(ctx, PAD, boxTop, W - PAD * 2, boxH, 20);
    ctx.fill();
    ctx.textAlign = 'left';
    ctx.fillStyle = summary.length ? '#1f2937' : '#9ca3af';
    ctx.font = `700 34px ${FONT}`;
    sumLines.forEach((line, i) => {
      ctx.fillText(line, PAD + 28, boxTop + 28 + i * LINE_H);
    });

    // 星期列
    const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
    ctx.textAlign = 'center';
    ctx.font = `800 30px ${FONT}`;
    WEEK.forEach((w, i) => {
      ctx.fillStyle = i === 0 ? '#e63946' : (i === 6 ? '#3b82f6' : '#9ca3af');
      ctx.fillText(w, PAD + i * (cellW + GAP) + cellW / 2, weekTop + 12);
    });

    // 日期格
    for (let d = 1; d <= dim; d++) {
      const idx = firstDay + d - 1;
      const col = idx % 7, row = Math.floor(idx / 7);
      const x = PAD + col * (cellW + GAP);
      const cy = gridTop + row * (cellH + GAP);
      const key = dateKey(y, m, d);
      const isHoliday = !!holidays[key];

      ctx.fillStyle = isHoliday ? '#ffe5e8' : '#f0f3f8';
      rr(ctx, x, cy, cellW, cellH, 18);
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.font = `800 32px ${FONT}`;
      if (isHoliday || col === 0) ctx.fillStyle = '#e63946';
      else if (col === 6) ctx.fillStyle = '#3b82f6';
      else ctx.fillStyle = '#1f2937';
      ctx.fillText(String(d), x + 14, cy + 12);

      if (isHoliday) {
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(x + cellW - 14, cy + cellH - 14, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      if (notes[key]) {
        const r = cellW * 0.27;
        const dx = x + cellW / 2, dy = cy + cellH * 0.62;
        const g = ctx.createLinearGradient(dx - r, dy - r, dx + r, dy + r);
        g.addColorStop(0, '#3b82f6');
        g.addColorStop(1, '#60a5fa');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(dx, dy, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `800 36px ${FONT}`;
        ctx.fillText(notes[key].slice(0, 1), dx, dy + 2);
        ctx.textBaseline = 'top';
      }
    }

    // 頁尾
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c4c9d2';
    ctx.font = `500 24px ${FONT}`;
    ctx.fillText(`${loadBrand()} · 吱吱製作`, W / 2, footTop);

    return canvas;
  }

  function closeImage() {
    document.getElementById('imgOverlay').classList.remove('active');
  }

  function downloadImage() {
    const go = (blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = imgFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      showToast('已下載，若沒反應請長按圖片儲存');
    };
    if (imgBlob) go(imgBlob);
    else showToast('圖片還在產生，請再按一次');
  }

  async function shareImage() {
    if (!imgBlob) { showToast('圖片還在產生，請再按一次'); return; }
    try {
      const file = new File([imgBlob], imgFileName, { type: 'image/png' });
      await navigator.share({ files: [file] });
    } catch (e) {
      if (e && e.name !== 'AbortError') showToast('無法分享，請改用下載或長按儲存');
    }
  }

  function modalReady() {
    return Date.now() - modalOpenedAt > 400;
  }

  function openModal(key, day, year, month) {
    selectedDateKey = key;
    modalOpenedAt = Date.now();
    const notes = loadNotes();
    const holidays = getHolidays(year);
    const holidayName = holidays[key];

    const titleEl = document.getElementById('modalTitle');
    const subEl = document.getElementById('modalHoliday');

    titleEl.textContent = `${year} 年 ${month + 1} 月 ${day} 日`;

    if (holidayName) {
      subEl.textContent = `🎌 ${holidayName}`;
      subEl.style.display = 'block';
    } else {
      subEl.textContent = '';
      subEl.style.display = 'none';
    }

    document.getElementById('noteInput').value = notes[key] || DEFAULT_MARK;
    document.getElementById('modalOverlay').classList.add('active');
    setTimeout(() => document.getElementById('noteInput').focus(), 100);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    selectedDateKey = null;
  }

  function saveNote() {
    if (!selectedDateKey) return;
    const notes = loadNotes();
    const val = document.getElementById('noteInput').value.trim();
    if (val) notes[selectedDateKey] = val;
    else delete notes[selectedDateKey];
    saveNotes(notes);
    closeModal();
    render();
  }

  function deleteNote() {
    if (!selectedDateKey) return;
    const notes = loadNotes();
    delete notes[selectedDateKey];
    saveNotes(notes);
    closeModal();
    render();
  }

  function resetMonth() {
    const notes = loadNotes();
    const prefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-`;
    const keys = Object.keys(notes).filter(k => k.startsWith(prefix));

    if (keys.length === 0) {
      showToast('本月沒有紀錄');
      return;
    }
    if (confirm(`確定要清除本月的 ${keys.length} 筆紀錄嗎？`)) {
      keys.forEach(k => delete notes[k]);
      saveNotes(notes);
      render();
      showToast('已清除本月紀錄');
    }
  }

  function resetAll() {
    const notes = loadNotes();
    const noteCount = Object.keys(notes).length;
    const brandChanged = loadBrand() !== DEFAULT_BRAND;

    if (noteCount === 0 && !brandChanged) {
      showToast('目前沒有可重置的內容');
      return;
    }

    const msg = `確定要重置嗎？\n\n` +
      (noteCount > 0 ? `• 清除 ${noteCount} 筆留守紀錄\n` : '') +
      (brandChanged ? `• 標題還原成「${DEFAULT_BRAND}」\n` : '');

    if (confirm(msg)) {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(BRAND_KEY);
      document.getElementById('brandText').textContent = DEFAULT_BRAND;
      document.title = DEFAULT_BRAND;
      render();
      showToast('已重置全部');
    }
  }

  function changeMonth(delta) {
    let y = currentYear;
    let m = currentMonth + delta;

    if (m > 11) { m = 0; y++; }
    if (m < 0) { m = 11; y--; }

    currentYear = y;
    currentMonth = m;

    const sel = document.getElementById('yearSelect');
    if (![...sel.options].some(o => parseInt(o.value) === currentYear)) {
      const opt = document.createElement('option');
      opt.value = currentYear;
      opt.textContent = currentYear + ' 年';
      sel.appendChild(opt);
      const opts = [...sel.options].sort((a, b) => parseInt(a.value) - parseInt(b.value));
      sel.innerHTML = '';
      opts.forEach(o => sel.appendChild(o));
    }

    sel.value = currentYear;
    render();
  }

  function initYearSelect() {
    const sel = document.getElementById('yearSelect');
    YEAR_RANGE.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y + ' 年';
      sel.appendChild(opt);
    });
    if (![...sel.options].some(o => parseInt(o.value) === currentYear)) {
      const opt = document.createElement('option');
      opt.value = currentYear;
      opt.textContent = currentYear + ' 年';
      sel.appendChild(opt);
    }
    sel.value = currentYear;
    sel.onchange = () => {
      currentYear = parseInt(sel.value);
      render();
    };
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  function getShareUrl() {
    const url = new URL(window.location.href.split('?')[0]);
    url.searchParams.set('y', currentYear);
    url.searchParams.set('m', currentMonth + 1);

    const notes = loadNotes();
    const prefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-`;
    const parts = [];
    Object.keys(notes).forEach(k => {
      if (k.startsWith(prefix)) {
        const day = parseInt(k.split('-')[2]);
        parts.push(`${day}:${encodeURIComponent(notes[k])}`);
      }
    });
    if (parts.length) url.searchParams.set('d', parts.join(','));

    return url.toString();
  }

  async function copyLink() {
    const url = getShareUrl();
    try {
      await navigator.clipboard.writeText(url);
      showToast('✅ 已複製連結，貼給朋友即可');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✅ 已複製連結，貼給朋友即可');
      } catch {
        showToast('複製失敗，請手動複製');
      }
      document.body.removeChild(ta);
    }
  }

  function applySharedNotes() {
    const params = new URLSearchParams(window.location.search);
    const d = params.get('d');
    if (!d) return;

    const notes = loadNotes();
    d.split(',').forEach(item => {
      const [dayStr, val] = item.split(':');
      const day = parseInt(dayStr);
      if (!day || !val) return;
      const key = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      notes[key] = decodeURIComponent(val);
    });
    saveNotes(notes);

    window.history.replaceState({}, '', window.location.pathname);
  }

  (function initSwipe() {
    const cal = document.getElementById('calendar');
    const track = document.getElementById('calendarTrack');
    let startX = 0, startY = 0, curX = 0;
    let dragging = false, locked = null;
    let moved = false;
    const MOVE_MIN = 10;
    const W = () => cal.clientWidth;

    cal.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      curX = 0;
      dragging = true;
      locked = null;
      moved = false;
      track.classList.add('no-anim');
    }, { passive: true });

    cal.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;

      if (!locked) {
        if (Math.abs(dx) > Math.abs(dy) + 4) locked = 'h';
        else if (Math.abs(dy) > Math.abs(dx) + 4) locked = 'v';
      }
      if (locked !== 'h') return;

      if (Math.abs(dx) > MOVE_MIN) moved = true;
      curX = dx;
      track.style.transform = `translateX(${-W() + dx}px)`;
    }, { passive: true });

    const touchFinish = () => {
      if (!dragging) return;
      dragging = false;
      track.classList.remove('no-anim');

      if (!moved) {
        track.style.transform = `translateX(-${W()}px)`;
        curX = 0;
        return;
      }

      suppressClickUntil = Date.now() + 400;

      const threshold = W() * 0.25;
      if (curX < -threshold) slideTo(1);
      else if (curX > threshold) slideTo(-1);
      else track.style.transform = `translateX(-${W()}px)`;

      curX = 0;
    };

    cal.addEventListener('touchend', touchFinish);
    cal.addEventListener('touchcancel', touchFinish);

    cal.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      startX = e.clientX;
      curX = 0;
      dragging = true;
      locked = 'h';
      moved = false;
      track.classList.add('no-anim');
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging || locked !== 'h') return;
      curX = e.clientX - startX;
      if (Math.abs(curX) > MOVE_MIN) moved = true;
      track.style.transform = `translateX(${-W() + curX}px)`;
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      track.classList.remove('no-anim');

      if (!moved) {
        track.style.transform = `translateX(-${W()}px)`;
        curX = 0;
        return;
      }

      suppressClickUntil = Date.now() + 400;

      const threshold = W() * 0.2;
      if (curX < -threshold) slideTo(1);
      else if (curX > threshold) slideTo(-1);
      else track.style.transform = `translateX(-${W()}px)`;
      curX = 0;
    });

    function slideTo(delta) {
      const w = W();
      const target = delta > 0 ? -2 * w : 0;
      track.style.transform = `translateX(${target}px)`;
      playFlip();
      setTimeout(() => changeMonth(delta), 280);
    }
  })();

  const params = new URLSearchParams(window.location.search);
  const urlYear = parseInt(params.get('y'));
  const urlMonth = parseInt(params.get('m'));

  const now = new Date();
  currentYear = !isNaN(urlYear) ? urlYear : now.getFullYear();
  currentMonth = !isNaN(urlMonth) ? urlMonth - 1 : now.getMonth();

  document.getElementById('quickInput').addEventListener('input', updateQuickPreview);

  initBrand();
  initYearSelect();
  applySharedNotes();
  render();
  initManifest();
  initAppBar();
  initHelp();
</script>

</body>
