<title>誰誰誰</title>
<style>
  :root {
    --bg:#f2f4f7; --card:#ffffff; --card2:#f7f9fb; --card3:#eceff4;
    --line:#e1e6ed; --line2:#cfd7e2; --txt:#1b2533; --sub:#56657a; --dim:#8794a6;
    --acc:#1f4f86; --acc-a:#e8eff7; --acc-b:#b9cbe0;
    --amber:#a85d00; --amber-a:#fbf2e6; --ok:#2f7a4e; --err:#b3362b;
    --r:12px; --tb:56px;
    --sb: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-top, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:16px; line-height:1.5; min-height:100vh; }
  button { font-family:inherit; color:inherit; font-size:inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .hidden { display:none !important; }
  mark { background:#fff1c2; color:inherit; border-radius:2px; padding:0 1px; }
  .num { font-variant-numeric:tabular-nums; }
  svg.ico { width:20px; height:20px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .zs { display:inline-block; font-size:18px; line-height:1; color:var(--acc); width:22px; text-align:center; }

  /* ===== 登入 ===== */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); }
  .lcard { width:100%; max-width:360px; padding:32px 24px 24px; background:var(--card); border:1px solid var(--line); border-radius:16px; text-align:center; }
  .lcard .logo { display:block; width:72px; height:72px; border-radius:18px; margin:0 auto 14px; }
  .lcard h1 { margin:0; font-size:26px; font-weight:700; letter-spacing:.15em; padding-left:.15em; }
  .lcard p { margin:2px 0 24px; color:var(--sub); font-size:14px; }
  .pwbox { position:relative; }
  .pwbox svg.ico { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--dim); }
  .field { width:100%; height:52px; padding:0 14px 0 44px; font-size:17px; color:var(--txt); border-radius:10px; border:1px solid var(--line2); background:var(--card); outline:none; }
  .field:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-a); }
  .btn { width:100%; height:52px; margin-top:12px; font-size:17px; font-weight:700; letter-spacing:.2em; border:0; border-radius:10px; color:#fff; cursor:pointer; background:var(--acc); }
  .btn:disabled { opacity:.5; }
  .lmsg { min-height:22px; margin-top:14px; font-size:14px; color:var(--err); }
  .lmsg.note { color:var(--amber); }
  .lmsg svg.ico { display:block; width:40px; height:40px; margin:0 auto 6px; color:var(--dim); }
  .lnote { margin-top:20px; font-size:12px; color:var(--dim); }

  /* ===== 外框 ===== */
  #app { padding-bottom:calc(72px + var(--sb)); }
  .top { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:calc(8px + var(--st)) 12px 8px 14px; background:var(--card); border-bottom:1px solid var(--line); }
  .top .logo { width:30px; height:30px; border-radius:8px; }
  .top .ttl { flex:1; min-width:0; }
  .top b { display:block; font-size:17px; letter-spacing:.08em; line-height:1.25; }
  .top small { display:block; font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top small i { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:5px; vertical-align:1px; }
  .ibtn { width:44px; height:44px; display:grid; place-items:center; padding:0; border:0; border-radius:10px; background:none; color:var(--sub); cursor:pointer; }
  .ibtn:active { background:var(--card3); }
  .ibtn svg.ico { width:22px; height:22px; }
  .wrap { max-width:720px; margin:0 auto; padding:0 14px 16px; }
  .vhead { padding:16px 2px 8px; }
  .vhead h2 { margin:0; font-size:21px; font-weight:700; }
  .vhead p { margin:2px 0 0; color:var(--sub); font-size:14px; }

  /* ===== 搜尋列 ===== */
  .sbar { position:sticky; top:var(--tb); z-index:25; margin:0 -14px; padding:10px 14px 8px; background:var(--bg); border-bottom:1px solid transparent; }
  .sbox { position:relative; }
  .sbox > svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:20px; height:20px; stroke:var(--dim); fill:none; stroke-width:2; stroke-linecap:round; pointer-events:none; z-index:2; }
  .sbox input { width:100%; height:50px; padding:0 44px; font-size:17px; color:var(--txt); border-radius:10px; border:1px solid var(--line2); background:var(--card); outline:none; }
  .sbox input:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-a); }
  .sbox input::placeholder { color:var(--dim); }
  .clr { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%; border:0; background:none; color:var(--dim); font-size:15px; cursor:pointer; }
  .sug { position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--card); border:1px solid var(--line2); border-radius:10px; box-shadow:0 10px 30px rgba(20,35,58,.14); max-height:62vh; overflow-y:auto; }
  .sug-h { padding:8px 14px 2px; font-size:12px; color:var(--dim); }
  .sug-i { display:flex; align-items:center; gap:11px; min-height:52px; padding:8px 14px; cursor:pointer; }
  .sug-i + .sug-i { border-top:1px solid var(--line); }
  .sug-i.on, .sug-i:active { background:var(--acc-a); }
  .sug-i .m { flex:1; min-width:0; }
  .sug-i b { display:block; font-size:16px; font-weight:600; }
  .sug-i small { display:block; font-size:13px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sug-i em { font-style:normal; font-size:12px; color:var(--acc); }
  .quick { display:flex; gap:6px; overflow-x:auto; padding:8px 0 0; scrollbar-width:none; }
  .quick::-webkit-scrollbar { display:none; }
  .qc { flex:0 0 auto; height:36px; padding:0 13px; border-radius:18px; border:1px solid var(--line2); background:var(--card); font-size:14px; color:var(--txt); cursor:pointer; white-space:nowrap; }
  .qc i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .qc.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .qc.on i { background:#fff !important; }
  input:focus-visible { outline:none; }
  .lmsg { border:0; }
  .fchips { display:flex; flex-wrap:wrap; gap:6px; padding-top:8px; }
  .fchips:empty { display:none; }
  .fchip { display:inline-flex; align-items:center; gap:4px; height:34px; padding:0 4px 0 12px; border-radius:17px; background:var(--acc-a); border:1px solid var(--acc-b); font-size:14px; color:var(--acc); }
  .fchip button { width:28px; height:28px; border-radius:50%; border:0; background:none; color:var(--acc); font-size:12px; cursor:pointer; padding:0; }

  /* ===== 區塊 ===== */
  .card { margin-top:12px; padding:14px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); }
  .card > h3 { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:15px; font-weight:700; color:var(--txt); }
  .card > h3 svg.ico { color:var(--sub); }
  .card > h3 em { margin-left:auto; font-style:normal; color:var(--sub); font-weight:600; font-size:14px; }
  .card > h3 small { margin-left:auto; font-weight:400; color:var(--dim); font-size:12.5px; }
  .card.gold { border-left:4px solid var(--amber); }
  .card.gold > h3 svg.ico, .card.gold > h3 em { color:var(--amber); }
  .hero { margin-top:14px; padding:2px 2px 0; }
  .hero b { display:block; font-size:20px; font-weight:700; }
  .hero span { font-size:14px; color:var(--sub); }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .kpi { padding:10px 4px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); text-align:center; cursor:pointer; }
  .kpi svg.ico { display:block; margin:0 auto 2px; color:var(--dim); }
  .kpi b { display:block; font-size:22px; font-weight:700; line-height:1.2; }
  .kpi span { font-size:12px; color:var(--sub); }
  .kpi.hot b { color:var(--amber); }
  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { min-height:38px; padding:0 13px; border-radius:19px; background:var(--card2); border:1px solid var(--line2); font-size:15px; cursor:pointer; }
  .pill small { color:var(--sub); margin-left:6px; font-size:12.5px; }
  .pill.hot { border-color:#e6c9a0; background:var(--amber-a); }
  .lrow { display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:6px 2px; border:0; border-top:1px solid var(--line); background:none; cursor:pointer; text-align:left; }
  .lrow:first-of-type { border-top:0; }
  .lrow .d { flex:0 0 86px; color:var(--sub); font-size:14px; }
  .lrow .n { flex:1; min-width:0; font-weight:600; }
  .lrow .n small { color:var(--sub); font-weight:400; margin-left:6px; font-size:13px; }
  .tag { font-size:12.5px; padding:2px 10px; border-radius:12px; background:var(--card3); color:var(--sub); white-space:nowrap; }
  .tag.today { background:var(--amber); color:#fff; font-weight:700; }
  .tag.soon { background:var(--amber-a); color:var(--amber); }
  .lrow.past { color:var(--dim); }
  .lrow.past .n { font-weight:400; }
  .more { display:block; width:100%; min-height:44px; margin-top:8px; background:none; border:1px solid var(--line2); border-radius:10px; color:var(--acc); font-size:14px; cursor:pointer; }
  .drow { display:flex; justify-content:space-between; align-items:center; min-height:44px; }
  .drow + .drow { border-top:1px solid var(--line); }
  .dt { display:inline-flex; align-items:center; gap:5px; font-size:14px; font-weight:600; padding:3px 10px; border-radius:14px; margin-left:6px; background:var(--card3); color:var(--txt); }
  .dt svg.ico { width:16px; height:16px; color:var(--sub); }
  .tips { color:var(--sub); font-size:14px; line-height:2.2; }
  .tips code { font-family:inherit; background:var(--card3); padding:4px 10px; border-radius:6px; color:var(--acc); font-size:13.5px; margin-right:4px; cursor:pointer; }
  .cbar { display:flex; height:5px; border-radius:3px; overflow:hidden; background:var(--card3); }
  .cbar i { display:block; height:100%; }

  /* ===== 結果 ===== */
  .rbar { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 2px 4px; color:var(--sub); font-size:14px; }
  .rbar .b { display:flex; gap:4px; }
  .rbar button { display:inline-flex; align-items:center; gap:5px; min-height:40px; padding:0 8px; background:none; border:0; border-radius:8px; color:var(--acc); font-size:14px; cursor:pointer; }
  .rbar button svg.ico { width:18px; height:18px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px; padding:2px 0 4px; }
  .lg { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 11px; border-radius:16px; font-size:13.5px; cursor:pointer; border:1px solid var(--line2); background:var(--card); }
  .lg::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--lc); }
  .lg small { color:var(--sub); }
  .ynav { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:6px; margin:4px 0 8px; }
  .ynav button, .ynav div { min-height:52px; padding:6px 4px; border-radius:10px; border:1px solid var(--line2); background:var(--card); text-align:center; font-size:14px; font-weight:600; cursor:pointer; line-height:1.3; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ynav div { border-color:var(--acc); color:var(--acc); cursor:default; }
  .ynav small { display:block; font-size:12px; color:var(--sub); font-weight:400; }
  .ynav span { display:inline-flex; align-items:center; gap:3px; }
  .ynav svg.ico { width:16px; height:16px; }
  .ynav button:disabled { opacity:.35; }
  .grp { display:flex; align-items:center; gap:8px; min-height:40px; margin:10px 2px 4px; font-size:14px; font-weight:700; color:var(--txt); cursor:pointer; user-select:none; }
  .grp.first { margin-top:2px; }
  .grp i { width:10px; height:10px; border-radius:50%; background:var(--gc); }
  .grp small { color:var(--sub); font-weight:400; font-size:13px; }
  .grp::after { content:""; flex:1; order:5; height:1px; background:var(--line); }
  .grp .car { order:9; color:var(--dim); font-size:11px; transition:transform .2s; }
  .grp.off .car { transform:rotate(-90deg); }
  .row { display:flex; align-items:center; gap:12px; min-height:64px; padding:10px 12px; margin-bottom:6px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); cursor:pointer; }
  .av { flex:0 0 auto; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-size:17px; font-weight:700; color:var(--gc); background:var(--card3); background:color-mix(in srgb, var(--gc) 13%, #fff); }
  .rm { flex:1; min-width:0; }
  .rn { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:17px; font-weight:700; }
  .rk { font-size:12.5px; font-weight:600; color:var(--gc); }
  .bt { font-size:12px; font-weight:600; padding:1px 8px; border-radius:10px; background:var(--amber-a); color:var(--amber); }
  .star { color:var(--amber); font-size:14px; }
  .rs { margin-top:1px; font-size:13.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chev { color:var(--dim); font-size:20px; }
  .empty { text-align:center; padding:44px 10px; color:var(--sub); }
  .empty svg.ico { width:44px; height:44px; color:var(--dim); stroke-width:1.4; margin-bottom:6px; }
  .loading { text-align:center; padding:48px 0; color:var(--sub); }
  .loading::before { content:""; display:block; width:30px; height:30px; margin:0 auto 12px; border-radius:50%; border:3px solid var(--line2); border-top-color:var(--acc); animation:spin .8s linear infinite; }
  .pager { text-align:center; margin:6px 0 10px; }
  .pager button { min-height:44px; padding:0 26px; border-radius:22px; border:1px solid var(--line2); background:var(--card); color:var(--acc); cursor:pointer; }

  /* ===== 磚塊 ===== */
  .seg { display:flex; padding:3px; border-radius:10px; background:var(--card3); margin:4px 0 12px; }
  .seg button { flex:1; min-height:40px; padding:0 4px; border:0; border-radius:8px; background:none; color:var(--sub); font-size:15px; font-weight:600; cursor:pointer; }
  .seg button.on { background:var(--card); color:var(--txt); box-shadow:0 1px 3px rgba(20,35,58,.12); }
  .seg.sm button { font-size:13px; }
  .sect { display:flex; align-items:center; gap:8px; margin:16px 2px 8px; font-size:14px; font-weight:700; color:var(--sub); }
  .sect small { font-weight:400; }
  .sect::after { content:""; flex:1; height:1px; background:var(--line); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tiles.c4 { grid-template-columns:repeat(4,1fr); }
  .tiles.c2 { grid-template-columns:repeat(2,1fr); }
  .tile { min-height:64px; padding:10px 6px; border-radius:var(--r); border:1px solid var(--line); background:var(--card); text-align:center; cursor:pointer; }
  .tile .zs { display:block; width:auto; font-size:22px; margin-bottom:2px; }
  .tile svg.ico { display:block; margin:0 auto 2px; color:var(--dim); }
  .tile b { display:block; font-size:16px; font-weight:700; }
  .tile span { display:block; font-size:13px; color:var(--sub); }
  .tile em { display:block; font-style:normal; font-size:11.5px; color:var(--dim); }
  .tile .cbar { margin:8px 6px 0; }
  .tile.now { border-color:var(--amber); }
  .tile.now b { color:var(--amber); }
  .tile.zero { opacity:.45; }

  /* ===== 留守 ===== */
  .dcard { display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:60px; padding:10px 14px; margin-bottom:6px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); }
  .dcard.today { border-left:4px solid var(--amber); }
  .dcard .dd { font-size:18px; font-weight:700; }
  .dcard .dd small { margin-left:7px; font-size:14px; color:var(--sub); font-weight:400; }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; background:var(--amber); color:#fff; font-weight:700; margin-left:7px; vertical-align:2px; }

  /* ===== 統計 ===== */
  .skpi { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .skpi div { padding:10px 4px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); text-align:center; }
  .skpi b { display:block; font-size:20px; font-weight:700; }
  .skpi b small { font-size:12px; font-weight:400; color:var(--sub); margin-left:1px; }
  .skpi span { font-size:12px; color:var(--sub); }
  .ch-note { margin:8px 0 0; font-size:13px; color:var(--sub); }
  .hb { display:grid; grid-template-columns:92px 1fr 40px; align-items:center; gap:9px; width:100%; min-height:40px; padding:4px 0; border:0; background:none; cursor:pointer; text-align:left; }
  .hb + .hb { border-top:1px solid var(--line); }
  .hb .l { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .hb .t { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--card3); }
  .hb .t i { display:block; height:100%; }
  .hb .v { font-size:14px; font-weight:600; text-align:right; }
  .hb .v small { display:block; font-size:11px; color:var(--dim); font-weight:400; }
  .hb.top .l { color:var(--amber); }
  .vb { display:flex; align-items:flex-end; gap:4px; height:150px; padding-top:18px; }
  .vb button { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; padding:0; border:0; background:none; cursor:pointer; }
  .vb button > small { display:block; text-align:center; font-size:11.5px; color:var(--sub); margin-bottom:3px; font-variant-numeric:tabular-nums; }
  .vb .st { display:flex; flex-direction:column-reverse; border-radius:3px 3px 0 0; overflow:hidden; min-height:2px; }
  .vb .st i { display:block; width:100%; }
  .vl { display:flex; gap:4px; margin-top:4px; padding-top:4px; border-top:1px solid var(--line2); }
  .vl span { flex:1; min-width:0; text-align:center; font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; }
  .lc svg { display:block; width:100%; height:auto; }
  .lc .dot { cursor:pointer; }
  .clegend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:12.5px; color:var(--sub); }
  .clegend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .mile { display:flex; align-items:center; gap:10px; width:100%; min-height:46px; padding:4px 2px; border:0; border-top:1px solid var(--line); background:none; cursor:pointer; text-align:left; }
  .mile b { flex:1; font-weight:600; }
  .mile b small { color:var(--sub); font-weight:400; margin-left:6px; font-size:13px; }
  .msub { display:flex; align-items:center; gap:6px; margin:14px 0 2px; font-size:14px; color:var(--sub); font-weight:700; }

  /* ===== 人員卡（底部彈出） ===== */
  .scrim { position:fixed; inset:0; z-index:70; background:rgba(20,30,45,.4); opacity:0; transition:opacity .25s; }
  .scrim.on { opacity:1; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:71; max-height:92vh; overflow-y:auto; overscroll-behavior:contain; background:var(--bg); border-radius:16px 16px 0 0;
    padding:0 14px calc(16px + var(--sb)); transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 40px rgba(20,35,58,.2); }
  .sheet.on { transform:none; }
  @media (min-width:740px) { .sheet { left:50%; right:auto; width:700px; margin-left:-350px; } }
  .grab { position:sticky; top:0; z-index:2; padding:8px 0 4px; background:var(--bg); }
  .grab::before { content:""; display:block; width:40px; height:5px; border-radius:3px; background:var(--line2); margin:0 auto; }
  .sh-head { display:flex; align-items:center; gap:12px; padding:6px 0 12px; }
  .sh-head .av { width:54px; height:54px; font-size:23px; }
  .sh-head .m { flex:1; min-width:0; }
  .sh-head h3 { margin:0; font-size:22px; font-weight:700; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .sh-head h3 .rk { font-size:15px; }
  .sh-head p { margin:2px 0 0; color:var(--sub); font-size:14px; }
  .sh-x { width:44px; height:44px; border-radius:50%; border:0; background:var(--card3); color:var(--sub); font-size:15px; cursor:pointer; align-self:flex-start; }
  .acts { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .ac { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:64px; padding:6px 2px; border-radius:var(--r); border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:600; color:var(--txt); text-decoration:none; cursor:pointer; }
  .ac svg.ico { width:22px; height:22px; color:var(--acc); }
  .ac.pri { background:var(--acc); color:#fff; border-color:var(--acc); }
  .ac.pri svg.ico { color:#fff; }
  .ac.on { color:var(--amber); }
  .ac.on svg.ico { color:var(--amber); fill:var(--amber); }
  .ac.done { color:var(--ok); border-color:var(--ok); }
  .ac.off { opacity:.35; pointer-events:none; }
  .info { margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .cell { display:flex; gap:12px; padding:12px 14px; min-width:0; }
  .cell + .cell { border-top:1px solid var(--line); }
  .cell > svg.ico { margin-top:2px; color:var(--dim); }
  .cell .cb { flex:1; min-width:0; }
  .cell label { display:flex; align-items:center; font-size:13px; color:var(--sub); }
  .cell label .lk { margin-left:auto; color:var(--acc); font-size:13px; }
  .cell .v { font-size:16px; word-break:break-all; }
  .cell.link { cursor:pointer; }
  .cell.link:active { background:var(--acc-a); }
  .idr { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .idr span { letter-spacing:.06em; }
  .mini { min-height:36px; border:1px solid var(--line2); background:var(--card); color:var(--acc); font-size:14px; padding:0 14px; border-radius:18px; cursor:pointer; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { display:inline-flex; align-items:center; gap:4px; min-height:30px; font-size:13px; padding:0 10px; border-radius:15px; background:var(--card3); color:var(--sub); }
  .chip .zs { font-size:15px; width:auto; }
  .chip svg.ico { width:15px; height:15px; }
  .chip.tap { cursor:pointer; color:var(--acc); background:var(--acc-a); }
  .chip.hot { background:var(--amber-a); color:var(--amber); }

  /* ===== 底部導覽 ===== */
  .nav { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; padding:0 4px var(--sb); background:var(--card); border-top:1px solid var(--line); }
  .nav button { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:60px; padding:0; border:0; background:none; color:var(--dim); font-size:12px; cursor:pointer; }
  .nav button svg.ico { width:24px; height:24px; }
  .nav button.on { color:var(--acc); font-weight:700; }
  .nav button.on::before { content:""; position:absolute; top:0; left:28%; right:28%; height:3px; border-radius:0 0 3px 3px; background:var(--acc); }
  .nb { position:absolute; top:6px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--amber); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; }
  .totop { position:fixed; right:14px; bottom:calc(76px + var(--sb)); z-index:45; width:46px; height:46px; display:grid; place-items:center; padding:0; border:1px solid var(--line2); border-radius:50%; background:var(--card); color:var(--acc); cursor:pointer; box-shadow:0 4px 14px rgba(20,35,58,.15); }
  .toast { position:fixed; left:50%; bottom:calc(80px + var(--sb)); z-index:90; transform:translate(-50%,8px); padding:10px 18px; border-radius:20px; background:#1b2533; color:#fff; font-size:14px; white-space:nowrap; opacity:0; pointer-events:none; transition:all .2s; }
  .toast.on { opacity:1; transform:translate(-50%,0); }
  .toast.err { background:var(--err); }
  .foot { text-align:center; color:var(--dim); font-size:12px; margin-top:20px; }

  .snav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin:0 0 10px; }
  .snav button { min-height:40px; border:1px solid var(--line2); background:var(--card); border-radius:10px; color:var(--acc); font-size:14px; cursor:pointer; }
  .snav button:disabled { opacity:.35; }
  .snav span { font-size:13px; color:var(--sub); }
  .cmenu { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 8px; padding:10px; border-radius:var(--r); background:var(--card); border:1px solid var(--line2); }
  .cmenu p { width:100%; margin:0 0 2px; font-size:13px; color:var(--sub); }
  .cmenu button { flex:1 1 auto; min-height:42px; padding:0 10px; border:1px solid var(--line2); border-radius:10px; background:var(--card2); font-size:14px; cursor:pointer; }
  .btnrow { display:flex; gap:8px; margin-top:10px; }
  .btnrow button { flex:1; min-height:44px; border:1px solid var(--line2); border-radius:10px; background:var(--card); color:var(--acc); font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .chk { display:flex; align-items:center; gap:10px; width:100%; min-height:46px; padding:4px 2px; border:0; border-top:1px solid var(--line); background:none; text-align:left; cursor:pointer; font-size:15px; }
  .chk:first-of-type { border-top:0; }
  .chk b { flex:1; font-weight:500; }
  .chk .tag.warn { background:var(--amber-a); color:var(--amber); font-weight:700; }
  .okline { display:flex; align-items:center; gap:8px; color:var(--ok); font-size:14px; }

  .hero { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hero img { width:76px; height:76px; flex:0 0 auto; }
  .card > h3 img { width:26px; height:26px; }
  .empty img { width:110px; height:110px; display:inline-block; margin-bottom:4px; }
  .lmsg img { display:block; width:72px; height:72px; margin:0 auto 6px; }
  .okline img { width:40px; height:40px; }
  .toast img { width:22px; height:22px; vertical-align:-6px; margin-right:6px; }
  .toast.ok { background:var(--card); color:var(--txt); border:1px solid var(--line2); box-shadow:0 6px 20px rgba(20,35,58,.15); }

  /* ===== 回饋（低調） ===== */
  .row, .tile, .kpi, .pill, .lrow, .ac, .qc, .hb, .mile, .lg, .chip.tap { transition:background .15s, transform .1s; }
  .row:active, .tile:active, .kpi:active, .pill:active, .lrow:active, .ac:active, .qc:active, .hb:active, .mile:active, .lg:active { transform:scale(.98); background:var(--card2); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes shake { 20%,80% { transform:translateX(4px); } 30%,50%,70% { transform:translateX(-6px); } 40%,60% { transform:translateX(6px); } }
  @keyframes fade { from { opacity:0; } }
  section.show { animation:fade .18s ease both; }
  .shake { animation:shake .4s ease; }
  .spin svg.ico { animation:spin .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>

function zodiacIdx(month, day) {

  if (isNaN(m) || isNaN(d) || m < 1 || m > 12 || d < 1 || d > 31) return -1;
  const md = m * 100 + d;
  for (let i = 0; i < ZODIACS.length; i++) {
    const z = ZODIACS[i], s = z.sm * 100 + z.sd, e = z.em * 100 + z.ed;
    if (s <= e ? (md >= s && md <= e) : (md >= s || md <= e)) return i;

  return -1;
}

function zodiacRange(z) { return z.sm + '/' + z.sd + '–' + z.em + '/' + z.ed; }

function pad2(n) { n = String(n == null ? '' : n); return n.length === 1 ? '0' + n : n; }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function weekRange(now) {
  const t = startOfDay(now), dow = (t.getDay() + 6) % 7;   // 週一 = 0
  const s = new Date(t.getFullYear(), t.getMonth(), t.getDate() - dow);
  return { start: s, end: new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6) };
}
function bdayDateInRange(p, start, end) {
  const m = Number(p.birthM), d = Number(p.birthD);
  if (!m || !d) return null;
  const ys = start.getFullYear() === end.getFullYear() ? [start.getFullYear()] : [start.getFullYear(), end.getFullYear()];
  for (let i = 0; i < ys.length; i++) {
    const dt = new Date(ys[i], m - 1, d);
    if (dt >= start && dt <= end) return dt;
  }
  return null;
}
function inThisWeek(p, now) { const r = weekRange(now); return !!bdayDateInRange(p, r.start, r.end); }
function diffThisYear(p, now) {
  const m = Number(p.birthM), d = Number(p.birthD);
  if (!m || !d) return null;
  return Math.round((new Date(now.getFullYear(), m - 1, d) - startOfDay(now)) / 86400000);
}
function daysToNext(p, now) {

}

function unitLabel(u) {

}

function matchUnit(p, sel) {
  if (!sel) return true;
  if (sel.indexOf('g:') === 0) {
    const gname = sel.slice(2);
    for (let i = 0; i < UNITS.length; i++) {
      if (UNITS[i].name !== gname) continue;
      if (i === 0) return FACTORY_UNITS.indexOf(p.unit) !== -1;
      return p.unit === gname || UNITS[i].children.indexOf(p.unit) !== -1;
    }
    return false;
  }
  if (sel.indexOf('u:') === 0) return p.unit === sel.slice(2);
  return true;
}

// 把一串搜尋文字拆成：一般關鍵字 / 月 / 日 / 血型 / 今天生日 / 本週壽星 / 星座
function parseQuery(raw, now) {
  now = now || new Date();
  const out = { terms: [], month: null, day: null, blood: null, today: false, week: false, zod: null };
  const parts = String(raw || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  for (let i = 0; i < parts.length; i++) {
    const t = parts[i];
    let m;
    if (/^(今天|今日)(生日|壽星)$/.test(t)) { out.today = true; continue; }
    if (/^(本週|本周|這週|這周|今週|今周)(生日|壽星)?$/.test(t)) { out.week = true; continue; }
    if (/^(本月|這個月|當月)(生日|壽星)?$/.test(t)) { out.month = now.getMonth() + 1; continue; }
    if ((m = t.match(/^(\d{1,2})月(\d{1,2})[日號号]?(?:生日)?$/)) || (m = t.match(/^(\d{1,2})[\/\-](\d{1,2})$/))) {
      const mo = Number(m[1]), da = Number(m[2]);
      if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) { out.month = mo; out.day = da; continue; }
    }
    if ((m = t.match(/^(\d{1,2})月(?:生日|壽星)?$/))) {
      const mo = Number(m[1]);
      if (mo >= 1 && mo <= 12) { out.month = mo; continue; }
    }
    if ((m = t.match(/^(ab|a|b|o)型$/))) { out.blood = m[1]; continue; }
    const zn = t.replace(/座$/, '');
    let zi = -1;
    if (zn.length >= 2) for (let k = 0; k < ZODIACS.length; k++) if (ZODIACS[k].name.replace('座', '') === zn) { zi = k; break; }
    if (zi >= 0) { out.zod = zi; continue; }
    out.terms.push(t);
  }
  return out;
}

function filterPeople(list, f, now) {
  now = now || new Date();
  const pq = parseQuery(f.q, now);
  const month = pq.month || (f.month ? Number(f.month) : null);
  const day = pq.day || (f.day ? Number(f.day) : null);
  const week = pq.week || f.week === '1';
  const zod = pq.zod != null ? pq.zod : ((f.zod !== '' && f.zod != null) ? Number(f.zod) : null);
  if (pq.month && f.month && Number(f.month) !== pq.month) return [];
  const wr = weekRange(now);
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (!matchUnit(p, f.unit)) continue;
    if (f.year && yearNum(p.yearClass) !== f.year) continue;
    if (f.cat !== '' && f.cat != null && rankInfo(p.rank).cat !== Number(f.cat)) continue;
    if (month && Number(p.birthM) !== month) continue;
    if (day && Number(p.birthD) !== day) continue;
    if (week && !bdayDateInRange(p, wr.start, wr.end)) continue;
    if (zod !== null && zodiacIdx(p.birthM, p.birthD) !== zod) continue;
    if (pq.today && !isBirthdayOn(p, now)) continue;
    if (pq.blood && bloodKey(p.blood) !== pq.blood) continue;
    if (pq.terms.length) {
      const hay = [p.name, p.unit, unitLabel(p.unit), p.skill, p.rank, CATS[rankInfo(p.rank).cat].name, p.yearClass].join(' ').toLowerCase();
      const digits = String(p.phone || '').replace(/\D/g, '');
      let ok = true;
      for (let t = 0; t < pq.terms.length; t++) {
        const term = pq.terms[t];
        const td = term.replace(/\D/g, '');
        const isNum = /^[\d\-]+$/.test(term);
        if (hay.indexOf(term) !== -1) continue;
        if (isNum && td.length >= 4 && digits.indexOf(td) !== -1) continue;
        ok = false; break;
      }
      if (!ok) continue;
    }
    out.push(p);
  }
  const keyed = out.map(function (p, i) {
    const dt = week ? bdayDateInRange(p, wr.start, wr.end) : null;
    return { p: p, i: i, r: rankInfo(p.rank), wt: dt ? dt.getTime() : 0 };
  });
  keyed.sort(function (a, b) {
    if (week && a.wt !== b.wt) return a.wt - b.wt;
    if ((month || zod !== null) && !week) {
      const am = Number(a.p.birthM) * 100 + Number(a.p.birthD), bm = Number(b.p.birthM) * 100 + Number(b.p.birthD);
      if (am !== bm) return am - bm;
    }
    if (a.r.cat !== b.r.cat) return a.r.cat - b.r.cat;
    if (a.r.order !== b.r.order) return a.r.order - b.r.order;
    return a.i - b.i;
  });
  return keyed.map(function (k) { return k.p; });
}

function allYears(list) {
  const set = {}, r = [];
  for (let i = 0; i < list.length; i++) {
    const y = yearNum(list[i].yearClass);
    if (y && !set[y]) { set[y] = 1; r.push(y); }
  }
  r.sort(function (a, b) { return Number(a) - Number(b); });
  return r;
}

// 輸入時的建議：先列姓名，再列單位／年班／身分／星座／生日
function buildSuggestions(list, raw, now) {

  if (!q) return [];
  const ql = q.toLowerCase();
  const starts = [], contains = [], cats = [];

    if (at === 0) starts.push(list[i]); else if (at > 0) contains.push(list[i]);
  }
  const people = starts.concat(contains).slice(0, 6).map(function (p) { return { type: 'person', p: p }; });

    if (g.name.toLowerCase().indexOf(ql) !== -1 || (gi === 0 && '廠辦生品'.indexOf(q) !== -1)) {
      cats.push({ type: 'cat', k: 'unit', v: 'g:' + g.name, label: g.name + (g.children.length ? '（整課）' : '') });
    }
    g.children.forEach(function (c) {
      if (c.toLowerCase().indexOf(ql) !== -1) cats.push({ type: 'cat', k: 'unit', v: 'u:' + c, label: g.name + ' / ' + c });
    });
  });
  if (/^\d{1,3}$/.test(q)) {
    allYears(list).filter(function (y) { return y.indexOf(q) === 0; }).slice(0, 3)
      .forEach(function (y) { cats.push({ type: 'cat', k: 'year', v: y, label: y + ' 年班' }); });
  }
  CATS.slice(0, 4).forEach(function (c, i) {
    if (c.name.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'cat', v: String(i), label: c.name });
  });
  ZODIACS.forEach(function (z, i) {
    if (z.name.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'zod', v: String(i), label: z.emoji + ' ' + z.name });
  });
  if ('本週壽星'.indexOf(q) !== -1 || '本周壽星'.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'week', v: '1', label: '本週壽星' });
  if ('本月壽星'.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'month', v: String(now.getMonth() + 1), label: '本月壽星' });
  const mm = q.match(/^(\d{1,2})月?(?:生日)?$/);
  if (mm && Number(mm[1]) >= 1 && Number(mm[1]) <= 12) {
    cats.push({ type: 'cat', k: 'month', v: String(Number(mm[1])), label: Number(mm[1]) + ' 月生日' });
  }
  cats.forEach(function (c) {
    const f = { q: '', unit: '', year: '', month: '', day: '', cat: '', week: '', zod: '' };
    f[c.k] = c.v;
    c.n = filterPeople(list, f, now).length;
  });
  return people.concat(cats).slice(0, 9);
}

function firstPhone(raw) {
  const v = String(raw || '').trim();
  if (!v) return '';
  const parts = v.split(/[,，\/、;；]+/);
  return (parts[0] || '').trim() || v;
}
function dialPhone(raw) { const p = firstPhone(raw); return p ? p.replace(/[^\d+]/g, '') : ''; }

function birthText(p) {
  if (!p.birthY && !p.birthM && !p.birthD) return '';
  const base = p.birthY ? (p.birthY + '-' + pad2(p.birthM) + '-' + pad2(p.birthD)) : (p.birthM + '月' + p.birthD + '日');
  const roc = p.birthRY || rocYear(p.birthY);
  return base + (roc ? '（民國 ' + roc + ' 年）' : '');
}
function joinText(p) {
  if (!p.joinY && !p.joinM && !p.joinD) return '';
  const base = p.joinY ? (p.joinY + '-' + pad2(p.joinM) + '-' + pad2(p.joinD)) : (p.joinM + '月' + p.joinD + '日');
  const roc = p.joinRY || rocYear(p.joinY);
  return base + (roc ? '（民國 ' + roc + ' 年）' : '');
}
function westYear(westStr, rocStr) {
  const w = parseInt(westStr, 10);
  if (!isNaN(w)) return w;
  const r = parseInt(rocStr, 10);
  return isNaN(r) ? NaN : r + 1911;
}
function ageText(p, now) {
  now = now || new Date();
  const y = westYear(p.birthY, p.birthRY), m = Number(p.birthM), d = Number(p.birthD);
  if (isNaN(y) || !m || !d) return '';
  let age = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) age--;
  return age >= 0 && age < 120 ? age + ' 歲' : '';
}
function serviceText(p, now) {
  now = now || new Date();
  const y = westYear(p.joinY, p.joinRY), m = Number(p.joinM), d = Number(p.joinD);
  if (isNaN(y) || !m) return '';
  let months = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
  if (d && now.getDate() < d) months--;
  if (months < 0) return '';
  const yy = Math.floor(months / 12), mm = months % 12;
  return (yy ? yy + ' 年 ' : '') + mm + ' 個月';
}

function ageOf(p, now) {
  const y = westYear(p.birthY, p.birthRY), m = Number(p.birthM), d = Number(p.birthD);
  if (isNaN(y)) return null;
  let a = now.getFullYear() - y;
  if (m && d && (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d))) a--;
  return a >= 15 && a < 90 ? a : null;
}
function serviceYears(p, now) {
  const y = westYear(p.joinY, p.joinRY);
  if (isNaN(y)) return null;
  const m = Number(p.joinM) || 1, d = Number(p.joinD) || 1;
  const v = (startOfDay(now) - new Date(y, m - 1, d)) / (365.2425 * 86400000);
  return v >= 0 && v < 50 ? v : null;
}
// 分組：fn 取數值，step 每格寬度
function histogram(list, fn, step) {
  const vals = [];
  list.forEach(function (p) { const v = fn(p); if (v !== null && v !== undefined) vals.push({ p: p, v: v }); });
  if (!vals.length) return { bins: [], missing: list.length };
  let lo = Infinity, hi = -Infinity;
  vals.forEach(function (x) { const b = Math.floor(x.v / step) * step; if (b < lo) lo = b; if (b > hi) hi = b; });
  const bins = [];
  for (let b = lo; b <= hi; b += step) bins.push({ lo: b, hi: b + step, items: [] });
  vals.forEach(function (x) { bins[(Math.floor(x.v / step) * step - lo) / step].items.push(x.p); });
  return { bins: bins, missing: list.length - vals.length };
}
function joinsByYear(list) {
  const map = {};
  list.forEach(function (p) { const y = westYear(p.joinY, p.joinRY); if (!isNaN(y)) (map[y] = map[y] || []).push(p); });
  const ys = Object.keys(map).map(Number);
  if (!ys.length) return [];
  const out = [];
  for (let y = Math.min.apply(null, ys); y <= Math.max.apply(null, ys); y++) out.push({ year: y, items: map[y] || [] });
  return out;
}
function milestones(list, now, marks) {
  marks = marks || [10, 15, 20, 25, 30];
  const out = [];
  list.forEach(function (p) {
    const y = westYear(p.joinY, p.joinRY);
    if (isNaN(y)) return;
    const n = now.getFullYear() - y;
    if (marks.indexOf(n) !== -1) out.push({ p: p, n: n, m: Number(p.joinM) || 0, d: Number(p.joinD) || 0 });
  });
  out.sort(function (a, b) { return b.n - a.n || (a.m * 100 + a.d) - (b.m * 100 + b.d); });
  return out;
}
function average(arr) { return arr.length ? arr.reduce(function (s, x) { return s + x; }, 0) / arr.length : null; }

  if (navList) h += '<div class="snav"><button data-act="snav" data-v="-1"' + (navIdx > 0 ? '' : ' disabled') + '>‹ 上一位</button><span class="num">' + (navIdx + 1) + ' / ' + navList.length + '</span><button data-act="snav" data-v="1"' + (navIdx < navList.length - 1 ? '' : ' disabled') + '>下一位 ›</button></div>';
  h += '<div class="acts">' +
    '<a class="ac pri' + (dial ? '' : ' off') + '" href="tel:' + esc(dial) + '">' + img(IMG.b.call) + '撥打</a>' +
    (bd ? '<a class="ac' + (dial ? '' : ' off') + '" href="sms:' + esc(dial) + '?&body=' + encodeURIComponent('生日快樂！🎂') + '">' + img(IMG.b.gift) + '祝福</a>'
        : '<a class="ac' + (dial ? '' : ' off') + '" href="sms:' + esc(dial) + '">' + img(IMG.b.sms) + '簡訊</a>') +
    '<button class="ac' + (isFav(p) ? ' on' : '') + '" data-act="fav">' + img(IMG.b.star) + (isFav(p) ? '已常用' : '加常用') + '</button>' +
    '<button class="ac" data-act="copy">' + img(IMG.b.copy) + '複製</button>' +
    '<button class="ac' + (dial ? '' : ' off') + '" data-act="vcf">' + img(IMG.b.contact) + '存聯絡人</button></div>';
  h += '<div class="info">' +
    cell(IMG.f.unit, '單位', ul, '', false, us ? ' data-act="filter" data-k="unit" data-v="' + esc(us) + '"' : '') +
    cell(IMG.f.year, '年班', p.yearClass, '', false, yn ? ' data-act="filter" data-k="year" data-v="' + esc(yn) + '"' : '') +
    cell(IMG.f.skill, '專長', p.skill) + cell(IMG.f.blood, '血型', p.blood ? p.blood + ' 型' : '');
  if (p.idMask) h += '<div class="cell">' + img(IMG.f.id) + '<div class="cb"><label>身分證</label><div class="v idr"><span id="sid">' + esc(real || p.idMask) + '</span><button class="mini" data-act="id">' + (real ? '隱藏' : '顯示') + '</button></div></div></div>';
  h += cell(IMG.f.bday, '生日', birthText(p), bchips, true) + cell(IMG.f.phone, '電話', ph, '', true) +
    cell(IMG.f.enlist, '入伍', joinText(p), svc ? '<span class="chip">' + img(IMG.f.service) + '年資 ' + svc + '</span>' : '', true) + '</div>';
  $('sheet').innerHTML = h;
}
// 往下拖曳關閉
(function () {
  let y0 = null, x0 = 0, dy = 0, dx = 0, top0 = 0;
  $('sheet').addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; dx = 0; top0 = $('sheet').scrollTop; }, { passive: true });
  $('sheet').addEventListener('touchmove', function (e) {
    if (y0 === null) return; dy = e.touches[0].clientY - y0; dx = e.touches[0].clientX - x0;
    if (top0 <= 0 && dy > 0 && dy > Math.abs(dx)) { $('sheet').style.transition = 'none'; $('sheet').style.transform = 'translateY(' + dy + 'px)'; }
  }, { passive: true });
  $('sheet').addEventListener('touchend', function () {
    if (y0 === null) return; $('sheet').style.transition = ''; y0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && navList) { $('sheet').style.transform = ''; sheetStep(dx < 0 ? 1 : -1); return; }
    if (top0 <= 0 && dy > 110 && dy > Math.abs(dx)) closeSheet(); else $('sheet').style.transform = '';
  });
})();
async function toggleId(btn) {
  const p = cur; if (!p) return;
  if (idState[p.row]) { delete idState[p.row]; renderSheet(); return; }
  btn.disabled = true;
  try {
    const r = await api({ action: 'reveal', token: token, row: p.row });
    if (r.expired) { logoutLocal(r.msg); return; }
    if (r.ok) { idState[p.row] = r.id; renderSheet(); } else toast(r.msg || '讀取失敗', 'err');
  } catch (e) { toast('連線失敗', 'err'); }
  btn.disabled = false;
}
function flash(el, text, icon) {
  const old = el.innerHTML; el.classList.add('done'); el.innerHTML = img(icon || IMG.b.copy) + text;
  setTimeout(function () { el.classList.remove('done'); el.innerHTML = old; }, 1300);
}

// ---------- 搜尋建議 ----------
function hideSug() { sugs = []; sugIdx = -1; $('sug').classList.add('hidden'); }
function renderSug() {
  const q = $('q').value.trim();
  sugs = buildSuggestions(people, q); sugIdx = -1;
  if (!sugs.length) { hideSug(); return; }
  let h = '', lt = '';
  sugs.forEach(function (s, i) {
    if (s.type !== lt) { h += '<div class="sug-h">' + (s.type === 'person' ? '人員' : '快速篩選') + '</div>'; lt = s.type; }
    if (s.type === 'person') {
      h += '<div class="sug-i" data-s="' + i + '"><div class="av" style="--gc:' + catColor(s.p) + ';width:36px;height:36px;font-size:15px">' + esc(s.p.name.charAt(0)) + '</div><div class="m"><b>' + hl(s.p.name, q) + '</b><small>' + esc([s.p.rank, unitLabel(s.p.unit), s.p.yearClass].filter(Boolean).join(' · ')) + '</small></div></div>';
    } else {
      h += '<div class="sug-i" data-s="' + i + '"><div class="m"><b>' + esc(s.label.replace(/^[^一-龥\w]+\s*/, '')) + '</b><small class="num">' + s.n + ' 人</small></div><em>篩選</em></div>';
    }
  });
  $('sug').innerHTML = h; $('sug').classList.remove('hidden');
}
function chooseSug(i) {
  const s = sugs[i]; if (!s) return;
  if (s.type === 'person') openSheet(s.p);
  else { hideSug(); $('q').blur(); applyFilter(s.k, s.v); }
}

// ---------- 事件 ----------
let qT = null;
$('q').addEventListener('input', function () {
  flt.q = $('q').value; shown = PAGE; $('clr').classList.toggle('hidden', !$('q').value);
  clearTimeout(qT); qT = setTimeout(function () { renderSearch(); renderSug(); }, 90);
});
$('q').addEventListener('focus', function () { if ($('q').value.trim()) renderSug(); });
$('q').addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' && sugs.length) { e.preventDefault(); sugIdx = (sugIdx + 1) % sugs.length; markSug(); }
  else if (e.key === 'ArrowUp' && sugs.length) { e.preventDefault(); sugIdx = (sugIdx - 1 + sugs.length) % sugs.length; markSug(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (sugIdx >= 0) chooseSug(sugIdx); else { hideSug(); $('q').blur(); } }
  else if (e.key === 'Escape') hideSug();
});
function markSug() { document.querySelectorAll('.sug-i').forEach(function (el, i) { el.classList.toggle('on', i === sugIdx); }); }
$('sug').addEventListener('pointerdown', function (e) { const el = e.target.closest('.sug-i'); if (!el) return; e.preventDefault(); chooseSug(Number(el.getAttribute('data-s'))); });
document.addEventListener('pointerdown', function (e) { if (!e.target.closest('.sbox')) hideSug(); });
$('clr').addEventListener('click', function () { $('q').value = ''; flt.q = ''; hideSug(); renderSearch(); $('q').focus(); });
$('resetBtn').addEventListener('click', function () { flt = Object.assign({}, EMPTY); $('q').value = ''; hideSug(); renderSearch(); buzz(); });
$('copyList').addEventListener('click', function () { $('cmenu').classList.toggle('hidden'); buzz(6); });
function listOut(mode) {
  const L = ['名單：' + filterTitle() + '（共 ' + view.length + ' 人）'];
  view.forEach(function (p, i) {
    let s = (i + 1) + '. ' + p.name;
    if (mode === 'unit') s += (p.rank ? '　' + p.rank : '') + (p.unit ? '　' + unitLabel(p.unit) : '');
    if (mode === 'phone') s += '　' + (firstPhone(p.phone) || '（無電話）');
    L.push(s);
  });
  return L.join('\n');
}
$('moreBtn').addEventListener('click', function () { shown += PAGE; renderResults(); });
$('toTop').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
document.querySelector('.nav').addEventListener('click', function (e) { const b = e.target.closest('button[data-tab]'); if (b) { closeSheet(); setTab(b.getAttribute('data-tab')); } });
$('app').addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), now = new Date();
  if (act === 'open') {
    const box = el.closest('[data-group]');
    const list = box ? Array.prototype.map.call(box.querySelectorAll('[data-act="open"]'), function (x) { return people[Number(x.getAttribute('data-i'))]; }) : null;
    openSheet(people[Number(el.getAttribute('data-i'))], box && box.id === 'list' ? view : list);
  }
  else if (act === 'snav') sheetStep(Number(v));
  else if (act === 'copymode') {
    copyToClipboard(listOut(v)).then(function () { buzz(); $('cmenu').classList.add('hidden'); toast('已複製 ' + view.length + ' 人', 'ok'); }, function () { toast('複製失敗', 'err'); });
  }
  else if (act === 'notice') {
    const text = bdayNotice(v);
    if (!text) { toast(v === 'week' ? '本週沒有壽星' : '本月沒有壽星'); return; }
    copyToClipboard(text).then(function () { buzz(); toast('已複製，可直接貼到群組', 'ok'); }, function () { toast('複製失敗', 'err'); });
  }
  else if (act === 'close') closeSheet();
  else if (act === 'rm') { const k = el.getAttribute('data-k'); flt[k] = ''; if (k === 'month') flt.day = ''; shown = PAGE; renderSearch(); }
  else if (act === 'quick') {
    const k = el.getAttribute('data-k');
    const isOn = el.classList.contains('on');
    if (isOn) { if (k === 'cat') flt.cat = ''; else if (k === 'week') flt.week = ''; else { flt.month = ''; flt.day = ''; } shown = PAGE; renderSearch(); return; }
    if (k === 'cat') { flt.cat = v; shown = PAGE; setTab('search'); renderSearch(); return; }
    if (k === 'today') applyFilter('month', String(now.getMonth() + 1), { day: String(now.getDate()) });
    else if (k === 'week') applyFilter('week', '1');
    else applyFilter('month', String(now.getMonth() + 1));
  }
  else if (act === 'cat') { flt.cat = v; shown = PAGE; renderSearch(); }
  else if (act === 'year') { if (v) { flt.year = v; shown = PAGE; renderSearch(); window.scrollTo(0, 0); buzz(); } }
  else if (act === 'filter') { let extra = null; try { extra = JSON.parse(el.getAttribute('data-extra') || 'null'); } catch (x) {} applyFilter(el.getAttribute('data-k'), v, extra); }
  else if (act === 'set') { if (sets[v] && sets[v].ids.length) applyFilter('set', v); }
  else if (act === 'grp') { const c = Number(el.getAttribute('data-c')); collapsed[c] = !collapsed[c]; renderResults(); }
  else if (act === 'tab') setTab(v);
  else if (act === 'bmode') { browseMode = v; renderBrowse(); buzz(6); }
  else if (act === 'scope') { statScope = v; renderStats(); buzz(6); }
  else if (act === 'try') { $('q').value = el.getAttribute('data-t'); flt.q = $('q').value; shown = PAGE; renderSearch(); }
  else if (act === 'id') toggleId(el);
  else if (act === 'fav' && cur) {
    const k = favs.indexOf(cur.name);
    if (k === -1) favs.unshift(cur.name); else favs.splice(k, 1);
    favs = favs.slice(0, 30); saveFavs(); renderSheet();
    const on = isFav(cur); toast(on ? '已加入常用，首頁可看到' : '已移出常用', on ? 'ok' : ''); buzz(on ? 15 : 8);
    if (tab === 'search' && hasFilter()) renderResults();
  }
  else if (act === 'copy' && cur) copyToClipboard(copyText(cur, idState[cur.row])).then(function () { buzz(); flash(el, '已複製'); }, function () { toast('複製失敗', 'err'); });
  else if (act === 'vcf' && cur) {
    const url = URL.createObjectURL(new Blob([vcardText(cur)], { type: 'text/vcard;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = cur.name + '.vcf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000); buzz(); flash(el, '已產生', IMG.b.contact);
  }
});
$('reloadBtn').addEventListener('click', function () {
  const b = $('reloadBtn'); if (b.classList.contains('spin')) return;
  b.classList.add('spin'); buzz();
  loadData().then(function () { b.classList.remove('spin'); if (people.length) toast('資料已更新', 'ok'); });
});
$('logoutBtn').addEventListener('click', async function () { try { await api({ action: 'logout', token: token }); } catch (e) {} logoutLocal(''); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && cur) closeSheet();
  if (cur && navList && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) sheetStep(e.key === 'ArrowRight' ? 1 : -1);
  if (e.key === '/' && token && document.activeElement !== $('q') && document.activeElement !== $('pw')) { e.preventDefault(); closeSheet(); setTab('search'); $('q').focus(); }
});
$('loginBtn').addEventListener('click', login);
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

if (DEMO) setMsg('預覽模式：任意密碼即可進入，資料皆為虛構', 'note');
if (token) loadData(); else showApp(false);
</script>
