  .radar { position:absolute; width:min(92vw,520px); height:min(92vw,520px); left:50%; top:50%; transform:translate(-50%,-62%); border-radius:50%; opacity:.55; pointer-events:none;

      linear-gradient(0deg, transparent 49.8%, rgba(63,208,255,.12) 50%, transparent 50.2%); }
  .radar::after { content:""; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg, rgba(63,208,255,.38), rgba(63,208,255,0) 22%, transparent 100%); animation:sweep 5s linear infinite; }
  @keyframes sweep { to { transform:rotate(360deg); } }
  .login-card { position:relative; width:100%; max-width:360px; text-align:center; }
  .logo-big { display:block; width:120px; height:120px; border-radius:28px; margin:0 auto 16px; box-shadow:0 0 34px rgba(63,208,255,.45); }
  .login-card h1 { margin:0; font-size:34px; letter-spacing:.35em; padding-left:.35em; font-weight:800; background:linear-gradient(90deg,#fff,var(--acc)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .login-card p { margin:6px 0 26px; color:var(--sub); font-size:13px; letter-spacing:.2em; }
  .field { width:100%; padding:15px 16px; font-size:17px; color:var(--txt); border-radius:14px; border:1px solid var(--line); background:rgba(6,13,27,.65); backdrop-filter:blur(8px); outline:none; transition:border-color .2s, box-shadow .2s; text-align:center; letter-spacing:.2em; }
  .field:focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(63,208,255,.18); }
  .btn-main { width:100%; margin-top:12px; padding:15px; font-size:17px; font-weight:700; letter-spacing:.3em; border:0; border-radius:14px; color:#021224; cursor:pointer;
    background:linear-gradient(135deg,var(--acc),var(--acc2)); box-shadow:0 8px 26px rgba(63,208,255,.28); transition:transform .1s, opacity .2s; }
  .btn-main:active { transform:scale(.98); }
  .btn-main:disabled { opacity:.55; }
  .login-msg { min-height:22px; margin-top:12px; font-size:14px; color:var(--err); }
  .login-msg.info { color:var(--amber); }

  /* ===== App 外框 ===== */
  #app { padding-bottom:calc(84px + var(--safe-b)); }
  .topbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:calc(10px + var(--safe-t)) 16px 10px; background:rgba(6,13,27,.78); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:34px; height:34px; border-radius:10px; box-shadow:0 0 10px rgba(63,208,255,.4); }
  .brand b { font-size:19px; letter-spacing:.25em; }
  .brand small { display:block; color:var(--sub); font-size:11px; letter-spacing:.08em; margin-top:1px; }
  .icon-btn { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--glass); color:var(--sub); cursor:pointer; }
  .icon-btn:active { background:var(--glass2); }
  .icon-btn svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .wrap { max-width:720px; margin:0 auto; padding:14px 16px 20px; }
  .view-title { font-size:22px; font-weight:800; margin:6px 0 4px; }
  .view-sub { color:var(--sub); font-size:13px; margin:0 0 16px; }

  /* ===== 搜尋（固定在上方） ===== */
  .sbar { position:sticky; top:var(--tb); z-index:25; margin:-14px -16px 0; padding:12px 16px 8px;
    background:linear-gradient(180deg, rgba(7,16,31,.94) 72%, rgba(7,16,31,0)); }
  .searchbox { position:relative; }
  .searchbox .ico { position:absolute; left:15px; top:50%; transform:translateY(-50%); width:20px; height:20px; stroke:var(--sub); fill:none; stroke-width:2; stroke-linecap:round; pointer-events:none; z-index:2; }
  .searchbox input { width:100%; padding:16px 44px 16px 46px; font-size:17px; color:var(--txt); border-radius:16px; border:1px solid var(--line); background:rgba(14,28,54,.9); outline:none; transition:border-color .2s, box-shadow .2s; }
  .searchbox input:focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(63,208,255,.16); }
  .searchbox input::placeholder { color:#6a7fa3; }
  .clear { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; border:0; background:var(--glass2); color:var(--sub); font-size:15px; cursor:pointer; }
  .sug { position:absolute; left:0; right:0; top:calc(100% + 8px); background:#0c1a33; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.6); max-height:60vh; overflow-y:auto; }
  .sug-item { display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,.05); }
  .sug-item:last-child { border-bottom:0; }
  .sug-item.on, .sug-item:active { background:rgba(63,208,255,.12); }
  .sug-main { flex:1; min-width:0; }
  .sug-name { font-size:16px; font-weight:700; }
  .sug-sub { font-size:12.5px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sug-tag { font-size:11.5px; color:var(--acc); border:1px solid rgba(63,208,255,.35); padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .sug-head { padding:8px 14px 4px; font-size:11.5px; color:var(--sub); letter-spacing:.12em; }

  .fchips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .fchips:empty { display:none; }
  .fchip { display:inline-flex; align-items:center; gap:8px; padding:6px 8px 6px 12px; border-radius:20px; background:rgba(63,208,255,.14); border:1px solid rgba(63,208,255,.35); color:#d9f4ff; font-size:13.5px; }
  .fchip button { width:20px; height:20px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:#fff; font-size:11px; cursor:pointer; line-height:20px; padding:0; }
  .resultbar { display:flex; justify-content:space-between; align-items:center; margin:10px 2px 8px; color:var(--sub); font-size:13px; gap:10px; }
  .resultbar .rb { display:flex; gap:14px; }
  .resultbar button { background:none; border:0; color:var(--acc); font-size:13px; cursor:pointer; padding:4px 0; }
  .legend { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 6px; }
  .yearnav { display:flex; align-items:stretch; gap:8px; margin:0 0 10px; }
  .yearnav button { flex:1; padding:10px 6px; border-radius:14px; border:1px solid var(--line); background:var(--glass2); color:var(--txt); font-size:14px; font-weight:700; cursor:pointer; line-height:1.3; }
  .yearnav button small { display:block; font-size:11.5px; color:var(--sub); font-weight:500; }
  .yearnav button:active { background:rgba(63,208,255,.2); }
  .yearnav button:disabled { opacity:.3; }
  .yearnav .cur { flex:1.2; text-align:center; border-radius:14px; border:1px solid rgba(63,208,255,.5); background:rgba(63,208,255,.12); display:grid; place-items:center; font-weight:800; font-size:15px; line-height:1.3; }
  .yearnav .cur small { display:block; font-size:11.5px; color:var(--sub); font-weight:500; }
  .lg { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid var(--lc); color:var(--lc); background:transparent; }
  .lg i { width:8px; height:8px; border-radius:50%; background:var(--lc); }
  .lg small { font-size:12px; opacity:.85; font-weight:600; }

  /* ===== 首頁儀表 ===== */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px; }
  .stat { padding:12px 4px; border-radius:16px; background:var(--glass); border:1px solid var(--line); text-align:center; cursor:pointer; color:var(--txt); }
  .stat:active { background:rgba(63,208,255,.15); }
  .stat b { display:block; font-size:24px; font-weight:800; background:linear-gradient(180deg,#fff,var(--acc)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat span { font-size:11.5px; color:var(--sub); letter-spacing:.06em; }
  .stat.hot b { background:linear-gradient(180deg,#fff,var(--amber)); -webkit-background-clip:text; background-clip:text; }
  .panel { margin-top:14px; padding:14px 16px; border-radius:18px; background:var(--glass); border:1px solid var(--line); }
  .panel.gold { border-color:rgba(255,184,77,.5); background:linear-gradient(135deg, rgba(255,184,77,.16), rgba(255,184,77,.04)); }
  .panel h3 { margin:0 0 10px; font-size:14px; color:var(--sub); font-weight:600; letter-spacing:.1em; display:flex; align-items:center; justify-content:space-between; }
  .panel h3 em { font-style:normal; color:var(--amber); font-weight:800; }
  .panel.gold h3 { color:#ffe2b0; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; }
  .pill { padding:7px 13px; border-radius:20px; background:var(--glass2); border:1px solid var(--line); color:var(--txt); font-size:14px; cursor:pointer; }
  .pill:active { background:rgba(63,208,255,.2); }
  .pill small { color:var(--sub); margin-left:6px; font-size:12px; }
  .pill.hot { border-color:rgba(255,184,77,.5); background:rgba(255,184,77,.12); color:#ffe2b0; }
  .brow { display:flex; align-items:center; gap:10px; width:100%; padding:9px 4px; background:none; border:0; border-top:1px solid rgba(255,255,255,.06); color:var(--txt); font-size:15px; cursor:pointer; text-align:left; }
  .brow:first-of-type { border-top:0; }
  .brow .bd { flex:0 0 78px; color:var(--sub); font-size:13px; font-variant-numeric:tabular-nums; }
  .brow .bn { flex:1; min-width:0; font-weight:700; }
  .brow .bn small { color:var(--sub); font-weight:500; margin-left:6px; font-size:12.5px; }
  .brow .br { font-size:12.5px; padding:2px 10px; border-radius:20px; background:var(--glass2); color:var(--sub); white-space:nowrap; }
  .brow .br.today { background:var(--amber); color:#2a1a00; font-weight:800; }
  .brow .br.soon { background:rgba(255,184,77,.2); color:var(--amber); }
  .brow.past { opacity:.5; }
  .linkbtn { display:block; width:100%; margin-top:8px; padding:9px; background:none; border:1px dashed var(--line); border-radius:12px; color:var(--acc); font-size:13.5px; cursor:pointer; }
  .dutyrow { display:flex; justify-content:space-between; align-items:center; padding:6px 0; }
  .dutyrow + .dutyrow { border-top:1px solid rgba(255,255,255,.06); }
  .tips { color:var(--sub); font-size:13px; line-height:2.1; }
  .tips code { background:var(--glass2); padding:3px 9px; border-radius:8px; color:#cfe6ff; font-size:12.5px; margin-right:4px; cursor:pointer; }

  /* ===== 人員卡片 ===== */
  .person { margin-bottom:10px; border-radius:18px; background:var(--glass); border:1px solid var(--line); border-left:4px solid var(--gc, var(--line)); overflow:hidden; transition:border-color .2s, background .2s; }
  .person.open { border-color:rgba(63,208,255,.4); border-left-color:var(--gc, var(--acc)); background:rgba(63,208,255,.05); }
  .phead { display:flex; align-items:center; gap:13px; padding:13px 14px; cursor:pointer; }
  .avatar { flex:0 0 auto; width:46px; height:46px; border-radius:15px; display:grid; place-items:center; font-size:20px; font-weight:800; color:#04101f; }
  .pmain { flex:1; min-width:0; }
  .pname { font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rank { font-size:12px; font-weight:700; padding:2px 9px; border-radius:20px; background:rgba(255,255,255,.12); color:#dbe9ff; }
  .bday { font-size:12px; font-weight:700; padding:2px 9px; border-radius:20px; background:rgba(255,184,77,.2); color:var(--amber); }
  .psub { margin-top:3px; font-size:13.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chev { color:var(--sub); transition:transform .2s; font-size:13px; }
  .person.open .chev { transform:rotate(180deg); }
  .pdetail { padding:2px 14px 14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:6px; }
  .cell { padding:10px 12px; border-radius:13px; background:rgba(6,13,27,.45); border:1px solid rgba(255,255,255,.06); min-width:0; }
  .cell.wide { grid-column:1 / -1; }
  .cell label { display:block; font-size:11.5px; color:var(--sub); letter-spacing:.08em; margin-bottom:3px; }
  .cell div { font-size:15px; word-break:break-all; }
  .mchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .mchip { font-size:12.5px; padding:3px 11px; border-radius:20px; background:var(--glass2); border:1px solid var(--line); color:#cfe0ff; }
  .mchip.tap { cursor:pointer; color:var(--acc); border-color:rgba(63,208,255,.4); }
  .mchip.hot { background:rgba(255,184,77,.16); border-color:rgba(255,184,77,.45); color:var(--amber); }
  .idrow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .idrow span { font-variant-numeric:tabular-nums; letter-spacing:.06em; }
  .mini { border:1px solid var(--line); background:var(--glass2); color:var(--acc); font-size:13px; padding:5px 12px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .actions { display:flex; gap:9px; margin-top:12px; }
  .act { flex:1; padding:13px 8px; border-radius:14px; border:1px solid var(--line); background:var(--glass2); color:var(--txt); font-size:15px; font-weight:700; text-align:center; text-decoration:none; cursor:pointer; }
  .act.primary { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#021224; border:0; }
  .act:active { transform:scale(.98); }
  .grp { display:flex; align-items:center; gap:9px; margin:16px 2px 9px; font-size:14.5px; color:var(--gc); font-weight:800; letter-spacing:.16em; cursor:pointer; user-select:none; }
  .grp.first { margin-top:4px; }
  .grp i { width:10px; height:10px; border-radius:50%; background:var(--gc); box-shadow:0 0 10px var(--gc); }
  .grp small { color:var(--sub); font-weight:500; letter-spacing:0; font-size:12.5px; }
  .grp::after { content:""; flex:1; order:5; height:2px; background:linear-gradient(90deg,var(--gc),transparent); opacity:.55; }
  .grp .car { order:9; color:var(--sub); font-size:11px; letter-spacing:0; transition:transform .2s; }
  .grp.off .car { transform:rotate(-90deg); }
  .empty { text-align:center; padding:50px 10px; color:var(--sub); }
  .empty .big { font-size:42px; margin-bottom:8px; }

  /* ===== 瀏覽（單位／年班／生日） ===== */
  .sect { margin:18px 0 10px; font-size:13px; letter-spacing:.14em; color:var(--sub); display:flex; align-items:center; gap:10px; }
  .sect::after { content:""; flex:1; height:1px; background:var(--line); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .tiles.two { grid-template-columns:repeat(2,1fr); }
  .tiles.four { grid-template-columns:repeat(4,1fr); }
  .tile { padding:14px 6px; border-radius:16px; border:1px solid var(--line); background:var(--glass); color:var(--txt); cursor:pointer; text-align:center; position:relative; overflow:hidden; }
  .tile::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--tc, var(--acc)); opacity:.9; }
  .tile b { display:block; font-size:16px; font-weight:800; }
  .tile span { display:block; margin-top:3px; font-size:12.5px; color:var(--sub); }
  .tile em { display:block; margin-top:2px; font-style:normal; font-size:11px; color:#6f84a8; }
  .tile:active { background:rgba(63,208,255,.15); transform:scale(.98); }
  .tile.now { border-color:rgba(255,184,77,.6); background:rgba(255,184,77,.1); }
  .tile.zero { opacity:.45; }

  /* ===== 留守 ===== */
  .dcard { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; margin-bottom:10px; border-radius:16px; background:var(--glass); border:1px solid var(--line); }
  .dcard.today { border-color:rgba(255,184,77,.6); background:rgba(255,184,77,.1); }
  .dcard .d { font-size:18px; font-weight:800; }
  .dcard .d small { margin-left:8px; font-size:13px; color:var(--sub); font-weight:500; }
  .dcard .t { font-size:14.5px; text-align:right; }
  .badge { display:inline-block; font-size:11.5px; padding:2px 9px; border-radius:20px; background:var(--amber); color:#2a1a00; font-weight:800; margin-left:8px; vertical-align:middle; }

  /* ===== 底部導覽 ===== */
  .nav { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; justify-content:space-around; padding:8px 8px calc(8px + var(--safe-b)); background:rgba(6,13,27,.86); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--line); }
  .nav button { position:relative; flex:1; max-width:110px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border:0; background:none; color:var(--sub); font-size:11.5px; cursor:pointer; border-radius:12px; }
  .nav button svg { width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .nav button.on { color:var(--acc); }
  .nav button.on svg { filter:drop-shadow(0 0 6px rgba(63,208,255,.6)); }
  .nb { position:absolute; top:1px; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--amber); color:#2a1a00; font-size:11px; font-weight:800; display:grid; place-items:center; }
  .totop { position:fixed; right:16px; bottom:calc(92px + var(--safe-b)); z-index:45; width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:rgba(12,26,51,.92); color:var(--acc); font-size:18px; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .toast { position:fixed; left:50%; bottom:calc(92px + var(--safe-b)); transform:translateX(-50%) translateY(10px); background:rgba(11,24,48,.97); border:1px solid var(--line); padding:10px 20px; border-radius:22px; font-size:14px; opacity:0; transition:all .25s; pointer-events:none; z-index:60; }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .skel { height:74px; border-radius:18px; margin-bottom:10px; background:linear-gradient(90deg,var(--glass) 25%,var(--glass2) 50%,var(--glass) 75%); background-size:200% 100%; animation:sk 1.2s infinite; }
  @keyframes sk { to { background-position:-200% 0; } }
  .zi { display:block; width:46px; height:46px; margin:2px auto 6px; }
  .ic { width:22px; height:22px; object-fit:contain; flex:0 0 auto; }
  .ic.s { width:18px; height:18px; }

function zodiacIdx(month, day) {
  const m = parseInt(month, 10), d = parseInt(day, 10);
  if (isNaN(m) || isNaN(d) || m < 1 || m > 12 || d < 1 || d > 31) return -1;
  const md = m * 100 + d;
  for (let i = 0; i < ZODIACS.length; i++) {
    const z = ZODIACS[i], s = z.sm * 100 + z.sd, e = z.em * 100 + z.ed;
    if (s <= e ? (md >= s && md <= e) : (md >= s || md <= e)) return i;
  }
  return -1;
}
function zodiac(month, day) { const i = zodiacIdx(month, day); return i < 0 ? null : ZODIACS[i].emoji + ' ' + ZODIACS[i].name; }
function zodiacRange(z) { return z.sm + '/' + z.sd + '–' + z.em + '/' + z.ed; }

function pad2(n) { n = String(n == null ? '' : n); return n.length === 1 ? '0' + n : n; }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function weekRange(now) {
  const t = startOfDay(now), dow = (t.getDay() + 6) % 7;   // 週一 = 0
  const s = new Date(t.getFullYear(), t.getMonth(), t.getDate() - dow);
  return { start: s, end: new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6) };
}
function bdayDateInRange(p, start, end) {
  const m = Number(p.birthM), d = Number(p.birthD);
  if (!m || !d) return null;
  const ys = start.getFullYear() === end.getFullYear() ? [start.getFullYear()] : [start.getFullYear(), end.getFullYear()];
  for (let i = 0; i < ys.length; i++) {
    const dt = new Date(ys[i], m - 1, d);
    if (dt >= start && dt <= end) return dt;
  }
  return null;
}
function inThisWeek(p, now) { const r = weekRange(now); return !!bdayDateInRange(p, r.start, r.end); }
function diffThisYear(p, now) {
  const m = Number(p.birthM), d = Number(p.birthD);
  if (!m || !d) return null;
  return Math.round((new Date(now.getFullYear(), m - 1, d) - startOfDay(now)) / 86400000);
}
function daysToNext(p, now) {
  let diff = diffThisYear(p, now);
  if (diff === null) return null;
  if (diff < 0) diff = Math.round((new Date(now.getFullYear() + 1, Number(p.birthM) - 1, Number(p.birthD)) - startOfDay(now)) / 86400000);

}

  for (let i = 0; i < UNITS.length; i++) {
    if (UNITS[i].name === u) return u;

function matchUnit(p, sel) {
  if (!sel) return true;
  if (sel.indexOf('g:') === 0) {
    const gname = sel.slice(2);

      if (UNITS[i].name !== gname) continue;

      return p.unit === gname || UNITS[i].children.indexOf(p.unit) !== -1;

// 把一串搜尋文字拆成：一般關鍵字 / 月 / 日 / 血型 / 今天生日 / 本週壽星 / 星座
function parseQuery(raw, now) {
  now = now || new Date();
  const out = { terms: [], month: null, day: null, blood: null, today: false, week: false, zod: null };
  const parts = String(raw || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  for (let i = 0; i < parts.length; i++) {
    const t = parts[i];
    let m;
    if (/^(今天|今日)(生日|壽星)$/.test(t)) { out.today = true; continue; }
    if (/^(本週|本周|這週|這周|今週|今周)(生日|壽星)?$/.test(t)) { out.week = true; continue; }
    if (/^(本月|這個月|當月)(生日|壽星)?$/.test(t)) { out.month = now.getMonth() + 1; continue; }
    if ((m = t.match(/^(\d{1,2})月(\d{1,2})[日號号]?(?:生日)?$/)) || (m = t.match(/^(\d{1,2})[\/\-](\d{1,2})$/))) {
      const mo = Number(m[1]), da = Number(m[2]);
      if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) { out.month = mo; out.day = da; continue; }
    }
    if ((m = t.match(/^(\d{1,2})月(?:生日|壽星)?$/))) {
      const mo = Number(m[1]);
      if (mo >= 1 && mo <= 12) { out.month = mo; continue; }
    }
    if ((m = t.match(/^(ab|a|b|o)型$/))) { out.blood = m[1]; continue; }
    const zn = t.replace(/座$/, '');
    let zi = -1;
    if (zn.length >= 2) for (let k = 0; k < ZODIACS.length; k++) if (ZODIACS[k].name.replace('座', '') === zn) { zi = k; break; }
    if (zi >= 0) { out.zod = zi; continue; }
    out.terms.push(t);
  }
  return out;
}

  now = now || new Date();
  const pq = parseQuery(f.q, now);
  const month = pq.month || (f.month ? Number(f.month) : null);
  const day = pq.day || (f.day ? Number(f.day) : null);
  const week = pq.week || f.week === '1';
  const zod = pq.zod != null ? pq.zod : ((f.zod !== '' && f.zod != null) ? Number(f.zod) : null);
  if (pq.month && f.month && Number(f.month) !== pq.month) return [];
  const wr = weekRange(now);
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (!matchUnit(p, f.unit)) continue;
    if (f.year && yearNum(p.yearClass) !== f.year) continue;
    if (f.cat !== '' && f.cat != null && rankInfo(p.rank).cat !== Number(f.cat)) continue;
    if (month && Number(p.birthM) !== month) continue;
    if (day && Number(p.birthD) !== day) continue;
    if (week && !bdayDateInRange(p, wr.start, wr.end)) continue;
    if (zod !== null && zodiacIdx(p.birthM, p.birthD) !== zod) continue;
    if (pq.today && !isBirthdayOn(p, now)) continue;
    if (pq.blood && bloodKey(p.blood) !== pq.blood) continue;
    if (pq.terms.length) {
      const hay = [p.name, p.unit, unitLabel(p.unit), p.skill, p.rank, CATS[rankInfo(p.rank).cat].name, p.yearClass].join(' ').toLowerCase();
      const digits = String(p.phone || '').replace(/\D/g, '');
      let ok = true;
      for (let t = 0; t < pq.terms.length; t++) {
        const term = pq.terms[t];
        const td = term.replace(/\D/g, '');
        const isNum = /^[\d\-]+$/.test(term);
        if (hay.indexOf(term) !== -1) continue;
        if (isNum && td.length >= 4 && digits.indexOf(td) !== -1) continue;
        ok = false; break;
      }
      if (!ok) continue;
    }
    out.push(p);
  }
  const keyed = out.map(function (p, i) {
    const dt = week ? bdayDateInRange(p, wr.start, wr.end) : null;
    return { p: p, i: i, r: rankInfo(p.rank), wt: dt ? dt.getTime() : 0 };
  });
  keyed.sort(function (a, b) {
    if (week && a.wt !== b.wt) return a.wt - b.wt;
    if ((month || zod !== null) && !week) {
      const am = Number(a.p.birthM) * 100 + Number(a.p.birthD), bm = Number(b.p.birthM) * 100 + Number(b.p.birthD);
      if (am !== bm) return am - bm;
    }
    if (a.r.cat !== b.r.cat) return a.r.cat - b.r.cat;
    if (a.r.order !== b.r.order) return a.r.order - b.r.order;
    return a.i - b.i;
  });
  return keyed.map(function (k) { return k.p; });
}

function allYears(list) {
  const set = {}, r = [];
  for (let i = 0; i < list.length; i++) {
    const y = yearNum(list[i].yearClass);
    if (y && !set[y]) { set[y] = 1; r.push(y); }
  }
  r.sort(function (a, b) { return Number(a) - Number(b); });
  return r;
}

// 輸入時的建議：先列姓名，再列單位／年班／身分／星座／生日
function buildSuggestions(list, raw, now) {
  now = now || new Date();
  const q = String(raw || '').trim();
  if (!q) return [];
  const ql = q.toLowerCase();
  const starts = [], contains = [], cats = [];
  for (let i = 0; i < list.length; i++) {
    const n = list[i].name.toLowerCase();
    const at = n.indexOf(ql);
    if (at === 0) starts.push(list[i]); else if (at > 0) contains.push(list[i]);
  }
  const people = starts.concat(contains).slice(0, 6).map(function (p) { return { type: 'person', p: p }; });
  UNITS.forEach(function (g, gi) {
    if (g.name.toLowerCase().indexOf(ql) !== -1 || (gi === 0 && '廠辦生品'.indexOf(q) !== -1)) {
      cats.push({ type: 'cat', k: 'unit', v: 'g:' + g.name, label: g.name + (g.children.length ? '（整課）' : '') });
    }
    g.children.forEach(function (c) {
      if (c.toLowerCase().indexOf(ql) !== -1) cats.push({ type: 'cat', k: 'unit', v: 'u:' + c, label: g.name + ' / ' + c });
    });
  });
  if (/^\d{1,3}$/.test(q)) {
    allYears(list).filter(function (y) { return y.indexOf(q) === 0; }).slice(0, 3)
      .forEach(function (y) { cats.push({ type: 'cat', k: 'year', v: y, label: y + ' 年班' }); });
  }
  CATS.slice(0, 4).forEach(function (c, i) {
    if (c.name.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'cat', v: String(i), label: c.name });
  });
  ZODIACS.forEach(function (z, i) {
    if (z.name.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'zod', v: String(i), label: z.emoji + ' ' + z.name });
  });
  if ('本週壽星'.indexOf(q) !== -1 || '本周壽星'.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'week', v: '1', label: '📅 本週壽星' });
  if ('本月壽星'.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'month', v: String(now.getMonth() + 1), label: '📆 本月壽星' });
  const mm = q.match(/^(\d{1,2})月?(?:生日)?$/);
  if (mm && Number(mm[1]) >= 1 && Number(mm[1]) <= 12) {
    cats.push({ type: 'cat', k: 'month', v: String(Number(mm[1])), label: Number(mm[1]) + ' 月生日' });
  }
  cats.forEach(function (c) {
    const f = { q: '', unit: '', year: '', month: '', day: '', cat: '', week: '', zod: '' };
    f[c.k] = c.v;
    c.n = filterPeople(list, f, now).length;
  });
  return people.concat(cats).slice(0, 9);
}

function firstPhone(raw) {

  const parts = v.split(/[,，\/、;；]+/);

}

function birthText(p) {
  if (!p.birthY && !p.birthM && !p.birthD) return '';
  const base = p.birthY ? (p.birthY + '-' + pad2(p.birthM) + '-' + pad2(p.birthD)) : (p.birthM + '月' + p.birthD + '日');
  const roc = p.birthRY || rocYear(p.birthY);
  return base + (roc ? '（民國 ' + roc + ' 年）' : '');
}
function joinText(p) {
  if (!p.joinY && !p.joinM && !p.joinD) return '';
  const base = p.joinY ? (p.joinY + '-' + pad2(p.joinM) + '-' + pad2(p.joinD)) : (p.joinM + '月' + p.joinD + '日');
  const roc = p.joinRY || rocYear(p.joinY);
  return base + (roc ? '（民國 ' + roc + ' 年）' : '');
}
function westYear(westStr, rocStr) {
  const w = parseInt(westStr, 10);
  if (!isNaN(w)) return w;
  const r = parseInt(rocStr, 10);
  return isNaN(r) ? NaN : r + 1911;
}
function ageText(p, now) {
  now = now || new Date();
  const y = westYear(p.birthY, p.birthRY), m = Number(p.birthM), d = Number(p.birthD);
  if (isNaN(y) || !m || !d) return '';
  let age = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) age--;
  return age >= 0 && age < 120 ? age + ' 歲' : '';
}
function serviceText(p, now) {
  now = now || new Date();
  const y = westYear(p.joinY, p.joinRY), m = Number(p.joinM), d = Number(p.joinD);
  if (isNaN(y) || !m) return '';
  let months = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
  if (d && now.getDate() < d) months--;
  if (months < 0) return '';
  const yy = Math.floor(months / 12), mm = months % 12;
  return (yy ? yy + ' 年 ' : '') + mm + ' 個月';
}

    '<div><code data-act="try" data-t="99">99</code>年班　<code data-act="try" data-t="3月生日">3月生日</code><code data-act="try" data-t="3/15">3/15</code>生日</div>' +
    '<div><code data-act="try" data-t="本週壽星">本週壽星</code><code data-act="try" data-t="今天生日">今天生日</code></div>' +
    '<div><code data-act="try" data-t="雙魚座">雙魚座</code>星座　<code data-act="try" data-t="O型">O型</code>血型</div>' +
    '<div>可以混搭：<code data-act="try" data-t="通導 巨蟹座">通導 巨蟹座</code>用空白隔開</div></div></div>';
  $('home').innerHTML = h;
}

function bdayTag(p, now, showB) {
  if (isBirthdayOn(p, now)) return '<span class="bday">🎂 今天生日</span>';
  if (!showB || !p.birthM || !p.birthD) return '';
  const diff = diffThisYear(p, now);
  return '<span class="bday">🎂 ' + p.birthM + '/' + p.birthD + (diff !== null && Math.abs(diff) <= 31 ? ' · ' + relText(diff) : '') + '</span>';
}
function personHtml(p, open, showB) {
  const now = new Date();
  const ul = unitLabel(p.unit);
  const subs = [ul, p.skill, p.yearClass].filter(Boolean).join(' · ');
  const real = idState[p.row];
  const ph = firstPhone(p.phone), dial = dialPhone(p.phone);
  const zi = zodiacIdx(p.birthM, p.birthD);
  const age = ageText(p, now), svc = serviceText(p, now);
  const bt = birthText(p), jt = joinText(p);
  const next = daysToNext(p, now);
  const kw = flt.q.trim();
  const c = catColor(p);
  function cell(label, val, chips, wide) {
    return val ? '<div class="cell' + (wide ? ' wide' : '') + '"><label>' + label + '</label><div>' + esc(val) + '</div>' + (chips ? '<div class="mchips">' + chips + '</div>' : '') + '</div>' : '';
  }
  let bchips = '';
  if (zi >= 0) bchips += '<span class="mchip tap" data-act="zod" data-v="' + zi + '">' + ZODIACS[zi].emoji + ' ' + ZODIACS[zi].name + '</span>';
  if (age) bchips += '<span class="mchip">' + age + '</span>';
  if (next !== null) bchips += '<span class="mchip' + (next <= 7 ? ' hot' : '') + '">' + (next === 0 ? '🎂 今天生日' : '下次生日 ' + relText(next)) + '</span>';
  let d = '<div class="grid">';
  d += cell('單位', ul) + cell('專長', p.skill) + cell('年班', p.yearClass) + cell('血型', p.blood ? p.blood + ' 型' : '');
  if (p.idMask) {
    d += '<div class="cell wide"><label>身分證</label><div class="idrow"><span id="id' + p.row + '">' + esc(real || p.idMask) + '</span>' +
         '<button class="mini" data-act="id" data-row="' + p.row + '">' + (real ? '隱藏' : '顯示') + '</button></div></div>';
  }
  d += cell('生日', bt, bchips, true);
  d += cell('電話', ph, '', true);
  d += cell('入伍', jt, svc ? '<span class="mchip">年資 ' + svc + '</span>' : '', true);
  d += '</div><div class="actions">' +
       (dial ? '<a class="act primary" href="tel:' + esc(dial) + '">📞 撥打</a>' : '') +
       (dial ? '<a class="act" href="sms:' + esc(dial) + '">💬 簡訊</a>' : '') +
       '<button class="act" data-act="copy" data-i="' + p._i + '">📋 複製</button></div>';
  return '<div class="person' + (open ? ' open' : '') + '" style="--gc:' + c + '" data-i="' + p._i + '">' +
    '<div class="phead" data-act="toggle"><div class="avatar" style="background:' + c + '">' + esc(p.name.charAt(0)) + '</div>' +
    '<div class="pmain"><div class="pname">' + hl(p.name, kw) +
    (p.rank ? '<span class="rank" style="color:' + c + ';border:1px solid ' + c + ';background:' + c + '24">' + esc(p.rank) + '</span>' : '') +
    bdayTag(p, now, showB) + '</div>' +
    (subs ? '<div class="psub">' + esc(subs) + '</div>' : '') + '</div><div class="chev">▼</div></div>' +
    '<div class="pdetail' + (open ? '' : ' hidden') + '">' + d + '</div></div>';
}
function grpHead(c, counts, first) {
  return '<div class="grp' + (collapsed[c] ? ' off' : '') + (first ? ' first' : '') + '" style="--gc:' + CATS[c].color + '" data-act="grp" data-c="' + c + '">' + (IMG.cat[c] ? catImg(c) : '<i></i>') + CATS[c].name +
         '<small>' + counts[c] + ' 人</small><span class="car">▼</span></div>';
}
function renderResults() {
  const now = new Date();
  const pq = parseQuery(flt.q, now);
  const bySort = !!(flt.month || flt.week || flt.zod !== '' || pq.month || pq.week || pq.zod != null);
  const showB = bySort || !!flt.day || pq.today;
  const open = view.length === 1;
  const counts = [0, 0, 0, 0, 0];
  view.forEach(function (p) { counts[rankInfo(p.rank).cat]++; });
  $('count').textContent = view.length ? '找到 ' + view.length + ' 人' : '';
  $('copyListBtn').classList.toggle('hidden', !view.length);
  $('legend').innerHTML = view.length ? CATS.map(function (c, i) {
    return counts[i] ? '<button class="lg" style="--lc:' + c.color + '" data-act="cat" data-v="' + i + '">' + (IMG.cat[i] ? catImg(i, 's') : '<i></i>') + c.name + ' <small>' + counts[i] + '</small></button>' : '';
  }).join('') : '';
  renderYearNav();
  if (!view.length) {
    $('list').innerHTML = '<div class="empty"><img src="' + IMG.empty + '" alt=""><br>找不到符合的人員<br><small>換個關鍵字，或按「清除全部」</small></div>';
    $('more').classList.add('hidden');
    return;
  }
  let html = '', n = 0, lastCat = -1, more = false;
  for (let i = 0; i < view.length; i++) {
    const p = view[i], c = rankInfo(p.rank).cat;
    if (!bySort && c !== lastCat) { html += grpHead(c, counts, lastCat === -1); lastCat = c; }
    if (!bySort && collapsed[c]) continue;
    if (n >= shown) { more = true; continue; }
    html += personHtml(p, open, showB);
    n++;
  }
  $('list').innerHTML = html;
  $('more').classList.toggle('hidden', !more);
}

function renderYearNav() {
  const el = $('yearNav');
  if (!flt.year) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  const ys = allYears(people), i = ys.indexOf(flt.year);
  const cnt = function (y) { return people.filter(function (p) { return yearNum(p.yearClass) === y; }).length; };
  const prev = i > 0 ? ys[i - 1] : null, next = i >= 0 && i < ys.length - 1 ? ys[i + 1] : null;
  el.innerHTML =
    '<button data-act="year" data-v="' + (prev || '') + '"' + (prev ? '' : ' disabled') + '>◀ 往下查<small>' + (prev ? prev + ' 年班 · ' + cnt(prev) + ' 人' : '沒有了') + '</small></button>' +
    '<div class="cur">' + esc(flt.year) + ' 年班<small>' + cnt(flt.year) + ' 人</small></div>' +
    '<button data-act="year" data-v="' + (next || '') + '"' + (next ? '' : ' disabled') + '>往上查 ▶<small>' + (next ? next + ' 年班 · ' + cnt(next) + ' 人' : '沒有了') + '</small></button>';
  el.classList.remove('hidden');
}
function tile(label, sub, k, v, color, cls, extra, hint, icon) {
  return '<button class="tile ' + (cls || '') + '" style="--tc:' + (color || 'var(--acc)') + '" data-act="tile" data-k="' + k + '" data-v="' + esc(v) + '"' +
    (extra ? ' data-extra="' + esc(JSON.stringify(extra)) + '"' : '') + '>' + (icon ? '<img class="zi" src="' + icon + '" alt="">' : '') + '<b>' + esc(label) + '</b><span>' + esc(sub) + '</span>' + (hint ? '<em>' + esc(hint) + '</em>' : '') + '</button>';
}
function renderUnit() {
  let h = '';
  UNITS.forEach(function (g) {
    const all = people.filter(function (p) { return matchUnit(p, 'g:' + g.name); }).length;
    h += '<div class="sect">' + esc(g.name) + '</div>';
    if (!g.children.length) { h += '<div class="tiles two">' + tile(g.name, all + ' 人', 'unit', 'g:' + g.name, g.color, all ? '' : 'zero') + '</div>'; return; }
    h += '<div class="tiles four">' + tile('整課', all + ' 人', 'unit', 'g:' + g.name, g.color, all ? '' : 'zero');
    g.children.forEach(function (c) {
      const n = people.filter(function (p) { return p.unit === c; }).length;
      h += tile(c, n + ' 人', 'unit', 'u:' + c, g.color, n ? '' : 'zero');
    });
    h += '</div>';
  });
  $('unitTiles').innerHTML = h;
}
function renderYear() {
  $('yearTiles').innerHTML = allYears(people).map(function (y) {
    const n = people.filter(function (p) { return yearNum(p.yearClass) === y; }).length;
    return tile(y + ' 年班', n + ' 人', 'year', y, 'var(--acc2)');
  }).join('') || '<div class="empty" style="grid-column:1/-1">沒有年班資料</div>';
}
function renderBday() {
  const now = new Date(), cm = now.getMonth() + 1;
  const todayN = people.filter(function (p) { return isBirthdayOn(p, now); }).length;
  const weekN = filterPeople(people, Object.assign({}, EMPTY, { week: '1' }), now).length;
  const monthN = people.filter(function (p) { return Number(p.birthM) === cm; }).length;
  let h = '<div class="sect" style="margin-top:4px"><img src="' + IMG.bday + '" alt="">壽星</div><div class="tiles">' +
    tile('🎂 今天', todayN + ' 人', 'month', String(cm), 'var(--amber)', 'now ' + (todayN ? '' : 'zero'), { day: String(now.getDate()) }) +
    tile('📅 本週', weekN + ' 人', 'week', '1', 'var(--amber)', 'now ' + (weekN ? '' : 'zero')) +
    tile('📆 本月', monthN + ' 人', 'month', String(cm), 'var(--amber)', 'now ' + (monthN ? '' : 'zero')) + '</div>';
  h += '<div class="sect">全部月份</div><div class="tiles">';
  for (let m = 1; m <= 12; m++) {
    const n = people.filter(function (p) { return Number(p.birthM) === m; }).length;
    h += tile(m + ' 月', n + ' 人', 'month', String(m), 'var(--acc)', (m === cm ? 'now ' : '') + (n ? '' : 'zero'));
  }
  h += '</div><div class="sect"><img src="' + IMG.zod + '" alt="">星座</div><div class="tiles">';
  ZODIACS.forEach(function (z, i) {
    const n = people.filter(function (p) { return zodiacIdx(p.birthM, p.birthD) === i; }).length;
    h += tile(z.name.replace('座', ''), n + ' 人', 'zod', String(i), 'var(--acc2)', n ? '' : 'zero', null, zodiacRange(z), IMG.zi[i]);
  });
  $('bdayTiles').innerHTML = h + '</div>';
}
function renderDuty() {
  if (!duty.length) { $('dutyList').innerHTML = '<div class="empty"><div class="big">📅</div>目前沒有未來的留守資料</div>'; return; }
  const now = new Date(), t0 = ymd(now), t1 = ymd(new Date(now.getTime() + 86400000));
  $('dutyList').innerHTML = duty.map(function (d) {
    const p = d.date.split('-');
    const w = WK[new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay()];
    const badge = d.date === t0 ? '<span class="badge">今天</span>' : (d.date === t1 ? '<span class="badge">明天</span>' : '');
    return '<div class="dcard' + (d.date === t0 ? ' today' : '') + '"><div class="d">' + p[1] + '/' + p[2] + '<small>週' + w + '</small>' + badge +
           '</div><div class="t">' + esc(dutyIcons(d)) + '</div></div>';
  }).join('');
}

// ---- 建議清單 ----
function hideSug() { sugs = []; sugIdx = -1; $('sug').classList.add('hidden'); }
function renderSug() {
  const q = $('q').value.trim();
  sugs = buildSuggestions(people, q); sugIdx = -1;
  if (!sugs.length) { hideSug(); return; }
  let h = '', lastType = '';
  sugs.forEach(function (s, i) {
    if (s.type !== lastType) { h += '<div class="sug-head">' + (s.type === 'person' ? '人員' : '快速篩選') + '</div>'; lastType = s.type; }
    if (s.type === 'person') {
      const sub = [s.p.rank, unitLabel(s.p.unit), s.p.yearClass].filter(Boolean).join(' · ');
      h += '<div class="sug-item" data-s="' + i + '"><div class="avatar" style="width:38px;height:38px;border-radius:12px;font-size:17px;background:' + catColor(s.p) + '">' + esc(s.p.name.charAt(0)) +
           '</div><div class="sug-main"><div class="sug-name">' + hl(s.p.name, q) + '</div><div class="sug-sub">' + esc(sub) + '</div></div></div>';
    } else {
      h += '<div class="sug-item" data-s="' + i + '"><div class="sug-main"><div class="sug-name">' + esc(s.label) + '</div><div class="sug-sub">' + s.n + ' 人</div></div><span class="sug-tag">篩選</span></div>';
    }
  });
  $('sug').innerHTML = h; $('sug').classList.remove('hidden');
}
function pushRecent(i) {
  let r = [];
  try { r = JSON.parse(sessionStorage.getItem('recent') || '[]'); } catch (e) {}
  r = [i].concat(r.filter(function (x) { return x !== i; })).slice(0, 8);
  try { sessionStorage.setItem('recent', JSON.stringify(r)); } catch (e) {}
}
function pickPerson(p) {
  pushRecent(p._i);
  flt = Object.assign({}, EMPTY);
  flt.q = p.name; $('q').value = p.name; hideSug(); shown = PAGE;
  setTab('search'); renderSearch();
  $('q').blur();
}
function chooseSug(i) {
  const s = sugs[i]; if (!s) return;
  if (s.type === 'person') pickPerson(s.p);
  else { hideSug(); $('q').blur(); applyTile(s.k, s.v); }
}

// ---- 動作 ----
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise(function (resolve, reject) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? resolve() : reject(); } catch (e) { reject(e); }
    document.body.removeChild(ta);
  });
}
function filterTitle() {
  const t = [];
  if (flt.q.trim()) t.push(flt.q.trim());
  if (flt.unit) t.push(flt.unit.slice(2));
  if (flt.cat !== '') t.push(CATS[Number(flt.cat)].name);
  if (flt.year) t.push(flt.year + ' 年班');
  if (flt.week) t.push('本週壽星');
  if (flt.month) t.push(flt.month + (flt.day ? '/' + flt.day : ' 月') + '生日');
  if (flt.zod !== '') t.push(ZODIACS[Number(flt.zod)].name);
  return '天眼名單：' + (t.join(' ') || '全部');
}
async function toggleId(btn) {
  const rowNo = Number(btn.getAttribute('data-row'));
  const span = $('id' + rowNo);
  const p = people.find(function (x) { return x.row === rowNo; });
  if (!p || !span) return;
  if (idState[rowNo]) { delete idState[rowNo]; span.textContent = p.idMask; btn.textContent = '顯示'; return; }
  btn.disabled = true;
  try {
    const r = await api({ action: 'reveal', token: token, row: rowNo });
    if (r.expired) { logoutLocal(r.msg); return; }
    if (r.ok) { idState[rowNo] = r.id; span.textContent = r.id; btn.textContent = '隱藏'; }
    else toast(r.msg || '失敗');
  } catch (e) { toast('連線失敗'); }
  btn.disabled = false;
}

let qTimer = null;
$('q').addEventListener('input', function () {
  flt.q = $('q').value; shown = PAGE;
  $('clearQ').classList.toggle('hidden', !$('q').value);
  clearTimeout(qTimer);
  qTimer = setTimeout(function () { renderSearch(); renderSug(); }, 90);
});
$('q').addEventListener('focus', function () { if ($('q').value.trim()) renderSug(); });
$('q').addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' && sugs.length) { e.preventDefault(); sugIdx = (sugIdx + 1) % sugs.length; markSug(); }
  else if (e.key === 'ArrowUp' && sugs.length) { e.preventDefault(); sugIdx = (sugIdx - 1 + sugs.length) % sugs.length; markSug(); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (sugIdx >= 0) chooseSug(sugIdx); else { hideSug(); $('q').blur(); }
  } else if (e.key === 'Escape') hideSug();
});
function markSug() {
  document.querySelectorAll('.sug-item').forEach(function (el, i) { el.classList.toggle('on', i === sugIdx); });
}
$('sug').addEventListener('pointerdown', function (e) {
  const el = e.target.closest('.sug-item'); if (!el) return;
  e.preventDefault();
  chooseSug(Number(el.getAttribute('data-s')));
});
document.addEventListener('pointerdown', function (e) { if (!e.target.closest('.searchbox')) hideSug(); });
$('clearQ').addEventListener('click', function () { $('q').value = ''; flt.q = ''; hideSug(); renderSearch(); $('q').focus(); });
$('resetBtn').addEventListener('click', function () { flt = Object.assign({}, EMPTY); $('q').value = ''; hideSug(); renderSearch(); });
$('copyListBtn').addEventListener('click', function () {
  copyToClipboard(listText(view, filterTitle())).then(function () { toast('已複製名單（' + view.length + ' 人）'); }, function () { toast('複製失敗'); });
});
$('moreBtn').addEventListener('click', function () { shown += PAGE; renderResults(); });
$('toTop').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('fchips').addEventListener('click', function (e) {
  const b = e.target.closest('[data-act="rm"]'); if (!b) return;
  const k = b.getAttribute('data-k');
  flt[k] = ''; if (k === 'month') flt.day = '';
  shown = PAGE; renderSearch();
});
document.querySelector('.nav').addEventListener('click', function (e) {
  const b = e.target.closest('button[data-tab]'); if (b) setTab(b.getAttribute('data-tab'));
});
$('app').addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.getAttribute('data-act');
  const now = new Date();
  if (act === 'toggle') {
    const card = el.parentNode;
    card.classList.toggle('open');
    card.querySelector('.pdetail').classList.toggle('hidden');
  } else if (act === 'id') toggleId(el);
  else if (act === 'copy') {
    const p = people[Number(el.getAttribute('data-i'))];
    copyToClipboard(copyText(p, idState[p.row])).then(function () { toast('已複製'); }, function () { toast('複製失敗'); });
  } else if (act === 'tile') {
    let extra = null;
    try { extra = JSON.parse(el.getAttribute('data-extra') || 'null'); } catch (x) {}
    applyTile(el.getAttribute('data-k'), el.getAttribute('data-v'), extra);
  } else if (act === 'pick') pickPerson(people[Number(el.getAttribute('data-i'))]);
  else if (act === 'year') { const v = el.getAttribute('data-v'); if (v) { flt.year = v; shown = PAGE; renderSearch(); window.scrollTo(0, 0); } }
  else if (act === 'cat') { if (tab === 'search' && hasFilter()) { flt.cat = el.getAttribute('data-v'); shown = PAGE; renderSearch(); } else applyTile('cat', el.getAttribute('data-v')); }
  else if (act === 'zod') applyTile('zod', el.getAttribute('data-v'));
  else if (act === 'grp') { const c = Number(el.getAttribute('data-c')); collapsed[c] = !collapsed[c]; renderResults(); }
  else if (act === 'stat') {
    const k = el.getAttribute('data-k');
    if (k === 'today') applyTile('month', String(now.getMonth() + 1), { day: String(now.getDate()) });
    else if (k === 'week') applyTile('week', '1');
    else applyTile('month', String(now.getMonth() + 1));
  } else if (act === 'try') { $('q').value = el.getAttribute('data-t'); flt.q = $('q').value; shown = PAGE; renderSearch(); }
});
$('reloadBtn').addEventListener('click', function () { loadData().then(function () { toast('已更新'); }); });
$('logoutBtn').addEventListener('click', async function () {
  try { await api({ action: 'logout', token: token }); } catch (e) {}
  logoutLocal('');
});
$('loginBtn').addEventListener('click', login);
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

if (DEMO) { $('loginMsg').className = 'login-msg info'; $('loginMsg').textContent = '預覽模式：任意密碼即可進入，資料皆為虛構'; }
if (token) loadData(); else showApp(false);
</script>
