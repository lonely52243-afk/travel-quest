  .lcard { width:100%; max-width:340px; text-align:center; }
  .lcard .logo { display:block; width:112px; height:112px; border-radius:26px; margin:0 auto 18px; box-shadow:0 0 40px rgba(63,208,255,.40); }
  .lcard h1 { margin:0; font-size:32px; font-weight:800; letter-spacing:.4em; padding-left:.4em; }
  .lcard p { margin:4px 0 28px; color:var(--sub); font-size:13px; letter-spacing:.25em; }
  .pwbox { position:relative; }
  .pwbox img { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; pointer-events:none; z-index:2; }
  .field { width:100%; padding:16px 16px 16px 52px; font-size:17px; color:var(--txt); border-radius:14px; border:1px solid var(--line2); background:rgba(5,8,15,.8); outline:none; letter-spacing:.15em; transition:border-color .2s, box-shadow .2s; }
  .field:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-a); }
  .btn { width:100%; margin-top:12px; padding:15px; font-size:17px; font-weight:800; letter-spacing:.3em; border:0; border-radius:14px; color:#02121f; cursor:pointer; background:var(--acc); box-shadow:0 8px 28px rgba(63,208,255,.30); }
  .btn:disabled { opacity:.5; }
  .lmsg { min-height:22px; margin-top:14px; font-size:14px; color:var(--err); }
  .lmsg.info { color:var(--amber); }
  .lmsg img { display:block; width:70px; height:70px; margin:0 auto 6px; border-radius:50%; }
  .lnote { margin-top:26px; font-size:11.5px; color:var(--dim); letter-spacing:.06em; }

  /* ===== 外框 ===== */
  #app { padding-bottom:calc(78px + var(--sb)); }
  .top { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:calc(8px + var(--st)) 14px 8px;
    background:rgba(5,8,15,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .top .logo { width:36px; height:36px; border-radius:10px; box-shadow:0 0 12px rgba(63,208,255,.35); }
  .top .ttl { flex:1; min-width:0; }
  .top b { display:block; font-size:18px; letter-spacing:.25em; line-height:1.2; }
  .top small { display:block; font-size:11.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top small i { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ok); margin-right:5px; vertical-align:1px; box-shadow:0 0 6px var(--ok); }
  .ibtn { width:40px; height:40px; padding:0; border:0; border-radius:11px; background:none; cursor:pointer; overflow:hidden; }
  .ibtn img { width:40px; height:40px; display:block; }
  .wrap { max-width:720px; margin:0 auto; padding:0 14px 16px; }
  .vhead { padding:16px 2px 10px; }
  .vhead h2 { margin:0; font-size:22px; font-weight:800; }
  .vhead p { margin:3px 0 0; color:var(--sub); font-size:13px; }

  /* ===== 搜尋列 ===== */
  .sbar { position:sticky; top:var(--tb); z-index:25; margin:0 -14px; padding:10px 14px 6px; background:linear-gradient(var(--bg) 80%, rgba(5,8,15,0)); }
  .sbox { position:relative; }
  .sbox svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:19px; height:19px; stroke:var(--sub); fill:none; stroke-width:2.2; stroke-linecap:round; pointer-events:none; z-index:2; }
  .sbox input { width:100%; padding:14px 42px 14px 42px; font-size:16.5px; color:var(--txt); border-radius:14px; border:1px solid var(--line2); background:var(--card); outline:none; transition:border-color .2s, box-shadow .2s; }
  .sbox input:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-a); }
  .sbox input::placeholder { color:var(--dim); }
  .clr { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:50%; border:0; background:var(--card3); color:var(--sub); font-size:13px; cursor:pointer; }
  .sug { position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line2); border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.65); max-height:62vh; overflow-y:auto; }
  .sug-h { padding:9px 14px 3px; font-size:11px; color:var(--dim); letter-spacing:.15em; }
  .sug-i { display:flex; align-items:center; gap:11px; padding:10px 14px; cursor:pointer; }
  .sug-i + .sug-i { border-top:1px solid var(--line); }
  .sug-i.on, .sug-i:active { background:var(--acc-a); }
  .sug-i .m { flex:1; min-width:0; }
  .sug-i b { display:block; font-size:15.5px; }
  .sug-i small { display:block; font-size:12.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sug-i em { font-style:normal; font-size:11.5px; color:var(--acc); border:1px solid var(--acc-b); padding:1px 8px; border-radius:20px; }
  .quick { display:flex; gap:7px; overflow-x:auto; padding:9px 0 2px; scrollbar-width:none; }
  .quick::-webkit-scrollbar { display:none; }
  .qc { flex:0 0 auto; padding:6px 12px; border-radius:20px; border:1px solid var(--line2); background:var(--card); font-size:13.5px; color:var(--txt); cursor:pointer; white-space:nowrap; }
  .qc i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .qc.on { background:var(--acc-a); border-color:var(--acc); color:#dff6ff; }
  .fchips { display:flex; flex-wrap:wrap; gap:7px; padding-top:8px; }
  .fchips:empty { display:none; }
  .fchip { display:inline-flex; align-items:center; gap:7px; padding:5px 6px 5px 12px; border-radius:20px; background:var(--acc-a); border:1px solid var(--acc-b); font-size:13.5px; color:#dff6ff; }
  .fchip button { width:20px; height:20px; border-radius:50%; border:0; background:rgba(255,255,255,.15); font-size:10px; cursor:pointer; padding:0; }

  /* ===== 卡片與區塊 ===== */
  .card { margin-top:12px; padding:14px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); }
  .card > h3 { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:14px; font-weight:700; color:var(--sub); letter-spacing:.08em; }
  .card > h3 img { width:24px; height:24px; border-radius:50%; }
  .card > h3 em { margin-left:auto; font-style:normal; color:var(--amber); font-weight:800; letter-spacing:0; }
  .card > h3 small { margin-left:auto; font-weight:500; color:var(--dim); letter-spacing:0; font-size:12px; }
  .card.gold { border-color:rgba(255,184,77,.45); background:linear-gradient(160deg, rgba(255,184,77,.12), var(--card) 60%); position:relative; overflow:hidden; }
  .card.gold > h3 { color:#ffe1ad; }
  .card.gold::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(110deg, transparent 35%, rgba(255,226,176,.12) 50%, transparent 65%); background-size:220% 100%; animation:shimmer 3.6s linear infinite; }

  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(5,8,15,.85), rgba(5,8,15,.05)); }
  .hero div { position:absolute; left:16px; bottom:13px; z-index:2; }
  .hero b { display:block; font-size:19px; letter-spacing:.08em; }
  .hero span { font-size:12.5px; color:#b6c8e6; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .kpi { padding:10px 4px 9px; border-radius:14px; background:var(--card); border:1px solid var(--line); text-align:center; cursor:pointer; }
  .kpi img { display:block; width:30px; height:30px; margin:0 auto 4px; border-radius:50%; }
  .kpi b { display:block; font-size:23px; font-weight:800; line-height:1.15; }
  .kpi span { font-size:11.5px; color:var(--sub); }
  .kpi.hot b { color:var(--amber); }
  .pills { display:flex; flex-wrap:wrap; gap:7px; }
  .pill { padding:7px 12px; border-radius:20px; background:var(--card2); border:1px solid var(--line2); font-size:14px; cursor:pointer; }
  .pill small { color:var(--sub); margin-left:6px; font-size:12px; }
  .pill.hot { border-color:rgba(255,184,77,.55); background:var(--amber-a); color:#ffe1ad; }
  .lrow { display:flex; align-items:center; gap:10px; width:100%; padding:9px 2px; border:0; border-top:1px solid var(--line); background:none; font-size:15px; cursor:pointer; text-align:left; }
  .lrow:first-of-type { border-top:0; }
  .lrow .d { flex:0 0 80px; color:var(--sub); font-size:13px; }
  .lrow .n { flex:1; min-width:0; font-weight:700; }
  .lrow .n small { color:var(--sub); font-weight:500; margin-left:6px; font-size:12.5px; }
  .tag { font-size:12px; padding:2px 10px; border-radius:20px; background:var(--card3); color:var(--sub); white-space:nowrap; }
  .tag.today { background:var(--amber); color:#291800; font-weight:800; }
  .tag.soon { background:var(--amber-a); color:var(--amber); }
  .lrow.past { opacity:.45; }
  .more { display:block; width:100%; margin-top:8px; padding:9px; background:none; border:1px dashed var(--line2); border-radius:12px; color:var(--acc); font-size:13.5px; cursor:pointer; }
  .drow { display:flex; justify-content:space-between; align-items:center; padding:7px 0; }
  .drow + .drow { border-top:1px solid var(--line); }
  .dt { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:700; padding:3px 10px 3px 4px; border-radius:20px; margin-left:6px; border:1px solid; }
  .dt img { width:20px; height:20px; border-radius:50%; }
  .dt.d1 { color:var(--c0); border-color:rgba(255,184,77,.45); background:rgba(255,184,77,.1); }
  .dt.d2 { color:var(--c1); border-color:var(--acc-b); background:var(--acc-a); }
  .dt.d3 { color:var(--c2); border-color:rgba(74,222,128,.45); background:rgba(74,222,128,.1); }
  .tips { color:var(--sub); font-size:13px; line-height:2.15; }
  .tips code { font-family:inherit; background:var(--card3); padding:3px 9px; border-radius:8px; color:#d3e7ff; font-size:12.5px; margin-right:4px; cursor:pointer; }
  .cbar { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--card3); }
  .cbar i { display:block; height:100%; }

  /* ===== 結果列表 ===== */
  .rbar { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 2px 6px; color:var(--sub); font-size:13px; }
  .rbar .b { display:flex; gap:12px; }
  .rbar button { display:inline-flex; align-items:center; gap:4px; background:none; border:0; color:var(--acc); font-size:13px; cursor:pointer; padding:4px 0; }
  .rbar button img { width:18px; height:18px; border-radius:4px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px; padding-bottom:4px; }
  .lg { display:inline-flex; align-items:center; gap:6px; padding:4px 11px 4px 5px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid var(--lc); color:var(--lc); background:transparent; }
  .lg img { width:20px; height:20px; }
  .lg small { font-weight:600; opacity:.8; }
  .ynav { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:7px; margin:4px 0 8px; }
  .ynav button, .ynav div { padding:9px 4px; border-radius:13px; border:1px solid var(--line2); background:var(--card); text-align:center; font-size:14px; font-weight:700; cursor:pointer; line-height:1.3; }
  .ynav div { border-color:var(--acc-b); background:var(--acc-a); cursor:default; font-size:15px; }
  .ynav small { display:block; font-size:11.5px; color:var(--sub); font-weight:500; }
  .ynav img { width:16px; height:16px; vertical-align:-3px; border-radius:4px; }
  .ynav button:disabled { opacity:.3; }
  .grp { display:flex; align-items:center; gap:8px; margin:14px 2px 7px; font-size:14px; font-weight:800; letter-spacing:.14em; color:var(--gc); cursor:pointer; user-select:none; }
  .grp.first { margin-top:4px; }
  .grp img { width:24px; height:24px; }
  .grp i { width:9px; height:9px; border-radius:50%; background:var(--gc); }
  .grp small { color:var(--sub); font-weight:500; letter-spacing:0; font-size:12.5px; }
  .grp::after { content:""; flex:1; order:5; height:1px; background:linear-gradient(90deg, var(--gc), transparent); opacity:.5; }
  .grp .car { order:9; color:var(--dim); font-size:11px; transition:transform .2s; }
  .grp.off .car { transform:rotate(-90deg); }
  .row { display:flex; align-items:center; gap:12px; padding:11px 12px; margin-bottom:7px; border-radius:14px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gc); cursor:pointer; animation:fadeUp .3s ease both; animation-delay:var(--d,0s); }
  .av { flex:0 0 auto; width:42px; height:42px; border-radius:13px; display:grid; place-items:center; font-size:18px; font-weight:800; color:#04101f; background:var(--gc); }
  .rm { flex:1; min-width:0; }
  .rn { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:16.5px; font-weight:800; }
  .rk { font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:20px; color:var(--gc); border:1px solid var(--gc); background:color-mix(in srgb, var(--gc) 14%, transparent); }
  .bt { font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:20px; background:var(--amber-a); color:var(--amber); }
  .star { color:var(--amber); font-size:14px; }
  .rs { margin-top:2px; font-size:13px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chev { color:var(--dim); font-size:20px; }
  .empty { text-align:center; padding:40px 10px; color:var(--sub); }
  .empty img { width:120px; height:120px; margin-bottom:6px; }
  .loading { text-align:center; padding:40px 0; color:var(--sub); }
  .loading img { display:block; width:110px; height:110px; margin:0 auto 12px; border-radius:50%; animation:spin 2.4s linear infinite; }
  .pager { text-align:center; margin:6px 0 10px; }
  .pager button { padding:10px 24px; border-radius:20px; border:1px solid var(--line2); background:var(--card); color:var(--acc); cursor:pointer; }

  /* ===== 磚塊 ===== */
  .seg { display:flex; padding:3px; border-radius:12px; background:var(--card); border:1px solid var(--line); margin:4px 0 12px; }
  .seg button { flex:1; padding:9px 4px; border:0; border-radius:9px; background:none; color:var(--sub); font-size:14px; font-weight:700; cursor:pointer; }
  .seg button.on { background:var(--card3); color:var(--txt); box-shadow:inset 0 0 0 1px var(--line2); }
  .seg.sm button { font-size:12.5px; padding:7px 2px; }
  .sect { display:flex; align-items:center; gap:9px; margin:16px 2px 9px; font-size:13px; color:var(--sub); letter-spacing:.14em; }
  .sect img { width:24px; height:24px; border-radius:50%; }
  .sect::after { content:""; flex:1; height:1px; background:var(--line); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .tiles.c4 { grid-template-columns:repeat(4,1fr); }
  .tiles.c2 { grid-template-columns:repeat(2,1fr); }
  .tile { padding:12px 6px 10px; border-radius:14px; border:1px solid var(--line); background:var(--card); text-align:center; cursor:pointer; }
  .tile img { display:block; width:44px; height:44px; margin:0 auto 6px; border-radius:50%; }
  .tiles.c4 .tile img { width:38px; height:38px; }
  .tile b { display:block; font-size:15.5px; font-weight:800; }
  .tile span { display:block; font-size:12.5px; color:var(--sub); }
  .tile em { display:block; font-style:normal; font-size:10.5px; color:var(--dim); }
  .tile .cbar { margin:8px 8px 0; height:5px; }
  .tile.now { border-color:rgba(255,184,77,.55); background:linear-gradient(160deg, var(--amber-a), var(--card) 70%); }
  .tile.zero { opacity:.4; }

  /* ===== 留守 ===== */
  .dcard { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 14px; margin-bottom:8px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .dcard.today { border-color:rgba(255,184,77,.55); background:linear-gradient(160deg, var(--amber-a), var(--card) 70%); }
  .dcard .dd { font-size:19px; font-weight:800; }
  .dcard .dd small { margin-left:7px; font-size:13px; color:var(--sub); font-weight:500; }
  .badge { display:inline-block; font-size:11.5px; padding:1px 9px; border-radius:20px; background:var(--amber); color:#291800; font-weight:800; margin-left:7px; vertical-align:2px; }

  /* ===== 統計 ===== */
  .skpi { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .skpi div { padding:10px 4px; border-radius:13px; background:var(--card); border:1px solid var(--line); text-align:center; }
  .skpi b { display:block; font-size:20px; font-weight:800; }
  .skpi b small { font-size:12px; font-weight:600; color:var(--sub); margin-left:1px; }
  .skpi span { font-size:11.5px; color:var(--sub); }
  .ch-note { margin:8px 0 0; font-size:12px; color:var(--dim); }
  .hb { display:grid; grid-template-columns:96px 1fr 38px; align-items:center; gap:9px; width:100%; padding:7px 0; border:0; background:none; cursor:pointer; text-align:left; }
  .hb + .hb { border-top:1px solid var(--line); }
  .hb .l { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .hb .l img { width:26px; height:26px; border-radius:50%; flex:0 0 auto; }
  .hb .t { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--card3); }
  .hb .t i { display:block; height:100%; }
  .hb .v { font-size:13.5px; font-weight:700; text-align:right; }
  .hb .v small { display:block; font-size:10.5px; color:var(--dim); font-weight:500; }
  .hb.top .l { color:var(--amber); }
  .vb { display:flex; align-items:flex-end; gap:4px; height:150px; padding-top:18px; }
  .vb button { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; padding:0; border:0; background:none; cursor:pointer; }
  .vb button > small { display:block; text-align:center; font-size:11px; color:var(--sub); margin-bottom:3px; font-variant-numeric:tabular-nums; }
  .vb .st { display:flex; flex-direction:column-reverse; border-radius:5px 5px 2px 2px; overflow:hidden; min-height:2px; }
  .vb .st i { display:block; width:100%; }
  .vb button.now .st { box-shadow:0 0 0 1px var(--amber); }
  .vl { display:flex; gap:4px; margin-top:5px; padding-top:5px; border-top:1px solid var(--line2); }
  .vl span { flex:1; min-width:0; text-align:center; font-size:10.5px; color:var(--dim); white-space:nowrap; overflow:hidden; }
  .lc svg { display:block; width:100%; height:auto; }
  .lc .dot { cursor:pointer; }
  .clegend { display:flex; flex-wrap:wrap; gap:10px; margin-top:9px; font-size:11.5px; color:var(--sub); }
  .clegend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .mile { display:flex; align-items:center; gap:10px; width:100%; padding:8px 2px; border:0; border-top:1px solid var(--line); background:none; cursor:pointer; text-align:left; font-size:14.5px; }
  .mile b { flex:1; }
  .mile b small { color:var(--sub); font-weight:500; margin-left:6px; font-size:12.5px; }
  .mile .tag { background:var(--acc-a); color:var(--acc); }

  /* ===== 人員卡（底部彈出） ===== */
  .scrim { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.55); opacity:0; transition:opacity .25s; }
  .scrim.on { opacity:1; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:71; max-height:92vh; overflow-y:auto; overscroll-behavior:contain; background:var(--bg2); border-top:1px solid var(--line2); border-radius:22px 22px 0 0;
    padding:0 16px calc(18px + var(--sb)); transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1); box-shadow:0 -20px 60px rgba(0,0,0,.6); }
  .sheet.on { transform:none; }
  @media (min-width:740px) { .sheet { left:50%; right:auto; width:700px; margin-left:-350px; } }
  .grab { position:sticky; top:0; z-index:2; padding:10px 0 6px; background:var(--bg2); }
  .grab::before { content:""; display:block; width:42px; height:5px; border-radius:3px; background:var(--line2); margin:0 auto; }
  .sh-head { display:flex; align-items:center; gap:13px; padding:4px 0 14px; }
  .sh-head .av { width:58px; height:58px; border-radius:17px; font-size:25px; }
  .sh-head .m { flex:1; min-width:0; }
  .sh-head h3 { margin:0; font-size:22px; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sh-head p { margin:3px 0 0; color:var(--sub); font-size:13.5px; }
  .sh-x { width:34px; height:34px; border-radius:50%; border:0; background:var(--card3); color:var(--sub); font-size:15px; cursor:pointer; align-self:flex-start; }
  .acts { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .ac { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 2px 8px; border-radius:14px; border:1px solid var(--line2); background:var(--card); font-size:12px; font-weight:700; color:var(--txt); text-decoration:none; cursor:pointer; }
  .ac img { width:34px; height:34px; border-radius:9px; }
  .ac.pri { background:var(--acc); color:#02121f; border-color:var(--acc); }
  .ac.on { border-color:rgba(255,184,77,.6); background:var(--amber-a); color:var(--amber); }
  .ac.done { border-color:rgba(74,222,128,.6); background:rgba(74,222,128,.13); color:#c2f5d5; }
  .ac.off { opacity:.35; pointer-events:none; }
  .info { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .cell { padding:10px 12px; border-radius:13px; background:var(--card); border:1px solid var(--line); min-width:0; }
  .cell.w { grid-column:1 / -1; }
  .cell label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); margin-bottom:3px; }
  .cell label img { width:18px; height:18px; border-radius:50%; }
  .cell label .lk { margin-left:auto; color:var(--acc); font-size:11.5px; }
  .cell .v { font-size:15.5px; word-break:break-all; }
  .cell.link { cursor:pointer; border-color:rgba(63,208,255,.25); }
  .idr { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .idr span { letter-spacing:.06em; font-variant-numeric:tabular-nums; }
  .mini { border:1px solid var(--line2); background:var(--card3); color:var(--acc); font-size:13px; padding:5px 13px; border-radius:20px; cursor:pointer; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; padding:2px 10px; border-radius:20px; background:var(--card3); border:1px solid var(--line2); color:#cfe0fb; }
  .chip img { width:18px; height:18px; border-radius:50%; margin-left:-5px; }
  .chip.tap { cursor:pointer; color:var(--acc); border-color:var(--acc-b); }
  .chip.hot { background:var(--amber-a); border-color:rgba(255,184,77,.45); color:var(--amber); }

  /* ===== 底部導覽 ===== */
  .nav { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; padding:6px 6px calc(6px + var(--sb)); background:rgba(5,8,15,.9); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line); }
  .nav button { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 0; border:0; background:none; color:var(--dim); font-size:11px; cursor:pointer; }
  .nav img, .nav svg { width:30px; height:30px; border-radius:50%; opacity:.45; filter:grayscale(.4); transition:opacity .2s, filter .2s; }
  .nav button.on { color:var(--acc); }
  .nav button.on img, .nav button.on svg { opacity:1; filter:drop-shadow(0 0 7px rgba(63,208,255,.65)); animation:pop .35s ease; }
  .nb { position:absolute; top:0; left:calc(50% + 8px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--amber); color:#291800; font-size:10.5px; font-weight:800; display:grid; place-items:center; }
  .totop { position:fixed; right:14px; bottom:calc(86px + var(--sb)); z-index:45; width:44px; height:44px; padding:0; border:0; border-radius:12px; background:none; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .totop img { width:44px; height:44px; display:block; }
  .toast { position:fixed; left:50%; bottom:calc(88px + var(--sb)); z-index:90; transform:translate(-50%,10px); padding:10px 18px; border-radius:22px; background:var(--card2); border:1px solid var(--line2); font-size:14px; white-space:nowrap; opacity:0; pointer-events:none; transition:all .25s; }
  .toast.on { opacity:1; transform:translate(-50%,0); }
  .toast.ok { border-color:rgba(74,222,128,.55); }
  .toast.err { border-color:rgba(255,107,125,.6); color:#ffd2d8; }
  .foot { text-align:center; color:var(--dim); font-size:11.5px; margin-top:20px; }

  /* ===== 動態回饋 ===== */
  button, .row, .tile, .kpi, .pill, .cell.link, .lrow, .ac, .qc, .sug-i, .chip.tap, .hb, .mile { transition:transform .12s ease, background .2s, border-color .2s; }
  button:active, .row:active, .tile:active, .kpi:active, .pill:active, .cell.link:active, .lrow:active, .ac:active, .qc:active, .chip.tap:active, .hb:active, .mile:active { transform:scale(.96); }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes shake { 20%,80% { transform:translateX(5px); } 30%,50%,70% { transform:translateX(-8px); } 40%,60% { transform:translateX(8px); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pop { 40% { transform:scale(1.2); } }
  @keyframes shimmer { from { background-position:120% 0; } to { background-position:-120% 0; } }
  @keyframes grow { from { transform:scaleY(0); } }
  @keyframes growX { from { transform:scaleX(0); } }
  .anim > * { animation:fadeUp .35s ease both; }
  .anim > *:nth-child(2) { animation-delay:.04s; } .anim > *:nth-child(3) { animation-delay:.08s; } .anim > *:nth-child(4) { animation-delay:.12s; } .anim > *:nth-child(n+5) { animation-delay:.16s; }
  section.show { animation:fadeUp .28s ease both; }
  .vb .st { transform-origin:bottom; animation:grow .5s cubic-bezier(.2,.8,.2,1) both; }
  .hb .t i { transform-origin:left; animation:growX .5s cubic-bezier(.2,.8,.2,1) both; }
  .shake { animation:shake .45s ease; }
  .spin img { animation:spin .8s linear infinite; }
  .pop { animation:pop .35s ease; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>

  if (FACTORY_UNITS.indexOf(u) !== -1) return u;
  for (let i = 0; i < UNITS.length; i++) {
    if (UNITS[i].name === u) return u;
    if (UNITS[i].children.indexOf(u) !== -1) return UNITS[i].name + ' / ' + u;
  }
  return u;
}
function yearNum(yc) { const m = String(yc || '').match(/^(\d+)/); return m ? m[1] : ''; }
function rocYear(y) { const n = parseInt(y, 10); return isNaN(n) ? '' : String(n - 1911); }

function matchUnit(p, sel) {
  if (!sel) return true;
  if (sel.indexOf('g:') === 0) {
    const gname = sel.slice(2);
    for (let i = 0; i < UNITS.length; i++) {
      if (UNITS[i].name !== gname) continue;
      if (i === 0) return FACTORY_UNITS.indexOf(p.unit) !== -1;
      return p.unit === gname || UNITS[i].children.indexOf(p.unit) !== -1;
    }
    return false;
  }
  if (sel.indexOf('u:') === 0) return p.unit === sel.slice(2);
  return true;
}

function bloodKey(b) { return String(b || '').toLowerCase().replace(/型|rh|\+|\-|\s/g, ''); }
function isBirthdayOn(p, now) { return Number(p.birthM) === now.getMonth() + 1 && Number(p.birthD) === now.getDate(); }

// 把一串搜尋文字拆成：一般關鍵字 / 月 / 日 / 血型 / 今天生日 / 本週壽星 / 星座
function parseQuery(raw, now) {
  now = now || new Date();
  const out = { terms: [], month: null, day: null, blood: null, today: false, week: false, zod: null };
  const parts = String(raw || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  for (let i = 0; i < parts.length; i++) {
    const t = parts[i];
    let m;
    if (/^(今天|今日)(生日|壽星)$/.test(t)) { out.today = true; continue; }
    if (/^(本週|本周|這週|這周|今週|今周)(生日|壽星)?$/.test(t)) { out.week = true; continue; }
    if (/^(本月|這個月|當月)(生日|壽星)?$/.test(t)) { out.month = now.getMonth() + 1; continue; }
    if ((m = t.match(/^(\d{1,2})月(\d{1,2})[日號号]?(?:生日)?$/)) || (m = t.match(/^(\d{1,2})[\/\-](\d{1,2})$/))) {
      const mo = Number(m[1]), da = Number(m[2]);
      if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) { out.month = mo; out.day = da; continue; }
    }
    if ((m = t.match(/^(\d{1,2})月(?:生日|壽星)?$/))) {
      const mo = Number(m[1]);
      if (mo >= 1 && mo <= 12) { out.month = mo; continue; }
    }
    if ((m = t.match(/^(ab|a|b|o)型$/))) { out.blood = m[1]; continue; }
    const zn = t.replace(/座$/, '');
    let zi = -1;
    if (zn.length >= 2) for (let k = 0; k < ZODIACS.length; k++) if (ZODIACS[k].name.replace('座', '') === zn) { zi = k; break; }
    if (zi >= 0) { out.zod = zi; continue; }
    out.terms.push(t);
  }
  return out;
}

function filterPeople(list, f, now) {
  now = now || new Date();
  const pq = parseQuery(f.q, now);
  const month = pq.month || (f.month ? Number(f.month) : null);
  const day = pq.day || (f.day ? Number(f.day) : null);
  const week = pq.week || f.week === '1';
  const zod = pq.zod != null ? pq.zod : ((f.zod !== '' && f.zod != null) ? Number(f.zod) : null);
  if (pq.month && f.month && Number(f.month) !== pq.month) return [];
  const wr = weekRange(now);
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (!matchUnit(p, f.unit)) continue;
    if (f.year && yearNum(p.yearClass) !== f.year) continue;
    if (f.cat !== '' && f.cat != null && rankInfo(p.rank).cat !== Number(f.cat)) continue;
    if (month && Number(p.birthM) !== month) continue;
    if (day && Number(p.birthD) !== day) continue;
    if (week && !bdayDateInRange(p, wr.start, wr.end)) continue;
    if (zod !== null && zodiacIdx(p.birthM, p.birthD) !== zod) continue;
    if (pq.today && !isBirthdayOn(p, now)) continue;
    if (pq.blood && bloodKey(p.blood) !== pq.blood) continue;
    if (pq.terms.length) {
      const hay = [p.name, p.unit, unitLabel(p.unit), p.skill, p.rank, CATS[rankInfo(p.rank).cat].name, p.yearClass].join(' ').toLowerCase();
      const digits = String(p.phone || '').replace(/\D/g, '');
      let ok = true;
      for (let t = 0; t < pq.terms.length; t++) {
        const term = pq.terms[t];
        const td = term.replace(/\D/g, '');
        const isNum = /^[\d\-]+$/.test(term);
        if (hay.indexOf(term) !== -1) continue;
        if (isNum && td.length >= 4 && digits.indexOf(td) !== -1) continue;
        ok = false; break;
      }
      if (!ok) continue;
    }
    out.push(p);
  }
  const keyed = out.map(function (p, i) {
    const dt = week ? bdayDateInRange(p, wr.start, wr.end) : null;
    return { p: p, i: i, r: rankInfo(p.rank), wt: dt ? dt.getTime() : 0 };
  });
  keyed.sort(function (a, b) {
    if (week && a.wt !== b.wt) return a.wt - b.wt;
    if ((month || zod !== null) && !week) {
      const am = Number(a.p.birthM) * 100 + Number(a.p.birthD), bm = Number(b.p.birthM) * 100 + Number(b.p.birthD);
      if (am !== bm) return am - bm;
    }
    if (a.r.cat !== b.r.cat) return a.r.cat - b.r.cat;
    if (a.r.order !== b.r.order) return a.r.order - b.r.order;
    return a.i - b.i;
  });
  return keyed.map(function (k) { return k.p; });
}

function allYears(list) {
  const set = {}, r = [];
  for (let i = 0; i < list.length; i++) {
    const y = yearNum(list[i].yearClass);
    if (y && !set[y]) { set[y] = 1; r.push(y); }
  }
  r.sort(function (a, b) { return Number(a) - Number(b); });
  return r;
}

// 輸入時的建議：先列姓名，再列單位／年班／身分／星座／生日
function buildSuggestions(list, raw, now) {
  now = now || new Date();
  const q = String(raw || '').trim();
  if (!q) return [];
  const ql = q.toLowerCase();
  const starts = [], contains = [], cats = [];
  for (let i = 0; i < list.length; i++) {
    const n = list[i].name.toLowerCase();
    const at = n.indexOf(ql);
    if (at === 0) starts.push(list[i]); else if (at > 0) contains.push(list[i]);
  }
  const people = starts.concat(contains).slice(0, 6).map(function (p) { return { type: 'person', p: p }; });
  UNITS.forEach(function (g, gi) {
    if (g.name.toLowerCase().indexOf(ql) !== -1 || (gi === 0 && '廠辦生品'.indexOf(q) !== -1)) {
      cats.push({ type: 'cat', k: 'unit', v: 'g:' + g.name, label: g.name + (g.children.length ? '（整課）' : '') });
    }
    g.children.forEach(function (c) {
      if (c.toLowerCase().indexOf(ql) !== -1) cats.push({ type: 'cat', k: 'unit', v: 'u:' + c, label: g.name + ' / ' + c });
    });
  });
  if (/^\d{1,3}$/.test(q)) {
    allYears(list).filter(function (y) { return y.indexOf(q) === 0; }).slice(0, 3)
      .forEach(function (y) { cats.push({ type: 'cat', k: 'year', v: y, label: y + ' 年班' }); });
  }
  CATS.slice(0, 4).forEach(function (c, i) {
    if (c.name.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'cat', v: String(i), label: c.name });
  });
  ZODIACS.forEach(function (z, i) {
    if (z.name.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'zod', v: String(i), label: z.emoji + ' ' + z.name });
  });
  if ('本週壽星'.indexOf(q) !== -1 || '本周壽星'.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'week', v: '1', label: '本週壽星' });
  if ('本月壽星'.indexOf(q) !== -1) cats.push({ type: 'cat', k: 'month', v: String(now.getMonth() + 1), label: '本月壽星' });
  const mm = q.match(/^(\d{1,2})月?(?:生日)?$/);
  if (mm && Number(mm[1]) >= 1 && Number(mm[1]) <= 12) {
    cats.push({ type: 'cat', k: 'month', v: String(Number(mm[1])), label: Number(mm[1]) + ' 月生日' });
  }
  cats.forEach(function (c) {
    const f = { q: '', unit: '', year: '', month: '', day: '', cat: '', week: '', zod: '' };
    f[c.k] = c.v;
    c.n = filterPeople(list, f, now).length;
  });
  return people.concat(cats).slice(0, 9);
}

function firstPhone(raw) {
  const v = String(raw || '').trim();
  if (!v) return '';
  const parts = v.split(/[,，\/、;；]+/);
  return (parts[0] || '').trim() || v;
}
function dialPhone(raw) { const p = firstPhone(raw); return p ? p.replace(/[^\d+]/g, '') : ''; }

function birthText(p) {
  if (!p.birthY && !p.birthM && !p.birthD) return '';
  const base = p.birthY ? (p.birthY + '-' + pad2(p.birthM) + '-' + pad2(p.birthD)) : (p.birthM + '月' + p.birthD + '日');
  const roc = p.birthRY || rocYear(p.birthY);
  return base + (roc ? '（民國 ' + roc + ' 年）' : '');
}
function joinText(p) {
  if (!p.joinY && !p.joinM && !p.joinD) return '';
  const base = p.joinY ? (p.joinY + '-' + pad2(p.joinM) + '-' + pad2(p.joinD)) : (p.joinM + '月' + p.joinD + '日');
  const roc = p.joinRY || rocYear(p.joinY);
  return base + (roc ? '（民國 ' + roc + ' 年）' : '');
}
function westYear(westStr, rocStr) {
  const w = parseInt(westStr, 10);
  if (!isNaN(w)) return w;
  const r = parseInt(rocStr, 10);
  return isNaN(r) ? NaN : r + 1911;
}
function ageText(p, now) {
  now = now || new Date();
  const y = westYear(p.birthY, p.birthRY), m = Number(p.birthM), d = Number(p.birthD);
  if (isNaN(y) || !m || !d) return '';
  let age = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) age--;
  return age >= 0 && age < 120 ? age + ' 歲' : '';
}
function serviceText(p, now) {
  now = now || new Date();
  const y = westYear(p.joinY, p.joinRY), m = Number(p.joinM), d = Number(p.joinD);
  if (isNaN(y) || !m) return '';
  let months = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
  if (d && now.getDate() < d) months--;
  if (months < 0) return '';
  const yy = Math.floor(months / 12), mm = months % 12;
  return (yy ? yy + ' 年 ' : '') + mm + ' 個月';
}

function copyText(p, realId) {
  const L = ['👤 ' + p.name];
  if (p.rank) L.push(p.rank);
  if (realId) L.push('ID：' + realId);
  const ul = unitLabel(p.unit);
  if (ul) L.push('單位：' + ul);
  if (p.skill) L.push('專長：' + p.skill);
  if (p.yearClass) L.push('年班：' + p.yearClass);
  const b = birthText(p);
  if (b) { L.push('生日：' + b); const z = zodiac(p.birthM, p.birthD); if (z) L.push(z); }
  if (p.blood) L.push('血型：' + p.blood);
  const ph = firstPhone(p.phone);
  if (ph) L.push('電話：' + ph);
  const j = joinText(p);
  if (j) L.push('入伍：' + j);
  return L.join('\n');
}
function listText(view, title) {
  const L = [title + '（共 ' + view.length + ' 人）'];
  view.forEach(function (p, i) {
    L.push((i + 1) + '. ' + p.name + (p.rank ? '　' + p.rank : '') + (p.unit ? '　' + unitLabel(p.unit) : ''));
  });
  return L.join('\n');
}
function vcardText(p) {
  const L = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + p.name, 'N:' + p.name + ';;;;'];
  const ul = unitLabel(p.unit);
  if (ul) L.push('ORG:' + ul);
  if (p.rank) L.push('TITLE:' + p.rank);
  const ph = dialPhone(p.phone);
  if (ph) L.push('TEL;TYPE=CELL:' + ph);
  const y = westYear(p.birthY, p.birthRY);
  if (!isNaN(y) && p.birthM && p.birthD) L.push('BDAY:' + y + '-' + pad2(p.birthM) + '-' + pad2(p.birthD));
  L.push('END:VCARD');
  return L.join('\r\n');
}
function unitSel(u) {
  if (!u) return '';
  if (FACTORY_UNITS.indexOf(u) !== -1) return 'g:廠辦/生品';
  for (let i = 0; i < UNITS.length; i++) {
    if (UNITS[i].name === u) return 'g:' + u;
    if (UNITS[i].children.indexOf(u) !== -1) return 'u:' + u;
  }
  return '';
}
function catCounts(list) {
  const c = [0, 0, 0, 0, 0];
  for (let i = 0; i < list.length; i++) c[rankInfo(list[i].rank).cat]++;
  return c;
}
function dutyIcons(d) {

}

function ageOf(p, now) {
  const y = westYear(p.birthY, p.birthRY), m = Number(p.birthM), d = Number(p.birthD);
  if (isNaN(y)) return null;
  let a = now.getFullYear() - y;
  if (m && d && (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d))) a--;
  return a >= 15 && a < 90 ? a : null;
}
function serviceYears(p, now) {
  const y = westYear(p.joinY, p.joinRY);
  if (isNaN(y)) return null;
  const m = Number(p.joinM) || 1, d = Number(p.joinD) || 1;
  const v = (startOfDay(now) - new Date(y, m - 1, d)) / (365.2425 * 86400000);
  return v >= 0 && v < 50 ? v : null;
}
// 分組：fn 取數值，step 每格寬度
function histogram(list, fn, step) {
  const vals = [];
  list.forEach(function (p) { const v = fn(p); if (v !== null && v !== undefined) vals.push({ p: p, v: v }); });
  if (!vals.length) return { bins: [], missing: list.length };
  let lo = Infinity, hi = -Infinity;
  vals.forEach(function (x) { const b = Math.floor(x.v / step) * step; if (b < lo) lo = b; if (b > hi) hi = b; });
  const bins = [];
  for (let b = lo; b <= hi; b += step) bins.push({ lo: b, hi: b + step, items: [] });
  vals.forEach(function (x) { bins[(Math.floor(x.v / step) * step - lo) / step].items.push(x.p); });
  return { bins: bins, missing: list.length - vals.length };
}
function joinsByYear(list) {
  const map = {};
  list.forEach(function (p) { const y = westYear(p.joinY, p.joinRY); if (!isNaN(y)) (map[y] = map[y] || []).push(p); });
  const ys = Object.keys(map).map(Number);
  if (!ys.length) return [];
  const out = [];
  for (let y = Math.min.apply(null, ys); y <= Math.max.apply(null, ys); y++) out.push({ year: y, items: map[y] || [] });
  return out;
}
function milestones(list, now, marks) {
  marks = marks || [10, 15, 20, 25, 30];
  const out = [];
  list.forEach(function (p) {
    const y = westYear(p.joinY, p.joinRY);
    if (isNaN(y)) return;
    const n = now.getFullYear() - y;
    if (marks.indexOf(n) !== -1) out.push({ p: p, n: n, m: Number(p.joinM) || 0, d: Number(p.joinD) || 0 });
  });
  out.sort(function (a, b) { return b.n - a.n || (a.m * 100 + a.d) - (b.m * 100 + b.d); });
  return out;
}
function average(arr) { return arr.length ? arr.reduce(function (s, x) { return s + x; }, 0) / arr.length : null; }

// ---------- 小工具 ----------
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hl(text, q) {
  text = String(text || ''); const k = String(q || '').trim();
  const i = k ? text.toLowerCase().indexOf(k.toLowerCase()) : -1;
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + k.length)) + '</mark>' + esc(text.slice(i + k.length));
}
function img(src, cls) { return src ? '<img' + (cls ? ' class="' + cls + '"' : '') + ' src="' + src + '" alt="">' : ''; }

  clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('on'); }, 1700);
}

}
function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(function (b) {
    const end = Number(b.getAttribute('data-count')); if (!end) return;
    const t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / 600); b.textContent = Math.round(end * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  });
}

function copyToClipboard(text) {

function regSet(key, label, list) { sets[key] = { label: label, ids: list.map(function (p) { return p._i; }) }; return key; }

function vbars(bins, labelFn, keyBase, titleFn, opts) {

  let h = '<div class="vb">' + bins.map(function (b, i) {

  else if (act === 'year') { if (v) { flt.year = v; shown = PAGE; renderSearch(); window.scrollTo(0, 0); buzz(); } }
  else if (act === 'filter') { let extra = null; try { extra = JSON.parse(el.getAttribute('data-extra') || 'null'); } catch (x) {} applyFilter(el.getAttribute('data-k'), v, extra); }
  else if (act === 'set') { if (sets[v] && sets[v].ids.length) applyFilter('set', v); }
  else if (act === 'grp') { const c = Number(el.getAttribute('data-c')); collapsed[c] = !collapsed[c]; renderResults(); }
  else if (act === 'tab') setTab(v);
  else if (act === 'bmode') { browseMode = v; renderBrowse(); buzz(6); }
  else if (act === 'scope') { statScope = v; renderStats(); buzz(6); }
  else if (act === 'try') { $('q').value = el.getAttribute('data-t'); flt.q = $('q').value; shown = PAGE; renderSearch(); }
  else if (act === 'id') toggleId(el);
  else if (act === 'fav' && cur) {
    const k = favs.indexOf(cur.name);
    if (k === -1) favs.unshift(cur.name); else favs.splice(k, 1);
    favs = favs.slice(0, 30); saveFavs(); renderSheet();
    const on = isFav(cur); toast(on ? '已加入常用，首頁可看到' : '已移出常用', on ? 'ok' : ''); buzz(on ? 15 : 8);
    if (tab === 'search' && hasFilter()) renderResults();
  }
  else if (act === 'copy' && cur) copyToClipboard(copyText(cur, idState[cur.row])).then(function () { buzz(); flash(el, '已複製'); }, function () { toast('複製失敗', 'err'); });
  else if (act === 'vcf' && cur) {
    const url = URL.createObjectURL(new Blob([vcardText(cur)], { type: 'text/vcard;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = cur.name + '.vcf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000); buzz(); flash(el, '已產生', IMG.b.contact);
  }
});
$('reloadBtn').addEventListener('click', function () {
  const b = $('reloadBtn'); if (b.classList.contains('spin')) return;
  b.classList.add('spin'); buzz();
  loadData().then(function () { b.classList.remove('spin'); if (people.length) toast('資料已更新', 'ok'); });
});
$('logoutBtn').addEventListener('click', async function () { try { await api({ action: 'logout', token: token }); } catch (e) {} logoutLocal(''); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && cur) closeSheet();
  if (e.key === '/' && token && document.activeElement !== $('q') && document.activeElement !== $('pw')) { e.preventDefault(); closeSheet(); setTab('search'); $('q').focus(); }
});
$('loginBtn').addEventListener('click', login);
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

if (DEMO) setMsg('預覽模式：任意密碼即可進入，資料皆為虛構', 'info');
if (token) loadData(); else showApp(false);
</script>
</body>
