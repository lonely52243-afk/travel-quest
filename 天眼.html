<title>誰誰誰</title>
<style>
  /* ================= 誰誰誰｜Playful Pop UI 設計系統 ================= */
  :root {
    /* 品牌色 */
    --brand:#10BFC8; --brand-ink:#087880; --brand-soft:#E3F8F9; --brand-mid:#9EE3E7;
    --ink:#183447; --cream:#FFFDF7; --pink:#FF739B; --pink-ink:#C93A64; --pink-soft:#FFE8EF;
    --yellow:#FFD65A; --yellow-soft:#FFF5D1; --green:#1E9E5A; --red:#E5484D;
    --sub:#5B7182; --dim:#8A9AA6; --card:#FFFFFF; --card2:#FFF9EC; --card3:#F4EFE3;
    --line:#EEE6D3; --line2:#E2D7BF;
    /* 形狀與層次 */
    --r:18px; --rb:14px; --stroke:2px solid var(--ink);
    --pop:0 3px 0 var(--ink); --pop-s:0 2px 0 var(--ink);
    --shadow:0 4px 0 rgba(24,52,71,.06), 0 6px 18px rgba(24,52,71,.06);
    --ease:180ms ease; --tb:60px;
    --sb: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-top, 0px);
    /* 舊元件沿用的名稱 → 新色 */
    --bg:var(--cream); --txt:var(--ink); --acc:var(--brand-ink); --acc-a:var(--brand-soft); --acc-b:var(--brand-mid);
    --amber:var(--pink-ink); --amber-a:var(--pink-soft); --ok:var(--green); --err:var(--red);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--cream); color:var(--ink); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:16px; line-height:1.5; min-height:100vh; min-height:100dvh; overflow-x:hidden; }
  button { font-family:inherit; color:inherit; font-size:inherit; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
  input:focus-visible { outline:none; }
  .hidden { display:none !important; }
  mark { background:var(--yellow); color:inherit; border-radius:3px; padding:0 1px; }
  .num { font-variant-numeric:tabular-nums; }
  svg.ico { width:20px; height:20px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  .zs { display:inline-block; font-size:18px; line-height:1; color:var(--brand-ink); width:22px; text-align:center; }
  img { -webkit-user-drag:none; }

  /* ===== 共用元件：按鈕 ===== */
  .btn-pop { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 18px; border:var(--stroke); border-radius:var(--rb); background:var(--yellow); color:var(--ink); font-weight:800; box-shadow:var(--pop); cursor:pointer; }
  .btn-pop:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .btn-pop:disabled { opacity:.55; }

  /* ===== 登入 ===== */
  #login { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:calc(12px + var(--st)) 18px calc(14px + var(--sb));
    background:radial-gradient(120% 60% at 50% 0%, var(--brand-soft) 0 55%, transparent 56%), var(--cream); }
  .lcard { width:100%; max-width:400px; flex:1; display:flex; flex-direction:column; }
  .lhero { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 0; }
  .lhero img { display:block; width:auto; max-width:min(82vw, 330px); height:auto; max-height:min(46dvh, 360px); object-fit:contain; filter:drop-shadow(0 6px 0 rgba(24,52,71,.08)); animation:float 4s ease-in-out infinite; }
  .lslogan { margin:4px 0 14px; text-align:center; font-size:clamp(16px, 4.4vw, 19px); font-weight:800; }
  .lslogan span { background:linear-gradient(transparent 62%, var(--yellow) 62%); padding:0 2px; }
  .lform { background:var(--card); border:var(--stroke); border-radius:22px; padding:16px; box-shadow:var(--pop); }
  .pwbox { position:relative; }
  .pwbox > svg.ico { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--sub); }
  .field { width:100%; height:54px; padding:0 52px 0 44px; font-size:17px; color:var(--ink); border-radius:var(--rb); border:2px solid var(--line2); background:var(--cream); outline:none; transition:border-color var(--ease), box-shadow var(--ease); }
  .field:focus { border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  .eye { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:46px; height:46px; display:grid; place-items:center; border:0; background:none; color:var(--sub); cursor:pointer; border-radius:12px; }
  .eye:active { background:var(--card3); }
  .btn { width:100%; margin-top:12px; font-size:18px; letter-spacing:.3em; padding-left:calc(18px + .3em); }
  .lmsg { min-height:20px; margin-top:10px; font-size:14px; font-weight:700; color:var(--red); text-align:center; }
  .lmsg.note { color:var(--brand-ink); }
  .lmsg img { display:block; width:110px; height:auto; margin:0 auto 4px; }
  .lnote { margin-top:10px; font-size:12px; line-height:1.7; color:var(--sub); text-align:center; }
  .lnote b { color:var(--ink); }
  @media (max-height:640px) { .lhero img { max-height:30dvh; } .lslogan { margin:0 0 8px; } }

  /* ===== 頁首 ===== */
  #app { padding-bottom:calc(76px + var(--sb)); }
  .top { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:calc(8px + var(--st)) 10px 8px 14px; background:var(--brand); color:var(--ink); }
  .top .logo { width:36px; height:36px; border-radius:11px; border:var(--stroke); box-shadow:var(--pop-s); }
  .top .ttl { flex:1; min-width:0; }
  .top b { display:block; font-size:18px; font-weight:900; letter-spacing:.06em; line-height:1.2; }
  .top small { display:block; font-size:12px; font-weight:600; color:#0E4E57; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top small i { display:inline-block; width:8px; height:8px; border-radius:50%; background:#fff; border:2px solid var(--ink); margin-right:5px; vertical-align:0; }
  .ibtn { width:44px; height:44px; display:grid; place-items:center; padding:0; border:0; border-radius:12px; background:rgba(255,255,255,.28); color:var(--ink); cursor:pointer; }
  .ibtn:active { background:rgba(255,255,255,.5); }
  .ibtn svg.ico { width:22px; height:22px; stroke-width:2.3; }
  .wrap { max-width:720px; margin:0 auto; padding:0 14px 16px; }

  /* ===== 頁面標題（角色插畫只放一處） ===== */
  .vhero { display:flex; align-items:center; gap:10px; margin:12px 0 4px; padding:12px 12px 12px 16px; border-radius:var(--r); background:var(--brand-soft); border:2px solid var(--brand-mid); overflow:hidden; }
  .vhero .vt { flex:1; min-width:0; }
  .vhero h2 { margin:0; font-size:21px; font-weight:900; }
  .vhero p { margin:2px 0 0; font-size:13.5px; color:var(--sub); }
  .vhero img { flex:0 0 auto; width:clamp(78px, 24vw, 104px); height:auto; margin:-6px -4px -14px 0; }
  .vhero.pink { background:var(--pink-soft); border-color:#FFC3D3; }
  .vhero.yel { background:var(--yellow-soft); border-color:#F7DF92; }

  /* ===== 搜尋 ===== */
  .sbar { position:sticky; top:var(--tb); z-index:25; margin:0 -14px; padding:4px 14px 12px; background:var(--brand); border-radius:0 0 24px 24px; }
  .sbox { position:relative; }
  .sbox > svg { position:absolute; left:15px; top:50%; transform:translateY(-50%); width:21px; height:21px; stroke:var(--ink); fill:none; stroke-width:2.4; stroke-linecap:round; pointer-events:none; z-index:2; }
  .sbox input { width:100%; height:52px; padding:0 46px; font-size:17px; color:var(--ink); border-radius:16px; border:var(--stroke); background:#fff; outline:none; box-shadow:var(--pop); }
  .sbox input:focus { box-shadow:var(--pop), 0 0 0 4px rgba(255,255,255,.55); }
  .sbox input::placeholder { color:var(--dim); }
  .clr { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:0; background:var(--card3); color:var(--ink); font-size:14px; font-weight:800; cursor:pointer; }
  .sug { position:absolute; left:0; right:0; top:calc(100% + 8px); background:#fff; border:var(--stroke); border-radius:16px; box-shadow:0 14px 30px rgba(24,52,71,.2); max-height:60vh; overflow-y:auto; }
  .sug-h { padding:8px 14px 2px; font-size:12px; font-weight:800; color:var(--brand-ink); letter-spacing:.1em; }
  .sug-i { display:flex; align-items:center; gap:11px; min-height:54px; padding:8px 14px; cursor:pointer; }
  .sug-i + .sug-i { border-top:1px solid var(--line); }
  .sug-i.on, .sug-i:active { background:var(--brand-soft); }
  .sug-i .m { flex:1; min-width:0; }
  .sug-i b { display:block; font-size:16px; font-weight:800; }
  .sug-i small { display:block; font-size:13px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sug-i em { font-style:normal; font-size:12px; font-weight:800; color:var(--ink); background:var(--yellow); padding:2px 9px; border-radius:10px; }
  .quick { display:flex; gap:7px; overflow-x:auto; padding:10px 0 0; scrollbar-width:none; }
  .quick::-webkit-scrollbar { display:none; }
  .qc { flex:0 0 auto; height:38px; padding:0 14px; border-radius:19px; border:2px solid rgba(24,52,71,.18); background:rgba(255,255,255,.9); font-size:14px; font-weight:700; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .qc i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:0; border:1.5px solid var(--ink); }
  .qc.on { background:var(--yellow); border-color:var(--ink); box-shadow:var(--pop-s); }
  #pzone .qc { border-color:var(--line2); background:#fff; }
  #pzone .qc.on { background:var(--yellow); border-color:var(--ink); }
  .fchips { display:flex; flex-wrap:wrap; gap:6px; padding-top:8px; }
  .fchips:empty { display:none; }
  .fchip { display:inline-flex; align-items:center; gap:4px; height:34px; padding:0 4px 0 12px; border-radius:17px; background:#fff; border:2px solid var(--ink); font-size:14px; font-weight:700; }
  .fchip button { width:28px; height:28px; border-radius:50%; border:0; background:var(--card3); font-size:11px; cursor:pointer; padding:0; }

  /* ===== 卡片 ===== */
  .card { margin-top:14px; padding:16px; border-radius:var(--r); background:var(--card); border:1.5px solid var(--line); box-shadow:var(--shadow); }
  .card > h3 { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:16px; font-weight:900; }
  .card > h3 svg.ico { color:var(--brand-ink); }
  .card > h3 img { width:30px; height:30px; object-fit:contain; }
  .card > h3 em { margin-left:auto; font-style:normal; font-size:13px; font-weight:800; color:var(--ink); background:var(--yellow); padding:2px 10px; border-radius:12px; }
  .card > h3 small { margin-left:auto; font-weight:500; color:var(--dim); font-size:12.5px; }
  .card.gold { background:linear-gradient(180deg, var(--pink-soft), #fff 70%); border-color:#FFC3D3; }
  .card.gold > h3 em { background:var(--pink); color:#fff; }

  /* ===== 首頁 ===== */
  .hero { display:flex; align-items:center; gap:4px; margin-top:14px; }
  .bubble { position:relative; flex:1; padding:12px 14px; border:var(--stroke); border-radius:18px; background:#fff; box-shadow:var(--pop-s); }
  .bubble::after { content:""; position:absolute; right:-10px; top:50%; width:16px; height:16px; background:#fff; border:var(--stroke); border-left:0; border-bottom:0; transform:translateY(-50%) rotate(45deg); }
  .bubble b { display:block; font-size:17px; font-weight:900; }
  .bubble span { font-size:13.5px; color:var(--sub); }
  .hero img { flex:0 0 auto; width:clamp(86px, 26vw, 118px); height:auto; margin-right:-6px; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .kpi { padding:10px 2px 8px; border-radius:16px; background:#fff; border:1.5px solid var(--line); text-align:center; cursor:pointer; box-shadow:var(--shadow); }
  .kpi svg.ico { display:block; margin:0 auto 2px; color:var(--brand-ink); }
  .kpi b { display:block; font-size:23px; font-weight:900; line-height:1.15; }
  .kpi span { font-size:12px; font-weight:600; color:var(--sub); }
  .kpi.hot { background:var(--pink-soft); border-color:#FFC3D3; }
  .kpi.hot b { color:var(--pink-ink); }
  .feats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .feat { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 4px 10px; border:var(--stroke); border-radius:18px; background:#fff; box-shadow:var(--pop); font-size:14px; font-weight:800; cursor:pointer; }
  .feat img { width:46px; height:46px; }
  .feat:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .pills { display:flex; flex-wrap:wrap; gap:7px; }
  .pill { min-height:40px; padding:0 14px; border-radius:20px; background:var(--card2); border:1.5px solid var(--line2); font-size:15px; font-weight:700; cursor:pointer; }
  .pill small { color:var(--sub); margin-left:6px; font-size:12.5px; font-weight:500; }
  .pill.hot { border-color:var(--pink); background:#fff; }
  .lrow { display:flex; align-items:center; gap:10px; width:100%; min-height:50px; padding:6px 2px; border:0; border-top:1.5px dashed var(--line); background:none; cursor:pointer; text-align:left; }
  .lrow:first-of-type { border-top:0; }
  .lrow .d { flex:0 0 86px; color:var(--sub); font-size:14px; font-weight:600; }
  .lrow .n { flex:1; min-width:0; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lrow .n small { color:var(--sub); font-weight:500; margin-left:6px; font-size:13px; }
  .lrow.past { color:var(--dim); }
  .tag { display:inline-flex; align-items:center; justify-content:center; min-width:64px; height:28px; padding:0 10px; border-radius:14px; font-size:13px; font-weight:800; background:var(--card3); color:var(--sub); white-space:nowrap; }
  .tag.today { background:var(--pink); color:#fff; border:2px solid var(--ink); }
  .tag.soon { background:var(--pink-soft); color:var(--pink-ink); }
  .more { display:block; width:100%; min-height:46px; margin-top:10px; background:var(--brand-soft); border:0; border-radius:var(--rb); color:var(--brand-ink); font-size:14.5px; font-weight:800; cursor:pointer; }
  .tips { color:var(--sub); font-size:14px; line-height:2.3; }
  .tips code { font-family:inherit; background:var(--yellow-soft); border:1.5px solid #F2D47A; padding:3px 10px; border-radius:9px; color:var(--ink); font-weight:700; font-size:13.5px; margin-right:4px; cursor:pointer; }
  .cbar { display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--card3); }
  .cbar i { display:block; height:100%; }

  /* ===== 搜尋結果 ===== */
  .rbar { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 2px 6px; font-size:14.5px; font-weight:800; }
  .rbar .b { display:flex; gap:6px; }
  .rbar button { display:inline-flex; align-items:center; gap:5px; min-height:40px; padding:0 12px; background:#fff; border:2px solid var(--ink); border-radius:12px; font-size:13.5px; font-weight:800; cursor:pointer; box-shadow:var(--pop-s); }
  .rbar button svg.ico { width:17px; height:17px; }
  .cmenu { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px; padding:12px; border-radius:var(--r); background:var(--yellow-soft); border:var(--stroke); }
  .cmenu p { width:100%; margin:0 0 2px; font-size:13.5px; font-weight:800; }
  .cmenu button { flex:1 1 auto; min-height:44px; padding:0 10px; border:2px solid var(--ink); border-radius:12px; background:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  .legend { display:flex; flex-wrap:wrap; gap:6px; padding:2px 0 4px; }
  .lg { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:17px; font-size:13.5px; font-weight:700; cursor:pointer; border:1.5px solid var(--line2); background:#fff; }
  .lg::before { content:""; width:10px; height:10px; border-radius:50%; background:var(--lc); border:1.5px solid var(--ink); }
  .lg small { color:var(--sub); }
  .ynav { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:7px; margin:4px 0 8px; }
  .ynav button, .ynav div { min-height:56px; padding:6px 4px; border-radius:14px; border:2px solid var(--ink); background:#fff; text-align:center; font-size:14px; font-weight:800; cursor:pointer; line-height:1.3; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:var(--pop-s); }
  .ynav div { background:var(--yellow); cursor:default; font-size:15px; }
  .ynav small { display:block; font-size:12px; color:var(--sub); font-weight:500; }
  .ynav span { display:inline-flex; align-items:center; gap:3px; }
  .ynav svg.ico { width:16px; height:16px; }
  .ynav button:disabled { opacity:.35; box-shadow:none; }
  .grp { display:flex; align-items:center; gap:8px; min-height:42px; margin:12px 2px 4px; font-size:15px; font-weight:900; cursor:pointer; user-select:none; }
  .grp.first { margin-top:2px; }
  .grp i { width:12px; height:12px; border-radius:50%; background:var(--gc); border:2px solid var(--ink); }
  .grp small { color:var(--sub); font-weight:600; font-size:13px; }
  .grp::after { content:""; flex:1; order:5; height:2px; border-radius:1px; background:var(--line); }
  .grp .car { order:9; color:var(--dim); font-size:11px; transition:transform var(--ease); }
  .grp.off .car { transform:rotate(-90deg); }
  .row { display:flex; align-items:center; gap:12px; min-height:68px; padding:10px 12px; margin-bottom:8px; border-radius:18px; background:#fff; border:1.5px solid var(--line); box-shadow:var(--shadow); cursor:pointer; }
  .av { flex:0 0 auto; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:18px; font-weight:900; color:var(--ink); background:#fff; border:2.5px solid var(--gc); box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--gc) 18%, #fff); }
  .rm { flex:1; min-width:0; }
  .rn { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:17.5px; font-weight:900; }
  .rk { font-size:12.5px; font-weight:800; padding:1px 8px; border-radius:10px; color:var(--ink); background:color-mix(in srgb, var(--gc) 16%, #fff); }
  .bt { font-size:12px; font-weight:800; padding:1px 8px; border-radius:10px; background:var(--pink); color:#fff; }
  .star { color:#E8A400; font-size:15px; }
  .rs { margin-top:2px; font-size:13.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chev { color:var(--dim); font-size:22px; font-weight:700; }
  .empty { text-align:center; padding:28px 10px 40px; color:var(--sub); font-weight:600; }
  .empty img { width:min(180px, 50vw); height:auto; margin-bottom:4px; }
  .empty b { display:block; font-size:17px; font-weight:900; color:var(--ink); }
  .loading { text-align:center; padding:40px 0; color:var(--sub); font-weight:700; }
  .loading img { display:block; width:150px; height:auto; margin:0 auto 8px; animation:bob 1s ease-in-out infinite; }
  .pager { text-align:center; margin:8px 0 12px; }
  .pager button { min-height:46px; padding:0 28px; border-radius:23px; border:var(--stroke); background:#fff; font-weight:800; cursor:pointer; box-shadow:var(--pop-s); }

  /* ===== 磚塊與分段 ===== */
  .seg { display:flex; padding:4px; border-radius:16px; background:var(--card3); margin:12px 0 10px; gap:4px; }
  .seg button { flex:1; min-height:42px; padding:0 4px; border:2px solid transparent; border-radius:12px; background:none; color:var(--sub); font-size:15px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .seg button.on { background:#fff; color:var(--ink); border-color:var(--ink); box-shadow:var(--pop-s); }
  .seg.sm { overflow-x:auto; scrollbar-width:none; }
  .seg.sm::-webkit-scrollbar { display:none; }
  .seg.sm button { flex:1 0 auto; padding:0 10px; font-size:13.5px; }
  .sect { display:flex; align-items:center; gap:8px; margin:18px 2px 9px; font-size:15px; font-weight:900; }
  .sect small { font-weight:600; color:var(--sub); }
  .sect img { width:28px; height:28px; object-fit:contain; }
  .sect::after { content:""; flex:1; height:2px; border-radius:1px; background:var(--line); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .tiles.c4 { grid-template-columns:repeat(4,1fr); }
  .tiles.c2 { grid-template-columns:repeat(2,1fr); }
  .tile { min-height:66px; padding:10px 6px; border-radius:16px; border:1.5px solid var(--line); background:#fff; text-align:center; cursor:pointer; box-shadow:var(--shadow); min-width:0; }
  .tile .zs { display:block; width:auto; font-size:22px; margin-bottom:2px; }
  .tile svg.ico { display:block; margin:0 auto 2px; color:var(--brand-ink); }
  .tile b { display:block; font-size:16px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile span { display:block; font-size:13px; font-weight:600; color:var(--sub); }
  .tile em { display:block; font-style:normal; font-size:11.5px; color:var(--dim); }
  .tile .cbar { margin:8px 6px 0; }
  .tile.now { border:var(--stroke); background:var(--pink-soft); box-shadow:var(--pop-s); }
  .tile.now b { color:var(--pink-ink); font-size:20px; }
  .tile.zero { opacity:.45; }
  .btnrow { display:flex; gap:8px; margin-top:12px; }
  .btnrow button { flex:1; min-height:48px; padding:0 8px; border:var(--stroke); border-radius:var(--rb); background:var(--yellow); font-size:14px; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; box-shadow:var(--pop-s); }

  /* ===== 統計 ===== */
  .skpi { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .skpi div { padding:10px 2px; border-radius:16px; background:#fff; border:1.5px solid var(--line); text-align:center; box-shadow:var(--shadow); }
  .skpi b { display:block; font-size:21px; font-weight:900; }
  .skpi b small { font-size:12px; font-weight:600; color:var(--sub); margin-left:1px; }
  .skpi span { font-size:12px; font-weight:600; color:var(--sub); }
  .ch-note { margin:8px 0 0; font-size:13px; color:var(--sub); }
  .hb { display:grid; grid-template-columns:96px 1fr 42px; align-items:center; gap:9px; width:100%; min-height:44px; padding:4px 0; border:0; background:none; cursor:pointer; text-align:left; }
  .hb + .hb { border-top:1.5px dashed var(--line); }
  .hb .l { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .hb .t { display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--card3); border:1.5px solid var(--ink); }
  .hb .t i { display:block; height:100%; }
  .hb .v { font-size:14px; font-weight:800; text-align:right; }
  .hb .v small { display:block; font-size:11px; color:var(--dim); font-weight:500; }
  .hb.top .l { color:var(--pink-ink); }
  .vb { display:flex; align-items:flex-end; gap:4px; height:150px; padding-top:18px; }
  .vb button { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; padding:0; border:0; background:none; cursor:pointer; }
  .vb button > small { display:block; text-align:center; font-size:11.5px; font-weight:700; color:var(--sub); margin-bottom:3px; }
  .vb .st { display:flex; flex-direction:column-reverse; border-radius:6px 6px 0 0; overflow:hidden; min-height:3px; border:1.5px solid var(--ink); border-bottom:0; }
  .vb .st i { display:block; width:100%; }
  .vl { display:flex; gap:4px; margin-top:0; padding-top:5px; border-top:2px solid var(--ink); }
  .vl span { flex:1; min-width:0; text-align:center; font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; }
  .lc svg { display:block; width:100%; height:auto; }
  .lc .dot { cursor:pointer; }
  .clegend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:12.5px; font-weight:600; color:var(--sub); }
  .clegend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; border:1.5px solid var(--ink); }
  .mile { display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:4px 2px; border:0; border-top:1.5px dashed var(--line); background:none; cursor:pointer; text-align:left; }
  .mile b { flex:1; font-weight:800; }
  .mile b small { color:var(--sub); font-weight:500; margin-left:6px; font-size:13px; }
  .mile .tag { background:var(--brand-soft); color:var(--brand-ink); }
  .msub { display:flex; align-items:center; gap:6px; margin:14px 0 2px; font-size:14px; font-weight:800; }
  .chk { display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:4px 2px; border:0; border-top:1.5px dashed var(--line); background:none; text-align:left; cursor:pointer; font-size:15px; }
  .chk:first-of-type { border-top:0; }
  .chk b { flex:1; font-weight:700; }
  .chk .tag.warn { background:var(--pink-soft); color:var(--pink-ink); }
  .okline { display:flex; align-items:center; gap:10px; color:var(--green); font-size:15px; font-weight:800; }
  .okline img { width:70px; height:auto; }

  /* ===== 電話名單（多人選取） ===== */
  #pzone .sbox input { box-shadow:none; border-color:var(--line2); border-width:2px; }
  #pzone .sbox input:focus { border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  #pzone .ch-note { margin:8px 2px 8px; }

  .prow + .prow { border-top:1.5px dashed var(--line); }
  .prow .ck { flex:0 0 auto; width:24px; height:24px; border-radius:7px; border:2px solid var(--ink); background:#fff; display:grid; place-items:center; }
  .prow.on { background:var(--yellow-soft); }
  .prow.on .ck { background:var(--brand); }
  .prow.on .ck::after { content:""; width:6px; height:11px; border:solid var(--ink); border-width:0 3px 3px 0; transform:rotate(45deg) translate(-1px,-1px); }
  .prow.no { cursor:default; color:var(--dim); }
  .prow.no .ck { opacity:.3; }

  .prow .pp { font-size:15px; font-weight:600; color:var(--sub); white-space:nowrap; }
  .pcp { flex:0 0 44px; width:44px; height:44px; display:grid; place-items:center; border:0; background:none; color:var(--brand-ink); cursor:pointer; border-radius:12px; }
  .pcp:active { background:var(--brand-soft); }
  .pbar { position:fixed; left:10px; right:10px; bottom:calc(74px + var(--sb)); z-index:39; display:flex; align-items:center; gap:6px; padding:8px 8px 8px 14px; background:#fff; border:var(--stroke); border-radius:18px; box-shadow:var(--pop), 0 10px 24px rgba(24,52,71,.15); max-width:700px; margin:0 auto; }
  .pbar span { flex:1; min-width:0; font-size:14px; font-weight:800; white-space:nowrap; }
  .pbar button { min-height:44px; padding:0 11px; border:2px solid var(--ink); border-radius:12px; background:#fff; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .pbar button.pri { background:var(--yellow); font-weight:900; box-shadow:var(--pop-s); }

  /* ===== 設定 ===== */
  .srow { display:flex; align-items:center; gap:12px; min-height:52px; padding:6px 0; }
  .srow + .srow { border-top:1.5px dashed var(--line); }
  .srow > svg.ico { color:var(--brand-ink); }
  .srow .sl { flex:1; min-width:0; }
  .srow .sl b { display:block; font-size:15px; font-weight:800; }
  .srow .sl small { display:block; font-size:13px; color:var(--sub); }
  .sbtn { min-height:42px; padding:0 14px; border:2px solid var(--ink); border-radius:12px; background:#fff; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; box-shadow:var(--pop-s); }
  .sbtn.warn { background:var(--pink-soft); }
  .logout-big { width:100%; margin-top:16px; background:#fff; }
  .about { text-align:center; margin-top:18px; color:var(--sub); font-size:13px; }
  .about img { width:120px; height:auto; display:block; margin:0 auto 4px; }

  /* ===== 人員詳情（底部彈出） ===== */
  .scrim { position:fixed; inset:0; z-index:70; background:rgba(24,52,71,.45); opacity:0; transition:opacity .2s; }
  .scrim.on { opacity:1; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:71; max-height:92vh; max-height:92dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--cream); border-radius:24px 24px 0 0; border-top:var(--stroke);
    padding:0 14px calc(16px + var(--sb)); transform:translateY(100%); transition:transform .22s cubic-bezier(.2,.8,.2,1); }
  .sheet.on { transform:none; }
  @media (min-width:740px) { .sheet { left:50%; right:auto; width:700px; margin-left:-350px; border:var(--stroke); border-bottom:0; } }
  .grab { position:sticky; top:0; z-index:2; padding:9px 0 5px; background:var(--cream); }
  .grab::before { content:""; display:block; width:44px; height:5px; border-radius:3px; background:var(--ink); opacity:.25; margin:0 auto; }
  .sh-head { display:flex; align-items:center; gap:12px; padding:2px 0 10px; }
  .sh-head .av { width:58px; height:58px; font-size:24px; border-width:3px; }
  .sh-head .m { flex:1; min-width:0; }
  .sh-head h3 { margin:0; font-size:23px; font-weight:900; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sh-head h3 .rk { font-size:13.5px; }
  .sh-head p { margin:2px 0 0; color:var(--sub); font-size:14px; font-weight:600; }
  .sh-x { width:44px; height:44px; border-radius:50%; border:2px solid var(--ink); background:#fff; font-size:15px; font-weight:800; cursor:pointer; align-self:flex-start; }
  .snav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin:0 0 10px; }
  .snav button { min-height:42px; border:2px solid var(--ink); background:#fff; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; }
  .snav button:disabled { opacity:.3; }
  .snav span { font-size:13px; font-weight:700; color:var(--sub); }
  .acts { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .ac { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:68px; padding:6px 2px; border-radius:16px; border:2px solid var(--ink); background:#fff; font-size:13px; font-weight:800; color:var(--ink); text-decoration:none; cursor:pointer; box-shadow:var(--pop-s); min-width:0; white-space:nowrap; }
  .ac svg.ico { width:23px; height:23px; color:var(--brand-ink); }
  .ac.pri { background:var(--brand); }
  .ac.pri svg.ico { color:var(--ink); }
  .ac.on { background:var(--yellow); }
  .ac.on svg.ico { color:var(--ink); fill:var(--ink); }
  .ac.done { background:#DDF6E8; }
  .ac.off { opacity:.35; pointer-events:none; box-shadow:none; }
  .ac:active, .snav button:active, .sbtn:active, .rbar button:active, .btnrow button:active, .pbar button:active, .cmenu button:active, .ynav button:active { transform:translateY(2px); box-shadow:none; }
  .sec-hd { display:flex; align-items:flex-end; justify-content:space-between; margin-top:14px; }
  .tabh { display:inline-flex; align-items:center; gap:7px; padding:6px 14px 5px 12px; background:var(--brand); color:var(--ink); font-size:14.5px; font-weight:900; border-radius:12px 12px 0 0; border:var(--stroke); border-bottom:0; }
  .tabh svg.ico { width:19px; height:19px; }
  .sec-link { min-height:38px; border:0; background:none; color:var(--brand-ink); font-size:14px; font-weight:800; cursor:pointer; padding:0 2px; }
  .sec { background:#fff; border:var(--stroke); border-radius:0 18px 18px 18px; padding:2px 14px; }
  .g3 { display:grid; grid-template-columns:1.25fr 1fr 1fr; }
  .g2 { display:grid; grid-template-columns:.75fr 1.6fr; }
  .g3 > .fd + .fd, .g2 > .fd + .fd { border-left:1.5px dashed var(--line); padding-left:10px; }
  .hr { height:0; border-top:1.5px dashed var(--line); }
  .fd { display:flex; gap:9px; padding:11px 0; min-width:0; }
  .fd > svg.ico { margin-top:2px; color:var(--brand-ink); }
  .fd .fb { flex:1; min-width:0; }
  .fd label { display:block; font-size:12.5px; font-weight:700; color:var(--sub); }
  .fd .v { font-size:16.5px; font-weight:800; word-break:break-all; }
  .fd .na { color:var(--dim); font-weight:500; font-size:14px; }
  .fd.link { cursor:pointer; }
  .fd.link label::after { content:" ›"; color:var(--brand-ink); }
  .g3 .fd { flex-direction:column; gap:2px; }
  .g3 .fd > svg.ico { margin:0; }
  .idr { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .idr span { letter-spacing:.04em; white-space:nowrap; }
  .g2 .idr span { font-size:15.5px; }
  .mini { flex:0 0 auto; min-height:38px; border:2px solid var(--ink); background:var(--yellow); font-size:13.5px; font-weight:800; padding:0 13px; border-radius:12px; cursor:pointer; white-space:nowrap; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { display:inline-flex; align-items:center; gap:4px; min-height:30px; font-size:13px; font-weight:700; padding:0 10px; border-radius:15px; background:var(--card3); color:var(--sub); }
  .chip .zs { font-size:15px; width:auto; }
  .chip svg.ico { width:15px; height:15px; }
  .chip.tap { cursor:pointer; color:var(--brand-ink); background:var(--brand-soft); }
  .chip.hot { background:var(--pink-soft); color:var(--pink-ink); }

  /* ===== 底部導覽 ===== */
  .nav { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; padding:6px 6px calc(6px + var(--sb)); background:#fff; border-top:var(--stroke); }
  .nav button { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; min-height:56px; padding:0; border:0; background:none; color:var(--sub); font-size:11.5px; font-weight:700; cursor:pointer; min-width:0; }
  .nav button span.ni { display:grid; place-items:center; width:46px; height:30px; border-radius:15px; transition:background var(--ease); }
  .nav button svg.ico { width:23px; height:23px; }
  .nav button.on { color:var(--ink); font-weight:900; }
  .nav button.on span.ni { background:var(--brand); border:2px solid var(--ink); }
  .nb { position:absolute; top:0; left:calc(50% + 8px); min-width:19px; height:19px; padding:0 5px; border-radius:10px; background:var(--pink); color:#fff; font-size:11px; font-weight:900; display:grid; place-items:center; border:2px solid var(--ink); }
  .totop { position:fixed; right:14px; bottom:calc(80px + var(--sb)); z-index:45; width:46px; height:46px; display:grid; place-items:center; padding:0; border:var(--stroke); border-radius:50%; background:var(--yellow); cursor:pointer; box-shadow:var(--pop-s); }
  .toast { position:fixed; left:50%; bottom:calc(86px + var(--sb)); z-index:90; transform:translate(-50%,8px); display:flex; align-items:center; gap:8px; max-width:calc(100vw - 32px); padding:10px 18px; border-radius:22px; background:var(--ink); color:#fff; font-size:14px; font-weight:700; opacity:0; pointer-events:none; transition:all .2s; }
  .toast.on { opacity:1; transform:translate(-50%,0); }
  .toast.err { background:var(--red); }
  .toast.ok { background:#fff; color:var(--ink); border:var(--stroke); box-shadow:var(--pop-s); }
  .done-pop { position:fixed; inset:0; z-index:95; display:grid; place-items:center; pointer-events:none; }
  .done-pop div { padding:14px 22px 16px; border:var(--stroke); border-radius:24px; background:#fff; box-shadow:var(--pop), 0 20px 40px rgba(24,52,71,.2); text-align:center; font-weight:900; font-size:16px; animation:popin .22s ease both; }
  .done-pop img { display:block; width:150px; height:auto; margin:0 auto 4px; }
  .foot { text-align:center; color:var(--dim); font-size:12px; margin-top:22px; }

  /* 2.0：資料卡細邊框，粗描邊只留在主要按鈕 */
  .sec { border:1.5px solid var(--line2); box-shadow:var(--shadow); }
  .tabh { border:0; padding:7px 14px 6px 12px; }
  .ac { border:1.5px solid var(--line2); box-shadow:var(--shadow); }

  .vl { border-top:1.5px solid var(--line2); }
  .tag.today { border:0; }
  .nb { border-width:1.5px; }

  .ug { margin-top:10px; background:#fff; border:1.5px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
  .ugh { display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:10px 14px; border:0; background:none; text-align:left; cursor:pointer; }
  .ugh img { width:40px; height:40px; }
  .ugh .ut { flex:1; min-width:0; }
  .ugh b { display:block; font-size:16.5px; font-weight:900; }
  .ugh .cbar { margin-top:6px; }
  .ugh .uc { font-size:14px; font-weight:800; color:var(--sub); white-space:nowrap; }
  .ugh .car { color:var(--dim); font-size:12px; transition:transform var(--ease); }
  .ug.open .ugh .car { transform:rotate(180deg); }
  .ug.open .ugh { background:var(--brand-soft); }
  .ugb { padding:10px 12px 12px; border-top:1.5px dashed var(--line); }
  .ugb .tile { box-shadow:none; background:var(--card2); }
  .ugb .more { margin-top:10px; }
  /* 首頁壽星精簡 */
  .bdmini .lrow { min-height:46px; }

  /* 星座圖示 */
  .tile img { display:block; width:50px; height:50px; margin:0 auto 4px; object-fit:contain; }
  .chip img { width:22px; height:22px; margin-left:-6px; border-radius:50%; object-fit:contain; }
  .hb .l img { width:28px; height:28px; border-radius:50%; object-fit:contain; }

  /* ===== 互動（150–220ms） ===== */
  .row, .tile, .kpi, .pill, .lrow, .qc, .hb, .mile, .lg, .chip.tap, .prow, .fd.link, .feat, .ac { transition:background-color var(--ease), box-shadow var(--ease), transform 150ms ease; }
  .row:active, .tile:active, .kpi:active, .pill:active, .lrow:active, .hb:active, .mile:active, .lg:active { transform:scale(.985); background:var(--card2); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes shake { 20%,80% { transform:translateX(4px); } 30%,50%,70% { transform:translateX(-7px); } 40%,60% { transform:translateX(7px); } }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } }
  @keyframes float { 50% { transform:translateY(-6px); } }
  @keyframes bob { 50% { transform:translateY(-8px); } }
  @keyframes popin { from { opacity:0; transform:scale(.92); } }
  section.show { animation:fade .2s ease both; }
  .shake { animation:shake .4s ease; }
  .spin svg.ico { animation:spin .8s linear infinite; }
  @media (max-width:360px) { .feats { gap:7px; } .feat { font-size:13px; } .acts { gap:5px; } .ac { font-size:12px; } .kpi b { font-size:20px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

    if (/^(本週|本周|這週|這周|今週|今周)(生日|壽星)?$/.test(t)) { out.week = true; continue; }
    if (/^(本月|這個月|當月)(生日|壽星)?$/.test(t)) { out.month = now.getMonth() + 1; continue; }
    if ((m = t.match(/^(\d{1,2})月(\d{1,2})[日號号]?(?:生日)?$/)) || (m = t.match(/^(\d{1,2})[\/\-](\d{1,2})$/))) {
      const mo = Number(m[1]), da = Number(m[2]);
      if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) { out.month = mo; out.day = da; continue; }
    }
    if ((m = t.match(/^(\d{1,2})月(?:生日|壽星)?$/))) {
      const mo = Number(m[1]);
      if (mo >= 1 && mo <= 12) { out.month = mo; continue; }
    }
    if ((m = t.match(/^(ab|a|b|o)型$/))) { out.blood = m[1]; continue; }

    if (zn.length >= 2) for (let k = 0; k < ZODIACS.length; k++) if (ZODIACS[k].name.replace('座', '') === zn) { zi = k; break; }
    if (zi >= 0) { out.zod = zi; continue; }
    out.terms.push(t);

}

function filterPeople(list, f, now) {
  now = now || new Date();
  const pq = parseQuery(f.q, now);
  const month = pq.month || (f.month ? Number(f.month) : null);
  const day = pq.day || (f.day ? Number(f.day) : null);
  const week = pq.week || f.week === '1';
  const zod = pq.zod != null ? pq.zod : ((f.zod !== '' && f.zod != null) ? Number(f.zod) : null);
  if (pq.month && f.month && Number(f.month) !== pq.month) return [];
  const wr = weekRange(now);
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (!matchUnit(p, f.unit)) continue;
    if (f.year && yearNum(p.yearClass) !== f.year) continue;
    if (f.cat !== '' && f.cat != null && rankInfo(p.rank).cat !== Number(f.cat)) continue;
    if (month && Number(p.birthM) !== month) continue;
    if (day && Number(p.birthD) !== day) continue;
    if (week && !bdayDateInRange(p, wr.start, wr.end)) continue;
    if (zod !== null && zodiacIdx(p.birthM, p.birthD) !== zod) continue;
    if (pq.today && !isBirthdayOn(p, now)) continue;
    if (pq.blood && bloodKey(p.blood) !== pq.blood) continue;
    if (pq.terms.length) {
      const hay = [p.name, p.unit, unitLabel(p.unit), p.skill, p.rank, CATS[rankInfo(p.rank).cat].name, p.yearClass].join(' ').toLowerCase();
      const digits = String(p.phone || '').replace(/\D/g, '');
      let ok = true;
      for (let t = 0; t < pq.terms.length; t++) {
        const term = pq.terms[t];
        const td = term.replace(/\D/g, '');
        const isNum = /^[\d\-]+$/.test(term);
        if (hay.indexOf(term) !== -1) continue;
        if (isNum && td.length >= 4 && digits.indexOf(td) !== -1) continue;
        ok = false; break;
      }
      if (!ok) continue;
    }
    out.push(p);
  }
  const keyed = out.map(function (p, i) {
    const dt = week ? bdayDateInRange(p, wr.start, wr.end) : null;
    return { p: p, i: i, r: rankInfo(p.rank), wt: dt ? dt.getTime() : 0 };
  });
  keyed.sort(function (a, b) {
    if (week && a.wt !== b.wt) return a.wt - b.wt;
    if ((month || zod !== null) && !week) {
      const am = Number(a.p.birthM) * 100 + Number(a.p.birthD), bm = Number(b.p.birthM) * 100 + Number(b.p.birthD);
      if (am !== bm) return am - bm;
    }
    if (a.r.cat !== b.r.cat) return a.r.cat - b.r.cat;
    if (a.r.order !== b.r.order) return a.r.order - b.r.order;
    return a.i - b.i;
  });
  return keyed.map(function (k) { return k.p; });
}

function histogram(list, fn, step) {
  const vals = [];
  list.forEach(function (p) { const v = fn(p); if (v !== null && v !== undefined) vals.push({ p: p, v: v }); });
  if (!vals.length) return { bins: [], missing: list.length };
  let lo = Infinity, hi = -Infinity;
  vals.forEach(function (x) { const b = Math.floor(x.v / step) * step; if (b < lo) lo = b; if (b > hi) hi = b; });
  const bins = [];
  for (let b = lo; b <= hi; b += step) bins.push({ lo: b, hi: b + step, items: [] });
  vals.forEach(function (x) { bins[(Math.floor(x.v / step) * step - lo) / step].items.push(x.p); });
  return { bins: bins, missing: list.length - vals.length };
}

  list.forEach(function (p) { const y = westYear(p.joinY, p.joinRY); if (!isNaN(y)) (map[y] = map[y] || []).push(p); });
  const ys = Object.keys(map).map(Number);

  const out = [];
  for (let y = Math.min.apply(null, ys); y <= Math.max.apply(null, ys); y++) out.push({ year: y, items: map[y] || [] });

}

    (p.rank ? '<span class="rk" style="--gc:' + c + '">' + esc(p.rank) + '</span>' : '') + (bd ? '<span class="bt">今天生日</span>' : '') + '</h3><p>' + esc([ul, CATS[rankInfo(p.rank).cat].name].filter(Boolean).join(' · ')) + '</p></div>' +
    '<button class="sh-x" data-act="close" aria-label="關閉">✕</button></div>';
  if (navList) h += '<div class="snav"><button data-act="snav" data-v="-1"' + (navIdx > 0 ? '' : ' disabled') + '>‹ 上一位</button><span class="num">' + (navIdx + 1) + ' / ' + navList.length + '</span><button data-act="snav" data-v="1"' + (navIdx < navList.length - 1 ? '' : ' disabled') + '>下一位 ›</button></div>';
  h += '<div class="acts">' +
    '<a class="ac pri' + (dial ? '' : ' off') + '" href="tel:' + esc(dial) + '">' + img(IMG.b.call) + '撥打</a>' +
    (bd ? '<a class="ac' + (dial ? '' : ' off') + '" href="sms:' + esc(dial) + '?&body=' + encodeURIComponent('生日快樂！🎂') + '">' + img(IMG.b.gift) + '祝福</a>'
        : '<a class="ac' + (dial ? '' : ' off') + '" href="sms:' + esc(dial) + '">' + img(IMG.b.sms) + '簡訊</a>') +
    '<button class="ac' + (isFav(p) ? ' on' : '') + '" data-act="fav">' + img(IMG.b.star) + (isFav(p) ? '已常用' : '加常用') + '</button>' +
    '<button class="ac" data-act="copy">' + img(IMG.b.copy) + '複製</button>' +
    '<button class="ac' + (dial ? '' : ' off') + '" data-act="vcf">' + img(IMG.b.contact) + '存聯絡人</button></div>';
  // 基本資料
  h += sec('svg:id', '基本資料', us ? '<button class="sec-link" data-act="filter" data-k="unit" data-v="' + esc(us) + '">看同單位 ›</button>' : '');
  h += '<div class="sec"><div class="g3">' + fd(IMG.f.unit, '單位', ul) +
    fd(IMG.f.year, '年班', p.yearClass, yn ? ' data-act="filter" data-k="year" data-v="' + esc(yn) + '"' : '') +
    fd(IMG.f.skill, '專長', p.skill) + '</div></div>';
  // 個人資料
  h += sec('svg:users', '個人資料');
  h += '<div class="sec"><div class="g2">' + fd(IMG.f.blood, '血型', p.blood ? p.blood + ' 型' : '') +
    (p.idMask ? '<div class="fd">' + img(IMG.f.id) + '<div class="fb"><label>身分證</label><div class="v idr"><span id="sid">' + esc(real || p.idMask) + '</span><button class="mini" data-act="id">' + (real ? '隱藏' : '顯示') + '</button></div></div></div>' : fd(IMG.f.id, '身分證', '')) +
    '</div><div class="hr"></div>' + fd(IMG.f.bday, '生日', birthText(p), '', bchips ? '<div class="chips">' + bchips + '</div>' : '') + '</div>';
  // 聯絡與服役
  h += sec('svg:phone', '聯絡與服役資訊');
  h += '<div class="sec"><div class="fd">' + img(IMG.f.phone) + '<div class="fb"><label>電話</label><div class="v idr"><span class="num">' + (ph ? esc(ph) : '<span class="na">未填</span>') + '</span>' +
    (dial ? '<button class="mini" data-act="copyphone">複製姓名電話</button>' : '') + '</div></div></div><div class="hr"></div>' +
    fd(IMG.f.enlist, '入伍', joinText(p), '', svc ? '<div class="chips"><span class="chip">' + img(IMG.f.service) + '年資 ' + svc + '</span></div>' : '') + '</div>';
  $('sheet').innerHTML = h;
}
// 往下拖曳關閉
(function () {
  let y0 = null, x0 = 0, dy = 0, dx = 0, top0 = 0;
  $('sheet').addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; dx = 0; top0 = $('sheet').scrollTop; }, { passive: true });
  $('sheet').addEventListener('touchmove', function (e) {
    if (y0 === null) return; dy = e.touches[0].clientY - y0; dx = e.touches[0].clientX - x0;
    if (top0 <= 0 && dy > 0 && dy > Math.abs(dx)) { $('sheet').style.transition = 'none'; $('sheet').style.transform = 'translateY(' + dy + 'px)'; }
  }, { passive: true });
  $('sheet').addEventListener('touchend', function () {
    if (y0 === null) return; $('sheet').style.transition = ''; y0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && navList) { $('sheet').style.transform = ''; sheetStep(dx < 0 ? 1 : -1); return; }
    if (top0 <= 0 && dy > 110 && dy > Math.abs(dx)) closeSheet(); else $('sheet').style.transform = '';
  });
})();
async function toggleId(btn) {
  const p = cur; if (!p) return;
  if (idState[p.row]) { delete idState[p.row]; renderSheet(); return; }
  btn.disabled = true;
  try {
    const r = await api({ action: 'reveal', token: token, row: p.row });
    if (r.expired) { logoutLocal(r.msg); return; }
    if (r.ok) { idState[p.row] = r.id; renderSheet(); } else toast(r.msg || '讀取失敗', 'err');
  } catch (e) { toast('連線失敗', 'err'); }
  btn.disabled = false;
}
function flash(el, text, icon) {
  const old = el.innerHTML; el.classList.add('done'); el.innerHTML = img(icon || IMG.b.copy) + text;
  setTimeout(function () { el.classList.remove('done'); el.innerHTML = old; }, 1300);
}

// ---------- 搜尋建議 ----------
function hideSug() { sugs = []; sugIdx = -1; $('sug').classList.add('hidden'); }
function renderSug() {
  const q = $('q').value.trim();
  sugs = buildSuggestions(people, q); sugIdx = -1;
  if (!sugs.length) { hideSug(); return; }
  let h = '', lt = '';
  sugs.forEach(function (s, i) {
    if (s.type !== lt) { h += '<div class="sug-h">' + (s.type === 'person' ? '人員' : '快速篩選') + '</div>'; lt = s.type; }
    if (s.type === 'person') {
      h += '<div class="sug-i" data-s="' + i + '"><div class="av" style="--gc:' + catColor(s.p) + ';width:36px;height:36px;font-size:15px">' + esc(s.p.name.charAt(0)) + '</div><div class="m"><b><span>' + hl(s.p.name, q) + '</span></b><small>' + esc([s.p.rank, unitLabel(s.p.unit), s.p.yearClass].filter(Boolean).join(' · ')) + '</small></div></div>';
    } else {
      h += '<div class="sug-i" data-s="' + i + '"><div class="m"><b>' + esc(s.label.replace(/^[^一-龥\w]+\s*/, '')) + '</b><small class="num">' + s.n + ' 人</small></div><em>篩選</em></div>';
    }
  });
  $('sug').innerHTML = h; $('sug').classList.remove('hidden');
}
function chooseSug(i) {
  const s = sugs[i]; if (!s) return;
  if (s.type === 'person') openSheet(s.p);
  else { hideSug(); $('q').blur(); applyFilter(s.k, s.v); }
}

// ---------- 事件 ----------
let qT = null;
$('q').addEventListener('input', function () {
  flt.q = $('q').value; shown = PAGE; $('clr').classList.toggle('hidden', !$('q').value);
  clearTimeout(qT); qT = setTimeout(function () { renderSearch(); renderSug(); }, 90);
});
$('q').addEventListener('focus', function () { if ($('q').value.trim()) renderSug(); });
$('q').addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' && sugs.length) { e.preventDefault(); sugIdx = (sugIdx + 1) % sugs.length; markSug(); }
  else if (e.key === 'ArrowUp' && sugs.length) { e.preventDefault(); sugIdx = (sugIdx - 1 + sugs.length) % sugs.length; markSug(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (sugIdx >= 0) chooseSug(sugIdx); else { hideSug(); $('q').blur(); } }
  else if (e.key === 'Escape') hideSug();
});
function markSug() { document.querySelectorAll('.sug-i').forEach(function (el, i) { el.classList.toggle('on', i === sugIdx); }); }
$('sug').addEventListener('pointerdown', function (e) { const el = e.target.closest('.sug-i'); if (!el) return; e.preventDefault(); chooseSug(Number(el.getAttribute('data-s'))); });
document.addEventListener('pointerdown', function (e) { if (!e.target.closest('.sbox')) hideSug(); });
$('clr').addEventListener('click', function () { $('q').value = ''; flt.q = ''; hideSug(); renderSearch(); $('q').focus(); });
$('resetBtn').addEventListener('click', function () { flt = Object.assign({}, EMPTY); $('q').value = ''; hideSug(); renderSearch(); buzz(); });
$('copyList').addEventListener('click', function () { $('cmenu').classList.toggle('hidden'); buzz(6); });
function listOut(mode) {
  const L = ['名單：' + filterTitle() + '（共 ' + view.length + ' 人）'];
  view.forEach(function (p, i) {
    let s = (i + 1) + '. ' + p.name;
    if (mode === 'unit') s += (p.rank ? '　' + p.rank : '') + (p.unit ? '　' + unitLabel(p.unit) : '');
    if (mode === 'phone') s += '　' + (firstPhone(p.phone) || '（無電話）');
    L.push(s);
  });
  return L.join('\n');
}
$('moreBtn').addEventListener('click', function () { shown += PAGE; renderResults(); });
$('toTop').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
document.querySelector('.nav').addEventListener('click', function (e) { const b = e.target.closest('button[data-tab]'); if (b) { closeSheet(); setTab(b.getAttribute('data-tab')); } });
$('app').addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), now = new Date();
  if (act === 'open') {
    const box = el.closest('[data-group]');
    const list = box ? Array.prototype.map.call(box.querySelectorAll('[data-act="open"]'), function (x) { return people[Number(x.getAttribute('data-i'))]; }) : null;
    openSheet(people[Number(el.getAttribute('data-i'))], box && box.id === 'list' ? view : list);
  }
  else if (act === 'snav') sheetStep(Number(v));
  else if (act === 'feat') {
    if (v === 'unit' || v === 'year' || v === 'phone') { browseMode = v; setTab('browse'); renderBrowse(); }
    else setTab(v);
  }
  else if (act === 'reload') $('reloadBtn').click();
  else if (act === 'ugo') { openUnits[v] = !openUnits[v]; renderBrowse(); buzz(6); }
  else if (act === 'logout') $('logoutBtn').click();
  else if (act === 'clrfav') { favs = []; saveFavs(); renderSet(); renderSearch(); toast('已清除常用'); }
  else if (act === 'clrrecent') { try { sessionStorage.removeItem('recent'); } catch (x) {} renderSet(); renderSearch(); toast('已清除最近查看'); }
  else if (act === 'copymode') {
    copyToClipboard(listOut(v)).then(function () { buzz(); $('cmenu').classList.add('hidden'); celebrate('已複製 ' + view.length + ' 人'); }, function () { toast('複製失敗', 'err'); });
  }
  else if (act === 'notice') {
    const text = bdayNotice(v);
    if (!text) { toast(v === 'week' ? '本週沒有壽星' : '本月沒有壽星'); return; }
    copyToClipboard(text).then(function () { buzz(); celebrate('已複製壽星通知'); }, function () { toast('複製失敗', 'err'); });
  }
  else if (act === 'close') closeSheet();
  else if (act === 'rm') { const k = el.getAttribute('data-k'); flt[k] = ''; if (k === 'month') flt.day = ''; shown = PAGE; renderSearch(); }
  else if (act === 'quick') {
    const k = el.getAttribute('data-k');
    const isOn = el.classList.contains('on');
    if (isOn) { if (k === 'cat') flt.cat = ''; else if (k === 'week') flt.week = ''; else { flt.month = ''; flt.day = ''; } shown = PAGE; renderSearch(); return; }
    if (k === 'cat') { flt.cat = v; shown = PAGE; setTab('search'); renderSearch(); return; }
    if (k === 'today') applyFilter('month', String(now.getMonth() + 1), { day: String(now.getDate()) });
    else if (k === 'week') applyFilter('week', '1');
    else applyFilter('month', String(now.getMonth() + 1));
  }
  else if (act === 'cat') { flt.cat = v; shown = PAGE; renderSearch(); }
  else if (act === 'year') { if (v) { flt.year = v; shown = PAGE; renderSearch(); window.scrollTo(0, 0); buzz(); } }
  else if (act === 'filter') { let extra = null; try { extra = JSON.parse(el.getAttribute('data-extra') || 'null'); } catch (x) {} applyFilter(el.getAttribute('data-k'), v, extra); }
  else if (act === 'set') { if (sets[v] && sets[v].ids.length) applyFilter('set', v); }
  else if (act === 'grp') { const c = Number(el.getAttribute('data-c')); collapsed[c] = !collapsed[c]; renderResults(); }
  else if (act === 'tab') setTab(v);
  else if (act === 'bmode') { browseMode = v; renderBrowse(); buzz(6); }
  else if (act === 'pscope') { phoneScope = v; renderPhone(); buzz(6); }
  else if (act === 'psel') {
    const i = Number(el.getAttribute('data-i'));
    if (phoneSel[i]) delete phoneSel[i]; else phoneSel[i] = 1;
    el.classList.toggle('on', !!phoneSel[i]); updatePbar(); buzz(5);
  }
  else if (act === 'pall') { phoneView.forEach(function (p) { if (dialPhone(p.phone)) phoneSel[p._i] = 1; }); renderPlist(); buzz(); }
  else if (act === 'pclear') { for (const k in phoneSel) delete phoneSel[k]; renderPlist(); buzz(); }
  else if (act === 'pcopy') {
    const pp = people[Number(el.getAttribute('data-i'))];
    copyToClipboard(phoneLine(pp)).then(function () { buzz(); toast('已複製：' + pp.name, 'ok'); }, function () { toast('複製失敗', 'err'); });
  }
  else if (act === 'pcopyall') {
    const ids = Object.keys(phoneSel).map(Number);
    const L = ids.length ? filterPeople(people, EMPTY).filter(function (p) { return phoneSel[p._i]; }) : phoneView.filter(function (p) { return dialPhone(p.phone); });
    if (!L.length) { toast('沒有可複製的電話'); return; }
    copyToClipboard(L.map(phoneLine).join('\n')).then(function () { buzz(); celebrate('已複製 ' + L.length + ' 人的電話'); }, function () { toast('複製失敗', 'err'); });
  }
  else if (act === 'copyphone' && cur) copyToClipboard(phoneLine(cur)).then(function () { buzz(); toast('已複製：' + phoneLine(cur), 'ok'); }, function () { toast('複製失敗', 'err'); });
  else if (act === 'scope') { statScope = v; renderStats(); buzz(6); }
  else if (act === 'try') { $('q').value = el.getAttribute('data-t'); flt.q = $('q').value; shown = PAGE; renderSearch(); }
  else if (act === 'id') toggleId(el);
  else if (act === 'fav' && cur) {
    const k = favs.indexOf(cur.name);
    if (k === -1) favs.unshift(cur.name); else favs.splice(k, 1);
    favs = favs.slice(0, 30); saveFavs(); renderSheet();
    const on = isFav(cur); toast(on ? '已加入常用，首頁可看到' : '已移出常用', on ? 'ok' : ''); buzz(on ? 15 : 8);
    if (tab === 'search' && hasFilter()) renderResults();
  }
  else if (act === 'copy' && cur) copyToClipboard(copyText(cur, idState[cur.row])).then(function () { buzz(); flash(el, '已複製'); }, function () { toast('複製失敗', 'err'); });
  else if (act === 'vcf' && cur) {
    const url = URL.createObjectURL(new Blob([vcardText(cur)], { type: 'text/vcard;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = cur.name + '.vcf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000); buzz(); flash(el, '已產生', IMG.b.contact);
  }
});
$('reloadBtn').addEventListener('click', function () {
  const b = $('reloadBtn'); if (b.classList.contains('spin')) return;
  b.classList.add('spin'); buzz();
  loadData().then(function () { b.classList.remove('spin'); if (people.length) toast('資料已更新', 'ok'); });
});
$('logoutBtn').addEventListener('click', async function () { try { await api({ action: 'logout', token: token }); } catch (e) {} logoutLocal(''); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && cur) closeSheet();
  if (cur && navList && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) sheetStep(e.key === 'ArrowRight' ? 1 : -1);
  if (e.key === '/' && token && document.activeElement !== $('q') && document.activeElement !== $('pw')) { e.preventDefault(); closeSheet(); setTab('search'); $('q').focus(); }
});
$('pq').addEventListener('input', function () { phoneQ = $('pq').value; clearTimeout(qT); qT = setTimeout(renderPlist, 90); });
$('eyeBtn').addEventListener('click', function () {
  const on = $('pw').type === 'password';
  $('pw').type = on ? 'text' : 'password';
  $('eyeBtn').setAttribute('aria-label', on ? '隱藏密碼' : '顯示密碼');
  $('eyePath').setAttribute('d', on ? 'M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2' : 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z');
  $('pw').focus();
});
$('loginBtn').addEventListener('click', login);
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

if (DEMO) setMsg('預覽模式：任意密碼即可進入，資料皆為虛構', 'note');
if (token) loadData(); else showApp(false);
</script>
