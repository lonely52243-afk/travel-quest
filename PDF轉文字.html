<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 轉 TXT</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --text:#1f2933; --sub:#667085;
    --main:#2563eb; --main-d:#1d4ed8; --line:#d9dee5; --ok:#16a34a; --warn:#d97706;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.5;padding:16px;padding-bottom:40px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:22px;margin:4px 0 4px}
  .hint{color:var(--sub);font-size:14px;margin:0 0 14px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card h2{font-size:16px;margin:0 0 10px}
  .pick{display:block;text-align:center;padding:18px 10px;border:2px dashed var(--main);
    border-radius:12px;color:var(--main);font-weight:600;cursor:pointer;font-size:16px}
  .pick input{display:none}
  .fname{margin-top:8px;font-size:14px;color:var(--sub);word-break:break-all;text-align:center}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
  .opt:last-of-type{border-bottom:none}
  .opt input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--main)}
  .opt b{display:block;font-size:15px}
  .opt span{display:block;font-size:13px;color:var(--sub)}
  textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;
    font-size:15px;font-family:inherit;resize:vertical;background:#fff;color:var(--text)}
  #kw{height:84px}
  #out{height:340px;font-size:14px}
  .btns{display:flex;gap:10px;margin-top:10px}
  button{flex:1;padding:13px 10px;border:none;border-radius:10px;font-size:16px;font-weight:600;
    background:var(--main);color:#fff;cursor:pointer}
  button:active{background:var(--main-d)}
  button.gray{background:#e5e7eb;color:var(--text)}
  button:disabled{opacity:.45}
  .status{font-size:14px;margin:8px 0 0;color:var(--sub)}
  .status.ok{color:var(--ok)}
  .status.warn{color:var(--warn)}
  .bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:8px;display:none}
  .bar i{display:block;height:100%;width:0;background:var(--main);transition:width .15s}
  .stat{font-size:13px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>PDF 轉 TXT</h1>
  <p class="hint">檔案只在你的手機裡處理，不會上傳。文字可選取的 PDF 和掃描檔都可以。</p>

  <div class="card">
    <label class="pick">
      點這裡選擇 PDF 檔
      <input type="file" id="file" accept="application/pdf,.pdf">
    </label>
    <div class="fname" id="fname">尚未選擇檔案</div>
    <label class="opt" style="margin-top:8px">
      <input type="checkbox" id="oOcr" checked>
      <div><b>掃描頁自動辨識（OCR）</b><span>沒有文字的頁會用圖片辨識，比較慢；第一次使用要下載中文辨識資料（約 20MB 以上），要先選好再選檔案</span></div>
    </label>
    <div class="bar" id="bar"><i id="barin"></i></div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h2>清理選項（改了會立刻更新）</h2>
    <label class="opt"><input type="checkbox" id="oPageNum" checked>
      <div><b>去掉頁碼</b><span>例如「3」、「第 3 頁」、「3 / 10」、「Page 3 of 10」</span></div></label>
    <label class="opt"><input type="checkbox" id="oHeader" checked>
      <div><b>去掉每頁重複的頁首／頁尾</b><span>每頁都出現的固定文字（頁數 3 頁以上才判斷）</span></div></label>
    <label class="opt"><input type="checkbox" id="oMerge" checked>
      <div><b>接回被硬斷開的行</b><span>PDF 每行是斷開的，這個會接成完整段落</span></div></label>
    <label class="opt"><input type="checkbox" id="oBlank" checked>
      <div><b>段落之間空一行</b><span>只在「接回斷行」開啟時有效</span></div></label>
    <label class="opt"><input type="checkbox" id="oSpace" checked>
      <div><b>整理多餘空白</b><span>連續空格縮成一個、去掉行首行尾空白</span></div></label>
    <div style="margin-top:10px;font-size:15px"><b>自訂要刪掉的字詞</b>
      <span style="font-size:13px;color:var(--sub)">（一行一個，含有這個字的整行會刪掉）</span></div>
    <textarea id="kw" placeholder="例如：&#10;機密　請勿外流&#10;本文件僅供內部使用"></textarea>
  </div>

  <div class="card">
    <h2>轉換結果</h2>
    <textarea id="out" readonly placeholder="選好 PDF 後，結果會顯示在這裡"></textarea>
    <div class="stat" id="stat"></div>
    <div class="btns">
      <button id="copy" disabled>複製全部</button>
      <button id="dl" class="gray" disabled>下載 txt</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var pages = [];          // 每頁一個陣列，裝該頁的每一行文字
  var baseName = 'output';
  var CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F]/;

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  function setStatus(msg, cls){
    var s = $('status');
    s.textContent = msg;
    s.className = 'status' + (cls ? ' ' + cls : '');
  }

  // 把一頁的文字片段，依位置組成一行一行
  function buildLines(items){
    var its = [];
    for (var i = 0; i < items.length; i++){
      var it = items[i];
      if (typeof it.str === 'string' && it.str !== '' && it.transform){
        its.push({
          s: it.str,
          x: it.transform[4],
          y: it.transform[5],
          w: it.width || 0,
          h: it.height || 10
        });
      }
    }
    its.sort(function(a, b){
      if (Math.abs(b.y - a.y) > 0.5) return b.y - a.y;
      return a.x - b.x;
    });
    var lines = [];
    for (var j = 0; j < its.length; j++){
      var t = its[j];
      var last = lines.length ? lines[lines.length - 1] : null;
      if (last && Math.abs(last.y - t.y) <= Math.max(2, t.h * 0.4)){
        last.parts.push(t);
      } else {
        lines.push({ y: t.y, parts: [t] });
      }
    }
    var result = [];
    for (var k = 0; k < lines.length; k++){
      var parts = lines[k].parts.sort(function(a, b){ return a.x - b.x; });
      var text = '';
      var prev = null;
      for (var m = 0; m < parts.length; m++){
        var p = parts[m];
        if (prev){
          var gap = p.x - (prev.x + prev.w);
          var a = text.charAt(text.length - 1);
          var b = p.s.charAt(0);
          if (gap > prev.h * 0.25 && a !== ' ' && b !== ' ' && !CJK.test(a) && !CJK.test(b)){
            text += ' ';
          }
        }
        text += p.s;
        prev = p;
      }
      text = text.replace(/\s+$/, '').replace(/^\s+/, '');
      if (text !== '') result.push(text);
    }
    return result;
  }

  var ocrWorker = null;
  var ocrCtx = { label: '' };

  async function getOcrWorker(){
    if (ocrWorker) return ocrWorker;
    if (!window.Tesseract) throw new Error('讀不到 OCR 辨識程式，請確認手機有連上網路後重新整理。');
    setStatus('準備辨識程式（第一次要下載中文資料，請稍候）…');
    ocrWorker = await Tesseract.createWorker(['chi_tra', 'eng'], 1, {
      logger: function(m){
        if (m && m.status === 'recognizing text' && typeof m.progress === 'number'){
          setStatus(ocrCtx.label + ' ' + Math.round(m.progress * 100) + '%');
        } else if (m && m.status && m.status.indexOf('loading') === 0 && typeof m.progress === 'number'){
          setStatus('下載辨識資料… ' + Math.round(m.progress * 100) + '%');
        }
      }
    });
    return ocrWorker;
  }

  // 辨識結果：中文字之間 Tesseract 會夾空格，這裡去掉
  function cleanOcrText(txt){
    var out = [];
    var rows = txt.split('\n');
    for (var i = 0; i < rows.length; i++){
      var r = rows[i].trim();
      if (r === '') continue;
      var prev;
      do {
        prev = r;
        r = r.replace(/([⺀-鿿豈-﫿＀-￯　-〿])[ \t]+(?=[⺀-鿿豈-﫿＀-￯　-〿])/g, '$1');
      } while (r !== prev);
      out.push(r);
    }
    return out;
  }

  async function ocrPage(page, label){
    var vp1 = page.getViewport({ scale: 1 });
    var scale = Math.min(2.5, 1800 / vp1.width);
    if (scale < 1) scale = 1;
    var vp = page.getViewport({ scale: scale });
    var canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    var worker = await getOcrWorker();
    ocrCtx.label = label;
    var res = await worker.recognize(canvas);
    canvas.width = 1;
    canvas.height = 1;
    return cleanOcrText(res.data.text || '');
  }

  async function readPdf(file){
    setStatus('讀取中…');
    $('bar').style.display = 'block';
    $('barin').style.width = '0%';
    $('out').value = '';
    $('copy').disabled = true;
    $('dl').disabled = true;
    pages = [];
    var ocrCount = 0, skipped = 0;
    try {
      if (!window.pdfjsLib) throw new Error('讀不到 PDF 解析程式，請確認手機有連上網路後重新整理。');
      var buf = await file.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      var useOcr = $('oOcr').checked;
      for (var i = 1; i <= pdf.numPages; i++){
        var page = await pdf.getPage(i);
        var tc = await page.getTextContent();
        var lines = buildLines(tc.items);
        var chars = lines.join('').length;
        if (chars < 10){
          if (useOcr){
            lines = await ocrPage(page, '辨識第 ' + i + ' / ' + pdf.numPages + ' 頁');
            ocrCount++;
          } else {
            skipped++;
          }
        }
        pages.push(lines);
        $('barin').style.width = Math.round(i / pdf.numPages * 100) + '%';
        setStatus('讀取中… ' + i + ' / ' + pdf.numPages + ' 頁');
      }
      var total = 0;
      for (var p = 0; p < pages.length; p++) total += pages[p].length;
      if (total === 0){
        setStatus(useOcr ? '沒有辨識出任何文字，可能是圖片太模糊。' : '這份 PDF 抓不到文字，可能是掃描檔，請勾選「掃描頁自動辨識」後重新選檔。', 'warn');
      } else {
        var msg = '完成，共 ' + pdf.numPages + ' 頁。';
        if (ocrCount) msg += '其中 ' + ocrCount + ' 頁用 OCR 辨識，建議快速看過有沒有認錯字。';
        if (skipped) msg += '有 ' + skipped + ' 頁沒有文字（未辨識）。';
        setStatus(msg, 'ok');
      }
      render();
    } catch (e){
      setStatus('讀取失敗：' + (e && e.message ? e.message : e), 'warn');
    }
    if (ocrWorker){
      try { await ocrWorker.terminate(); } catch (e2) {}
      ocrWorker = null;
    }
    setTimeout(function(){ $('bar').style.display = 'none'; }, 600);
  }

  function weight(s){
    var n = 0;
    for (var i = 0; i < s.length; i++) n += CJK.test(s.charAt(i)) ? 2 : 1;
    return n;
  }

  var PAGENUM = [
    /^[-–—\s]*(第\s*)?\d{1,4}\s*(頁|页)?[-–—\s]*$/,
    /^[-–—\s]*(第\s*)?\d{1,4}\s*(頁|页)?\s*[\/／]\s*(共\s*)?\d{1,4}\s*(頁|页)?[-–—\s]*$/,
    /^[-–—\s]*(第\s*)?\d{1,4}\s*(頁|页)\s*[,，]?\s*共\s*\d{1,4}\s*(頁|页)[-–—\s]*$/,
    /^page\s*\d{1,4}(\s*(of|\/)\s*\d{1,4})?$/i
  ];
  function isPageNum(s){
    var t = s.trim();
    for (var i = 0; i < PAGENUM.length; i++) if (PAGENUM[i].test(t)) return true;
    return false;
  }

  function norm(s){ return s.replace(/\d+/g, '#').replace(/\s+/g, ''); }

  function process(){
    var n = pages.length;
    var data = pages.map(function(l){ return l.slice(); });
    var before = 0, i, j;
    for (i = 0; i < n; i++) before += pages[i].join('').length;

    // 1. 頁首頁尾（每頁邊緣兩行，重複出現者）
    if ($('oHeader').checked && n >= 3){
      var count = {};
      for (i = 0; i < n; i++){
        var seen = {};
        for (j = 0; j < data[i].length; j++){
          if (j < 2 || j >= data[i].length - 2){
            var key = norm(data[i][j]);
            if (key && !seen[key]){ seen[key] = 1; count[key] = (count[key] || 0) + 1; }
          }
        }
      }
      var th = Math.max(3, Math.ceil(n * 0.4));
      for (i = 0; i < n; i++){
        var L = data[i], keep = [];
        for (j = 0; j < L.length; j++){
          var edge = (j < 2 || j >= L.length - 2);
          if (edge && count[norm(L[j])] >= th) continue;
          keep.push(L[j]);
        }
        data[i] = keep;
      }
    }

    // 2. 頁碼（只看每頁邊緣兩行）
    if ($('oPageNum').checked){
      for (i = 0; i < n; i++){
        var L2 = data[i], keep2 = [];
        for (j = 0; j < L2.length; j++){
          var edge2 = (j < 2 || j >= L2.length - 2);
          if (edge2 && isPageNum(L2[j])) continue;
          keep2.push(L2[j]);
        }
        data[i] = keep2;
      }
    }

    // 3. 自訂字詞
    var kws = $('kw').value.split('\n').map(function(s){ return s.trim(); })
      .filter(function(s){ return s !== ''; });
    if (kws.length){
      for (i = 0; i < n; i++){
        data[i] = data[i].filter(function(line){
          for (var q = 0; q < kws.length; q++) if (line.indexOf(kws[q]) !== -1) return false;
          return true;
        });
      }
    }

    // 4. 攤平成一串行
    var lines = [];
    for (i = 0; i < n; i++) for (j = 0; j < data[i].length; j++) lines.push(data[i][j]);

    // 5. 整理空白
    if ($('oSpace').checked){
      lines = lines.map(function(s){
        return s.replace(/\u3000/g, ' ').replace(/[ \t]+/g, ' ').trim();
      }).filter(function(s){ return s !== ''; });
    }

    // 6. 接回斷行
    var text;
    if ($('oMerge').checked && lines.length){
      var ws = lines.map(weight).sort(function(a, b){ return a - b; });
      var full = ws[Math.floor(ws.length * 0.9)] || ws[ws.length - 1];
      var endPunct = /[。！？!?.；;：:」』）)”"…]$/;
      var paras = [], cur = lines[0];
      for (i = 1; i < lines.length; i++){
        var prevLine = cur;
        var canMerge = weight(lines[i - 1]) >= full * 0.8 && !endPunct.test(prevLine);
        if (canMerge){
          var a = cur.charAt(cur.length - 1), b = lines[i].charAt(0);
          cur += (!CJK.test(a) && !CJK.test(b) && a !== ' ' && b !== ' ') ? ' ' : '';
          cur += lines[i];
        } else {
          paras.push(cur);
          cur = lines[i];
        }
      }
      paras.push(cur);
      text = paras.join($('oBlank').checked ? '\n\n' : '\n');
    } else {
      text = lines.join('\n');
    }
    return { text: text, before: before };
  }

  function render(){
    if (!pages.length) return;
    var r = process();
    $('out').value = r.text;
    var after = r.text.replace(/\s/g, '').length;
    $('stat').textContent = '原本 ' + r.before + ' 字 → 清理後 ' + after + ' 字（不含空白）';
    var has = r.text.length > 0;
    $('copy').disabled = !has;
    $('dl').disabled = !has;
  }

  $('file').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if (!f) return;
    $('fname').textContent = f.name;
    baseName = f.name.replace(/\.pdf$/i, '') || 'output';
    readPdf(f);
  });

  ['oPageNum', 'oHeader', 'oMerge', 'oBlank', 'oSpace'].forEach(function(id){
    $(id).addEventListener('change', render);
  });
  var timer = null;
  $('kw').addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(render, 300);
  });

  $('copy').addEventListener('click', function(){
    var t = $('out').value;
    var done = function(){ var b = $('copy'); b.textContent = '已複製 ✓'; setTimeout(function(){ b.textContent = '複製全部'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var o = $('out');
      o.removeAttribute('readonly');
      o.select();
      o.setSelectionRange(0, t.length);
      try { document.execCommand('copy'); done(); } catch (e) { alert('複製失敗，請長按文字手動複製'); }
      o.setAttribute('readonly', 'readonly');
    }
  });

  $('dl').addEventListener('click', function(){
    var blob = new Blob(['\uFEFF' + $('out').value], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = baseName + '.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
})();
</script>
</body>
</html>
