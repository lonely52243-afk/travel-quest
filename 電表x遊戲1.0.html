<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電表機房</title>
<meta name="theme-color" content="#03060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="電表機房">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   主題變數 — 電表頁（深色科技風）
   ============================================================ */
body.mode-meter{
  --bg:#03060d;
  --bg-2:#060b14;
  --panel:rgba(11,17,28,.78);
  --panel-2:rgba(16,24,38,.85);
  --panel-3:rgba(22,32,50,.92);
  --border:rgba(34,211,238,.18);
  --border-soft:rgba(34,211,238,.10);
  --border-hi:rgba(34,211,238,.55);
  --text-0:#e8f2ff;
  --text-1:#8ba0bd;
  --text-2:#4a5a72;
  --green:#3fb950;--green-glow:rgba(63,185,80,.65);
  --cyan:#22d3ee;--cyan-2:#58a6ff;--cyan-glow:rgba(34,211,238,.6);
  --yellow:#d29922;--yellow-glow:rgba(210,153,34,.65);
  --red:#f85149;--red-glow:rgba(248,81,73,.65);
  --blue:#58a6ff;--blue-glow:rgba(88,166,255,.6);
  --violet:#a371f7;
  --sp-1:8px;
  --sp-2:12px;
  background:var(--bg);color:var(--text-0);
  font-family:"Noto Sans TC","JetBrains Mono",system-ui,-apple-system,sans-serif;
  background-image:
    radial-gradient(circle 900px at 15% 8%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(circle 800px at 85% 92%, rgba(88,166,255,.06), transparent 60%),
    linear-gradient(rgba(34,211,238,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,.025) 1px, transparent 1px);
  background-size:100% 100%, 100% 100%, 40px 40px, 40px 40px;
}
body.mode-meter::before{
  content:"";position:fixed;inset:0;
  background-image:url('https://lonely52243.neocities.org/電表/24E9FED2-BB7C-4404-88A9-ECCF98D088D4.gif');
  background-repeat:repeat;background-size:300px 300px;
  opacity:.05;pointer-events:none;z-index:0;mix-blend-mode:screen;
  filter:grayscale(.85) brightness(1.3) contrast(.9);
}

/* ============================================================
   主題變數 — 名冊頁（羊皮紙奇幻風）
   ============================================================ */
body.mode-roster{
  --paper:#f0e9d8;--paper-2:#e8dfc9;--paper-3:#ded2b8;
  --ink:#2a2418;--ink-2:#5a4f3a;
  --forest:#1a2f1f;--moss:#4a6b3d;
  --gold:#c9a55c;--gold-2:#e8d18f;--gold-3:#8b6f3a;
  --crimson:#8b3a3a;
  --lv-gray:#6b7280;--lv-blue:#3b6dba;--lv-purple:#8b5cf6;
  background:var(--paper);color:var(--ink);
  font-family:"Cinzel","Noto Serif TC",serif;
  background-image:
    radial-gradient(circle at 20% 8%, rgba(201,165,92,.10), transparent 55%),
    radial-gradient(circle at 80% 92%, rgba(74,107,61,.08), transparent 55%),
    repeating-linear-gradient(0deg, rgba(139,111,58,.025) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(139,111,58,.015) 0 1px, transparent 1px 8px),
    radial-gradient(circle at 50% 50%, rgba(232,223,201,.4), rgba(240,233,216,.9));
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;transition:background .6s,color .6s}
body{padding:0 0 40px;min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:12px 12px 40px;position:relative;z-index:2}

/* ============================================================
   頂部切換鈕
   ============================================================ */
.top-switch{
  display:flex;gap:0;margin-bottom:var(--sp-2);
  border-bottom:1px solid var(--border);
}
body.mode-roster .top-switch{border-bottom-color:rgba(201,165,92,.4)}
.switch-btn{
  flex:1;padding:12px 0;text-align:center;
  font-size:13px;font-weight:600;letter-spacing:.4em;
  cursor:pointer;color:var(--text-2);
  position:relative;transition:color .3s;user-select:none;
  padding-left:.4em;
}
.switch-btn.disabled{pointer-events:none;opacity:.7}
body.mode-meter .switch-btn.active{color:var(--cyan)}
body.mode-roster .switch-btn{color:var(--ink-2);font-family:"Cinzel","Noto Serif TC",serif}
body.mode-roster .switch-btn.active{color:var(--gold-3)}
.switch-btn.active::after{
  content:"";position:absolute;bottom:-1px;left:20%;right:20%;height:2px;
  border-radius:2px;
}
body.mode-meter .switch-btn.active::after{
  background:var(--cyan);box-shadow:0 0 12px var(--cyan-glow);
}
body.mode-roster .switch-btn.active::after{
  background:var(--gold);box-shadow:0 0 12px rgba(201,165,92,.8);
}

/* ============================================================
   頁面容器
   ============================================================ */
.page{display:none}
.page.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 電表頁自帶深色背景（保險） */
#page-meter{
  background:#03060d;
  background-image:
    radial-gradient(circle 900px at 15% 8%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(circle 800px at 85% 92%, rgba(88,166,255,.06), transparent 60%),
    linear-gradient(rgba(34,211,238,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,.025) 1px, transparent 1px);
  background-size:100% 100%, 100% 100%, 40px 40px, 40px 40px;
  margin:-12px;
  padding:12px;
  border-radius:12px;
}

/* ============================================================
   擋頭橫幅
   ============================================================ */
.hero-eva{
  position:relative;
  width:100%;height:120px;border-radius:14px;overflow:hidden;
  margin-bottom:var(--sp-2);background-color:#0a0f18;
  border:1px solid var(--border-hi);
  box-shadow:
    0 0 30px rgba(34,211,238,.15),
    inset 0 0 40px rgba(3,6,13,.7);
  animation:heroIn .9s cubic-bezier(.16,1,.3,1);
}
.hero-eva::before{
  content:"";
  position:absolute;inset:0;z-index:0;
  background-image:url('https://lonely52243.neocities.org/電表/C2D6CC57-904F-4863-AB45-03713065A159.gif');
  background-size:cover;background-position:80% 54%;background-repeat:no-repeat;
  filter:grayscale(.9) brightness(.85) contrast(1.15);
}
.hero-eva::after{
  content:"SYS / METER-ROOM";
  position:absolute;inset:0;z-index:1;
  padding:12px 16px;
  font-family:"JetBrains Mono",monospace;
  font-size:9px;letter-spacing:.35em;
  color:var(--cyan);
  text-shadow:0 0 8px var(--cyan-glow);
  background:
    linear-gradient(135deg, rgba(34,211,238,.5) 0%, rgba(34,211,238,.12) 45%, rgba(3,6,13,.7) 100%),
    linear-gradient(180deg, rgba(3,6,13,.45) 0%, transparent 40%, transparent 60%, rgba(3,6,13,.8) 100%);
  pointer-events:none;
}

.hero-roster{
  position:relative;
  width:100%;height:120px;border-radius:14px;overflow:hidden;
  margin-bottom:var(--sp-2);background-color:#1a1410;
  background-image:url('https://lonely52243.neocities.org/圖庫/IMG_3340.jpeg');
  background-size:cover;background-position:center 45%;background-repeat:no-repeat;
  border:1px solid rgba(201,165,92,.55);
  box-shadow:0 0 30px rgba(201,165,92,.15);
  animation:heroIn .9s cubic-bezier(.16,1,.3,1);
}
.hero-roster::after{
  content:"";position:absolute;inset:0;
  background:rgba(201,165,92,.35);
  mix-blend-mode:overlay;
  pointer-events:none;
}

@keyframes heroIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

body.mode-meter .hero-roster{display:none}
body.mode-roster .hero-eva{display:none}

/* ============================================================
   Topbar
   ============================================================ */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--border);border-radius:10px;
  margin-bottom:var(--sp-2);
  font-size:11px;letter-spacing:.1em;
  backdrop-filter:blur(14px);font-family:"JetBrains Mono",monospace;
  animation:blockIn .5s cubic-bezier(.16,1,.3,1) backwards;
  animation-delay:.05s;
}
.topbar .left{display:flex;align-items:center;gap:10px;color:var(--text-0)}
.topbar .live{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);font-weight:700}
.topbar .live::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan-glow);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.topbar .right{color:var(--text-1);display:flex;align-items:center;gap:8px}
body.mode-meter .topbar .right::after{
  content:"";width:20px;height:20px;
  background-image:url('https://lonely52243.neocities.org/電表/C6A11818-3260-4FA9-9661-574B95F55064.gif');
  background-size:contain;background-repeat:no-repeat;background-position:center;
  mix-blend-mode:screen;opacity:1;
  filter:grayscale(.5) brightness(1.6) contrast(1.2);
}
@keyframes blockIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============================================================
   日期範圍
   ============================================================ */
.date-range{
  display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
  padding:10px 12px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;margin-bottom:var(--sp-2);
  animation:blockIn .5s cubic-bezier(.16,1,.3,1) backwards;
  animation-delay:.1s;
}
.date-range input[type="date"]{
  width:100%;height:36px;padding:0 10px;
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:6px;color:var(--text-0);
  font-family:"JetBrains Mono",monospace;font-size:11px;outline:none;
  -webkit-appearance:none;appearance:none;
  transition:border-color .2s ease;
  color-scheme:dark;
}
.date-range input[type="date"]:focus{
  border-color:var(--cyan);
  box-shadow:0 0 12px rgba(34,211,238,.25);
}
.date-range .sep{color:var(--text-2);font-size:11px}

/* ============================================================
   折疊面板
   ============================================================ */
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--border);border-bottom:none;
  border-radius:10px 10px 0 0;
  font-size:11px;color:var(--text-1);cursor:pointer;
  letter-spacing:.15em;user-select:none;
  font-family:"JetBrains Mono",monospace;
  animation:blockIn .5s cubic-bezier(.16,1,.3,1) backwards;
  position:relative;
}
.section-head::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;
  width:2px;background:var(--cyan);
  box-shadow:0 0 8px var(--cyan-glow);
  border-radius:0 2px 2px 0;
}
.section-head .label{display:flex;align-items:center;gap:10px;padding-left:6px}
.section-head .num{
  font-size:9px;color:var(--cyan);
  letter-spacing:.1em;opacity:.7;
}
.section-head .arrow{
  transition:transform .25s;font-size:10px;color:var(--text-2);
}
.section-head.open .arrow{transform:rotate(90deg);color:var(--cyan)}

.panel-body{
  background:var(--panel);border:1px solid var(--border);
  border-top:none;border-radius:0 0 10px 10px;
  overflow:hidden;max-height:0;
  transition:max-height .45s cubic-bezier(.16,1,.3,1);
  margin-bottom:var(--sp-2);
}
.panel-body.open{max-height:2200px}

/* ============================================================
   統計區塊（左 3 右 1）
   ============================================================ */
body.mode-meter .stats-block{
  display:grid;grid-template-columns:58% 1fr;gap:var(--sp-1);
  margin-bottom:var(--sp-2);
  animation:blockIn .5s cubic-bezier(.16,1,.3,1) backwards;
  animation-delay:.15s;
}
body.mode-meter .stats-col{display:grid;grid-template-rows:1fr 1fr 1fr;gap:var(--sp-1)}
body.mode-meter .stat{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;display:flex;flex-direction:column;
  justify-content:center;position:relative;overflow:hidden;
}
body.mode-meter .stat::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,currentColor,transparent);
  opacity:.6;
}
body.mode-meter .stat .k{
  font-size:9px;color:var(--text-2);letter-spacing:.2em;
  text-transform:uppercase;margin-bottom:6px;
  font-family:"JetBrains Mono",monospace;
}
body.mode-meter .stat .v{
  font-size:28px;font-weight:700;line-height:1;
  font-family:"JetBrains Mono",monospace;letter-spacing:-.02em;
}
body.mode-meter .stat .v small{font-size:10px;color:var(--text-2);margin-left:4px;font-weight:500;letter-spacing:.1em}
body.mode-meter .stat.green{color:var(--green)}
body.mode-meter .stat.green .v{color:var(--green);text-shadow:0 0 20px var(--green-glow)}
body.mode-meter .stat.yellow{color:var(--yellow)}
body.mode-meter .stat.yellow .v{color:var(--yellow);text-shadow:0 0 20px var(--yellow-glow)}
body.mode-meter .stat.red{color:var(--red)}
body.mode-meter .stat.red .v{color:var(--red);text-shadow:0 0 20px var(--red-glow)}

/* 系統核心 */
.core{
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;position:relative;overflow:hidden;
}
.core::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  animation:coreScan 3s linear infinite;z-index:3;
}
@keyframes coreScan{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
.core-img{
  position:absolute;inset:0;
  background-image:url('https://lonely52243.neocities.org/電表/91EF739D-32BA-43AA-9BD5-21228167910B.gif');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  filter:grayscale(1) brightness(.9) contrast(1.1);
  opacity:.65;pointer-events:none;z-index:0;
}
.core::after{
  content:"";position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(135deg, rgba(34,211,238,.45) 0%, rgba(34,211,238,.1) 50%, rgba(3,6,13,.4) 100%),
    linear-gradient(180deg, transparent 0%, rgba(3,6,13,.6) 100%);
  pointer-events:none;
}
.core-label{
  position:absolute;left:14px;bottom:12px;
  display:flex;align-items:center;gap:7px;
  font-size:9px;color:var(--cyan);
  font-family:"JetBrains Mono",monospace;
  letter-spacing:.25em;z-index:4;
  text-shadow:0 0 8px var(--cyan-glow);
  text-transform:uppercase;
}
.core-label::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan-glow);
  animation:blink 2s ease-in-out infinite;
}

/* ============================================================
   異常警告
   ============================================================ */
.alert-warning{
  position:relative;padding:14px 16px 12px;
  background:rgba(248,81,73,.06);
  border-bottom:1px solid rgba(248,81,73,.25);
  text-align:center;
}
.alert-warning::before{
  content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:repeating-linear-gradient(45deg,var(--red) 0 10px, transparent 10px 20px);
  animation:warningMove 3s linear infinite;opacity:.7;
}
@keyframes warningMove{
  from{background-position:0 0}
  to{background-position:40px 0}
}
.alert-warning-text{
  font-family:"JetBrains Mono",monospace;
  font-size:14px;font-weight:700;letter-spacing:.3em;
  color:var(--red);text-shadow:0 0 12px rgba(248,81,73,.6);
}
.alert-item{
  padding:12px 14px;border-bottom:1px solid var(--border);
  display:flex;gap:10px;align-items:flex-start;
}
.alert-item:last-child{border-bottom:none}
.alert-item .ic{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;
  background:rgba(248,81,73,.1);
  border:1px solid rgba(248,81,73,.3);
}
.alert-item .title{font-size:12px;font-weight:700;margin-bottom:3px}
.alert-item .desc{font-size:11px;color:var(--text-1);font-family:"JetBrains Mono",monospace}
.alert-rule{
  padding:12px 14px;font-size:10px;color:var(--text-2);
  text-align:center;border-top:1px solid var(--border);
  font-family:"JetBrains Mono",monospace;
}
.alert-empty{
  padding:24px 16px;text-align:center;
  color:var(--text-2);font-size:12px;letter-spacing:.1em;
}

/* ============================================================
   電表卡片
   ============================================================ */
.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-1);
  margin-bottom:var(--sp-2);
  animation:blockIn .5s cubic-bezier(.16,1,.3,1) backwards;
  animation-delay:.2s;
}
@media(min-width:540px){.grid{grid-template-columns:repeat(4,1fr)}}

.rack{
  position:relative;overflow:hidden;min-height:140px;
  padding:14px;display:flex;flex-direction:column;
  border:1px solid var(--border);border-radius:10px;
  background-color:#0a0f18;cursor:pointer;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.rack::before{
  content:"";position:absolute;inset:0;z-index:0;
  background-image:url('https://lonely52243.neocities.org/電表/IMG_3039.jpeg');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  filter:grayscale(.85) brightness(.7) contrast(1.2);
}
.rack::after{
  content:"";position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(180deg, rgba(34,211,238,.25) 0%, rgba(34,211,238,.05) 40%, rgba(3,6,13,.7) 100%),
    radial-gradient(circle at 50% 30%, rgba(34,211,238,.15), transparent 60%);
  pointer-events:none;
}
.rack:hover{
  transform:translateY(-2px);
  border-color:var(--cyan);
  box-shadow:0 0 20px rgba(34,211,238,.25);
}
.rack.off{filter:grayscale(.5) brightness(.7)}
.rack.off:hover{border-color:var(--border);box-shadow:none}

.hud{
  position:absolute;right:6px;bottom:6px;width:74px;height:74px;
  pointer-events:none;z-index:2;overflow:hidden;opacity:.85;
}
.hud .radar{
  position:absolute;top:50%;left:50%;
  width:60px;height:60px;margin-top:-30px;margin-left:-30px;
  border-radius:50%;
  border:1px solid rgba(34,211,238,.35);
  box-shadow:0 0 0 6px rgba(34,211,238,.05), inset 0 0 10px rgba(34,211,238,.15);
}
.hud .radar::before{
  content:"";position:absolute;inset:8px;border-radius:50%;
  border:1px dashed rgba(34,211,238,.25);
}
.hud .radar::after{
  content:"";position:absolute;inset:18px;border-radius:50%;
  border:1px solid rgba(34,211,238,.45);
  box-shadow:0 0 10px rgba(34,211,238,.3);
}
.hud .sweep{
  position:absolute;top:50%;left:50%;
  width:60px;height:60px;margin-top:-30px;margin-left:-30px;
  border-radius:50%;
  background:conic-gradient(from 0deg,
    rgba(34,211,238,.5) 0deg,
    rgba(34,211,238,.10) 40deg,
    transparent 60deg
  );
  animation:sweepRotate var(--sweep-speed, 3s) linear infinite;
  animation-delay:var(--sweep-delay, 0s);
}
@keyframes sweepRotate{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
.hud .dot{
  position:absolute;top:50%;left:50%;
  width:5px;height:5px;margin-top:-2.5px;margin-left:-2.5px;
  border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px rgba(34,211,238,.9);
}
.hud .codes{
  position:absolute;bottom:0;left:0;right:0;height:30px;overflow:hidden;opacity:.6;
  font-family:"JetBrains Mono",monospace;font-size:7px;line-height:1.4;
  color:rgba(34,211,238,.35);letter-spacing:.15em;
  text-align:center;white-space:nowrap;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 60%,#000 100%);
          mask-image:linear-gradient(180deg,transparent 0%,#000 60%,#000 100%);
}
.hud .codes .line{
  animation:codeRain var(--code-speed, 4s) linear infinite;
  animation-delay:var(--code-delay, 0s);
}
@keyframes codeRain{
  from{transform:translateY(0)}
  to{transform:translateY(-50%)}
}
.rack.off .hud{filter:grayscale(1) brightness(.6);opacity:.6}

.rack > .content{
  position:relative;z-index:3;
  display:flex;flex-direction:column;flex:1;
}
.rack-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:10px;
}
.rack-head .name{
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--text-0);text-shadow:0 0 10px rgba(3,6,13,.9);
}
.rack-head .id{
  font-size:9px;color:var(--cyan);opacity:.75;
  font-family:"JetBrains Mono",monospace;letter-spacing:.15em;
  text-shadow:0 0 6px rgba(3,6,13,.8);
}
.rack-value{
  font-size:26px;font-weight:700;line-height:1;white-space:nowrap;
  margin-bottom:3px;font-family:"JetBrains Mono",monospace;
  letter-spacing:-.02em;color:var(--text-0);
  text-shadow:0 0 14px rgba(34,211,238,.5), 0 0 4px rgba(3,6,13,.9);
}
.rack-value small{
  font-size:9px;color:var(--text-1);
  margin-left:3px;font-weight:500;letter-spacing:.1em;text-shadow:none;
}
.rack-delta{
  font-size:10px;color:var(--text-1);
  font-family:"JetBrains Mono",monospace;
  margin-bottom:auto;letter-spacing:.05em;
  text-shadow:0 0 4px rgba(3,6,13,.9);
}
.rack-delta.up{color:var(--cyan);text-shadow:0 0 8px var(--cyan-glow), 0 0 4px rgba(3,6,13,.9)}
.rack-delta .lbl{color:var(--text-2);margin-right:5px}
.rack-delta.miss{color:var(--yellow);text-shadow:0 0 8px var(--yellow-glow), 0 0 4px rgba(3,6,13,.9)}
.rack-delta.bad{color:var(--red);text-shadow:0 0 8px var(--red-glow), 0 0 4px rgba(3,6,13,.9)}
.rack-bar,.rack-status{margin-right:72px}
.rack-bar{
  height:2px;background:rgba(34,211,238,.12);
  border-radius:1px;overflow:hidden;margin-top:12px;
}
.rack-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));
  border-radius:1px;transition:width 1s ease;
  box-shadow:0 0 8px var(--cyan-glow);
}
.rack-status{
  font-size:9px;letter-spacing:.2em;
  margin-top:8px;color:var(--text-1);
  font-family:"JetBrains Mono",monospace;
  text-transform:uppercase;
  display:flex;align-items:center;gap:6px;
  text-shadow:0 0 4px rgba(3,6,13,.9);
}
.rack-status::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green-glow);
  animation:blink 2s ease-in-out infinite;
}
.rack.off .rack-status::before{
  background:var(--text-2);box-shadow:none;animation:none;
}
.rack.alert{border-color:rgba(248,81,73,.55);box-shadow:0 0 18px rgba(248,81,73,.18)}
.rack.alert .rack-status{color:var(--red)}
.rack.alert .rack-status::before{background:var(--red);box-shadow:0 0 8px var(--red-glow);animation:blink 1s ease-in-out infinite}
.rack.alert .rack-bar-fill{background:linear-gradient(90deg,var(--yellow),var(--red));box-shadow:0 0 8px var(--red-glow)}

/* ===== 統計格：下方列出是哪幾台，可點擊跳到異常清單 ===== */
body.mode-meter .stat .sub{
  margin-top:7px;font-size:10px;line-height:1.4;color:var(--text-1);
  font-family:"JetBrains Mono","Noto Sans TC",monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
body.mode-meter .stat.tap{cursor:pointer;transition:border-color .2s ease}
body.mode-meter .stat.tap:active{border-color:currentColor}

/* ===== 快速日期 ===== */
.date-quick{grid-column:1 / -1;display:flex;gap:6px;margin-top:2px}
.date-quick button{
  flex:1;height:30px;border-radius:6px;cursor:pointer;
  background:transparent;border:1px solid var(--border);
  color:var(--text-1);font:500 11px "Noto Sans TC",sans-serif;letter-spacing:.08em;
  transition:border-color .2s ease,color .2s ease;
}
.date-quick button.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.2)}
.date-quick button:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}

/* ============================================================
   年度報表
   ============================================================ */
.year-inner{padding:14px 16px 18px}
.cat{margin-bottom:20px}
.cat-head{
  font-size:12px;font-weight:700;color:var(--text-0);
  margin-bottom:10px;letter-spacing:.1em;
  display:flex;align-items:center;gap:8px;
}
.cat-head::before{
  content:"";width:3px;height:12px;
  background:var(--cyan);border-radius:1px;
  box-shadow:0 0 6px var(--cyan-glow);
}
.cat-chart-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mini-bars{display:flex;align-items:flex-end;gap:2px;flex:1;height:30px}
.mini-bar{
  flex:1;border-radius:1px;min-height:2px;
  background:linear-gradient(180deg,var(--cyan),var(--blue));
  box-shadow:0 0 4px rgba(34,211,238,.3);
}
.mini-bar.empty{background:var(--text-2);opacity:.22;height:2px;box-shadow:none}
.cat-total{
  font-size:14px;font-weight:700;color:var(--yellow);
  font-family:"JetBrains Mono",monospace;
  text-shadow:0 0 10px var(--yellow-glow);
}
.cat-total small{font-size:9px;color:var(--text-2);margin-left:2px;font-weight:400;text-shadow:none}
.divider-line{height:1px;background:var(--border-soft);margin:10px 0}
.months-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.month-row{display:flex;justify-content:space-between;font-size:11px;font-family:"JetBrains Mono",monospace}
.month-row .m{color:var(--text-2);font-size:10px}
.month-row .v{color:var(--text-0);font-weight:600}

/* ============================================================
   表格
   ============================================================ */
.table-scroll{
  max-height:420px;overflow:auto;
  -webkit-overflow-scrolling:touch;
}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:"JetBrains Mono",monospace}
th{
  position:sticky;-webkit-position:sticky;top:0;z-index:1;background:var(--panel-3);
  color:var(--text-2);font-weight:600;text-align:right;padding:10px;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  border-bottom:1px solid var(--border);
}
th:first-child{text-align:left}
td{
  padding:9px 10px;text-align:right;
  border-bottom:1px solid var(--border-soft);
  color:var(--text-0);font-variant-numeric:tabular-nums;
}
td:first-child{text-align:left;color:var(--text-1)}
th:first-child,td:first-child{
  position:sticky;-webkit-position:sticky;left:0;background:var(--panel-3);
  border-right:1px solid var(--border);
}
th:first-child{z-index:3}
td:first-child{z-index:2;background:var(--panel-2)}

/* ============================================================
   詳情面板
   ============================================================ */
.detail-overlay{
  position:fixed;inset:0;background:rgba(3,6,13,.92);
  backdrop-filter:blur(14px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;visibility:hidden;
  transition:opacity .25s ease, visibility 0s linear .25s;
}
.detail-overlay.show{
  opacity:1;visibility:visible;
  transition:opacity .25s ease, visibility 0s linear 0s;
}
.detail-panel{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--border-hi);
  border-radius:18px;width:100%;max-width:600px;max-height:90vh;
  overflow-y:auto;padding:24px;position:relative;
  transform:scale(.96);transition:transform .25s ease;
  box-shadow:0 0 40px rgba(34,211,238,.2);
}
.detail-overlay.show .detail-panel{transform:scale(1)}
.detail-close{
  position:absolute;top:18px;right:18px;width:34px;height:34px;
  border-radius:8px;background:var(--panel-2);border:1px solid var(--border);
  color:var(--text-1);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
  transition:border-color .2s ease, color .2s ease;
}
.detail-close:hover{border-color:var(--cyan);color:var(--cyan)}
.detail-title{
  font-size:15px;font-weight:700;margin-bottom:22px;
  display:flex;align-items:center;gap:10px;letter-spacing:.1em;
}
.detail-title .dot{
  width:9px;height:9px;border-radius:50%;
  box-shadow:0 0 10px currentColor;
}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.detail-stat{
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:10px;padding:14px 10px;text-align:center;
}
.detail-stat .k{
  font-size:9px;color:var(--text-2);margin-bottom:6px;
  font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.14em;
}
.detail-stat .v{font-size:16px;font-weight:700;font-family:"JetBrains Mono",monospace}
.detail-chart-wrap{
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:12px;padding:16px 12px 10px;margin-bottom:18px;
}
.detail-chart-title{
  font-size:10px;color:var(--text-2);margin-bottom:12px;
  display:flex;justify-content:space-between;
  font-family:"JetBrains Mono",monospace;
}
canvas{display:block;width:100%;height:auto}

/* ============================================================
   Loading / Error
   ============================================================ */
.loading,.error{text-align:center;padding:80px 20px;font-size:12px}
body.mode-meter .loading{
  color:var(--text-2);font-family:"JetBrains Mono",monospace;letter-spacing:.2em;
  background-image:url('https://lonely52243.neocities.org/電表/E557D929-BA84-4CA1-BBF5-5CE6FD501037.gif');
  background-repeat:no-repeat;background-position:center 60px;
  background-size:min(320px, 80%) auto;padding-top:220px;min-height:300px;
  filter:grayscale(.5);
}
.error{color:var(--red)}
.error b{display:block;margin-bottom:8px;font-size:14px}
#mainContent{display:none}
#mainContent.show{display:block}

/* ============================================================
   底部橫幅
   ============================================================ */
.footer-banner{
  width:100%;height:auto;border-radius:10px;overflow:hidden;
  position:relative;margin-top:var(--sp-2);
  border:1px solid var(--border-hi);
  background-color:#0a0f18;
  box-shadow:0 0 24px rgba(34,211,238,.12);
}
.footer-banner img{
  display:block;width:100%;height:auto;
  filter:grayscale(.75) brightness(.9) contrast(1.1);
}
.footer-banner::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(3,6,13,.4) 0%,transparent 30%,transparent 60%,rgba(3,6,13,.85) 100%),
    linear-gradient(135deg, rgba(34,211,238,.4) 0%, rgba(34,211,238,.08) 60%, rgba(3,6,13,.3) 100%);
  pointer-events:none;
}
.footer-banner .caption{
  position:absolute;bottom:0;left:0;right:0;
  padding:24px 16px 14px;
  background:linear-gradient(180deg,transparent 0%,rgba(3,6,13,.92) 75%);
  color:var(--cyan);font-size:10px;letter-spacing:.5em;
  text-align:center;font-weight:700;
  font-family:"JetBrains Mono",monospace;
  text-shadow:0 0 12px var(--cyan-glow);
  z-index:1;text-transform:uppercase;
}

/* ============================================================
   名冊頭部
   ============================================================ */
.roster-head{text-align:center;margin-bottom:20px}
.roster-knight{
  width:110px;height:110px;margin:0 auto 10px;
  background-image:url('https://lonely52243.neocities.org/IMG_2783.png');
  background-size:contain;background-repeat:no-repeat;background-position:center;
  image-rendering:pixelated;
  filter:drop-shadow(0 8px 16px rgba(139,111,58,.4));
  animation:knightFloat 3s ease-in-out infinite;
}
@keyframes knightFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.roster-title{
  font-size:18px;color:var(--forest);letter-spacing:.45em;
  font-weight:700;margin-bottom:8px;display:inline-block;
  text-shadow:0 1px 0 rgba(255,255,255,.4), 0 2px 4px rgba(139,111,58,.2);
}
.roster-sub{font-size:11px;color:var(--ink-2);letter-spacing:.18em}

/* ============================================================
   排序按鈕
   ============================================================ */
.sort-bar{display:flex;gap:8px;margin-bottom:20px;justify-content:center}
.sort-btn{
  flex:1;padding:11px 8px;
  background:linear-gradient(180deg, #f5e9c8 0%, #e8d18f 100%);
  border:1px solid #b8944f;border-radius:100px;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:12px;font-weight:600;color:#5a4f3a;
  letter-spacing:.18em;cursor:pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),
    inset 0 -2px 3px rgba(139,111,58,.2),
    0 2px 4px rgba(139,111,58,.15);
  transition:all .2s ease;
  position:relative;overflow:hidden;
}
.sort-btn:hover{
  transform:translateY(-1px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -2px 3px rgba(139,111,58,.3),
    0 4px 8px rgba(139,111,58,.25);
}
.sort-btn.active{
  background:linear-gradient(180deg, #c9a55c 0%, #8b6f3a 100%);
  color:#fdf6e3;border-color:#5a4f3a;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -2px 4px rgba(0,0,0,.2),
    0 0 12px rgba(201,165,92,.6);
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.sort-btn.active::after{
  content:"◆";
  position:absolute;top:4px;right:6px;
  font-size:7px;color:rgba(255,255,255,.6);
}

/* ============================================================
   名冊網格
   ============================================================ */
.roster-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

/* ===== 名冊工具列：搜尋＋等級階層篩選 ===== */
.roster-tools{display:flex;flex-direction:column;gap:10px;margin:-6px 0 18px}
.roster-search{position:relative}
.roster-search input{
  width:100%;height:40px;padding:0 14px 0 38px;border-radius:100px;
  background:linear-gradient(180deg,#fdf6e3,#f3e8cc);border:1px solid #b8944f;
  font:500 14px "Noto Serif TC",serif;color:var(--ink);outline:none;
  box-shadow:inset 0 2px 4px rgba(139,111,58,.15);-webkit-appearance:none;appearance:none;
}
.roster-search input::placeholder{color:#a08a63}
.roster-search input:focus{border-color:var(--gold);box-shadow:inset 0 2px 4px rgba(139,111,58,.15),0 0 0 3px rgba(201,165,92,.25)}
.roster-search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7;pointer-events:none}
.tier-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tier-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;height:32px;
  border-radius:8px;border:1px solid rgba(184,148,79,.55);
  background:rgba(253,246,227,.6);cursor:pointer;
  font:600 11px "Cinzel","Noto Serif TC",serif;color:var(--ink-2);
  transition:background .2s ease,border-color .2s ease;
}
.tier-btn i{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);flex-shrink:0}
.tier-btn b{font-weight:700;color:var(--ink)}
.tier-btn[data-t="gold"] i{background:#c9a55c;box-shadow:0 0 6px rgba(201,165,92,.8)}
.tier-btn[data-t="purple"] i{background:#8b5cf6;box-shadow:0 0 6px rgba(139,92,246,.6)}
.tier-btn[data-t="blue"] i{background:#3b6dba;box-shadow:0 0 6px rgba(59,109,186,.6)}
.tier-btn[data-t="gray"] i{background:#9ca3af}
.tier-btn.on{background:linear-gradient(180deg,#c9a55c,#8b6f3a);border-color:#5a4f3a;color:#fdf6e3}
.tier-btn.on b{color:#fff8e0}
.tier-btn:disabled{opacity:.4;cursor:default}
.tier-btn:focus-visible,.roster-search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ===== 卡片名次、排序對應數值、挑戰紀錄 ===== */
.card-rank{
  position:absolute;top:9px;right:11px;z-index:2;
  font:700 10px "Cinzel",serif;color:var(--ink-2);opacity:.7;letter-spacing:.04em;
}
.card-rank.top{opacity:1;font-size:15px;top:6px;filter:drop-shadow(0 1px 2px rgba(139,111,58,.4))}
.card-head-text{padding-right:16px}
.card-stat{font:600 10px "Noto Serif TC",serif;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-stat b{font-family:"Cinzel",serif;color:var(--forest);font-size:12px}
.card-best{
  display:inline-block;margin-left:6px;padding:1px 6px;border-radius:100px;
  font:700 9px "Cinzel",serif;color:#8b3a3a;background:rgba(139,58,58,.1);
  border:1px solid rgba(139,58,58,.3);vertical-align:1px;
}
.roster-empty{
  text-align:center;padding:40px 20px;color:var(--ink-2);
  font-size:12px;letter-spacing:.18em;
  grid-column:1 / -1;
}

/* ============================================================
   遊戲卡牌
   ============================================================ */
.card{
  position:relative;
  background:
    radial-gradient(ellipse at top, rgba(255,255,255,.5), transparent 60%),
    linear-gradient(170deg, #f5e9c8 0%, #e8dfc9 50%, #ded2b8 100%);
  border:1px solid #b8944f;
  border-radius:10px;
  padding:14px 14px 13px;
  cursor:pointer;
  min-height:118px;
  display:flex;flex-direction:column;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -1px 0 rgba(139,111,58,.2),
    inset 0 0 20px rgba(201,165,92,.15),
    0 2px 6px rgba(139,111,58,.2);
  transition:all .25s cubic-bezier(.16,1,.3,1);
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;top:6px;left:6px;
  width:8px;height:8px;
  border-top:1.5px solid #b8944f;
  border-left:1.5px solid #b8944f;
  opacity:.5;
}
.card::after{
  content:"";
  position:absolute;bottom:6px;right:6px;
  width:8px;height:8px;
  border-bottom:1.5px solid #b8944f;
  border-right:1.5px solid #b8944f;
  opacity:.5;
}
.card:hover{
  transform:translateY(-4px) scale(1.01);
  border-color:#c9a55c;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -1px 0 rgba(139,111,58,.2),
    inset 0 0 24px rgba(201,165,92,.25),
    0 8px 20px rgba(139,111,58,.3),
    0 0 24px rgba(201,165,92,.3);
}

/* 卡片稀有度 */
.card.rarity-blue{
  border-color:#3b6dba;
  background:
    radial-gradient(ellipse at top, rgba(219,234,254,.7), transparent 60%),
    linear-gradient(170deg, #eaf2ff 0%, #dbeafe 50%, #c9d9f2 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -1px 0 rgba(59,109,186,.2),
    inset 0 0 20px rgba(59,109,186,.12),
    0 2px 6px rgba(59,109,186,.2);
}
.card.rarity-blue:hover{
  border-color:#3b6dba;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -1px 0 rgba(59,109,186,.2),
    inset 0 0 24px rgba(59,109,186,.2),
    0 8px 20px rgba(59,109,186,.3),
    0 0 24px rgba(59,109,186,.4);
}
.card.rarity-purple{
  border-color:#8b5cf6;
  background:
    radial-gradient(ellipse at top, rgba(237,233,254,.7), transparent 60%),
    linear-gradient(170deg, #f0eaff 0%, #ede9fe 50%, #ddd0f5 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -1px 0 rgba(139,92,246,.2),
    inset 0 0 20px rgba(139,92,246,.15),
    0 2px 6px rgba(139,92,246,.25);
}
.card.rarity-purple:hover{
  border-color:#8b5cf6;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -1px 0 rgba(139,92,246,.2),
    inset 0 0 24px rgba(139,92,246,.25),
    0 8px 20px rgba(139,92,246,.35),
    0 0 28px rgba(139,92,246,.5);
}
.card.rarity-gold{
  border-color:#c9a55c;
  background:
    radial-gradient(ellipse at top, rgba(254,243,199,.8), transparent 60%),
    linear-gradient(170deg, #fdf6e3 0%, #fef3c7 50%, #f3dfa0 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(201,165,92,.3),
    inset 0 0 24px rgba(201,165,92,.2),
    0 2px 6px rgba(201,165,92,.3),
    0 0 16px rgba(201,165,92,.25);
}
.card.rarity-gold::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(120deg, transparent 40%, rgba(255,255,255,.4) 50%, transparent 60%);
  background-size:200% 100%;
  animation:goldShine 4s ease-in-out infinite;
  pointer-events:none;
  z-index:1;
}
@keyframes goldShine{
  0%,100%{background-position:200% 0}
  50%{background-position:-100% 0}
}
.card.rarity-gold:hover{
  border-color:#c9a55c;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(201,165,92,.3),
    inset 0 0 28px rgba(201,165,92,.3),
    0 8px 22px rgba(201,165,92,.4),
    0 0 28px rgba(201,165,92,.5);
}

.card-head{display:flex;align-items:center;gap:11px;margin-bottom:8px;position:relative;z-index:2}
.card-head-text{flex:1;min-width:0}

/* 等級徽章 */
.card-badge{
  width:52px;height:52px;border-radius:50%;

.cx-box{width:100%;max-width:480px;display:flex;flex-direction:column;background:linear-gradient(180deg,#160f1f,#0b0911);border-left:2px solid rgba(201,165,92,.5);border-right:2px solid rgba(201,165,92,.5);color:#e8f2ff;font-family:"Noto Sans TC",sans-serif}

.cx-tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}

.cx-note{margin-top:12px;text-align:center;font:11px "Noto Sans TC",sans-serif;color:#6f819b}

.cx-ti{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}

.cx-bonus{width:100%;display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;background:linear-gradient(90deg,rgba(163,113,247,.18),rgba(163,113,247,.05));border:1px solid rgba(163,113,247,.45);color:#e8f2ff}

.cx-bonus b{display:block;font:700 13px "Noto Serif TC",serif;color:#e3d2ff}

.cx-bars{display:grid;gap:4px}

.cx-rc{display:grid;gap:6px}

.cx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.cx-grid b{font:700 13px "JetBrains Mono","Noto Sans TC",monospace;color:#ffe9b0}
.cx-chips-f{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}

.cx-chips-f button.on{background:#c9a55c;color:#1a1206;border-color:#c9a55c}

.cx-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:10px 4px 8px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:#8ba0bd;text-align:center}

.cx-tile.new{border-color:#f85149;box-shadow:0 0 0 1px rgba(248,81,73,.4),0 0 12px rgba(248,81,73,.25)}
.cx-tic{height:56px;display:flex;align-items:center;justify-content:center}
.cx-tile b{display:block;width:100%;font:700 12px/1.3 "Noto Serif TC",serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-tile small{font:10.5px "Noto Sans TC",sans-serif;opacity:.8;white-space:nowrap}
.cx-new{position:absolute;top:-6px;right:-4px;padding:1px 5px;border-radius:6px;background:#f85149;color:#fff;font:800 9px "JetBrains Mono",monospace;font-style:normal;letter-spacing:.05em;box-shadow:0 2px 6px rgba(0,0,0,.4)}

.cx-gray{display:inline-flex;filter:grayscale(1) brightness(.45)}
.cx-mav{flex:none;width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid #c9a55c;background-color:#0a0f18;background-repeat:no-repeat;image-rendering:pixelated}

.cx-tier{padding:12px;margin-bottom:12px;border-radius:12px;background:linear-gradient(180deg,rgba(163,113,247,.14),rgba(20,10,30,.4));border:1px solid rgba(163,113,247,.4)}
.cx-tier-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.cx-tier-h span{font:11px "Noto Sans TC",sans-serif;color:#b8a6d8}

.cx-tier-s div.on{background:rgba(163,113,247,.35);border-color:#c4a8f5}
.cx-tier-s b{display:block;font:700 11px "JetBrains Mono",monospace;color:#e3d2ff}
.cx-tier-s small{font:9.5px "Noto Sans TC",sans-serif;color:#9f8fc0}
.cx-tier>small{font:11px "Noto Sans TC",sans-serif;color:#cdbdf0}
.cx-gsum{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(201,165,92,.08);border:1px solid rgba(201,165,92,.25);font:12px "Noto Sans TC",sans-serif;color:#b8c5d8}

.cx-gsum b{color:#ffd54a;font-family:"JetBrains Mono",monospace}
.cx-god{margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(201,165,92,.25);overflow:hidden}
.cx-god.open{background:rgba(201,165,92,.06)}
.cx-gh{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:0;background:transparent;cursor:pointer;text-align:left;color:inherit}
.cx-gh>div{flex:1;min-width:0}
.cx-gh b{display:block;font:700 15px "Noto Serif TC",serif;color:#f3e6c4}
.cx-gh small{display:inline-flex;align-items:center;gap:3px;font:11px "Noto Sans TC",sans-serif;color:#c9b27a}
.cx-gh>em{font:700 12px "JetBrains Mono",monospace;font-style:normal;color:#e8d18f}
.cx-chev{color:#8ba0bd;font-size:14px;width:14px;text-align:center}
.cx-god .cx-chips,.cx-god .cx-gx{padding:0 10px}
.cx-god .cx-gx{padding-bottom:10px}
.cx-chips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.cx-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px 3px 4px;border-radius:100px;border:1px solid;font:11px "Noto Sans TC",sans-serif;color:#e8f2ff;background:rgba(0,0,0,.25)}
.cx-chip.no{border-color:#2a3346;color:#4a5a72;padding:3px 8px}
.cx-gx{display:flex;flex-wrap:wrap;gap:4px 12px;font:11px "Noto Sans TC",sans-serif;color:#9fb0c8}
.cx-gx span{display:inline-flex;align-items:center;gap:3px}
/* 詳細頁 */
.cx-sheet{position:fixed;inset:0;z-index:2;display:none;align-items:flex-end;justify-content:center}
.cx-ov.sh .cx-sheet{display:flex}
.cx-sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.cx-sh-box{position:relative;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;padding:8px 16px calc(22px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:linear-gradient(180deg,#221733,#110c19);border-top:2px solid #c9a55c;box-shadow:0 -10px 30px rgba(0,0,0,.6);color:#e8f2ff;animation:cxUp .25s ease;overscroll-behavior:contain}
@keyframes cxUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.cx-sh-grip{width:40px;height:4px;margin:0 auto 6px;border-radius:2px;background:rgba(255,255,255,.2)}
.cx-sh-top{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;padding-top:6px}

.cx-sh-ic.lock{filter:grayscale(1) brightness(.55)}
.cx-sh-nav{width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,165,92,.4);background:rgba(255,255,255,.04);color:#e8d18f;font-size:22px;line-height:1;cursor:pointer}
.cx-sh-nav:disabled{opacity:.25;cursor:default}
.cx-sh-tag{margin-top:8px;text-align:center;font:600 11px "Noto Sans TC",sans-serif;letter-spacing:.15em;color:#c4a8f5}
.cx-sh-nm{text-align:center;font:900 20px "Noto Serif TC",serif;color:#ffe9b0;letter-spacing:.08em}
.cx-sh-pos{text-align:center;font:10px "JetBrains Mono",monospace;color:#6f819b;margin-top:2px}
.cx-sh-body{margin-top:12px}
.cx-sh-sec{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(201,165,92,.2)}
.cx-sh-t{font:700 12px "Noto Serif TC",serif;color:#c9a55c;letter-spacing:.12em;margin-bottom:6px}
.cx-sh-sec p{margin:0;font:13px/1.7 "Noto Sans TC",sans-serif;color:#d8e2f0}
.cx-sh-sec p+p{margin-top:4px}
.cx-good{color:#a5e8b0!important}
.cx-bad{color:#ffb3ad!important}
.cx-dim{color:#7d8ea8!important}
.cx-hl{color:#e3d2ff}
.cx-quote{font-family:"Noto Serif TC",serif!important;color:#ffd54a!important}
.cx-sh-st{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-top:12px}
.cx-sh-st div{padding:10px 4px;border-radius:10px;text-align:center;background:rgba(255,213,74,.06);border:1px solid rgba(255,213,74,.2)}
.cx-sh-st small{display:block;font:10px "Noto Sans TC",sans-serif;color:#8ba0bd;margin-bottom:3px}
.cx-sh-st b{font:700 15px "JetBrains Mono","Noto Sans TC",monospace;color:#ffe9b0}
.cx-lv{display:grid;gap:6px}
.cx-lv div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);font:12px/1.5 "Noto Sans TC",sans-serif}
.cx-lv div.on{border-color:rgba(255,213,74,.45)}
.cx-lv b{font:700 12px "Noto Serif TC",serif;color:#e8d18f}
.cx-link{display:flex;align-items:center;gap:6px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(201,165,92,.35);background:rgba(0,0,0,.2);color:#f3e6c4;font:700 13px "Noto Serif TC",serif;cursor:pointer;text-align:left}
.cx-link small{font:400 11px "Noto Sans TC",sans-serif;color:#8ba0bd}
.st-cxbtn{width:100%;margin-top:10px}
@media (prefers-reduced-motion:reduce){.cx-ov.on,.cx-sh-box{animation:none}}
@media (max-width:360px){.cx-grid3{gap:6px}.cx-tile b{font-size:11px}}
/* ===== 戰鬥加速按鈕 ===== */
.bt-head{position:relative}
.bt-spd{display:inline-flex;align-items:center;gap:3px;padding:4px 10px 4px 6px;font-size:12px;border-color:#c9a55c;color:#e8d18f;background:linear-gradient(180deg,rgba(201,165,92,.22),rgba(201,165,92,.06))}
.bt-spd span{font:800 12px "JetBrains Mono","Noto Sans TC",sans-serif;letter-spacing:.02em}
.bt-spd.lock{border-color:#f85149;color:#ffb3ad;background:rgba(248,81,73,.15);padding:4px 8px}
.bt-spd.lock span{font-size:11px;letter-spacing:0}
.bt-spd.hint{animation:spdPulse 1.4s ease-in-out infinite}
@keyframes spdPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,213,74,.6)}50%{box-shadow:0 0 0 6px rgba(255,213,74,0)}}
.bt-spdtip{position:absolute;z-index:30;padding:7px 11px;border-radius:10px;background:#ffd54a;color:#1a1206;font:700 12px "Noto Sans TC",sans-serif;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none;animation:fadeIn .3s ease}
.bt-spdtip::before{content:"";position:absolute;top:-6px;left:var(--ax,50%);margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#ffd54a}
.bt-spdtip b{color:#8b3a3a}
.bt-spdtip.out{opacity:0;transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.bt-spd.hint{animation:none;box-shadow:0 0 0 2px #ffd54a}}
/* ===== 名冊新手指南 ===== */
.rg{position:relative;margin:0 0 16px;padding:14px 14px 12px;border-radius:12px;background:linear-gradient(180deg,var(--paper-2),var(--paper-3));border:1px solid var(--gold);box-shadow:0 4px 14px rgba(139,111,58,.18);color:var(--ink);font-family:"Noto Sans TC",sans-serif}
.rg[hidden]{display:none}
.rg-hd{display:flex;align-items:center;gap:6px;font:700 12px "Noto Serif TC",serif;letter-spacing:.2em;color:var(--gold-3)}
.rg-hd span{flex:1}
.rg-x{width:30px;height:30px;border-radius:50%;border:1px solid rgba(139,111,58,.4);background:rgba(255,255,255,.4);color:var(--ink-2);font-size:14px;cursor:pointer}
.rg-body{display:flex;gap:12px;align-items:flex-start;margin-top:8px;min-height:74px}
.rg-ic{flex:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:30px}
.rg-tx b{display:block;font:700 15px "Noto Serif TC",serif;color:var(--ink);margin-bottom:3px}
.rg-tx p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-2)}
.rg-ft{display:flex;align-items:center;gap:8px;margin-top:10px}
.rg-dots{flex:1;display:flex;gap:5px}
.rg-dots i{width:7px;height:7px;border-radius:50%;background:rgba(139,111,58,.3)}
.rg-dots i.on{background:var(--gold-3);width:16px;border-radius:4px}
.rg-btn{padding:6px 12px;border-radius:100px;border:1px solid var(--gold-3);background:transparent;color:var(--gold-3);font:700 12px "Noto Sans TC",sans-serif;cursor:pointer}
.rg-btn.pri{background:var(--gold-3);color:var(--paper)}
.rg-btn:disabled{opacity:.35;cursor:default}
.rg-off{display:block;margin:8px auto 0;padding:4px 8px;border:0;background:none;color:var(--ink-2);font:12px "Noto Sans TC",sans-serif;text-decoration:underline;cursor:pointer}
.rg button:focus-visible{outline:2px solid var(--gold-3);outline-offset:2px}
/* ===== 戰鬥上方精簡 ===== */
.bt-head{flex-wrap:nowrap!important;gap:6px}
.bt-ttl{flex:none;font-size:18px!important;letter-spacing:0!important}
.bt-fl{margin-right:0!important;flex:none}
.bt-goal{order:0!important;flex:1 1 auto!important;min-width:0;max-width:none!important;text-align:left!important}
.bt-spd,.bt-chip,.bt-x{flex:none}
.bt-legend-bar{flex-wrap:nowrap!important;justify-content:flex-start!important;overflow-x:auto;overflow-y:hidden;max-height:none!important;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bt-legend-bar::-webkit-scrollbar{display:none}
.bt-legend-bar .lbc{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}

.lbc .lbt{font-style:normal;margin-left:2px;color:#c9a55c}
.lb-empty{font:10px "JetBrains Mono",monospace;color:#4a5a72;white-space:nowrap}
.bt-mastery:empty{display:none}
.bt-mastery{flex-direction:column;align-items:stretch;gap:6px;padding:8px;border-radius:8px;background:rgba(201,165,92,.05);border:1px solid rgba(201,165,92,.2)}
.bt-drawer-bl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bt-drawer-m{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
/* ===== 戰利品連續視窗 ===== */
.bt-modal.chain .bt-modal-box{animation:none!important}
.bt-modal.chain{transition:none}
.loot-step{display:flex;align-items:center;justify-content:center;gap:6px;margin:-6px 0 10px;font:700 11px "Noto Sans TC",sans-serif;color:#c9a55c;letter-spacing:.08em}
.loot-step span{display:inline-flex;gap:3px}
.loot-step i{width:6px;height:6px;border-radius:50%;background:rgba(201,165,92,.35)}
.loot-step i.on{background:#ffd54a;box-shadow:0 0 6px #ffd54a}
/* ===== 面板外觀統一：標題字型、關閉鈕 ===== */
.cx-hb b,.ac-hd b{font:900 17px "Cinzel","Noto Serif TC",serif!important;color:#e8d18f!important;letter-spacing:.12em!important;text-shadow:0 0 12px rgba(201,165,92,.5)}
.ac-box,.cx-box{border-color:#c9a55c}
/* ===== 雲端存檔／存檔與帳號 ===== */
.cl-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:600;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:16px;background:rgba(11,17,28,.96);border:1px solid #c9a55c;color:#ffe9b0;font:600 13px/1.5 "Noto Sans TC",sans-serif;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none}
.cl-top{z-index:520}
.cl-bigcode{margin:6px 0 10px;text-align:center;font:900 30px "JetBrains Mono",monospace;letter-spacing:.12em;color:#ffd54a;user-select:all;-webkit-user-select:all}
.cx-open.acct{width:56px;letter-spacing:.1em;font-size:12px}
.bt-entry-row{gap:6px}
.bt-entry-row .cx-open:not(.acct){width:64px;font-size:12px;letter-spacing:.1em}
.bt-entry-row .bt-entry{padding:10px 8px;gap:4px;flex-direction:column;justify-content:center}
.bt-entry-row .bt-entry .t{flex:none;white-space:nowrap;letter-spacing:.15em}
.bt-entry-row .bt-entry>g-i.gi{display:none}
.ac-link b{color:#f3e6c4!important;font-weight:700!important}
.ac-link small{display:block}
.ac-ov{position:fixed;inset:0;z-index:390;display:none;align-items:flex-end;justify-content:center;background:rgba(3,6,13,.8)}
.ac-ov.on{display:flex;animation:fadeIn .2s ease}
.ac-box{width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;background:linear-gradient(180deg,#1a1626,#0d0b14);border-top:2px solid #c9a55c;color:#e8f2ff;font-family:"Noto Sans TC",sans-serif;animation:cxUp .25s ease}
.ac-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid rgba(201,165,92,.25)}
.ac-hd b{font:900 17px "Noto Serif TC",serif;letter-spacing:.12em;color:#ffe9b0}
.ac-body{overflow-y:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.ac-st{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--c)}
.ac-st i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.ac-st b{display:block;font:700 15px "Noto Serif TC",serif;color:var(--c)}
.ac-st small{font-size:12px;line-height:1.5;color:#b8c5d8}
.ac-code{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;margin-top:10px;padding:12px;border-radius:12px;background:rgba(255,213,74,.07);border:1px solid rgba(255,213,74,.35)}
.ac-code small{grid-column:1/-1;font-size:11px;color:#c9b27a}
.ac-code b{font:900 26px "JetBrains Mono",monospace;letter-spacing:.1em;color:#ffd54a;user-select:all;-webkit-user-select:all}
.ac-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ac-btns .bt-modal-btn,.ac-btns .bt-rs-new{width:100%;margin:0}
.ac-sec{margin:18px 2px 6px;font:700 12px "Noto Serif TC",serif;letter-spacing:.15em;color:#c9a55c}
.ac-note{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);font-size:12px;line-height:1.7;color:#9fb0c8}
.ac-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.ac-ic{flex:none;width:26px;text-align:center;font-size:18px}
.ac-tx{flex:1;min-width:0}
.ac-tx b{display:block;font-size:14px;color:#f3e6c4}
.ac-tx small{font-size:11.5px;color:#8ba0bd}
.ac-row .rk-edit{margin-left:0;flex:none}
.ac-link{width:100%;display:flex;align-items:center;gap:10px;padding:8px 2px;border:0;background:none;color:inherit;text-align:left;cursor:pointer}
.ac-link i{flex:none;width:10px;height:10px;border-radius:50%}
.ac-link span{flex:1;min-width:0}
.ac-link b{display:block;font-size:14px}
.ac-link small{font-size:11.5px;color:#8ba0bd}
.ac-link em{font-style:normal;font-size:20px;color:#c9a55c}
.ac-ov button:focus-visible,.ac-link:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ac-ov.on,.ac-box{animation:none}}


/* ============================================================
   v8：切換按鈕、同步列、提示、小字調亮、加到主畫面
   ============================================================ */
/* 切換按鈕：電表永遠是青色、名冊永遠是金色，沒選到的也看得出可以點 */
.switch-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;letter-spacing:.3em}
.switch-btn .sw-t{font-size:13px;font-weight:700}
.switch-btn .sw-s{font-size:9.5px;font-weight:500;letter-spacing:.12em;opacity:.8;font-family:"Noto Sans TC",sans-serif}
body.mode-meter .switch-btn[data-mode="meter"],body.mode-roster .switch-btn[data-mode="meter"]{color:rgba(34,211,238,.75);font-family:"Noto Sans TC",sans-serif}
body.mode-meter .switch-btn[data-mode="roster"],body.mode-roster .switch-btn[data-mode="roster"]{color:rgba(224,190,110,.85);font-family:"Cinzel","Noto Serif TC",serif}
body.mode-roster .switch-btn[data-mode="meter"]{color:#0e7490}
body.mode-meter .switch-btn[data-mode="meter"].active{color:var(--cyan);text-shadow:0 0 10px var(--cyan-glow)}
body.mode-roster .switch-btn[data-mode="roster"].active{color:var(--gold-3)}
body.mode-meter .switch-btn[data-mode="roster"]{text-shadow:0 0 8px rgba(201,165,92,.35)}
.switch-btn{position:relative}
.sw-bubble{position:absolute;top:calc(100% + 8px);right:6px;z-index:30;width:min(240px,62vw);padding:10px 12px;border-radius:10px;
  background:linear-gradient(180deg,#2b2214,#1a140b);border:1px solid rgba(224,190,110,.7);color:#f3e2b8;
  font:500 12px/1.55 "Noto Sans TC",sans-serif;letter-spacing:.02em;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.6);cursor:pointer;animation:swBub .35s ease-out}
.sw-bubble::before{content:"";position:absolute;top:-7px;right:40px;width:12px;height:12px;transform:rotate(45deg);background:#2b2214;border-left:1px solid rgba(224,190,110,.7);border-top:1px solid rgba(224,190,110,.7)}
.sw-bubble small{display:block;margin-top:4px;color:#c9a55c;font-size:10.5px}
@keyframes swBub{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* 同步列：最後更新時間／連不到資料 */
.sync-bar{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;padding:7px 12px;border-radius:8px;
  border:1px solid var(--border);background:rgba(11,17,28,.6);color:var(--text-1);
  font:500 11px "Noto Sans TC","JetBrains Mono",sans-serif;letter-spacing:.04em}
.sync-bar[hidden]{display:none}
.sync-bar i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green-glow)}
.sync-bar.wait i{background:var(--cyan);box-shadow:0 0 6px var(--cyan-glow);animation:blink 1s ease-in-out infinite}
.sync-bar.err{border-color:rgba(248,81,73,.5);color:#ffb4ae}
.sync-bar.err i{background:var(--red);box-shadow:0 0 6px var(--red-glow)}
.sync-bar span{flex:1;min-width:0}
.sync-bar button,.error .retry{flex:none;padding:5px 12px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;font:600 11px "Noto Sans TC",sans-serif;cursor:pointer}
.error .retry{display:inline-block;margin-top:14px;padding:8px 22px;font-size:13px;color:var(--cyan)}

/* 日期說明、電表區標題 */
.date-note{grid-column:1 / -1;margin-top:4px;font:500 10.5px/1.5 "Noto Sans TC",sans-serif;color:#9fb2cc;letter-spacing:.03em}
.date-note b{color:var(--cyan);font-weight:700}
.grid-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 2px 8px;color:var(--cyan);
  font:700 12px "Noto Sans TC",sans-serif;letter-spacing:.15em}
.grid-title small{font-size:10px;font-weight:500;color:#9fb2cc;letter-spacing:.03em;text-align:right}


/* 未回報名單完整顯示（換行） */
body.mode-meter .stat .sub{white-space:normal;overflow:visible;text-overflow:clip}

/* 今天尚未回報（還不到「已 X 天」）：顏色淡一點 */
.rack-delta.miss.soft{color:#e3c27a;text-shadow:0 0 4px rgba(3,6,13,.9)}

/* 小字調亮（顏色、版面都不變，只是比較好讀） */
body.mode-meter .stat .k{font-size:10px;color:#9fb2cc}
body.mode-meter .stat .v small{color:#9fb2cc}
body.mode-meter .stat .sub{color:#b4c4da}
.rack-value small{color:#a9bad3}
.rack-head .id{opacity:1}
.rack-delta .lbl{color:#8fa3bf}
.rack-status{color:#a9bad3}
.date-quick button{color:#b4c4da}

/* 提示（電表頁：青色科技風） */
.m-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:900;width:min(460px,calc(100vw - 32px));
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
  background:linear-gradient(180deg,rgba(16,24,38,.97),rgba(6,11,20,.97));border:1px solid rgba(34,211,238,.55);
  box-shadow:0 0 22px rgba(34,211,238,.25),0 8px 24px rgba(0,0,0,.6);color:#e8f2ff;
  font:500 12.5px/1.5 "Noto Sans TC",sans-serif;animation:mToast .35s ease-out}
.m-toast b{color:var(--cyan,#22d3ee)}
.m-toast span{flex:1;min-width:0}
.m-toast button{flex:none;padding:6px 10px;border-radius:7px;border:1px solid rgba(34,211,238,.6);background:rgba(34,211,238,.12);color:#22d3ee;font:600 11.5px "Noto Sans TC",sans-serif;cursor:pointer}
.m-toast button.x{border-color:transparent;background:none;color:#8ba0bd;padding:6px 4px}
@keyframes mToast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* 加到主畫面提醒：跟著所在頁面的風格 */
.a2hs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:899;width:min(460px,calc(100vw - 24px));
  padding:12px 14px 10px;border-radius:14px;font:500 12.5px/1.55 "Noto Sans TC",sans-serif;animation:mToast .4s ease-out}
.a2hs[hidden]{display:none}
.a2hs .a2-hd{display:flex;align-items:center;gap:10px}
.a2hs .a2-ic{flex:none;width:40px;height:40px;border-radius:10px;background:#03060d url('apple-touch-icon.png') center/cover;border:1px solid rgba(255,255,255,.15)}
.a2hs .a2-tx{flex:1;min-width:0}
.a2hs .a2-tx b{display:block;font-size:13.5px}
.a2hs .a2-steps{margin:8px 0 2px;padding:8px 10px;border-radius:8px;font-size:12px}
.a2hs .a2-ft{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.a2hs .a2-ft button{padding:6px 12px;border-radius:7px;font:600 12px "Noto Sans TC",sans-serif;cursor:pointer;background:transparent}
body.mode-meter .a2hs{background:linear-gradient(180deg,rgba(16,24,38,.98),rgba(6,11,20,.98));border:1px solid rgba(34,211,238,.55);color:#e8f2ff;box-shadow:0 0 22px rgba(34,211,238,.22),0 8px 24px rgba(0,0,0,.6)}
body.mode-meter .a2hs .a2-tx b{color:#22d3ee}
body.mode-meter .a2hs .a2-steps{background:rgba(34,211,238,.08);color:#b4c4da}
body.mode-meter .a2hs .a2-ft button{border:1px solid rgba(139,160,189,.4);color:#b4c4da}
body.mode-meter .a2hs .a2-ft button.pri{border-color:#22d3ee;color:#22d3ee;background:rgba(34,211,238,.12)}
body.mode-roster .a2hs{background:linear-gradient(180deg,#fdf6e3,#f3e8cc);border:1px solid #b8944f;color:#3b2f1c;box-shadow:0 8px 24px rgba(60,40,10,.35)}
body.mode-roster .a2hs .a2-tx b{color:#8b6f3a;font-family:"Noto Serif TC",serif}
body.mode-roster .a2hs .a2-steps{background:rgba(201,165,92,.15);color:#5a4a2e}
body.mode-roster .a2hs .a2-ft button{border:1px solid rgba(139,111,58,.45);color:#6b5530}
body.mode-roster .a2hs .a2-ft button.pri{border-color:#8b6f3a;background:linear-gradient(180deg,#c9a55c,#8b6f3a);color:#fdf6e3}
body.bt-open .a2hs,body.bt-open .m-toast{display:none}
@media (prefers-reduced-motion:reduce){.sw-bubble,.m-toast,.a2hs{animation:none}}
</style>

/* ============================================================

   ============================================================ */
function getAudioCtx(){
  if(audioCtx) return audioCtx;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  } catch(e){ audioCtx = null; }
  return audioCtx;
}
function initAudioOnFirstGesture(){
  const once = () => {
    const ctx = getAudioCtx();
    if(ctx && ctx.state === "suspended"){
      try { ctx.resume(); } catch(e){}
    }
    document.removeEventListener("pointerdown", once);
    document.removeEventListener("touchstart", once);
    document.removeEventListener("click", once);
  };
  document.addEventListener("pointerdown", once, { once: true, passive: true });
  document.addEventListener("touchstart", once, { once: true, passive: true });
  document.addEventListener("click", once, { once: true });
}
function playTone(fs, fe, d, v, t){
  const ctx = getAudioCtx();
  if(!ctx) return;
  if(ctx.state === "suspended"){ try{ ctx.resume(); }catch(e){} }
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = t || "sine";
  osc.frequency.setValueAtTime(fs, now);
  if(fe != null && fe !== fs) osc.frequency.exponentialRampToValueAtTime(fe, now + d);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(v, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + d);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + d + 0.02);
}

function animateNumber(key, from, to, duration, decimals, callback){
  if(typeof callback !== "function") return;
  if(runningAnims.has(key)){
    cancelAnimationFrame(runningAnims.get(key));
    runningAnims.delete(key);
  }
  const start = performance.now();
  duration = duration || 600;
  decimals = decimals || 0;
  const fmt = v => v.toFixed(decimals);
  callback(fmt(from));
  function step(now){
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = from + (to - from) * eased;
    callback(fmt(val));
    if(t < 1) runningAnims.set(key, requestAnimationFrame(step));
    else runningAnims.delete(key);
  }
  runningAnims.set(key, requestAnimationFrame(step));
}

   ============================================================ */
/* ============================================================
   載入資料
   1. 手機裡有上次的資料 → 立刻顯示，同時在背景抓新的
   2. 抓到新的 → 自動換上，記下「最後更新」時間
   3. 抓不到 → 有舊資料就繼續顯示並提示；完全沒資料才顯示錯誤畫面＋重試
   ============================================================ */
const DATA_CACHE_KEY = "meter_data_cache_v1";
const REPORT_HOUR = 8;                       // 這個時間以前，還不算「今天沒回報」
let _dataTime = 0;                           // 目前畫面上資料的時間
let _dateInited = false;
let _fetching = false;

function readDataCache(){
  try{
    const c = JSON.parse(localStorage.getItem(DATA_CACHE_KEY));
    return c && Array.isArray(c.data) && c.data.length ? c : null;
  }catch(e){ return null; }
}
function saveDataCache(rows, users){
  try{ localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({t:Date.now(), data:rows, users:users})); }
  catch(e){ try{ localStorage.removeItem(DATA_CACHE_KEY); }catch(x){} }
}
function hhmm(t){ const d = new Date(t); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function mdhm(t){ const d = new Date(t); return (d.getMonth()+1) + "/" + d.getDate() + " " + hhmm(t); }
function isTodayTime(t){ const a = new Date(t), b = new Date(); return a.toDateString() === b.toDateString(); }

/* 畫面上方的同步列 */
function setSync(state, msg){
  const bar = document.getElementById("syncBar");
  if(!bar) return;
  if(!meterRendered){ bar.hidden = true; return; }
  bar.hidden = false;
  bar.className = "sync-bar" + (state === "wait" ? " wait" : state === "err" ? " err" : "");
  const when = _dataTime ? (isTodayTime(_dataTime) ? hhmm(_dataTime) : mdhm(_dataTime)) : "—";
  if(state === "wait") bar.innerHTML = '<i></i><span>先顯示上次的資料（' + when + '），正在更新…</span>';
  else if(state === "err") bar.innerHTML = '<i></i><span>連不到資料，目前顯示 ' + when + ' 的資料</span><button type="button" onclick="retryLoad()">重試</button>';
  else bar.innerHTML = '<i></i><span>最後更新 ' + when + '</span>';
}

/* 把資料放上畫面（新資料、手機裡的舊資料都走這裡） */
function applyData(rows, users){
  const list = (rows || []).filter(r => {
    if(!r || !r["日期"]) return false;
    for(let i=0;i<METERS.length;i++) if(typeof r[METERS[i]] === "number") return true;
    return false;
  });
  if(!list.length) return false;
  data = list;
  usersData = users || [];
  resetCache();
  els.loadingText.style.display = "none";
  els.errorText.style.display = "none";
  els.mainContent.classList.add("show");
  initDateRange();
  renderMeterAll();
  renderYearReport();
  renderRoster();
  meterRendered = true;
  return true;
}

function loadData(){
  const c = readDataCache();
  if(c && !meterRendered && applyData(c.data, c.users)){
    _dataTime = c.t || 0;
    log("先顯示手機裡的資料", { t: _dataTime });
    setSync("wait");
  }
  fetchData();
}
function fetchData(){
  if(_fetching) return;
  _fetching = true;
  if(meterRendered) setSync("wait");
  // 修正 #6：設定逾時
  if(_apiTimer) clearTimeout(_apiTimer);
  _apiTimer = setTimeout(() => {
    _apiTimer = null;
    _fetching = false;
    showError("連線逾時，請檢查網路後重試");
  }, CONFIG.API_TIMEOUT);

  const cb = "gapi" + Date.now();
  window[cb] = function(json){
    if(_apiTimer){ clearTimeout(_apiTimer); _apiTimer = null; }
    _fetching = false;
    try { delete window[cb]; } catch(e) {}
    if(!json || !json.ok){ showError((json && json.error) || "API 回傳錯誤"); return; }
    const rows = json.data || [], users = json.users || [];
    if(!applyData(rows, users)){
      // 修正 #7：空資料防護
      if(meterRendered){ setSync("err", "沒有收到資料"); return; }
      els.loadingText.style.display = "none";
      els.errorText.style.display = "block";
      els.errorText.innerHTML = '<b>目前無資料</b>請確認 API 是否回傳資料<br><button type="button" class="retry" onclick="retryLoad()">重試</button>';
      return;
    }
    saveDataCache(rows, users);
    _dataTime = Date.now();
    log("資料載入完成", { dataLen: data.length, usersLen: usersData.length });
    setSync("ok");
  };
  const s = document.createElement("script");
  s.src = CONFIG.API_URL + "?callback=" + cb + "&_=" + Date.now();
  s.onerror = () => {
    if(_apiTimer){ clearTimeout(_apiTimer); _apiTimer = null; }
    _fetching = false;
    showError("無法連線到 API");
  };
  document.body.appendChild(s);
}
function showError(msg){
  // 已經有資料在畫面上：保留舊資料，只在上方提示
  if(meterRendered){ setSync("err", msg); return; }
  els.loadingText.style.display = "none";
  els.errorText.style.display = "block";
  els.errorText.innerHTML = '<b>目前連不到資料</b>' + escapeHtml(msg) + '，請稍後再試<br><button type="button" class="retry" onclick="retryLoad()">重試</button>';
}
function retryLoad(){
  try{ sfxTap(); }catch(e){}
  if(!meterRendered){
    els.errorText.style.display = "none";
    els.loadingText.style.display = "";
  }
  fetchData();
}
window.retryLoad = retryLoad;
/* 從背景回到畫面（例如切回這個 App）：資料超過 10 分鐘就自動更新 */

/* ============================================================
   日期範圍
   ============================================================ */
function initDateRange(){
  if(!data.length) return;
  const first = data[0]["日期"].replace(/\//g,"-");
  const last = data[data.length-1]["日期"].replace(/\//g,"-");
  els.dateStart.min = first; els.dateStart.max = last;
  els.dateEnd.min = first; els.dateEnd.max = last;
  const quick = document.getElementById("dateQuick");
  if(!_dateInited){
    const endIdx = data.length - 1;
    const startIdx = Math.max(0, endIdx - 6);
    els.dateStart.value = data[startIdx]["日期"].replace(/\//g,"-");
    els.dateEnd.value = data[endIdx]["日期"].replace(/\//g,"-");
  }
  if(_dateInited) return;
  _dateInited = true;
  els.dateStart.addEventListener("change", onDateChange);
  els.dateEnd.addEventListener("change", onDateChange);
  if(quick) quick.onclick = e => {
    const b = e.target.closest("[data-q]");
    if(!b) return;
    sfxTap();
    const endStr = data[data.length-1]["日期"];
    let startStr;
    if(b.dataset.q === "month"){
      startStr = endStr.substring(0,8) + "01";
    } else {
      const n = +b.dataset.q;
      startStr = data[Math.max(0, data.length - n)]["日期"];
    }
    if(startStr < data[0]["日期"]) startStr = data[0]["日期"];
    els.dateStart.value = startStr.replace(/\//g,"-");
    els.dateEnd.value = endStr.replace(/\//g,"-");
    quick.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    onDateChange();
  };
  [els.dateStart, els.dateEnd].forEach(inp => inp.addEventListener("input", () => {
    if(quick) quick.querySelectorAll("button").forEach(x => x.classList.remove("on"));
  }));
}
function onDateChange(){
  let sv = els.dateStart.value;
  let ev = els.dateEnd.value;
  if(!sv || !ev) return;
  let s = sv.replace(/-/g,"/");
  let e = ev.replace(/-/g,"/");
  if(s > e){
    [s, e] = [e, s];
    els.dateStart.value = s.replace(/\//g,"-");
    els.dateEnd.value = e.replace(/\//g,"-");
  }
  renderQuery(s, e);
  if(!els.queryHead.classList.contains("open")){
    els.queryHead.classList.add("open");
    els.queryBody.classList.add("open");
  }
}
function renderQuery(s, e){
  const filtered = data.filter(r => r["日期"] >= s && r["日期"] <= e);
  if(!filtered.length){
    els.queryInner.innerHTML = '<div class="alert-empty">此範圍內無資料</div>';
    return;
  }
  const header = '<tr><th>日期</th>' + METERS.map(m => '<th>' + m.slice(0,2) + '</th>').join("") + '</tr>';
  const rows = filtered.slice().reverse().map(r => {
    const cells = METERS.map(m => {
      const v = r[m];
      return '<td>' + (typeof v === "number" ? v.toFixed(1) : "—") + '</td>';
    }).join("");
    return '<tr><td>' + r["日期"].substring(5) + '</td>' + cells + '</tr>';
  }).join("");
  els.queryInner.innerHTML = '<div class="table-scroll" style="border:1px solid var(--border);border-radius:8px;"><table>' + header + rows + '</table></div>';
}

/* ============================================================
   快取與增量計算
   ============================================================ */
function getTodayStr(){
  if(_cacheTodayStr) return _cacheTodayStr;
  const now = new Date();
  _cacheTodayStr = now.getFullYear() + "/" + String(now.getMonth()+1).padStart(2,"0") + "/" + String(now.getDate()).padStart(2,"0");
  return _cacheTodayStr;
}
function getTodayIndex(){
  if(_cacheTodayIndex >= 0) return _cacheTodayIndex;
  const ts = getTodayStr();
  for(let i=data.length-1;i>=0;i--){
    if(data[i]["日期"] === ts){ _cacheTodayIndex = i; return i; }
  }
  _cacheTodayIndex = -1;
  return -1;
}
function getTodayValue(m){
  const idx = getTodayIndex();
  if(idx < 0) return null;
  const v = data[idx][m];
  return typeof v === "number" ? v : null;
}
const isReportedToday = m => getTodayValue(m) != null;

function getDiff(m){
  if(_cacheDiffs[m]) return _cacheDiffs[m];
  const arr = [];
  for(let i=0;i<data.length;i++){
    const c = data[i][m];
    const p = i>0 ? data[i-1][m] : null;
    if(i===0 || typeof c !== "number" || typeof p !== "number") arr.push(null);
    else arr.push(+(c - p).toFixed(2));
  }
  _cacheDiffs[m] = arr;
  return arr;
}

/* ============================================================
   異常偵測
   ============================================================ */
function getAnomalyThreshold(m){
  const diff = getDiff(m);
  const idx = getTodayIndex();
  const end = idx >= 0 ? idx - 1 : diff.length - 1;
  const start = Math.max(0, end - (CONFIG.MAX_DIFF_DAYS - 1));
  let valid = [];
  for(let i=start; i<=end; i++) if(diff[i] != null && diff[i] > 0) valid.push(diff[i]);
  if(valid.length < 7) valid = diff.filter(v => v != null && v > 0);
  if(!valid.length) return {threshold:0, mean:0, sigma:0};
  const mean = valid.reduce((s,v) => s+v, 0) / valid.length;
  const variance = valid.reduce((s,v) => s + (v-mean)*(v-mean), 0) / valid.length;
  const sigma = Math.sqrt(variance);
  return { threshold: Math.max(mean + CONFIG.ANOMALY_SIGMA*sigma, 1.0), mean, sigma };
}
function getRecentAnomalies(m){
  const idx = getTodayIndex();
  if(idx < 0) return [];
  const startIdx = Math.max(0, idx - 4);
  const t = getAnomalyThreshold(m);
  if(t.threshold <= 0) return [];
  const anomalies = [];
  for(let i=startIdx;i<=idx;i++){
    if(i <= 0) continue;
    const todayV = data[i][m];
    if(typeof todayV !== "number") continue;
    let prevV = null;
    for(let j=i-1;j>=0;j--){
      if(typeof data[j][m] === "number"){ prevV = data[j][m]; break; }
    }
    if(prevV == null) continue;
    const inc = +(todayV - prevV).toFixed(2);
    if(inc > t.threshold && inc > CONFIG.ANOMALY_MIN_INC){
      anomalies.push({date:data[i]["日期"], increment:inc, threshold:t.threshold, prevValue:prevV, currValue:todayV});
    }
  }
  anomalies.sort((a,b) => a.date < b.date ? 1 : -1);
  return anomalies;
}
function getRecentReversals(m){
  const idx = getTodayIndex();
  if(idx < 0) return [];
  const startIdx = Math.max(1, idx - 4);
  const reversals = [];
  for(let i=startIdx;i<=idx;i++){
    const todayV = data[i][m];
    if(typeof todayV !== "number") continue;
    let prevV = null;
    for(let j=i-1;j>=0;j--){
      if(typeof data[j][m] === "number"){ prevV = data[j][m]; break; }
    }
    if(prevV == null) continue;
    if(todayV < prevV){
      reversals.push({date:data[i]["日期"], delta:+(todayV - prevV).toFixed(2), prevValue:prevV, currValue:todayV});
    }
  }
  reversals.sort((a,b) => a.date < b.date ? 1 : -1);
  return reversals;
}

function renderTopDate(){
