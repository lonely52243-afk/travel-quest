<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>備忘 2.0｜互動原型 V2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#1f2a44;background:#eeeae0}*{box-sizing:border-box}body{margin:0}.app{max-width:430px;margin:auto;min-height:100dvh;background:#fffcf5;padding-bottom:84px;box-shadow:0 0 24px #1f2a4418}header{background:#fff1c9;padding:18px 18px 15px;position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;justify-content:space-between;font-size:13px}.logo{font-size:18px;font-weight:800}.logo b{display:inline-grid;place-items:center;background:#f5b800;border-radius:9px;width:31px;height:31px;margin-right:8px}.role{border:1px solid #b5a989;border-radius:12px;padding:7px;background:#fff9eb;color:#1f2a44}h1{font-size:23px;margin:14px 0 3px}h2{font-size:16px;margin:0 0 12px}small,.muted{color:#70788a;font-size:12px}.page{padding:17px}.card{background:white;border:1px solid #e9e2d5;border-radius:16px;padding:15px;margin-bottom:13px}.yellow{background:#f5b800!important;border-color:#f5b800!important;color:#1f2a44!important}.soft{background:#fff2cf}.alert{background:#fff0dd;border-color:#f3d3a8}.btn{background:#fff;border:1px solid #d8d4ca;border-radius:11px;color:#1f2a44;padding:11px 13px;font-weight:650;font-size:13px;cursor:pointer}.btn:active{transform:scale(.98)}.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#f5f1e8;border-radius:12px;text-align:center;padding:12px 2px;font-size:11px}.metric strong{display:block;font-size:23px;margin-bottom:4px}.section{margin:19px 0 11px;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;display:flex;background:#fff;border-top:1px solid #e9e2d5;padding:10px 4px max(12px,env(safe-area-inset-bottom));z-index:4}.nav button{flex:1;border:0;background:transparent;color:#7b8391;font-size:11px;cursor:pointer;padding:3px}.nav button span{display:block;font-size:21px;margin-bottom:4px}.nav button.active{color:#8e6800;font-weight:800}.pill{display:inline-block;padding:5px 8px;border-radius:8px;background:#f5f1e8;font-size:11px}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}.selected{background:#1f2a44;color:#fff;border-color:#1f2a44}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:53px;border:1px solid #e7e0d4;border-radius:8px;background:white;padding:5px 2px;text-align:center;font-size:12px;cursor:pointer}.day.today{background:#fff0bb}.day .dot{font-size:10px;color:#5479ae;display:block;margin-top:5px}.weektable{overflow:auto;border:1px solid #e7e0d4;border-radius:12px}.weekgrid{display:grid;grid-template-columns:70px repeat(7,minmax(43px,1fr));min-width:385px}.cell{border-right:1px solid #eee8dd;border-bottom:1px solid #eee8dd;min-height:45px;display:grid;place-items:center;font-size:11px;cursor:pointer;background:white}.cell.head{background:#f4efe5;font-weight:700}.cell.today{background:#fff4cd}.tag{font-size:10px;border-radius:6px;padding:4px 2px;background:#f8e0a5}.blue{background:#dceafa}.listitem{padding:13px 0;border-bottom:1px solid #eee8dd;cursor:pointer}.listitem:last-child{border:0}.overlay{position:fixed;inset:0;background:#17203688;z-index:9;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fffcf5;width:min(430px,100%);border-radius:20px 20px 0 0;padding:20px 18px 32px;max-height:80vh;overflow:auto}.hidden{display:none}select,input,textarea{font:inherit;border:1px solid #ddd5c8;border-radius:10px;padding:11px;background:white;color:#1f2a44;max-width:100%}textarea{width:100%;min-height:110px}button{touch-action:manipulation}.note{background:#f3f0e9;padding:12px;border-radius:12px;font-size:12px;color:#667085;line-height:1.6}.bar{height:10px;border-radius:20px;background:#e9e5dc;overflow:hidden;flex:1}.fill{height:100%;background:#d6ac3b}.personrow{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:13px}.personrow span:first-child{width:56px}.personrow span:last-child{width:65px;text-align:right}.subnav{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.subnav button{white-space:nowrap}button:focus-visible{outline:3px solid #7a99d3} @media(min-width:700px){.app{margin:20px auto;min-height:calc(100dvh - 40px);border-radius:22px;overflow:hidden}.nav{bottom:0}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo"><b>▤</b>備忘 <span class="muted">2.0 原型</span></div><select class="role" id="role"><option value="general">一般同仁</option><option value="eject" selected>彈射班長</option><option value="arms">軍械班長</option><option value="chief">股總</option><option value="readonly">唯讀模式</option></select></div><h1 id="heading">今天先看這些</h1><small id="subtitle">11 月 19 日・星期四｜V2 示意資料</small></header><main class="page" id="main"></main><nav class="nav" id="nav"></nav></div><div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div><script>
const $=id=>document.getElementById(id);let role='eject',page='home',mode='week',weekOffset=0,monthOffset=0,sub='todo',report='人員情況',selectedDay=19,historyType='全部',previewMark='',selectedPerson='';const managers=['eject','arms','chief'];const canEdit=()=>managers.includes(role);const names=['王○○','林○○','陳○○','張○○','黃○○','鄭○○'];const sample=[['休','','','休','','',''],['','留','','','','留',''],['','','上午','','休','',''],['','','','外勤','','',''],['','','','','','',''],['','休','','','','','']];
function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function go(p){page=p;render();window.scrollTo(0,0)}function modal(title,body){$('sheet').innerHTML=`<div class="row"><h2>${title}</h2>${btn('關閉','closeSheet()')}</div>${body}`;$('overlay').classList.remove('hidden')}function closeSheet(){$('overlay').classList.add('hidden')}function notice(){modal('原型說明','<p>這是互動設計示範，所有姓名、日期、件數都是虛構資料，沒有連接原本的 Google Sheets，也不會儲存任何正式紀錄。</p>'+btn('了解','closeSheet()','yellow full'))}function toast(t){modal('操作示範',`<p>${t}</p><p class="muted">正式版須維持既有權限與資料規則，並在後端確認儲存成功後才顯示成功。</p>${btn('返回','closeSheet()','yellow full')}`)}
function render(){let general=role==='general'||role==='readonly';let navs=[['home',general?'我的行程':'工作台','⌂'],['leave','假單','▦'],['duty','勤務','▤'],['more','更多','•••']];$('nav').innerHTML=navs.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[2]}</span>${x[1]}</button>`).join('');let titles={home:general?'我的行程':'今天先看這些',leave:'假單',duty:'勤務',more:'更多',output:'產出回報',stats:'勤務統計',records:'紀錄與提醒',settings:'設定',guide:'使用說明'};$('heading').textContent=titles[page]||'備忘';$('subtitle').textContent=`11 月 19 日・星期四｜${$('role').selectedOptions[0].text}｜示意資料`;let f={home:home,leave:leave,duty:duty,more:more,output:output,stats:stats,records:records,settings:settings,guide:guide};$('main').innerHTML=(f[page]||home)()}
function home(){if(role==='general'||role==='readonly')return `<div class="card soft"><small>今天・11/19（四）</small><h1>正常到班</h1><p class="muted">目前沒有其他個人勤務</p></div><div class="section row">接下來 7 天 <small>11/19－11/25</small></div><div class="calendar">${Array.from({length:7},(_,i)=>`<button class="day ${i===0?'today':''}" onclick="dayDetail(${19+i})">${['四','五','六','日','一','二','三'][i]}<br><b>${19+i}</b><span class="dot">${i===2?'●':i===4?'●':'·'}</span></button>`).join('')}</div><div class="section">近期行程</div><div class="card"><div class="listitem" onclick="dayDetail(21)">11/21（六）　<b>留守</b>　›</div><div class="listitem" onclick="dayDetail(23)">11/23（一）　<b>全天休假</b>　›</div></div><div class="card" onclick="go('records')">🔔 本週提醒　<span class="muted">查看 ›</span></div>${btn('查看假單與留守','go(\'leave\')','yellow full')}`;return `<div class="metrics"><div class="metric" onclick="go('records')"><strong>6</strong>未點假單</div><div class="metric" onclick="go('records')"><strong>2</strong>勤務重疊</div><div class="metric" onclick="dayDetail(19)"><strong>3</strong>今日留守</div></div><div class="card alert" style="margin-top:14px" onclick="go('records')"><b>需要確認　›</b><p style="font-size:13px;margin-bottom:0">勤務重疊 2 件，請確認排程。</p></div><div class="section">今天的人員</div><div class="grid">${[['休假','4 人'],['外勤','3 人'],['留守','3 人'],['到班','18 人']].map(x=>`<div class="card" onclick="dayDetail(19)"><small>${x[0]}</small><h2 style="margin:8px 0 0">${x[1]}</h2></div>`).join('')}</div><div class="section">常用操作</div><div class="grid">${btn('▦ 標記假單','go(\'leave\')','yellow')}${btn('▤ 派遣勤務','go(\'duty\')')}${btn('▣ 產出回報','go(\'output\')')}${btn('▥ 勤務統計','go(\'stats\')')}</div>`}
function leave(){return `<div class="row" style="margin-bottom:13px"><div class="tabs" style="margin:0">${btn('週','mode=\'week\';render()',mode==='week'?'selected':'')}${btn('月','mode=\'month\';render()',mode==='month'?'selected':'')}</div>${btn('今天','weekOffset=0;monthOffset=0;render()')}</div><div class="row card"><button class="btn" onclick="${mode==='week'?'weekOffset--':'monthOffset--'};render()">‹</button><b>${mode==='week'?`11/${16+weekOffset*7}－11/${22+weekOffset*7}`:`${11+monthOffset} 月`}</b><button class="btn" onclick="${mode==='week'?'weekOffset++':'monthOffset++'};render()">›</button></div>${mode==='week'?`<div class="weektable"><div class="weekgrid">${['人員','一','二','三','四','五','六','日'].map((x,i)=>`<div class="cell head ${i===4?'today':''}">${x}</div>`).join('')}${names.map((n,j)=>`<div class="cell head">${n}</div>${sample[j].map((v,i)=>`<div class="cell ${i===3?'today':''}" onclick="editCell('${n}',${16+i})">${v?`<span class="tag ${v==='留'?'blue':''}">${v}</span>`:''}</div>`).join('')}`).join('')}</div></div>`:`<div class="calendar">${Array.from({length:35},(_,i)=>`<button class="day ${i+1===19?'today':''}" onclick="dayDetail(${i%30+1})"><b>${i%30+1}</b><span class="dot">${i%5===0?'休 2':i%4===0?'留 1':'·'}</span></button>`).join('')}</div>`}<p class="note">一般同仁示意帳號為王○○，僅能操作自己的留守；唯讀不能編輯。空白代表尚無標記，不代表到班。</p>${btn('查看未點假單人員','go(\'records\')','yellow full')}`}
function editCell(n,d){selectedPerson=n;modal(`${n}｜11/${d}`,`<p class="muted">選擇原有標記類型（示意）</p><div class="grid">${['全天休','上午休','下午休','留守','監控','出差','受訓','公假'].map(v=>btn(v,`chooseMark('${n}','${v}')`)).join('')}</div><p class="note">一般同仁只能依既有規則標記自己的留守；唯讀不可修改。</p>`)}function chooseMark(n,v){if(role==='readonly')return toast('唯讀模式不能修改任何資料。');if(role==='general' && (n!==names[0] || v!=='留守'))return toast('一般同仁示意身分為王○○，只能標記自己的留守。');previewMark=v;modal('確認標記（僅預覽）',`<div class="card soft"><p><b>人員：</b>${n}</p><p><b>標記：</b>${v}</p><p class="muted">此操作不會寫入正式資料；正式版必須等後端確認成功才顯示完成。</p></div>${btn('確認示範',`toast('已完成 ${v} 的操作流程示範；沒有寫入資料。')`,'yellow full')}${btn('返回選項',`editCell('${n}',19)`,'full')}`)}
function duty(){return `<div class="row" style="margin-bottom:12px"><div class="tabs" style="margin:0">${btn('月曆','sub=\'calendar\';render()',sub!=='day'?'selected':'')}${btn('當日','sub=\'day\';render()',sub==='day'?'selected':'')}</div>${btn('＋ 新增','addDuty()','yellow')}</div>${sub==='day'?dayContent():`<div class="card row"><button class="btn" onclick="monthOffset--;render()">‹</button><b>${11+monthOffset} 月勤務</b><button class="btn" onclick="monthOffset++;render()">›</button></div><div class="calendar">${Array.from({length:35},(_,i)=>`<button class="day ${i+1===19?'today':''}" onclick="selectedDay=${i%30+1};sub='day';render()"><b>${i%30+1}</b><span class="dot">${i%6===0?'勤務 2':i%3===0?'勤務 1':'·'}</span></button>`).join('')}</div><p class="note">月曆只顯示勤務概況，完整人員、時間、事由及衝突於當日詳細查看。</p>`}<div class="section">快速操作</div><div class="grid">${btn('貼上通知快速標記','quickTag()')}${btn('查看勤務重疊','go(\'records\')')}</div>`}
function dayContent(){return `<div class="card"><div class="row">${btn('‹','selectedDay--;render()')}<b>11/${selectedDay} 當日詳細</b>${btn('›','selectedDay++;render()')}</div></div>${['休假','外勤','留守','監控','到班','勤務'].map((x,i)=>`<div class="card"><div class="row"><b>${x}</b><span class="pill">${[4,3,3,1,18,2][i]} 人／件</span></div><p class="muted">${i===5?'08:00－12:00　設備檢查（示意）':'王○○、林○○（示意）'}</p></div>`).join('')}`}
function addDuty(){if(!canEdit())return toast('此身分無權新增勤務。');modal('新增勤務｜示意',`<p>日期 <input type="date" value="2026-11-19"></p><p>勤務名稱 <input placeholder="輸入勤務名稱"></p><p>人員 <input placeholder="選擇人員"></p>${btn('預覽新增','toast(\'新增勤務預覽，沒有寫入資料。\')','yellow full')}`)}function quickTag(){if(!canEdit())return toast('此身分不能寫入勤務。');modal('貼上通知快速標記',`<p class="muted">保留原本的解析規則；貼上後先預覽，再確認寫入。</p><textarea placeholder="將勤務通知貼在這裡…"></textarea>${btn('解析預覽','toast(\'這是 UI 原型，尚未連接原本解析器。正式版須使用既有解析邏輯。\')','yellow full')}`)}
function dayDetail(d){selectedDay=d;modal(`11/${d}｜當日詳細`,`<div class="card soft"><b>${d===21?'留守':d===23?'休假':'當日人員與勤務'}</b><p class="muted">此處為示意行程，不代表真實資料。</p></div>${btn('查看勤務詳細','closeSheet();sub=\'day\';go(\'duty\')','full')}`)}
function more(){return `<div class="card">${[['產出回報','output','▣'],['勤務統計','stats','▥'],['紀錄與提醒','records','◷'],['設定','settings','⚙'],['使用說明','guide','ⓘ']].map(x=>`<div class="listitem row" onclick="go('${x[1]}')"><b>${x[2]}　${x[0]}</b><span>›</span></div>`).join('')}</div><p class="note">原有的其他工具與獨立入口在正式版仍須完整保留；點點月曆不擅自合併資料。</p>`}
function records(){let items=[['11/18','王○○','留守','原留守日調整'],['11/17','林○○','假單','全天休假標記'],['11/16','陳○○','勤務','勤務人員調整']];let filtered=items.filter(x=>historyType==='全部'||x[2]===historyType);return `<div class="tabs">${btn('待處理','sub=\'todo\';render()',sub!=='history'?'selected':'')}${btn('編輯紀錄','sub=\'history\';render()',sub==='history'?'selected':'')}</div>${sub==='history'?`<div class="card"><b>異動查詢</b><p class="muted">依類別篩選；原始修改紀錄不受影響</p><div class="subnav">${['全部','留守','假單','勤務'].map(x=>btn(x,`historyType='${x}';render()`,historyType===x?'selected':'' )).join('')}</div>${filtered.map(x=>`<div class="listitem" onclick="toast('${x[0]}　${x[1]}：${x[3]}。正式版顯示原始修改前後紀錄。')"><b>${x[2]}</b>　${x[0]}　${x[1]}　›<small class="muted">${x[3]}</small></div>`).join('')||'<p>沒有符合的示意紀錄</p>'}</div>`:`${[['未點假單','6 人','本週未完成標記'],['勤務重疊','2 件','需要確認的勤務排程'],['留守資訊','3 件','查看近期留守與異動']].map(x=>`<div class="card" onclick="modal('${x[0]}','<p>${x[2]}（示意資料）</p><p>王○○、林○○、陳○○</p>'+btn('返回','closeSheet()','yellow full'))"><div class="row"><b>${x[0]}</b><span class="pill">${x[1]}</span></div><p class="muted">${x[2]}　›</p></div>`).join('')}<p class="note">待處理與歷史異動分開呈現；留守異動不會每次開啟就彈出。</p>`}`}
function output(){return `<div class="section">選擇回報範本</div><div class="subnav">${['人員情況','假日留守','加班','尿篩'].map(x=>btn(x,`report='${x}';render()`,report===x?'selected':'' )).join('')}</div><div class="card"><h2>${report}</h2><p>日期　<input type="date" value="2026-11-19"></p><p>姓名格式　<select id="namefmt"><option>依原有預設</option><option>完整姓名</option><option>只顯示名字</option></select></p><p>內容預覽</p><textarea readonly>${report}｜115年11月19日\n王○○、林○○（示意）\n\n正式版應由原有資料及產出規則生成。</textarea>${btn('複製示意文字','copyReport()','yellow full')}</div><p class="note">原有各項回報格式、可選欄位及後續操作須逐項核對保留。</p>`}function copyReport(){let t=document.querySelector('textarea')?.value||'';navigator.clipboard?.writeText(t).then(()=>toast('示意文字已複製。')).catch(()=>toast('此瀏覽器未允許複製。'))}
function stats(){return `<div class="card row"><b>勤務公平性</b><span class="pill">近 90 天</span></div><div class="metrics"><div class="metric"><strong>3.2</strong>平均次／月</div><div class="metric"><strong>18</strong>統計人數</div><div class="metric"><strong>90</strong>滾動天數</div></div><div class="section">人員比較</div><div class="card">${[['王○○',4.1],['林○○',3.3],['陳○○',2.7],['張○○',2.1]].map(x=>`<div class="personrow"><span>${x[0]}</span><div class="bar"><div class="fill" style="width:${x[1]/5*100}%"></div></div><span>${x[1]} 次/月</span></div>`).join('')}</div>${btn('這些數字怎麼算？','modal(\'統計說明\',\'<p>勤務次數 ÷ 在營天數 × 30，呈現為每月等效勤務次數。</p><p>正式版保留既有 90 天、上班日、假別扣除、排除勤務與已排未執行勤務等計算規則。</p>\'+btn(\'了解\',\'closeSheet()\',\'yellow full\'))','full')}<p class="note">以上數字為示意，不是從原始檔案實際計算的結果。</p>`}
function settings(){return `<div class="card"><h2>我的身分</h2><p>${$('role').selectedOptions[0].text}</p><p class="muted">身分驗證與編輯權限維持原本後端判定。</p></div><div class="card"><h2>個人設定</h2><div class="listitem" onclick="toast('個人姓名設定，原型不儲存。')">我的姓名　›</div><div class="listitem" onclick="toast('提醒偏好，原型不儲存。')">提醒設定　›</div><div class="listitem" onclick="toast('示意登出；正式版須保留原有鎖定與登入流程。')">登出／鎖定　›</div></div>`}function guide(){return `<div class="card"><h2>使用導覽</h2><p>一般同仁：先看個人行程，需要時查看假單、勤務與自己被允許的留守操作。</p><p>班長：從工作台查看待處理，再進入假單、勤務、產出或統計。</p><p>編輯紀錄只用來查看誰改了什麼，不等同待處理清單。</p></div><p class="note">本原型不取代正式系統，尚未通過完整功能與權限驗收。</p>`}
$('role').addEventListener('change',e=>{role=e.target.value;page='home';render()});render();</script></body></html>
