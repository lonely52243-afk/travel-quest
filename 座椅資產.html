<style>
:root{
  --bg:#eef4ff; --card:#ffffff; --text:#14213d; --mute:#5b6b88; --line:#d9e3f5; --soft:#eaf1ff;
  --accent:#2563eb; --accent-t:#ffffff; --teal:#0ea5a4; --red:#d62839; --orange:#c2570c; --green:#15803d;
  --ua:#3b82f6; --ub:#14b8a6; --uc:#f59e0b; --ud:#f43f5e;
  --hero:linear-gradient(135deg,#2563eb 0%,#0ea5a4 100%);
  --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 18px rgba(37,99,235,.07);
  --safe-b:env(safe-area-inset-bottom,0px); --zoom:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#131d33; --text:#eaf0ff; --mute:#8fa1c4; --line:#23334f; --soft:#1a2745;
    --accent:#5b9dff; --accent-t:#04122b; --teal:#2dd4bf; --red:#ff7b86; --orange:#ffa94d; --green:#4ade80;
    --hero:linear-gradient(135deg,#1d4ed8 0%,#0f9d94 100%);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#131d33; --text:#eaf0ff; --mute:#8fa1c4; --line:#23334f; --soft:#1a2745;
  --accent:#5b9dff; --accent-t:#04122b; --teal:#2dd4bf; --red:#ff7b86; --orange:#ffa94d; --green:#4ade80;
  --hero:linear-gradient(135deg,#1d4ed8 0%,#0f9d94 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:calc(84px + var(--safe-b));zoom:var(--zoom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
.bad{color:var(--red)} .warn{color:var(--orange)} .mute{color:var(--mute)} .good{color:var(--green)}
.noscroll{overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding-top:max(6px,env(safe-area-inset-top,0px));transition:transform .22s}
.hdr.hide{transform:translateY(-100%)}
.hdr-top{display:flex;align-items:center;gap:6px;padding:2px 0 8px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:19px;letter-spacing:.5px}
.ttl small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.ttl small.warn::before{background:var(--orange)} .ttl small.bad::before{background:var(--red)}
.ttl small.warn{color:var(--orange)} .ttl small.bad{color:var(--red)}
.ibtn{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--accent)}
.ibtn svg{width:21px;height:21px}
.ibtn:active{background:var(--soft)}
.ibtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{position:relative;padding:0 0 10px}
.search svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:var(--mute);pointer-events:none}
.search input{width:100%;height:48px;padding:0 44px 0 44px;font-size:19px;border:2px solid var(--line);border-radius:14px;background:var(--card);outline:0;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent)}
.qclear{position:absolute;right:6px;top:3px;width:42px;height:42px;font-size:24px;color:var(--mute)}
.qclear[hidden]{display:none}

/* common */
main{padding-top:6px;min-height:60vh}
h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.card.pad{padding:12px}
.empty{padding:22px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.notice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red);border-radius:14px;background:color-mix(in srgb,var(--red) 8%,var(--card));margin-bottom:12px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{padding:8px 15px;border:1px solid var(--line);border-radius:22px;background:var(--card);font-size:15px;min-height:38px}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.btn{padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;min-height:42px}
.btn:active{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.5}
.foot{margin:20px 0 6px;font-size:12px;color:var(--mute);text-align:center}
.note{font-size:13px;color:var(--mute);margin:8px 2px 0;line-height:1.55}
.note.warn{color:var(--orange)}
.skel{height:92px;border-radius:16px;margin:0 0 12px;background:linear-gradient(90deg,var(--soft) 25%,var(--card) 50%,var(--soft) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* hero */
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(37,99,235,.28);margin:4px 0 14px}
.hero-main{display:block;width:100%;text-align:left;color:#fff}
.hero .hl{display:block;font-size:14px;opacity:.9}
.hero .hn{display:block;font-size:54px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.hero .hn small{font-size:18px;font-weight:600;margin-left:6px;opacity:.9}
.hero .hs{display:block;font-size:12px;opacity:.85}
.sbar{display:flex;height:28px;border-radius:10px;overflow:hidden;margin:12px 0 10px;background:rgba(255,255,255,.25)}
.sbar button{color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;min-width:22px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats button{background:rgba(255,255,255,.18);border-radius:12px;padding:9px 10px;text-align:left;color:#fff}
.hstats button:active{background:rgba(255,255,255,.3)}
.hstats .a{font-size:12px;opacity:.92;display:flex;align-items:center;gap:5px}
.hstats .b{font-size:22px;font-weight:800;line-height:1.2}
.hstats i{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block}

/* todo */
.todo{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.todo>h3{margin:0;padding:12px 14px 6px;font-size:15px}
.td{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.td:active{background:var(--soft)}
.td .ic{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.td .tx{flex:1;min-width:0;font-size:15px;line-height:1.35}
.td .tx small{display:block;color:var(--mute);font-size:12.5px}
.td .go{color:var(--mute);font-size:20px}
.td.ok{cursor:default}
.ic.r{background:var(--red)}.ic.o{background:#f08c00}.ic.b{background:var(--accent)}.ic.g{background:var(--green)}.ic.c{background:var(--uc)}.ic.d{background:var(--ud)}

/* type cards */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.tc-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.tc-h b{font-size:20px}
.tc-h .md{color:var(--mute);font-size:13px;flex:1}
.tc-h .nb{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;border-radius:12px;background:var(--soft);border-top:4px solid var(--tc,var(--line));min-height:66px}
.tile .tn{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .tl{font-size:12px;color:var(--mute)}
.tile:active{filter:brightness(.95)}
.tile:disabled,.tile.z{opacity:.45;cursor:default}
.tile.z .tn{font-weight:600}

/* support cards */
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.sc-h{display:flex;align-items:center;gap:8px}
.sc-h b{font-size:18px}
.sc-h .md{color:var(--mute);font-size:13px;flex:1}
.sc-rate{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.rbar{height:8px;border-radius:5px;background:var(--soft);margin:8px 0 8px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:5px;background:var(--green)}
.rbar.warn i{background:#f08c00}.rbar.bad i{background:var(--red)}
.sc-f{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute);flex-wrap:wrap;align-items:center}

/* sections */
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden;box-shadow:var(--shadow)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px;cursor:pointer;min-height:54px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'';width:9px;height:9px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;margin:0 6px 0 3px;flex:none}
.sec[open]>summary::before{transform:rotate(45deg)}
.sec .st{font-weight:800;font-size:17px}
.sec .ss{margin-left:auto;font-size:13px;color:var(--mute);text-align:right}
.sec>.sb{padding:0 12px 12px}
.sec .card,.sec .scard{box-shadow:none}
.secbar{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}
.secbar .btn{padding:6px 12px;font-size:14px;min-height:36px}

/* tables & numbers */
table{width:100%;border-collapse:collapse}
th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--mute);font-size:13px;background:var(--soft)}
th:first-child,td:first-child{text-align:left;padding-left:12px}
th:last-child,td:last-child{padding-right:12px}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--soft)}
.nb{min-width:40px;min-height:36px;padding:5px 10px;border-radius:10px;background:var(--soft);color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.nb.bold{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.nb:active{opacity:.7}
.zero{color:var(--mute);display:inline-block;min-width:40px;text-align:center}
.lk{font-size:13.5px;color:var(--orange);text-decoration:underline;padding:4px 2px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.u{display:inline-block;padding:1px 9px;border-radius:10px;font-size:13px;color:#fff;font-weight:700;font-style:normal;white-space:nowrap}
.u-a{background:var(--ua)}.u-b{background:var(--ub)}.u-c{background:var(--uc)}.u-d{background:var(--ud)}.u-x{background:var(--mute)}
.issue{display:block;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.issue:last-child{border-bottom:0}
.issue:active{background:var(--soft)}
.issue b{display:block}

/* items */
.it{border-bottom:1px solid var(--line);background:var(--card)}
.it:last-child{border-bottom:0}
.ith{display:flex;align-items:center;gap:8px;padding-right:10px}
.itm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:13px 6px 13px 14px}
.itm:active{background:var(--soft)}
.itm .s{font-weight:800;min-width:66px;font-variant-numeric:tabular-nums}
.itm .m{flex:1;min-width:0;color:var(--mute);font-size:14px}
.itm .d{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
.itm .chev{width:9px;height:9px;border-right:2.5px solid var(--mute);border-bottom:2.5px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:2px}
.it.on .chev{transform:rotate(45deg)}
.it.on{background:var(--soft)}
.itd{background:var(--card);border-top:1px solid var(--line)}
.itd[hidden]{display:none}

/* detail */
.dh{padding:16px 14px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--soft),var(--card))}
.dh .ser{font-size:36px;font-weight:800;line-height:1.1}
.dh .tags{margin-top:8px;color:var(--mute);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.remain{padding:14px;border-bottom:1px solid var(--line)}
.remain .lbl{color:var(--mute);font-size:14px}
.remain .big{font-size:46px;font-weight:800;line-height:1.15}
.remain .big small{font-size:18px;font-weight:600;margin-left:4px}
.remain .hum{color:var(--mute);font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--mute)}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.msg{padding:10px 14px;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.act{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.wrap-sm{max-width:100%}
.alertbox{border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));border-radius:14px;padding:12px 14px;margin-bottom:14px;background:color-mix(in srgb,var(--red) 7%,var(--card))}
.alertbox b{color:var(--red);display:block}
.alertbox .btn{margin-top:10px}
.ytabs{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;background:var(--card)}
.ytab{flex:1 0 78px;padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
.ytab:last-child{border-right:0}
.ytab b{display:block;font-size:17px}
.ytab span{font-size:13px;color:var(--mute)}
.ytab.on{background:var(--accent);color:var(--accent-t)}
.ytab.on span{color:var(--accent-t)}
.mbars{display:flex;align-items:flex-end;gap:2px;padding:8px 2px 2px}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:2px 0;min-width:0;min-height:44px}
.mb i{display:block;width:72%;background:linear-gradient(180deg,var(--teal),var(--accent));border-radius:4px 4px 0 0;min-height:3px}
.mb:disabled i{background:var(--line)}
.mb .mv{font-size:12px;font-weight:800}.mb .ml{font-size:11px;color:var(--mute)}
.mb:active i{filter:brightness(.9)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
.nav button{position:relative;padding:8px 0 7px;font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;justify-content:center}
.nav svg{width:24px;height:24px}
.nav button.on{color:var(--accent);font-weight:800}
.nav button.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;line-height:19px;text-align:center;font-weight:800}
.badge[hidden]{display:none}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--hero),var(--bg);background:var(--hero);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.lock.hide{display:none}
.lock form{width:100%;max-width:340px;background:var(--card);border-radius:22px;padding:24px 20px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.lockicon{display:block;width:76px;height:76px;border-radius:18px;margin:0 auto 12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lock h1{font-size:23px;margin:0 0 4px;text-align:center}
.lock p{margin:0 0 16px;text-align:center;color:var(--mute);font-size:14px}
.pwrow{position:relative}
.lock input{width:100%;height:50px;padding:0 54px 0 14px;font-size:18px;border:2px solid var(--line);border-radius:12px;background:var(--bg);outline:0}
.lock input:focus{border-color:var(--accent)}
.pwshow{position:absolute;right:4px;top:4px;height:42px;width:46px;color:var(--mute);font-size:13px}
.lock .go{width:100%;margin-top:12px;height:50px;background:var(--accent);color:var(--accent-t);font-weight:800;border-radius:12px;font-size:17px}
.lock .go:disabled{opacity:.6}
.lock .err{color:var(--red);min-height:22px;margin-top:8px;font-size:14px;text-align:center}
.lock .hint{font-size:12px;color:var(--mute);text-align:center;margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;z-index:120;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}

/* sheets */
.modal,.drawer{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,16,36,.5)}
.modal{z-index:90}.drawer{z-index:70}
.modal[hidden],.drawer[hidden]{display:none}
.sheet,.dsheet{background:var(--bg);width:100%;max-width:680px;overflow:auto;border-radius:22px 22px 0 0;-webkit-overflow-scrolling:touch;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet{max-height:92vh;padding:10px 16px calc(18px + var(--safe-b));background:var(--card)}
.dsheet{height:90vh;padding:6px 12px calc(18px + var(--safe-b))}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 8px;font-size:19px}
.mtxt{margin:8px 0}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.fld input,.fld select{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);outline:0;min-height:46px}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.fld small{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.agrid .fld{margin:0}
.merr{color:var(--red);min-height:22px;margin-top:6px;font-size:14px;font-weight:600}
.mbtn{display:flex;gap:10px;margin-top:8px}
.mbtn .btn{flex:1;padding:13px}
.sheet .its{display:flex;gap:6px;flex-wrap:wrap}
.sheet .its span{padding:3px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--soft)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-6px;background:var(--bg);padding:4px 0 8px;z-index:2}
.dtt b{display:block;font-size:17px;line-height:1.3}
.dbtns{display:flex;gap:8px;flex:none}
.dsum{font-size:13.5px;color:var(--mute);margin:0 0 8px;line-height:1.7}
.dtools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.dtools .chip{padding:5px 12px;min-height:32px;font-size:14px}
.dtools .sp{width:1px;height:20px;background:var(--line);margin:0 4px}

/* menu / tour / help */
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.mrow:last-child{border-bottom:0}
.mrow .mi{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.mrow .mi svg{width:20px;height:20px}
.mrow small{display:block;color:var(--mute);font-size:13px}
.setgrp{margin:14px 0}.setgrp>b{display:block;margin-bottom:6px}
.tour{text-align:center;padding:8px 4px 0}
.tour .tbig{width:84px;height:84px;border-radius:24px;margin:8px auto 14px;background:var(--hero);display:flex;align-items:center;justify-content:center;color:#fff}
.tour .tbig svg{width:44px;height:44px}
.tour h3{font-size:21px;margin:0 0 8px}
.tour p{color:var(--mute);margin:0 0 6px;text-align:left}
.tour ul{text-align:left;color:var(--mute);margin:6px 0;padding-left:20px}
.tdots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.tdots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.tdots i.on{background:var(--accent);width:22px}
.hlp{margin:0 0 6px;border-bottom:1px solid var(--line)}.hlp summary{font-weight:700;padding:12px 0;cursor:pointer}.hlp p,.hlp li{margin:4px 0;font-size:15px;line-height:1.65}.hlp ul,.hlp ol{margin:4px 0 10px;padding-left:20px}
.hicon{display:flex;gap:12px;align-items:center;padding:6px 0 10px}.hicon img{width:64px;height:64px;border-radius:15px}
</style>
</head>

<script>
/* ===== 共用規則（Apps Script 與網頁示範模式共用，兩邊一模一樣）===== */
const SEAT = {
  LOCS: ['一修', '三修', '待修庫', '指部工廠'],
  SERVICE: ['一修', '三修'],
  TYPES: ['-3', '-4', '-5', '-6'],
  LIFE_YEARS: 6,      // 三線屆期 = 出廠日 + 6 年
  SECOND_YEARS: 2,    // 二線屆期預設 = 出廠日 + 2 年（出廠時可以手動改）
  DATE_FIELDS: ['生效日', '三線屆期', '二線屆期', '進廠日'],
  EDITABLE: ['型別', '位置', '狀態', '生效日', '三線屆期', '二線屆期', '循環次數', '進廠日', '備註'],
  STATUS: { '一修': '服役中', '三修': '服役中', '待修庫': '待進廠', '指部工廠': '交修中' }
};
function seatP2(n) { return (n < 10 ? '0' : '') + n; }
function seatFmt(d) { return d.getFullYear() + '/' + seatP2(d.getMonth() + 1) + '/' + seatP2(d.getDate()); }
function seatFmtTime(d) { return seatFmt(d) + ' ' + seatP2(d.getHours()) + ':' + seatP2(d.getMinutes()); }
function seatParse(s) {
  if (s == null) return null;
  const m = String(s).trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getMonth() === +m[2] - 1 ? d : null;
}
function seatAddYears(d, n) {
  const t = new Date(d.getFullYear() + n, d.getMonth(), d.getDate());
  return t.getMonth() === d.getMonth() ? t : new Date(d.getFullYear() + n, d.getMonth() + 1, 0);
}
function seatToday(now) { return new Date(now.getFullYear(), now.getMonth(), now.getDate()); }
function seatKey(s) {
  const raw = String(s == null ? '' : s).toUpperCase().replace(/\s+/g, '');
  const m = raw.match(/^(?:SL)?0*(\d+)$/);
  return m ? 'SL' + m[1].padStart(3, '0') : raw;
}
function seatFind(rows, serial) {
  const k = seatKey(serial);
  for (let i = 0; i < rows.length; i++) { if (seatKey(rows[i]['序號']) === k) return rows[i]; }
  return null;
}
function seatNeed(rows, serial) {
  const r = seatFind(rows, serial);
  if (!r) throw new Error('找不到序號 ' + serial);
  return r;
}
function seatType(v) {
  const s = String(v == null ? '' : v).replace(/[－–—]/g, '-').replace(/型/g, '').trim();
  const m = s.match(/-?\s*(\d+)/);
  return m ? '-' + m[1] : s;
}
function seatDateArg(v, today, label) {
  if (v == null || String(v).trim() === '') return today;
  const d = seatParse(v);
  if (!d) throw new Error(label + '日期格式不對（要 yyyy/MM/dd）');
  return d;
}
function seatLog(now, action, row, from, to, note, source) {
  return { '時間': seatFmtTime(now), '動作': action, '序號': row['序號'], '原位置': from, '新位置': to, '說明': note, '來源': source || '網頁' };
}

/* 進廠：待修庫 → 指部工廠 */
function seatCheckin(rows, p, now) {
  const r = seatNeed(rows, p.serial);
  if (r['位置'] !== '待修庫') throw new Error(r['序號'] + ' 目前在「' + r['位置'] + '」，只有待修庫的座椅才能進廠');
  const d = seatDateArg(p.date, seatToday(now), '進廠');
  const from = r['位置'];
  r['位置'] = '指部工廠'; r['狀態'] = '交修中'; r['進廠日'] = seatFmt(d); r['備註'] = '交修中'; r['更新時間'] = seatFmtTime(now);
  return { rows: [r], logs: [seatLog(now, '進廠', r, from, '指部工廠', '進廠日 ' + seatFmt(d))], msg: r['序號'] + ' 已進廠到指部' };
}

/* 出廠：指部工廠 → 一修／三修，出廠日 = 生效日，三線屆期 = 出廠日 + 6 年 */
function seatCheckout(rows, p, now) {
  const r = seatNeed(rows, p.serial);
  if (r['位置'] !== '指部工廠') throw new Error(r['序號'] + ' 目前在「' + r['位置'] + '」，只有指部的座椅才能出廠');
  if (SEAT.SERVICE.indexOf(p.loc) < 0) throw new Error('出廠要選一修或三修');
  const d = seatDateArg(p.date, seatToday(now), '出廠');
  const ent = seatParse(r['進廠日']);
  if (ent && d < ent) throw new Error('出廠日不能早於進廠日（' + seatFmt(ent) + '）');
  const third = seatAddYears(d, SEAT.LIFE_YEARS);
  let sec;
  if (p.second != null && String(p.second).trim() !== '') {
    sec = seatParse(p.second);
    if (!sec) throw new Error('二線屆期日期格式不對（要 yyyy/MM/dd）');
  } else sec = seatAddYears(d, SEAT.SECOND_YEARS);
  const cycle = (parseInt(r['循環次數'], 10) || 1) + 1;
  const from = r['位置'];
  r['位置'] = p.loc; r['狀態'] = '服役中'; r['生效日'] = seatFmt(d); r['三線屆期'] = seatFmt(third); r['二線屆期'] = seatFmt(sec);
  r['進廠日'] = ''; r['循環次數'] = cycle; r['備註'] = '第 ' + cycle + ' 輪'; r['更新時間'] = seatFmtTime(now);
  return { rows: [r], logs: [seatLog(now, '出廠', r, from, p.loc, '出廠日 ' + seatFmt(d) + '，三線 ' + seatFmt(third) + '，二線 ' + seatFmt(sec) + '，第 ' + cycle + ' 輪')], msg: r['序號'] + ' 已出廠到' + p.loc + '，三線屆期 ' + seatFmt(third) };
}

/* 一修 ↔ 三修調撥 */
function seatTransfer(rows, p, now) {
  const r = seatNeed(rows, p.serial);
  if (SEAT.SERVICE.indexOf(r['位置']) < 0) throw new Error(r['序號'] + ' 目前在「' + r['位置'] + '」，只有一修／三修的座椅能調撥');
  if (SEAT.SERVICE.indexOf(p.loc) < 0 || p.loc === r['位置']) throw new Error('請選另一個單位（一修或三修）');
  const from = r['位置'];
  r['位置'] = p.loc; r['更新時間'] = seatFmtTime(now);
  return { rows: [r], logs: [seatLog(now, '調撥', r, from, p.loc, from + ' → ' + p.loc)], msg: r['序號'] + ' 已調撥到' + p.loc };
}

/* 新增座椅 */
function seatAdd(rows, p, now) {
  const m = String(p.serial == null ? '' : p.serial).toUpperCase().replace(/\s+/g, '').match(/^(?:SL)?(\d{1,4})$/);
  if (!m) throw new Error('序號請輸入數字（例如 72）');
  const serial = 'SL' + (m[1].length === 4 ? m[1] : m[1].padStart(3, '0'));
  if (seatFind(rows, serial)) throw new Error(serial + ' 已經存在');
  const type = seatType(p.type);
  if (SEAT.TYPES.indexOf(type) < 0) throw new Error('型別要是 -3、-4、-5 或 -6');
  const loc = p.loc;
  if (SEAT.LOCS.indexOf(loc) < 0) throw new Error('請選位置');
  const row = { '序號': serial, '型別': type, '位置': loc, '狀態': SEAT.STATUS[loc], '生效日': '', '三線屆期': '', '二線屆期': '', '循環次數': 1, '進廠日': '', '備註': (p.note && String(p.note).trim()) || '新增', '更新時間': seatFmtTime(now) };
  let note = '新增 ' + serial + '（' + type + '）在' + loc;
  if (SEAT.SERVICE.indexOf(loc) >= 0) {
    const eff = seatParse(p.effective);
    if (!eff) throw new Error('放在一修／三修的座椅要填生效日（出廠日）');
    let sec;
    if (p.second != null && String(p.second).trim() !== '') {
      sec = seatParse(p.second);
      if (!sec) throw new Error('二線屆期日期格式不對（要 yyyy/MM/dd）');
    } else sec = seatAddYears(eff, SEAT.SECOND_YEARS);
    row['生效日'] = seatFmt(eff); row['三線屆期'] = seatFmt(seatAddYears(eff, SEAT.LIFE_YEARS)); row['二線屆期'] = seatFmt(sec);
    note += '，生效 ' + row['生效日'] + '，三線 ' + row['三線屆期'];
  }
  return { rows: [row], isNew: true, logs: [seatLog(now, '新增', row, '', loc, note)], msg: serial + ' 已新增' };
}

/* 修改資料：只改有傳進來的欄位；全部檢查通過才會動 */
function seatEdit(rows, p, now) {
  const r = seatNeed(rows, p.serial), f = p.fields || {}, updates = {}, notes = [];
  Object.keys(f).forEach(function (k) {
    if (SEAT.EDITABLE.indexOf(k) < 0) throw new Error('不能修改欄位：' + k);
    let v = f[k] == null ? '' : String(f[k]).trim();
    if (k === '型別') { v = seatType(v); if (SEAT.TYPES.indexOf(v) < 0) throw new Error('型別要是 -3、-4、-5 或 -6'); }
    if (k === '位置' && SEAT.LOCS.indexOf(v) < 0) throw new Error('位置要是一修、三修、待修庫或指部工廠');
    if (SEAT.DATE_FIELDS.indexOf(k) >= 0 && v !== '') { const d = seatParse(v); if (!d) throw new Error(k + '日期格式不對（要 yyyy/MM/dd）'); v = seatFmt(d); }
    if (k === '循環次數' && v !== '') { if (!/^\d+$/.test(v) || +v < 1) throw new Error('循環次數要是 1 以上的整數'); v = +v; }
    const old = r[k] == null ? '' : r[k];
    if (String(old) !== String(v)) { updates[k] = v; notes.push(k + '：' + (old === '' ? '空白' : old) + ' → ' + (v === '' ? '空白' : v)); }
  });
  if (!notes.length) throw new Error('沒有任何修改');
  if (updates['位置'] !== undefined && f['狀態'] === undefined) { updates['狀態'] = SEAT.STATUS[updates['位置']]; }
  const from = r['位置'];
  Object.keys(updates).forEach(function (k) { r[k] = updates[k]; });
  r['更新時間'] = seatFmtTime(now);
  return { rows: [r], logs: [seatLog(now, '修改', r, from, r['位置'], notes.join('；'))], msg: r['序號'] + ' 已修改' };
}

/* 自動搬移：一修／三修的座椅，三線屆期日已過 → 待修庫（日期清空，舊日期寫進紀錄） */
function seatAutoMove(rows, now, source) {
  const today = seatToday(now), moved = [], logs = [];
  rows.forEach(function (r) {
    if (SEAT.SERVICE.indexOf(r['位置']) < 0) return;
    const third = seatParse(r['三線屆期']);
    if (!third || third >= today) return;
    const from = r['位置'];
    const old = { eff: r['生效日'] || '', third: seatFmt(third), sec: r['二線屆期'] || '' };
    const note = '三線 ' + old.third + ' 屆期，自動轉入待修庫（原生效 ' + (old.eff || '無') + '，二線 ' + (old.sec || '無') + '）';
    r['位置'] = '待修庫'; r['狀態'] = '待進廠'; r['生效日'] = ''; r['三線屆期'] = ''; r['二線屆期'] = ''; r['進廠日'] = ''; r['備註'] = '待進廠'; r['更新時間'] = seatFmtTime(now);
    const lg = seatLog(now, '自動搬移', r, from, '待修庫', note, source || '系統');
    lg['原生效日'] = old.eff; lg['原三線屆期'] = old.third; lg['原二線屆期'] = old.sec;   // 舊日期變成歷史資料
    moved.push(r); logs.push(lg);
  });
  return { rows: moved, logs: logs, msg: moved.length ? '已搬 ' + moved.length + ' 張到待修庫：' + moved.map(function (r) { return r['序號']; }).join('、') : '沒有需要搬移的座椅' };
}

/* 各單位飛機數：檢查並整理成 {一修:{'-3':14,...}} 和清單 */
function seatCleanAircraft(a) {
  const obj = {}, list = [];
  if (!a || typeof a !== 'object') throw new Error('飛機數資料不對');
  Object.keys(a).forEach(function (loc) {
    if (SEAT.SERVICE.indexOf(loc) < 0) throw new Error('單位只能是一修或三修');
    Object.keys(a[loc] || {}).forEach(function (t) {
      const type = seatType(t);
      if (SEAT.TYPES.indexOf(type) < 0) throw new Error('型別要是 -3、-4、-5 或 -6');
      const raw = a[loc][t];
      if (raw === '' || raw == null) return;
      if (!/^\d+$/.test(String(raw)) || +raw > 1000) throw new Error(loc + ' ' + type + ' 的飛機數要是 0～1000 的整數');
      obj[loc] = obj[loc] || {}; obj[loc][type] = +raw; list.push([loc, type, +raw]);
    });
  });
  if (!list.length) throw new Error('至少要填一個飛機數');
  return { obj: obj, list: list };
}

function seatApply(rows, req, now) {
  switch (req.action) {
    case 'checkin': return seatCheckin(rows, req, now);
    case 'checkout': return seatCheckout(rows, req, now);
    case 'transfer': return seatTransfer(rows, req, now);
    case 'add': return seatAdd(rows, req, now);
    case 'edit': return seatEdit(rows, req, now);
    default: throw new Error('不明的動作：' + req.action);
  }
}

  const p = parseResponse(text);

  state.source = source; state.updatedAt = ts;
  state.D = compute();
}
async function loadData(force) {
  if (!CONFIG.API_URL) {
    if (!state.demo) state.demo = { rows: rowsToObjects(parseTable(SAMPLE)), logs: [], aircraft: null };
    applyData(JSON.stringify({ records: state.demo.rows, aircraft: state.demo.aircraft }), 'demo', Date.now()); render(); return true;
  }
  state.loading = true; state.error = ''; renderStatus();
  try {
    const text = await fetchLive(state.key);
    applyData(text, 'live', Date.now());   // 先確定能解析，再存快取
    lsSet(CONFIG.CACHE_KEY, { ts: state.updatedAt, text });

  } catch (e) {

/* =====================================================================
   計算
   ===================================================================== */
function compute() {
  const R = state.records, A = state.aircraft, TYPES = CONFIG.TYPES, LOCS = CONFIG.LOCS;
  R.forEach(r => { r.days = diffDays(r.third); r.secDays = diffDays(r.second); });
  const matrix = {}; TYPES.forEach(t => { matrix[t] = {}; LOCS.forEach(l => matrix[t][l] = 0); });
  const unknown = [];
  R.forEach(r => { if (matrix[r.type] && matrix[r.type][r.loc] != null) matrix[r.type][r.loc]++; else unknown.push(r); });

  const support = [];
  Object.keys(A).forEach(loc => TYPES.forEach(type => {
    const ac = A[loc] && A[loc][type]; if (ac == null) return;
    const seats = matrix[type][loc] || 0;
    const exp90 = R.filter(r => r.loc === loc && r.type === type && r.days != null && r.days <= 90).length;
    support.push({ loc, type, ac, seats, exp90, rate: ac ? seats / ac * 100 : null, proj: ac ? (seats - exp90) / ac * 100 : null });
  }));

  const withDays = R.filter(r => r.days != null).sort((a, b) => a.days - b.days);
  const overdue = withDays.filter(r => r.days < 0 && SERVICE.includes(r.loc));
  const cnt = {}; R.forEach(r => cnt[r.serial] = (cnt[r.serial] || 0) + 1);
  const dupes = Object.keys(cnt).filter(k => cnt[k] > 1);
  const badDate = R.filter(r => r.badDates.length);
  const noThird = R.filter(r => SERVICE.includes(r.loc) && !r.third && !r.badDates.includes('三線屆期'));
  const serialFix = R.filter(r => r.serialFixed);
  // 出廠日 = 生效日，三線屆期應為出廠後 6 年
  const not6 = R.filter(r => r.effective && r.third && new Date(r.effective.getFullYear() + 6, r.effective.getMonth(), r.effective.getDate()).getTime() !== r.third.getTime());

  const issues = [];
  if (overdue.length) issues.push({ cls: 'bad', t: '三線已逾期、仍在服役位置（' + overdue.length + ' 張）', items: overdue.map(r => r.serial) });
  if (dupes.length) issues.push({ cls: 'bad', t: '序號重複（' + dupes.length + ' 個）', items: dupes });
  if (badDate.length) issues.push({ cls: 'warn', t: '日期格式看不懂（' + badDate.length + ' 張），該欄位已當成空白', items: badDate.map(r => r.serial), extra: badDate.map(r => r.serial + '：' + r.badDates.join('、') + ' 「' + r.raw[({ '生效日': 'effective', '三線屆期': 'third', '二線屆期': 'second', '進廠日': 'enter' })[r.badDates[0]]] + '」') });
  if (noThird.length) issues.push({ cls: 'warn', t: '服役中但沒有三線屆期日（' + noThird.length + ' 張）', items: noThird.map(r => r.serial) });
  if (not6.length) issues.push({ cls: 'warn', t: '三線屆期不是「生效日 + 6 年」（' + not6.length + ' 張）', items: not6.map(r => r.serial), extra: not6.map(r => r.serial + '：生效 ' + fmtDate(r.effective) + '，三線 ' + fmtDate(r.third)) });
  if (serialFix.length) issues.push({ cls: 'warn', t: '序號多打了 0（' + serialFix.length + ' 張），已當成 3 碼計算', items: serialFix.map(r => r.serial), extra: serialFix.map(r => r.rawSerial + ' → ' + r.serial) });
  if (unknown.length) issues.push({ cls: 'warn', t: '型別或位置不在清單內，未計入數量（' + unknown.length + ' 張）', items: unknown.map(r => r.serial) });

  const map = {}; R.forEach(r => { if (!map[r.serial]) map[r.serial] = r; });
  return { matrix, support, withDays, overdue, issues, map, unknown, total: R.length, cnt };
}

function findByQuery() {
  const d = serialDigits(state.q);
  if (!d) return { digits: '', exact: null, list: [] };
  const exact = state.records.find(r => serialDigits(r.serial) === d) || null;
  const seen = {}, list = [];
  state.records.forEach(r => { if (!seen[r.serial] && serialDigits(r.serial).startsWith(d)) { seen[r.serial] = 1; list.push(r); } });
  list.sort((a, b) => a.serial < b.serial ? -1 : 1);
  return { digits: d, exact, list };
}

function p2(n) { return (n < 10 ? '0' : '') + n; }
function dateVal(d) { return d ? d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) : ''; }
function slash(v) { return v ? String(v).replace(/-/g, '/') : ''; }
function fld(label, inner, hint) { return '<label class="fld"><span>' + label + '</span>' + inner + (hint ? '<small>' + hint + '</small>' : '') + '</label>'; }
function withCur(list, cur) { return (cur && list.indexOf(cur) < 0) ? [cur].concat(list) : list; }
function selHTML(id, opts, val, ph) {
  return '<select id="' + id + '">' + (ph ? '<option value="">' + ph + '</option>' : '') +
    opts.map(o => '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(LD(o)) + '</option>').join('') + '</select>';
}
function dateIn(id, d) { return '<input type="date" id="' + id + '" value="' + dateVal(d) + '">'; }

function openSheet(html) {
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  if ($('#modal').hidden) { $('#modal').hidden = false; pushLayer('modal'); }
  $('#sheet').scrollTop = 0;
}
function openModal(title, body, okText, onOk) {
  openSheet('<h3>' + esc(title) + '</h3>' + body + '<div class="merr" id="merr" role="alert"></div><div class="mbtn"><button class="btn" data-mcancel="1">' + (okText ? '取消' : '關閉') + '</button>' +
    (okText ? '<button class="btn pri" id="mok">' + esc(okText) + '</button>' : '') + '</div>');
  const ok = $('#mok');
  if (ok) ok.onclick = async () => { const me = $('#merr'); if (me) me.textContent = ''; ok.disabled = true; const old = ok.textContent; ok.textContent = '處理中…'; try { await onOk(); } finally { if (ok.isConnected) { ok.disabled = false; ok.textContent = old; } } };
}
function closeModal() { popLayerUI('modal'); }
function domCloseModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; }
function modalErr(msg) { const el = $('#merr'); if (el) el.textContent = msg; }

/* ---------- 送出：示範模式在本機模擬，連線模式 POST 到 Apps Script ---------- */
function demoApply(req) {
  const dm = state.demo, now = new Date();
  if (req.action === 'setAircraft') { const c = seatCleanAircraft(req.aircraft); dm.aircraft = c.obj; return { ok: true, msg: '飛機數已更新（示範模式，沒有真的寫入）' }; }
  const res = req.action === 'autoMove' ? seatAutoMove(dm.rows, now, '網頁') : seatApply(dm.rows, req, now);
  if (res.isNew) dm.rows.push(res.rows[0]);
  res.logs.forEach(l => dm.logs.push(l));
  return { ok: true, msg: res.msg + '（示範模式，沒有真的寫入）' };
}
async function apiPost(action, params) {
  const req = Object.assign({ action }, params);
  if (!CONFIG.API_URL) return demoApply(req);
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ key: state.key }, req)), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal });
    const text = await res.text();
    let j; try { j = JSON.parse(text); } catch (e) { throw new Error('伺服器回傳的不是資料，請確認 Apps Script 已重新部署'); }
    if (j.error) { const er = new Error(j.error); er.auth = (j.code === 'AUTH'); throw er; }
    return j;
  } finally { clearTimeout(to); }
}
async function doAction(action, params) {
  try {
    const j = await apiPost(action, params);
    closeModal(); toast(j.msg || '完成', 3500);
    await loadData(false);
    return true;
  } catch (e) {
    if (e.auth) { lock('密碼錯誤'); return false; }
    modalErr(e.name === 'AbortError' ? '連線逾時，不確定有沒有成功。請關掉這個視窗按「更新」確認後再操作' : (e.message || '失敗了，請再試一次'));
    return false;
  }
}
async function fetchLog(serial) {
  if (!CONFIG.API_URL) {
    const L = (state.demo ? state.demo.logs : []).slice().reverse();
    return (serial ? L.filter(x => seatKey(x['序號']) === seatKey(serial)) : L).slice(0, serial ? 200 : 40);
  }
  const url = CONFIG.API_URL + (CONFIG.API_URL.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(state.key) + '&what=log' + (serial ? '&serial=' + encodeURIComponent(serial) : '');
  const res = await fetch(url, { cache: 'no-store', redirect: 'follow' });
  const j = JSON.parse(await res.text());
  if (j.error) { const er = new Error(j.error); er.auth = (j.code === 'AUTH'); throw er; }
  return j.log || [];
}
function logHTML(list) {
  if (!list.length) return '<div class="empty">還沒有異動紀錄</div>';
  return list.map(x => '<div class="issue"><b>' + esc(x['動作']) + (x['序號'] ? '　' + esc(x['序號']) : '') + '</b><div class="note">' + esc(x['時間']) + (x['來源'] ? '　' + esc(x['來源']) : '') + '</div><div>' + esc(x['說明'] || '') + '</div></div>').join('');
}

/* ---------- 返回鍵：手機按返回會先關視窗，不會直接離開頁面 ---------- */
const layers = [];
function pushLayer(n) { layers.push(n); try { history.pushState({ l: n }, ''); } catch (e) { } }
function popLayerUI(n) {
  const i = layers.lastIndexOf(n); if (i < 0) return;
  let viaHistory = false;
  try { viaHistory = layers[layers.length - 1] === n && history.state && history.state.l === n; } catch (e) { }
  if (viaHistory) { history.back(); return; }
  layers.splice(i, 1); domClose(n);
}
function domClose(n) { if (n === 'modal') domCloseModal(); else if (n === 'dr') domCloseDr(); }
window.addEventListener('popstate', () => { const n = layers.pop(); if (n) domClose(n); });
function resetLayers() { layers.length = 0; domCloseModal(); domCloseDr(); }

/* ---------- 匯出 ---------- */
function csvText() {
  const H = ['序號', '型別', '位置', '狀態', '生效日', '三線屆期', '二線屆期', '進廠日', '循環次數', '備註'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"', fd = d => d ? fmtDate(d) : '';
  const rows = state.records.slice().sort((a, b) => a.serial < b.serial ? -1 : 1).map(r => [r.serial, r.type, r.loc, r.status, fd(r.effective), fd(r.third), fd(r.second), fd(r.enter), r.cycle == null ? '' : r.cycle, r.note].map(q).join(','));
  return [H.map(q).join(',')].concat(rows).join('\r\n');
}
function downloadCSV() {
  try {
    const d = new Date(), ymd = d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate());
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csvText()], { type: 'text/csv;charset=utf-8' }));
    a.download = '小記_' + ymd + '.csv'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); toast('已下載 CSV');
  } catch (e) { copyText(csvText()); }
}
function copyAll() {
  const L = state.records.slice().sort((a, b) => a.serial < b.serial ? -1 : 1);
  copyText('全部座椅（' + L.length + ' 張，' + fmtDate(today()) + '）\n' + L.map(r => r.serial + '　' + r.type + '　' + LD(r.loc) + '　' + (r.third ? fmtDate(r.third) : '—')).join('\n'));
}

    D('進廠、出廠、調撥', '<ul><li><b>進廠</b>：待修庫的座椅按「進廠」，選進廠日，搬到指部。</li><li><b>出廠</b>：指部的座椅按「出廠」，選出廠日與回到一修或三修；系統自動把出廠日當生效日、三線屆期設為 6 年後。出廠日不能早於進廠日。</li><li><b>調撥</b>：一修與三修互相調。</li><li><b>修改資料</b>：改型別、位置、日期、備註。</li><li><b>新增座椅</b>：作業頁按「新增座椅」。</li></ul><p>舊的日期不會消失，會記在試算表「異動紀錄」分頁，座椅的「歷史紀錄」可以看。</p>') +
    D('自動搬移', '<p>每天凌晨 1 點，系統自動把三線屆期已過的一修／三修座椅搬到待修庫；也可以在總覽或作業頁手動按。</p>') +
    D('飛機支援度', '<p>支援度 = 座椅數 ÷ 飛機數。100% 以上正常、90–99% 橘色、不到 90% 紅色。飛機數有變動：總覽「修改飛機數」。</p>') +
    D('設定與備份', '<p>右上「⋯」→ 設定：深淺色、文字大小、自動鎖定時間。「下載全部資料（CSV）」可當備份，用 Excel 開啟。</p>') +

    D('密碼與安全', '<p>密碼存在 Apps Script 的指令碼屬性 KEY，網頁裡不放密碼。閒置一段時間自動鎖定，離開前可按右上角鎖頭。</p>') +
    D('常見狀況', '<ul><li>顯示「示範資料」：尚未設定試算表網址，畫面是假資料。</li><li>資料沒更新：按右上角重新整理。</li><li>按了進廠／出廠但逾時：先重新整理確認有沒有成功，再決定要不要重做。</li><li>手機按返回鍵：會先關閉視窗，不會直接離開。</li></ul>') +
    '<div class="mbtn"><button class="btn pri" data-mcancel="1">關閉</button></div>';
}
function openHelp() { openSheet(helpHTML()); }

/* ---------- 作業頁 ---------- */
function viewWork() {
  const D = state.D;
  const by = loc => state.records.filter(r => r.loc === loc).sort((a, b) => a.type < b.type ? -1 : a.type > b.type ? 1 : a.serial < b.serial ? -1 : 1);
  const wait = by('待修庫'), fac = by('指部工廠');
  let h = '';
  if (!CONFIG.API_URL) h += '<div class="note" style="margin:0 0 12px"><b>示範模式：</b>這裡的操作只在畫面上模擬，不會寫進試算表。</div>';
  if (D.overdue.length) h += '<div class="alertbox"><b>三線已逾期 ' + D.overdue.length + ' 張，還在一修／三修</b><div class="note">系統每天凌晨 1 點會自動搬到待修庫，也可以現在手動搬。</div><button class="btn pri" data-act="automove">立即搬到待修庫（' + D.overdue.length + '）</button></div>';
  h += '<div class="chips"><button class="btn pri" data-act="add">＋ 新增座椅</button><button class="btn" data-act="log">看異動紀錄</button></div>' + secBar();
  h += sec('w-wait', '待修庫', wait.length + ' 張　按「進廠」', '<div class="card">' + (wait.length ? wait.map(r => itemHTML(r, { act: 'checkin', label: '進廠' })).join('') : '<div class="empty"><b>待修庫是空的</b>三線屆期的座椅會自動來這裡</div>') + '</div>', true);
  h += sec('w-fac', '指部', fac.length + ' 張　修好按「出廠」', '<div class="card">' + (fac.length ? fac.map(r => itemHTML(r, { act: 'checkout', label: '出廠' })).join('') : '<div class="empty"><b>指部沒有座椅</b>待修庫的座椅進廠後會在這裡</div>') + '</div>', true);
  if (state.logs) h += sec('w-log', '最近的異動紀錄', state.logs.length + ' 筆', '<div class="card">' + logHTML(state.logs) + '</div>', true);
  return h;
}

/* ---------- 事件 ---------- */
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.dataset && d.dataset.sec) { state.open[d.dataset.sec] = d.open; lsSet('seatAsset.open', state.open); }
}, true);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-nav],[data-h],[data-dr],[data-drclose],[data-drsort],[data-drtype],[data-copy-dr],[data-exp],[data-secall],[data-copy-card],[data-anh],[data-act],[data-mcancel],[data-year],[data-tool],[data-set],[data-tour],[data-retry]');
  if (!t) { if (e.target.id === 'modal') closeModal(); else if (e.target.id === 'drawer') closeDr(); return; }
  const d = t.dataset;
  if (d.mcancel) return closeModal();
  if (d.exp) {
    const it = t.closest('.it'), on = !it.classList.contains('on'), s = it.querySelector('.s').textContent;
    it.classList.toggle('on', on); it.querySelector('.itd').hidden = !on; t.setAttribute('aria-expanded', on); state.xp[s] = on; return;
  }
  if (d.dr) return openDr(d.dr);
  if (d.drclose) return closeDr();
  if (d.drsort) { state.drSort = d.drsort; return renderDrawer(); }
  if (d.drtype) { state.drType = d.drtype; return renderDrawer(); }
  if (d.copyDr) { const v = drView(state.dr); return copyText(v.x.title + '（共 ' + v.L.length + ' 張）\n' + v.L.map(r => r.serial + '　' + r.type + '　' + LD(r.loc) + '　' + (r.third ? fmtDate(r.third) : '—') + (r.days != null ? '　' + daysText(r.days) : '')).join('\n')); }
  if (d.secall != null) {
    document.querySelectorAll('#view details.sec').forEach(x => { x.open = d.secall === '1'; state.open[x.dataset.sec] = x.open; });
    lsSet('seatAsset.open', state.open); return;
  }
  if (d.tool) {
    if (d.tool === 'csv') return downloadCSV();
    if (d.tool === 'copyall') return copyAll();
    if (d.tool === 'settings') return openSettings();
    if (d.tool === 'help') return openHelp();
    if (d.tool === 'tour') return openTour(0);
    if (d.tool === 'lock') { closeModal(); return lock(); }
  }
  if (d.set) { const p = d.set.split(':'); state.set[p[0]] = (p[0] === 'lock' ? +p[1] : p[1]); lsSet(SET_KEY, state.set); applySettings(); bumpIdle(); return openSettings(); }
  if (d.tour) {
    if (d.tour === 'next') return openTour(state.tour + 1);
    if (d.tour === 'prev') return openTour(state.tour - 1);
    lsSet('seatAsset.tour', 1); return closeModal();
  }
  if (d.retry) return loadData(true);
  if (d.anh != null) { state.anH = +d.anh; return render(); }
  if (d.year) { state.year = +d.year; return render(); }
  if (d.act) return openAct(d.act, d.serial);
  if (d.go) return go(d.go);
  if (d.nav) return nav(d.nav);
  if (d.h) { state.horizon = +d.h; return render(); }
  if (d.copyCard) { const r = state.D.map[d.copyCard]; if (r) return copyText(cardText(r)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layers.length) popLayerUI(layers[layers.length - 1]); });
let lastY = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY, h = $('#hdr'); if (!h) return;
  if (document.activeElement === $('#q') || state.dr) { h.classList.remove('hide'); lastY = y; return; }
  if (y > lastY + 10 && y > 100) h.classList.add('hide'); else if (y < lastY - 6 || y < 40) h.classList.remove('hide');
  lastY = y;
}, { passive: true });
setInterval(() => { if (!document.hidden && CONFIG.API_URL && state.D && !state.loading && $('#modal').hidden && !state.dr && Date.now() - state.updatedAt > 10 * 60000) loadData(false); }, 60000);
$('#q').addEventListener('input', () => { state.q = $('#q').value; $('#qclear').hidden = !state.q; state.view = 'lookup'; render(); });
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (!state.D) return;
  const f = findByQuery(), s = f.exact || (f.list.length === 1 ? f.list[0] : null);
  if (s) saveRecent(s.serial);
  $('#q').blur();
});
$('#btnMore').addEventListener('click', openMenu);
$('#pwshow').addEventListener('click', () => { const i = $('#pw'), s = i.type === 'password'; i.type = s ? 'text' : 'password'; $('#pwshow').textContent = s ? '隱藏' : '顯示'; });
$('#qclear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; $('#qclear').hidden = true; render(); $('#q').focus(); });
$('#btnRefresh').addEventListener('click', () => { if (!state.loading) loadData(true); });
$('#btnLock').addEventListener('click', lock);

/* ---------- 鎖定（密碼由 Apps Script 檢查，網頁裡不存密碼） ---------- */
const AUTH_KEY = 'seatAsset.key';
let idleTimer = null;
function lock(msg) {
  try { sessionStorage.removeItem(AUTH_KEY); } catch (e) { }
  try { localStorage.removeItem(CONFIG.CACHE_KEY); } catch (e) { }
  state.key = ''; state.records = []; state.D = null; state.source = 'none'; state.q = ''; state.dr = null; state.logs = null; state.tourShown = false; resetLayers();
  $('#q').value = ''; $('#qclear').hidden = true; $('#view').innerHTML = ''; $('#badgeExp').hidden = true;
  $('#lock').classList.remove('hide'); $('#pw').value = '';
  $('#lockErr').textContent = (typeof msg === 'string') ? msg : '';
  setTimeout(() => $('#pw').focus(), 50);
}
function bumpIdle() {
  if (!CONFIG.AUTO_LOCK_MIN) return;
  clearTimeout(idleTimer); idleTimer = setTimeout(lock, CONFIG.AUTO_LOCK_MIN * 60000);
}
['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, bumpIdle, { passive: true }));
function showApp() { $('#lock').classList.add('hide'); bumpIdle(); maybeTour(); }
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw').value, btn = $('#lockForm .go');
  if (CONFIG.API_URL && !pw) { $('#lockErr').textContent = '請輸入密碼'; return; }
  btn.disabled = true; $('#lockErr').textContent = '驗證中…';
  state.key = pw;
  const ok = await loadData(false);
  btn.disabled = false;
  if (ok) { try { sessionStorage.setItem(AUTH_KEY, pw); } catch (err) { } $('#lockErr').textContent = ''; showApp(); }
  else if ($('#lockErr').textContent === '驗證中…') $('#lockErr').textContent = state.error || '連線失敗';
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.D && CONFIG.API_URL && state.updatedAt && Date.now() - state.updatedAt > 30 * 60000 && !state.loading) loadData(false);
});

/* ---------- 啟動 ---------- */
(function init() {
  loadSettings(); applySettings();
  state.open = lsGet('seatAsset.open', {}) || {};
  if (!CONFIG.API_URL) $('#pw').placeholder = '示範模式：隨便輸入就能進入';
  let k = ''; try { k = sessionStorage.getItem(AUTH_KEY) || ''; } catch (e) { }
  if (CONFIG.API_URL && k) { state.key = k; showApp(); loadData(false); }   // 同一次開啟，重新整理頁面不用再輸入
  else lock();
})();
</script>
