<style>
:root{
  --bg:#f4f4f1; --card:#ffffff; --text:#1c1c1a; --mute:#6b6b66; --line:#dcdcd5;
  --accent:#1f6f4a; --accent-t:#ffffff; --red:#c62828; --orange:#c76a00; --soft:#ecece7;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121412; --card:#1c1e1b; --text:#ecece6; --mute:#9a9b94; --line:#33362f;
    --accent:#4fbf86; --accent-t:#0d1a13; --red:#ff6b6b; --orange:#ffb04d; --soft:#252822; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:calc(72px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.bad{color:var(--red)} .warn{color:var(--orange)} .mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top,0px))}
.hdr-top{display:flex;align-items:center;gap:8px;padding:4px 0 8px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:18px}
.ttl small{display:block;font-size:12px;color:var(--mute)}
.ttl small.warn{color:var(--orange)} .ttl small.bad{color:var(--red)}
.sbtn{padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:14px}
.search{padding:0 0 10px}
.search input{width:100%;padding:12px 14px;font-size:20px;border:2px solid var(--line);border-radius:10px;background:var(--card);outline:0}
.search input:focus{border-color:var(--accent)}

/* common */
main{padding-top:14px}
h2{font-size:16px;margin:20px 0 8px}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.empty{padding:20px;text-align:center;color:var(--mute)}
.notice{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--red);color:var(--red);border-radius:10px;background:var(--card);margin-bottom:12px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:15px}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px}
.foot{margin-top:18px;font-size:12px;color:var(--mute);text-align:center}

/* list rows */
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.row:last-child{border-bottom:0}
.row:active{background:var(--soft)}
.row .s{font-weight:700;min-width:64px;font-variant-numeric:tabular-nums}
.row .m{flex:1;min-width:0;color:var(--mute);font-size:14px}
.row .d{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grp{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin:14px 2px 6px}
.grp.bad{color:var(--red)}

/* detail card */
.dh{padding:14px;border-bottom:1px solid var(--line)}
.dh .ser{font-size:34px;font-weight:700;line-height:1.1}
.dh .tags{margin-top:6px;color:var(--mute)}
.remain{padding:14px;border-bottom:1px solid var(--line)}
.remain .lbl{color:var(--mute);font-size:14px}
.remain .big{font-size:44px;font-weight:700;line-height:1.15}
.remain .big small{font-size:18px;font-weight:600;margin-left:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:0}
.kv span:first-child{color:var(--mute)}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.msg{padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.act{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* tables */
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mute);font-size:13px;background:var(--soft)}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
tr:last-child td{border-bottom:0}
td.t{cursor:pointer}
td.t:active{background:var(--soft)}
td.zero{color:var(--mute)}
tfoot td{font-weight:700;background:var(--soft)}
.note{font-size:13px;color:var(--mute);margin:6px 2px 0}
.issue{padding:12px 14px;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue b{display:block}
.issue .its{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.issue .its button{padding:3px 9px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--soft)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
.nav button{position:relative;padding:14px 0;font-size:17px;color:var(--mute)}
.nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:20px;vertical-align:2px}
.badge[hidden]{display:none}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lock.hide{display:none}
.lock form{width:100%;max-width:320px}
.lock h1{font-size:22px;margin:0 0 16px}
.lock input{width:100%;padding:13px 12px;font-size:18px;border:2px solid var(--line);border-radius:10px;background:var(--card);outline:0}
.lock input:focus{border-color:var(--accent)}
.lock button{width:100%;margin-top:10px;padding:13px;background:var(--accent);color:var(--accent-t);font-weight:700;border-radius:10px;font-size:17px}
.lock .err{color:var(--red);min-height:22px;margin-top:8px;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .25s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.btn.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.5}
.kvb{width:100%;text-align:left;background:var(--card);font:inherit;color:inherit}
.kvb:active{background:var(--soft)}
.kv small{font-size:13px}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.wrow:last-child{border-bottom:0}
.wmain{flex:1;min-width:0;display:flex;gap:10px;align-items:baseline;text-align:left}
.wmain .s{font-weight:700;min-width:64px}
.wmain .m{color:var(--mute);font-size:14px}
.alertbox{border:1px solid var(--red);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--card)}
.alertbox b{color:var(--red);display:block}
.alertbox .btn{margin-top:10px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.sheet h3{margin:0 0 8px;font-size:18px}
.mtxt{margin:8px 0}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.fld input,.fld select{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);outline:0;min-height:44px}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.fld small{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.agrid .fld{margin:0}
.merr{color:var(--red);min-height:22px;margin-top:6px;font-size:14px}
.mbtn{display:flex;gap:10px;margin-top:8px}
.mbtn .btn{flex:1;padding:12px}
.sheet .its{display:flex;gap:6px;flex-wrap:wrap}
.sheet .its span{padding:3px 9px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--soft)}
.ytabs{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.ytab{flex:1 0 76px;padding:10px 6px;text-align:center;border-right:1px solid var(--line);background:var(--card)}
.ytab:last-child{border-right:0}
.ytab b{display:block;font-size:17px}
.ytab span{font-size:13px;color:var(--mute)}
.ytab.on{background:var(--accent);color:var(--accent-t)}
.ytab.on span{color:var(--accent-t)}
.rbar{height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}.rbar i{display:block;height:100%;background:var(--accent)}
.mbars{display:flex;align-items:flex-end;gap:2px;padding:8px 4px 4px}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:2px 0;background:none;border:0;min-width:0}
.mb i{display:block;width:70%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.mb.on i{outline:2px solid var(--text)}.mb:disabled i{background:var(--line)}
.mb .mv{font-size:12px;font-weight:700}.mb .ml{font-size:11px;color:var(--mute)}
.dist{margin:10px 0}.dt{display:flex;justify-content:space-between;margin-bottom:4px}
.db{display:flex;height:22px;border-radius:6px;overflow:hidden}.db i{color:#fff;font-size:12px;font-style:normal;display:flex;align-items:center;justify-content:center;min-width:18px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.noscroll{overflow:hidden}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
.sec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px;cursor:pointer;min-height:52px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'›';font-size:22px;line-height:1;color:var(--mute);transition:transform .15s;width:14px;text-align:center}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec .st{font-weight:700;font-size:17px}
.sec .ss{margin-left:auto;font-size:13px;color:var(--mute);text-align:right}
.sec>.sb{padding:0 12px 12px}
.sec .card{border-radius:10px}
.card.pad{padding:12px}
.secbar{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}
.secbar .btn{padding:6px 12px;font-size:14px}
.nb{min-width:40px;padding:6px 10px;border-radius:8px;background:var(--soft);font-weight:700;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.nb.bold{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.nb:active{opacity:.7}
.zero{color:var(--mute);display:inline-block;min-width:40px;text-align:center}
.lk{font-size:13px;color:var(--orange);text-decoration:underline;padding:4px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.remainb{display:block;width:100%;text-align:left;background:var(--card)}
.remainb:active{background:var(--soft)}
.issueb{display:block;width:100%;text-align:left;background:var(--card)}
.issueb:active{background:var(--soft)}
.u{display:inline-block;padding:1px 8px;border-radius:10px;font-size:13px;color:#fff;font-weight:600;font-style:normal}
.u-a{background:#2f6fdb}.u-b{background:#17a589}.u-c{background:#e0a100}.u-d{background:#d6453d}.u-x{background:var(--mute)}
.it{border-bottom:1px solid var(--line);background:var(--card)}
.it:last-child{border-bottom:0}
.ith{display:flex;align-items:center;gap:8px;padding-right:10px}
.itm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:12px 6px 12px 14px}
.itm:active{background:var(--soft)}
.itm .s{font-weight:700;min-width:64px;font-variant-numeric:tabular-nums}
.itm .m{flex:1;min-width:0;color:var(--mute);font-size:14px}
.itm .d{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
.itm .chev{color:var(--mute);font-size:20px;transition:transform .15s}
.it.on .chev{transform:rotate(90deg)}
.it.on{background:var(--soft)}
.itd{background:var(--card);border-top:1px solid var(--line)}
.itd[hidden]{display:none}
.drawer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.drawer[hidden]{display:none}
.dsheet{background:var(--bg);width:100%;max-width:640px;height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 12px calc(16px + var(--safe-b));-webkit-overflow-scrolling:touch}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0 10px;z-index:2}
.dtt b{display:block;font-size:17px}
.dbtns{display:flex;gap:8px}
.dsum{font-size:14px;color:var(--mute);margin:0 0 10px;line-height:1.7}
.db button{color:#fff;font-size:13px;font-weight:700;min-width:22px;display:flex;align-items:center;justify-content:center}
.lockicon{display:block;width:84px;height:84px;border-radius:19px;margin:0 0 14px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hlp{margin:0 0 8px}.hlp summary{font-weight:700;padding:10px 0;cursor:pointer}.hlp p,.hlp li{margin:4px 0;font-size:15px;line-height:1.6}.hlp ul,.hlp ol{margin:4px 0;padding-left:20px}
.hicon{display:flex;gap:12px;align-items:center;padding:10px 0}.hicon img{width:64px;height:64px;border-radius:15px}
</style>

<script>
/* ===== 共用規則（Apps Script 與網頁示範模式共用，兩邊一模一樣）===== */
const SEAT = {
  LOCS: ['一修', '三修', '待修庫', '指部工廠'],
  SERVICE: ['一修', '三修'],
  TYPES: ['-3', '-4', '-5', '-6'],
  LIFE_YEARS: 6,      // 三線屆期 = 出廠日 + 6 年
  SECOND_YEARS: 3,    // 二線屆期預設 = 出廠日 + 3 年（出廠時可以手動改）
  DATE_FIELDS: ['生效日', '三線屆期', '二線屆期', '進廠日'],
  EDITABLE: ['型別', '位置', '狀態', '生效日', '三線屆期', '二線屆期', '循環次數', '進廠日', '備註'],
  STATUS: { '一修': '服役中', '三修': '服役中', '待修庫': '待進廠', '指部工廠': '交修中' }
};
function seatP2(n) { return (n < 10 ? '0' : '') + n; }
function seatFmt(d) { return d.getFullYear() + '/' + seatP2(d.getMonth() + 1) + '/' + seatP2(d.getDate()); }
function seatFmtTime(d) { return seatFmt(d) + ' ' + seatP2(d.getHours()) + ':' + seatP2(d.getMinutes()); }
function seatParse(s) {
  if (s == null) return null;
  const m = String(s).trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getMonth() === +m[2] - 1 ? d : null;
}
function seatAddYears(d, n) {
  const t = new Date(d.getFullYear() + n, d.getMonth(), d.getDate());
  return t.getMonth() === d.getMonth() ? t : new Date(d.getFullYear() + n, d.getMonth() + 1, 0);
}
function seatToday(now) { return new Date(now.getFullYear(), now.getMonth(), now.getDate()); }
function seatKey(s) {
  const raw = String(s == null ? '' : s).toUpperCase().replace(/\s+/g, '');
  const m = raw.match(/^(?:SL)?0*(\d+)$/);
  return m ? 'SL' + m[1].padStart(3, '0') : raw;
}
function seatFind(rows, serial) {
  const k = seatKey(serial);
  for (let i = 0; i < rows.length; i++) { if (seatKey(rows[i]['序號']) === k) return rows[i]; }
  return null;
}
function seatNeed(rows, serial) {
  const r = seatFind(rows, serial);
  if (!r) throw new Error('找不到序號 ' + serial);
  return r;
}
function seatType(v) {
  const s = String(v == null ? '' : v).replace(/[－–—]/g, '-').replace(/型/g, '').trim();
  const m = s.match(/-?\s*(\d+)/);
  return m ? '-' + m[1] : s;
}
function seatDateArg(v, today, label) {
  if (v == null || String(v).trim() === '') return today;
  const d = seatParse(v);
  if (!d) throw new Error(label + '日期格式不對（要 yyyy/MM/dd）');
  return d;
}
function seatLog(now, action, row, from, to, note, source) {
  return { '時間': seatFmtTime(now), '動作': action, '序號': row['序號'], '原位置': from, '新位置': to, '說明': note, '來源': source || '網頁' };
}

/* 進廠：待修庫 → 指部工廠 */
function seatCheckin(rows, p, now) {
  const r = seatNeed(rows, p.serial);
  if (r['位置'] !== '待修庫') throw new Error(r['序號'] + ' 目前在「' + r['位置'] + '」，只有待修庫的座椅才能進廠');
  const d = seatDateArg(p.date, seatToday(now), '進廠');
  const from = r['位置'];
  r['位置'] = '指部工廠'; r['狀態'] = '交修中'; r['進廠日'] = seatFmt(d); r['備註'] = '交修中'; r['更新時間'] = seatFmtTime(now);
  return { rows: [r], logs: [seatLog(now, '進廠', r, from, '指部工廠', '進廠日 ' + seatFmt(d))], msg: r['序號'] + ' 已進廠到指部' };
}

/* 出廠：指部工廠 → 一修／三修，出廠日 = 生效日，三線屆期 = 出廠日 + 6 年 */
function seatCheckout(rows, p, now) {
  const r = seatNeed(rows, p.serial);
  if (r['位置'] !== '指部工廠') throw new Error(r['序號'] + ' 目前在「' + r['位置'] + '」，只有指部的座椅才能出廠');
  if (SEAT.SERVICE.indexOf(p.loc) < 0) throw new Error('出廠要選一修或三修');
  const d = seatDateArg(p.date, seatToday(now), '出廠');
  const third = seatAddYears(d, SEAT.LIFE_YEARS);
  let sec;
  if (p.second != null && String(p.second).trim() !== '') {
    sec = seatParse(p.second);
    if (!sec) throw new Error('二線屆期日期格式不對（要 yyyy/MM/dd）');
  } else sec = seatAddYears(d, SEAT.SECOND_YEARS);
  const cycle = (parseInt(r['循環次數'], 10) || 1) + 1;
  const from = r['位置'];
  r['位置'] = p.loc; r['狀態'] = '服役中'; r['生效日'] = seatFmt(d); r['三線屆期'] = seatFmt(third); r['二線屆期'] = seatFmt(sec);
  r['進廠日'] = ''; r['循環次數'] = cycle; r['備註'] = '第 ' + cycle + ' 輪'; r['更新時間'] = seatFmtTime(now);
  return { rows: [r], logs: [seatLog(now, '出廠', r, from, p.loc, '出廠日 ' + seatFmt(d) + '，三線 ' + seatFmt(third) + '，二線 ' + seatFmt(sec) + '，第 ' + cycle + ' 輪')], msg: r['序號'] + ' 已出廠到' + p.loc + '，三線屆期 ' + seatFmt(third) };
}

/* 一修 ↔ 三修調撥 */
function seatTransfer(rows, p, now) {
  const r = seatNeed(rows, p.serial);
  if (SEAT.SERVICE.indexOf(r['位置']) < 0) throw new Error(r['序號'] + ' 目前在「' + r['位置'] + '」，只有一修／三修的座椅能調撥');
  if (SEAT.SERVICE.indexOf(p.loc) < 0 || p.loc === r['位置']) throw new Error('請選另一個單位（一修或三修）');
  const from = r['位置'];
  r['位置'] = p.loc; r['更新時間'] = seatFmtTime(now);
  return { rows: [r], logs: [seatLog(now, '調撥', r, from, p.loc, from + ' → ' + p.loc)], msg: r['序號'] + ' 已調撥到' + p.loc };
}

/* 新增座椅 */
function seatAdd(rows, p, now) {
  const m = String(p.serial == null ? '' : p.serial).toUpperCase().replace(/\s+/g, '').match(/^(?:SL)?0*(\d{1,3})$/);
  if (!m) throw new Error('序號請輸入數字（例如 72）');
  const serial = 'SL' + m[1].padStart(3, '0');
  if (seatFind(rows, serial)) throw new Error(serial + ' 已經存在');
  const type = seatType(p.type);
  if (SEAT.TYPES.indexOf(type) < 0) throw new Error('型別要是 -3、-4、-5 或 -6');
  const loc = p.loc;
  if (SEAT.LOCS.indexOf(loc) < 0) throw new Error('請選位置');
  const row = { '序號': serial, '型別': type, '位置': loc, '狀態': SEAT.STATUS[loc], '生效日': '', '三線屆期': '', '二線屆期': '', '循環次數': 1, '進廠日': '', '備註': (p.note && String(p.note).trim()) || '新增', '更新時間': seatFmtTime(now) };
  let note = '新增 ' + serial + '（' + type + '）在' + loc;
  if (SEAT.SERVICE.indexOf(loc) >= 0) {
    const eff = seatParse(p.effective);
    if (!eff) throw new Error('放在一修／三修的座椅要填生效日（出廠日）');
    let sec;
    if (p.second != null && String(p.second).trim() !== '') {
      sec = seatParse(p.second);
      if (!sec) throw new Error('二線屆期日期格式不對（要 yyyy/MM/dd）');
    } else sec = seatAddYears(eff, SEAT.SECOND_YEARS);
    row['生效日'] = seatFmt(eff); row['三線屆期'] = seatFmt(seatAddYears(eff, SEAT.LIFE_YEARS)); row['二線屆期'] = seatFmt(sec);
    note += '，生效 ' + row['生效日'] + '，三線 ' + row['三線屆期'];
  }
  return { rows: [row], isNew: true, logs: [seatLog(now, '新增', row, '', loc, note)], msg: serial + ' 已新增' };
}

/* 修改資料：只改有傳進來的欄位；全部檢查通過才會動 */
function seatEdit(rows, p, now) {
  const r = seatNeed(rows, p.serial), f = p.fields || {}, updates = {}, notes = [];
  Object.keys(f).forEach(function (k) {
    if (SEAT.EDITABLE.indexOf(k) < 0) throw new Error('不能修改欄位：' + k);
    let v = f[k] == null ? '' : String(f[k]).trim();
    if (k === '型別') { v = seatType(v); if (SEAT.TYPES.indexOf(v) < 0) throw new Error('型別要是 -3、-4、-5 或 -6'); }
    if (k === '位置' && SEAT.LOCS.indexOf(v) < 0) throw new Error('位置要是一修、三修、待修庫或指部工廠');
    if (SEAT.DATE_FIELDS.indexOf(k) >= 0 && v !== '') { const d = seatParse(v); if (!d) throw new Error(k + '日期格式不對（要 yyyy/MM/dd）'); v = seatFmt(d); }
    if (k === '循環次數' && v !== '') { if (!/^\d+$/.test(v) || +v < 1) throw new Error('循環次數要是 1 以上的整數'); v = +v; }
    const old = r[k] == null ? '' : r[k];
    if (String(old) !== String(v)) { updates[k] = v; notes.push(k + '：' + (old === '' ? '空白' : old) + ' → ' + (v === '' ? '空白' : v)); }
  });
  if (!notes.length) throw new Error('沒有任何修改');
  if (updates['位置'] !== undefined && f['狀態'] === undefined) { updates['狀態'] = SEAT.STATUS[updates['位置']]; }
  const from = r['位置'];
  Object.keys(updates).forEach(function (k) { r[k] = updates[k]; });
  r['更新時間'] = seatFmtTime(now);
  return { rows: [r], logs: [seatLog(now, '修改', r, from, r['位置'], notes.join('；'))], msg: r['序號'] + ' 已修改' };
}

/* 自動搬移：一修／三修的座椅，三線屆期日已過 → 待修庫（日期清空，舊日期寫進紀錄） */
function seatAutoMove(rows, now, source) {
  const today = seatToday(now), moved = [], logs = [];
  rows.forEach(function (r) {
    if (SEAT.SERVICE.indexOf(r['位置']) < 0) return;
    const third = seatParse(r['三線屆期']);
    if (!third || third >= today) return;
    const from = r['位置'];
    const old = { eff: r['生效日'] || '', third: seatFmt(third), sec: r['二線屆期'] || '' };
    const note = '三線 ' + old.third + ' 屆期，自動轉入待修庫（原生效 ' + (old.eff || '無') + '，二線 ' + (old.sec || '無') + '）';
    r['位置'] = '待修庫'; r['狀態'] = '待進廠'; r['生效日'] = ''; r['三線屆期'] = ''; r['二線屆期'] = ''; r['進廠日'] = ''; r['備註'] = '待進廠'; r['更新時間'] = seatFmtTime(now);
    const lg = seatLog(now, '自動搬移', r, from, '待修庫', note, source || '系統');
    lg['原生效日'] = old.eff; lg['原三線屆期'] = old.third; lg['原二線屆期'] = old.sec;   // 舊日期變成歷史資料
    moved.push(r); logs.push(lg);
  });
  return { rows: moved, logs: logs, msg: moved.length ? '已搬 ' + moved.length + ' 張到待修庫：' + moved.map(function (r) { return r['序號']; }).join('、') : '沒有需要搬移的座椅' };
}

/* 各單位飛機數：檢查並整理成 {一修:{'-3':14,...}} 和清單 */
function seatCleanAircraft(a) {
  const obj = {}, list = [];
  if (!a || typeof a !== 'object') throw new Error('飛機數資料不對');
  Object.keys(a).forEach(function (loc) {
    if (SEAT.SERVICE.indexOf(loc) < 0) throw new Error('單位只能是一修或三修');
    Object.keys(a[loc] || {}).forEach(function (t) {
      const type = seatType(t);
      if (SEAT.TYPES.indexOf(type) < 0) throw new Error('型別要是 -3、-4、-5 或 -6');
      const raw = a[loc][t];
      if (raw === '' || raw == null) return;
      if (!/^\d+$/.test(String(raw)) || +raw > 1000) throw new Error(loc + ' ' + type + ' 的飛機數要是 0～1000 的整數');
      obj[loc] = obj[loc] || {}; obj[loc][type] = +raw; list.push([loc, type, +raw]);
    });
  });
  if (!list.length) throw new Error('至少要填一個飛機數');
  return { obj: obj, list: list };
}

function seatApply(rows, req, now) {
  switch (req.action) {
    case 'checkin': return seatCheckin(rows, req, now);
    case 'checkout': return seatCheckout(rows, req, now);
    case 'transfer': return seatTransfer(rows, req, now);
    case 'add': return seatAdd(rows, req, now);
    case 'edit': return seatEdit(rows, req, now);
    default: throw new Error('不明的動作：' + req.action);
  }
}

  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('已複製'); } catch (e) { toast('複製失敗'); }

function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }


/* =====================================================================
   狀態
   ===================================================================== */
const state = {
  records: [], aircraft: JSON.parse(JSON.stringify(CONFIG.AIRCRAFT)),
  source: 'none', updatedAt: null, loading: false, error: '',
  view: 'count', key: '', logs: null, demo: null, anH: 90, xp: {}, open: {}, dr: null, year: null, yList: null, q: '', horizon: 90, expType: 'all', list: null, D: null
};

/* =====================================================================
   資料：讀取（只讀）／整理
   ===================================================================== */
function parseTable(text) {
  text = String(text).replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = first.indexOf('\t') >= 0 ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function rowsToObjects(rows) {
  const alias = CONFIG.FIELD_MAP.serial.map(s => s.toLowerCase());
  let hi = rows.findIndex(r => r.some(c => alias.indexOf(String(c).trim().toLowerCase()) >= 0));
  if (hi < 0) hi = 0;
  const head = (rows[hi] || []).map(h => String(h).trim());
  return rows.slice(hi + 1).map(r => { const o = {}; head.forEach((h, i) => { if (h) o[h] = r[i]; }); return o; });
}
function pick(obj, keys) {
  for (const k of keys) { if (obj[k] != null && obj[k] !== '') return obj[k]; }
  const lower = {}; Object.keys(obj).forEach(k => lower[String(k).trim().toLowerCase()] = obj[k]);
  for (const k of keys) { const v = lower[String(k).toLowerCase()]; if (v != null && v !== '') return v; }
  return null;
}
function extractRows(json) {
  if (Array.isArray(json)) {
    if (json.length && Array.isArray(json[0])) return rowsToObjects(json);
    return json;
  }
  if (json && typeof json === 'object') {
    for (const k of ['records', 'data', 'rows', 'items', 'seats', 'list']) if (Array.isArray(json[k])) return extractRows(json[k]);
  }
  return [];
}
// 回應可能是 JSON（Apps Script）或 CSV/TSV（發布到網路）
function parseResponse(text) {
  let json = null;
  try { json = JSON.parse(text); } catch (e) { }
  if (json != null && typeof json === 'object') {
    if (!Array.isArray(json) && json.error) { const er = new Error(json.error); er.auth = (json.code === 'AUTH'); throw er; }
    return { rows: extractRows(json), aircraft: (!Array.isArray(json) && json.aircraft && typeof json.aircraft === 'object') ? json.aircraft : null };
  }
  if (/^\s*</.test(text)) throw new Error('回傳的是網頁而不是資料（可能是權限沒設為「任何人」）');
  return { rows: rowsToObjects(parseTable(text)), aircraft: null };
}
function normalize(rows) {
  const F = CONFIG.FIELD_MAP;
  const DF = ['effective', 'third', 'second', 'enter'], DN = { effective: '生效日', third: '三線屆期', second: '二線屆期', enter: '進廠日' };
  return rows.map((o, i) => {
    const rawSerial = String(pick(o, F.serial) == null ? '' : pick(o, F.serial)).trim();
    const r = {
      serial: normSerial(rawSerial), rawSerial,
      type: normType(pick(o, F.type)),
      loc: String(pick(o, F.loc) || '').trim(),
      status: String(pick(o, F.status) || '').trim(),
      cycle: pick(o, F.cycle), note: String(pick(o, F.note) || '').trim(),
      raw: {}, badDates: [], _row: i + 2
    };
    DF.forEach(k => {
      const raw = pick(o, F[k]); r.raw[k] = raw; r[k] = parseDate(raw);
      if (!rawBlank(raw) && !r[k]) r.badDates.push(DN[k]);
    });
    r.serialFixed = false;
    return r;
  }).filter(r => r.serial);
}
async function fetchLive(key) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), CONFIG.FETCH_TIMEOUT_SEC * 1000);
  try {
    const res = await fetch(CONFIG.API_URL + (CONFIG.API_URL.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(key || ''), { method: 'GET', signal: ctl.signal, redirect: 'follow', cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.text();
  } finally { clearTimeout(to); }
}
function applyData(text, source, ts) {
  const p = parseResponse(text);
  state.records = normalize(p.rows);
  state.aircraft = p.aircraft || JSON.parse(JSON.stringify(CONFIG.AIRCRAFT));
  state.source = source; state.updatedAt = ts;
  state.D = compute();
}
async function loadData(force) {
  if (!CONFIG.API_URL) {
    if (!state.demo) state.demo = { rows: rowsToObjects(parseTable(SAMPLE)), logs: [], aircraft: null };
    applyData(JSON.stringify({ records: state.demo.rows, aircraft: state.demo.aircraft }), 'demo', Date.now()); render(); return true;
  }
  state.loading = true; state.error = ''; renderStatus();
  try {
    const text = await fetchLive(state.key);
    applyData(text, 'live', Date.now());   // 先確定能解析，再存快取
    lsSet(CONFIG.CACHE_KEY, { ts: state.updatedAt, text });
    if (force) toast('資料已更新');
    return true;
  } catch (e) {
    if (e.auth) { lock('密碼錯誤'); return false; }
    state.error = e.name === 'AbortError' ? '連線逾時' : (e.message || '連線失敗');
    if (!state.records.length) { const c = lsGet(CONFIG.CACHE_KEY, null); if (c && c.text) { try { applyData(c.text, 'cache', c.ts); } catch (e2) { } } }
    toast('更新失敗：' + state.error);
    return false;
  } finally { state.loading = false; render(); }
}

/* =====================================================================
   計算
   ===================================================================== */
function compute() {
  const R = state.records, A = state.aircraft, TYPES = CONFIG.TYPES, LOCS = CONFIG.LOCS;
  R.forEach(r => { r.days = diffDays(r.third); r.secDays = diffDays(r.second); });
  const matrix = {}; TYPES.forEach(t => { matrix[t] = {}; LOCS.forEach(l => matrix[t][l] = 0); });
  const unknown = [];
  R.forEach(r => { if (matrix[r.type] && matrix[r.type][r.loc] != null) matrix[r.type][r.loc]++; else unknown.push(r); });

  const support = [];
  Object.keys(A).forEach(loc => TYPES.forEach(type => {
    const ac = A[loc] && A[loc][type]; if (ac == null) return;
    const seats = matrix[type][loc] || 0;
    const exp90 = R.filter(r => r.loc === loc && r.type === type && r.days != null && r.days <= 90).length;
    support.push({ loc, type, ac, seats, exp90, rate: ac ? seats / ac * 100 : null, proj: ac ? (seats - exp90) / ac * 100 : null });
  }));

  const withDays = R.filter(r => r.days != null).sort((a, b) => a.days - b.days);
  const overdue = withDays.filter(r => r.days < 0 && SERVICE.includes(r.loc));
  const cnt = {}; R.forEach(r => cnt[r.serial] = (cnt[r.serial] || 0) + 1);
  const dupes = Object.keys(cnt).filter(k => cnt[k] > 1);
  const badDate = R.filter(r => r.badDates.length);
  const noThird = R.filter(r => SERVICE.includes(r.loc) && !r.third && !r.badDates.includes('三線屆期'));
  const serialFix = R.filter(r => r.serialFixed);
  // 出廠日 = 生效日，三線屆期應為出廠後 6 年
  const not6 = R.filter(r => r.effective && r.third && new Date(r.effective.getFullYear() + 6, r.effective.getMonth(), r.effective.getDate()).getTime() !== r.third.getTime());

  const issues = [];
  if (overdue.length) issues.push({ cls: 'bad', t: '三線已逾期、仍在服役位置（' + overdue.length + ' 張）', items: overdue.map(r => r.serial) });
  if (dupes.length) issues.push({ cls: 'bad', t: '序號重複（' + dupes.length + ' 個）', items: dupes });
  if (badDate.length) issues.push({ cls: 'warn', t: '日期格式看不懂（' + badDate.length + ' 張），該欄位已當成空白', items: badDate.map(r => r.serial), extra: badDate.map(r => r.serial + '：' + r.badDates.join('、') + ' 「' + r.raw[({ '生效日': 'effective', '三線屆期': 'third', '二線屆期': 'second', '進廠日': 'enter' })[r.badDates[0]]] + '」') });
  if (noThird.length) issues.push({ cls: 'warn', t: '服役中但沒有三線屆期日（' + noThird.length + ' 張）', items: noThird.map(r => r.serial) });
  if (not6.length) issues.push({ cls: 'warn', t: '三線屆期不是「生效日 + 6 年」（' + not6.length + ' 張）', items: not6.map(r => r.serial), extra: not6.map(r => r.serial + '：生效 ' + fmtDate(r.effective) + '，三線 ' + fmtDate(r.third)) });
  if (serialFix.length) issues.push({ cls: 'warn', t: '序號多打了 0（' + serialFix.length + ' 張），已當成 3 碼計算', items: serialFix.map(r => r.serial), extra: serialFix.map(r => r.rawSerial + ' → ' + r.serial) });
  if (unknown.length) issues.push({ cls: 'warn', t: '型別或位置不在清單內，未計入數量（' + unknown.length + ' 張）', items: unknown.map(r => r.serial) });

  const map = {}; R.forEach(r => { if (!map[r.serial]) map[r.serial] = r; });
  return { matrix, support, withDays, overdue, issues, map, unknown, total: R.length, cnt };
}

function findByQuery() {
  const d = serialDigits(state.q);
  if (!d) return { digits: '', exact: null, list: [] };
  const exact = state.records.find(r => serialDigits(r.serial) === d) || null;
  const seen = {}, list = [];
  state.records.forEach(r => { if (!seen[r.serial] && serialDigits(r.serial).startsWith(d)) { seen[r.serial] = 1; list.push(r); } });
  list.sort((a, b) => a.serial < b.serial ? -1 : 1);
  return { digits: d, exact, list };
}
function viewLookup() {
  const D = state.D, f = findByQuery();

/* ---------- 送出：示範模式在本機模擬，連線模式 POST 到 Apps Script ---------- */
function demoApply(req) {
  const dm = state.demo, now = new Date();
  if (req.action === 'setAircraft') { const c = seatCleanAircraft(req.aircraft); dm.aircraft = c.obj; return { ok: true, msg: '飛機數已更新（示範模式，沒有真的寫入）' }; }
  const res = req.action === 'autoMove' ? seatAutoMove(dm.rows, now, '網頁') : seatApply(dm.rows, req, now);
  if (res.isNew) dm.rows.push(res.rows[0]);
  res.logs.forEach(l => dm.logs.push(l));
  return { ok: true, msg: res.msg + '（示範模式，沒有真的寫入）' };
}
async function apiPost(action, params) {
  const req = Object.assign({ action }, params);
  if (!CONFIG.API_URL) return demoApply(req);
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ key: state.key }, req)), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal });
    const text = await res.text();
    let j; try { j = JSON.parse(text); } catch (e) { throw new Error('伺服器回傳的不是資料，請確認 Apps Script 已重新部署'); }
    if (j.error) { const er = new Error(j.error); er.auth = (j.code === 'AUTH'); throw er; }
    return j;
  } finally { clearTimeout(to); }
}
async function doAction(action, params) {
  try {
    const j = await apiPost(action, params);
    closeModal(); toast(j.msg || '完成', 3500);
    await loadData(false);
    return true;
  } catch (e) {
    if (e.auth) { lock('密碼錯誤'); return false; }
    modalErr(e.name === 'AbortError' ? '連線逾時，不確定有沒有成功。請關掉這個視窗按「更新」確認後再操作' : (e.message || '失敗了，請再試一次'));
    return false;
  }
}
async function fetchLog(serial) {
  if (!CONFIG.API_URL) {
    const L = (state.demo ? state.demo.logs : []).slice().reverse();
    return (serial ? L.filter(x => seatKey(x['序號']) === seatKey(serial)) : L).slice(0, serial ? 200 : 40);
  }
  const url = CONFIG.API_URL + (CONFIG.API_URL.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(state.key) + '&what=log' + (serial ? '&serial=' + encodeURIComponent(serial) : '');
  const res = await fetch(url, { cache: 'no-store', redirect: 'follow' });
  const j = JSON.parse(await res.text());
  if (j.error) { const er = new Error(j.error); er.auth = (j.code === 'AUTH'); throw er; }
  return j.log || [];
}
function logHTML(list) {
  if (!list.length) return '<div class="empty">還沒有異動紀錄</div>';
  return list.map(x => '<div class="issue"><b>' + esc(x['動作']) + (x['序號'] ? '　' + esc(x['序號']) : '') + '</b><div class="note">' + esc(x['時間']) + (x['來源'] ? '　' + esc(x['來源']) : '') + '</div><div>' + esc(x['說明'] || '') + '</div></div>').join('');
}

/* ---------- 各種作業的表單 ---------- */
function openAct(act, serial) {
  const D = state.D, r = serial ? D.map[serial] : null;
  if (serial && !r) return toast('找不到 ' + serial);
  const head = r ? '<div class="mtxt"><b>' + esc(r.serial) + '</b>　' + esc(r.type) + ' 型　目前在 ' + esc(LD(r.loc)) + '</div>' : '';

  if (act === 'checkin') {
    return openModal('進廠', head + '<div class="mtxt">待修庫 → 指部（開始翻修）</div>' + fld('進廠日', dateIn('f_date', today())), '確認進廠',
      () => doAction('checkin', { serial, date: slash($('#f_date').value) }));
  }
  if (act === 'checkout') {
    openModal('出廠', head + '<div class="mtxt">指部 → 一修或三修（翻修完成）</div>' +
      fld('出廠日（也是新的生效日）', dateIn('f_date', today())) + fld('回到哪個單位', selHTML('f_loc', CONFIG.SERVICE_LOCS, '', '請選擇')) +
      '<div class="mtxt" id="f_prev"></div>' + fld('二線屆期（預設出廠日 + 3 年，可以改）', dateIn('f_sec', null)), '確認出廠',
      () => {
        const loc = $('#f_loc').value, date = slash($('#f_date').value);
        if (!loc) { modalErr('請選擇回到一修或三修'); return; }
        if (!date) { modalErr('請填出廠日'); return; }
        return doAction('checkout', { serial, loc, date, second: slash($('#f_sec').value) });
      });
    let touched = false;
    const upd = () => {
      const d = seatParse($('#f_date').value);
      if (!d) { $('#f_prev').textContent = ''; return; }
      $('#f_prev').innerHTML = '新的三線屆期：<b>' + seatFmt(seatAddYears(d, SEAT.LIFE_YEARS)) + '</b>（出廠日 + 6 年）';
      if (!touched) $('#f_sec').value = dateVal(seatAddYears(d, SEAT.SECOND_YEARS));
    };
    $('#f_date').addEventListener('input', upd); $('#f_sec').addEventListener('input', () => { touched = true; }); upd();
    return;
  }
  if (act === 'transfer') {
    const to = r.loc === '一修' ? '三修' : '一修';
    return openModal('調撥', head + '<div class="mtxt">' + esc(LD(r.loc)) + ' → <b>' + to + '</b></div>', '確認調撥到' + to, () => doAction('transfer', { serial, loc: to }));
  }
  if (act === 'edit') {
    const stOpts = withCur(['服役中', '待進廠', '交修中'], r.status);
    openModal('修改資料', head +
      fld('型別', selHTML('e_type', withCur(CONFIG.TYPES, r.type), r.type)) + fld('位置', selHTML('e_loc', withCur(CONFIG.LOCS, r.loc), r.loc), '只改位置、沒改狀態時，狀態會自動跟著換') +
      fld('狀態', selHTML('e_status', stOpts, r.status, r.status ? '' : '（空白）')) +
      fld('生效日', dateIn('e_eff', r.effective)) + fld('三線屆期', dateIn('e_third', r.third)) + fld('二線屆期', dateIn('e_sec', r.second)) + fld('進廠日', dateIn('e_enter', r.enter)) +
      fld('循環次數', '<input type="number" id="e_cycle" min="1" value="' + (r.cycle == null ? '' : esc(r.cycle)) + '">') + fld('備註', '<input type="text" id="e_note" value="' + esc(r.note) + '">'),
      '儲存修改', () => {
        const orig = { '型別': r.type, '位置': r.loc, '狀態': r.status, '生效日': dateVal(r.effective), '三線屆期': dateVal(r.third), '二線屆期': dateVal(r.second), '進廠日': dateVal(r.enter), '循環次數': r.cycle == null ? '' : String(r.cycle), '備註': r.note };
        const now = { '型別': $('#e_type').value, '位置': $('#e_loc').value, '狀態': $('#e_status').value, '生效日': $('#e_eff').value, '三線屆期': $('#e_third').value, '二線屆期': $('#e_sec').value, '進廠日': $('#e_enter').value, '循環次數': $('#e_cycle').value, '備註': $('#e_note').value };
        const fields = {};
        Object.keys(now).forEach(k => { if (String(now[k]) !== String(orig[k])) fields[k] = SEAT.DATE_FIELDS.indexOf(k) >= 0 ? slash(now[k]) : now[k]; });
        if (!Object.keys(fields).length) { modalErr('沒有修改任何欄位'); return; }
        return doAction('edit', { serial, fields });
      });
    return;
  }
  if (act === 'add') {
    return openModal('新增座椅', fld('序號（只打數字）', '<input type="text" id="n_serial" inputmode="numeric" placeholder="例如 73">') +
      fld('型別', selHTML('n_type', CONFIG.TYPES, '', '請選擇')) + fld('位置', selHTML('n_loc', CONFIG.LOCS, '', '請選擇')) +
      fld('生效日（放一修／三修才要填）', dateIn('n_eff', null), '三線屆期會自動 = 生效日 + 6 年') + fld('備註（可以不填）', '<input type="text" id="n_note">'), '確認新增',
      () => {
        const serialIn = $('#n_serial').value.trim(), type = $('#n_type').value, loc = $('#n_loc').value;
        if (!serialIn) { modalErr('請輸入序號'); return; }
        if (!type) { modalErr('請選型別'); return; }
        if (!loc) { modalErr('請選位置'); return; }
        return doAction('add', { serial: serialIn, type, loc, effective: slash($('#n_eff').value), note: $('#n_note').value });
      });
  }
  if (act === 'aircraft') {
    const A = state.aircraft;
    let body = '<div class="mtxt">各單位各型別的飛機數（空白 = 沒有這個型別）</div>';
    CONFIG.SERVICE_LOCS.forEach(loc => {
      body += '<div class="mtxt"><b>' + loc + '</b></div><div class="agrid">' + CONFIG.TYPES.map(ty =>
        '<label class="fld"><span>' + ty + '</span><input type="number" min="0" id="a_' + loc + '_' + ty + '" value="' + ((A[loc] && A[loc][ty] != null) ? A[loc][ty] : '') + '"></label>').join('') + '</div>';
    });
    return openModal('修改飛機數', body, '儲存', () => {
      const aircraft = {};
      CONFIG.SERVICE_LOCS.forEach(loc => { aircraft[loc] = {}; CONFIG.TYPES.forEach(ty => { aircraft[loc][ty] = document.getElementById('a_' + loc + '_' + ty).value.trim(); }); });
      return doAction('setAircraft', { aircraft });
    });
  }
  if (act === 'automove') {
    const list = D.overdue;
    if (!list.length) return toast('沒有需要搬移的座椅');
    return openModal('搬到待修庫', '<div class="mtxt">以下 ' + list.length + ' 張三線屆期已過，要轉到待修庫。生效日、三線、二線會清空，舊日期記在異動紀錄裡當歷史資料。</div><div class="its">' +
      list.map(x => '<span>' + esc(x.serial) + '</span>').join('') + '</div>', '確認搬移 ' + list.length + ' 張', () => doAction('autoMove', {}));
  }
  if (act === 'history') {
    openModal('歷史紀錄　' + serial, '<div class="empty">讀取中…</div>', null);
    return fetchLog(serial).then(list => openModal('歷史紀錄　' + serial, '<div class="card">' + logHTML(list) + '</div>', null))
      .catch(e => { if (e.auth) return lock('密碼錯誤'); modalErr('讀取失敗：' + (e.message || '')); });
  }
  if (act === 'log') {
    return fetchLog().then(list => { state.logs = list; render(); })
      .catch(e => { if (e.auth) return lock('密碼錯誤'); toast('讀取紀錄失敗：' + (e.message || ''), 3000); });
  }
}

/* ---------- 作業頁 ---------- */
function viewWork() {
  const D = state.D;
  const by = loc => state.records.filter(r => r.loc === loc).sort((a, b) => a.type < b.type ? -1 : a.type > b.type ? 1 : a.serial < b.serial ? -1 : 1);
  const wait = by('待修庫'), fac = by('指部工廠');
  let h = '';
  if (!CONFIG.API_URL) h += '<div class="note" style="margin:0 0 12px">示範模式：這裡的操作只在畫面上模擬，不會寫進試算表。</div>';
  if (D.overdue.length) h += '<div class="alertbox"><b>三線已逾期 ' + D.overdue.length + ' 張，還在一修／三修</b><div class="note">系統每天凌晨 1 點會自動搬到待修庫，也可以現在手動搬。</div><button class="btn pri" data-act="automove">立即搬到待修庫（' + D.overdue.length + '）</button></div>';
  h += '<div class="chips"><button class="btn pri" data-act="add">新增座椅</button><button class="btn" data-act="log">看異動紀錄</button></div>' + secBar();
  h += sec('w-wait', '待修庫', wait.length + ' 張　按「進廠」送到指部', '<div class="card">' + (wait.length ? wait.map(r => itemHTML(r, { act: 'checkin', label: '進廠' })).join('') : '<div class="empty">待修庫沒有座椅</div>') + '</div>', true);
  h += sec('w-fac', '指部', fac.length + ' 張　修好按「出廠」', '<div class="card">' + (fac.length ? fac.map(r => itemHTML(r, { act: 'checkout', label: '出廠' })).join('') : '<div class="empty">指部沒有座椅</div>') + '</div>', true);
  if (state.logs) h += sec('w-log', '最近的異動紀錄', state.logs.length + ' 筆', '<div class="card">' + logHTML(state.logs) + '</div>', true);
  return h;
}

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.dataset && d.dataset.sec) { state.open[d.dataset.sec] = d.open; lsSet('seatAsset.open', state.open); }
}, true);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-nav],[data-h],[data-dr],[data-drclose],[data-copy-dr],[data-exp],[data-secall],[data-copy-card],[data-anh],[data-act],[data-mcancel],[data-year]');
  if (!t) { if (e.target.id === 'modal') closeModal(); else if (e.target.id === 'drawer') closeDr(); return; }
  const d = t.dataset;
  if (d.mcancel) return closeModal();
  if (d.exp) {
    const it = t.closest('.it'), on = !it.classList.contains('on'), s = it.querySelector('.s').textContent;
    it.classList.toggle('on', on); it.querySelector('.itd').hidden = !on; state.xp[s] = on; return;
  }
  if (d.dr) return openDr(d.dr);
  if (d.drclose) return closeDr();
  if (d.copyDr) { const x = drResolve(state.dr); return copyText(x.title + '（共 ' + x.recs.length + ' 張）\n' + x.recs.map(r => r.serial + '　' + r.type + '　' + LD(r.loc) + '　' + (r.third ? fmtDate(r.third) : '—') + (r.days != null ? '　' + daysText(r.days) : '')).join('\n')); }
  if (d.secall != null) {
    document.querySelectorAll('#view details.sec').forEach(x => { x.open = d.secall === '1'; state.open[x.dataset.sec] = x.open; });
    lsSet('seatAsset.open', state.open); return;
  }
  if (d.anh != null) { state.anH = +d.anh; return render(); }
  if (d.year) { state.year = +d.year; return render(); }
  if (d.act) return openAct(d.act, d.serial);
  if (d.go) return go(d.go);
  if (d.nav) return nav(d.nav);
  if (d.h) { state.horizon = +d.h; return render(); }
  if (d.copyCard) { const r = state.D.map[d.copyCard]; if (r) return copyText(cardText(r)); }
});
$('#q').addEventListener('input', () => { state.q = $('#q').value; state.view = 'lookup'; render(); });
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (!state.D) return;
  const f = findByQuery(), s = f.exact || (f.list.length === 1 ? f.list[0] : null);
  if (s) saveRecent(s.serial);
  $('#q').blur();
});
$('#btnHelp').addEventListener('click', () => openModal('使用說明', helpHTML(), null));
$('#btnRefresh').addEventListener('click', () => { if (!state.loading) loadData(true); });
$('#btnLock').addEventListener('click', lock);

/* ---------- 鎖定（密碼由 Apps Script 檢查，網頁裡不存密碼） ---------- */
const AUTH_KEY = 'seatAsset.key';
let idleTimer = null;
function lock(msg) {
  try { sessionStorage.removeItem(AUTH_KEY); } catch (e) { }
  try { localStorage.removeItem(CONFIG.CACHE_KEY); } catch (e) { }
  state.key = ''; state.records = []; state.D = null; state.source = 'none'; state.q = ''; state.dr = null; state.logs = null; closeModal(); renderDrawer();
  $('#q').value = ''; $('#view').innerHTML = ''; $('#badgeExp').hidden = true;
  $('#lock').classList.remove('hide'); $('#pw').value = '';
  $('#lockErr').textContent = (typeof msg === 'string') ? msg : '';
  setTimeout(() => $('#pw').focus(), 50);
}
function bumpIdle() {
  if (!CONFIG.AUTO_LOCK_MIN) return;
  clearTimeout(idleTimer); idleTimer = setTimeout(lock, CONFIG.AUTO_LOCK_MIN * 60000);
}
['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, bumpIdle, { passive: true }));
function showApp() { $('#lock').classList.add('hide'); bumpIdle(); }
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw').value, btn = $('#lockForm button');
  if (CONFIG.API_URL && !pw) { $('#lockErr').textContent = '請輸入密碼'; return; }
  btn.disabled = true; $('#lockErr').textContent = '驗證中…';
  state.key = pw;
  const ok = await loadData(false);
  btn.disabled = false;
  if (ok) { try { sessionStorage.setItem(AUTH_KEY, pw); } catch (err) { } $('#lockErr').textContent = ''; showApp(); }
  else if ($('#lockErr').textContent === '驗證中…') $('#lockErr').textContent = state.error || '連線失敗';
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.D && CONFIG.API_URL && state.updatedAt && Date.now() - state.updatedAt > 30 * 60000 && !state.loading) loadData(false);
});

/* ---------- 啟動 ---------- */
(function init() {
  state.open = lsGet('seatAsset.open', {}) || {};
  if (!CONFIG.API_URL) $('#pw').placeholder = '示範模式：隨便輸入就能進入';
  let k = ''; try { k = sessionStorage.getItem(AUTH_KEY) || ''; } catch (e) { }
  if (CONFIG.API_URL && k) { state.key = k; showApp(); loadData(false); }   // 同一次開啟，重新整理頁面不用再輸入
  else lock();
})();
</script>
