<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>人員情況投票</title>
<style>
/* Layout: 單欄。最上面是深藍色日期牌（日期是整頁主角），中間是投票，下面是尚未投票與回報文字，管理藏在頁尾。
   色彩: 冷灰底、深藍主色，四個狀態各一個固定色（休假藍、留守琥珀、救災紅、到班綠），其餘低調。 */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --ink: #0f1b2d;
  --muted: #5b6a7d;
  --line: #d9e0e8;
  --tint: #e8eef6;
  --hero: #12305c;
  --hero-fg: #ffffff;
  --hero-mute: #b7c7e0;
  --hero-chip: rgba(255, 255, 255, 0.14);
  --accent: #12305c;
  --on-accent: #ffffff;
  --ok: #1b7f4d;
  --err: #b8372b;
  --warn: #9a5b00;
  --c0: #1b78a8; --c1: #b26a00; --c2: #c23b2e; --c3: #1f8a54; --c4: #7a4fa3; --c5: #52667a;
  --font: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a111b; --surface: #121c2a; --ink: #e8eef6; --muted: #94a4b8; --line: #233246; --tint: #192a40;
    --hero: #173a6b; --hero-mute: #a9bddb;
    --accent: #8db8ff; --on-accent: #08111d;
    --ok: #5cc28a; --err: #ef7b6e; --warn: #e3b14f;
    --c0: #6bb8e0; --c1: #e3b14f; --c2: #ef7b6e; --c3: #5cc28a; --c4: #b794d9; --c5: #9db0c2;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* 日期牌 */
.hero { background: var(--hero); color: var(--hero-fg); border-radius: 18px; padding: 18px 16px 16px; }
.hero-unit { margin: 0 0 10px; text-align: center; font-size: 14px; font-weight: 700; letter-spacing: 0.16em; color: var(--hero-mute); }
.datebar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; }
.datebar > button {
  height: 48px; border: 0; border-radius: 12px; background: var(--hero-chip); color: var(--hero-fg);
  font-size: 28px; line-height: 1; cursor: pointer;
}
.datepick { position: relative; display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 2px 0; }
.d-big { font-size: 46px; font-weight: 800; line-height: 1.1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.d-sub { font-size: 18px; font-weight: 700; color: var(--hero-mute); }
.datepick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.pill {
  display: block; width: fit-content; max-width: 100%; margin: 12px auto 0; padding: 4px 14px; border-radius: 99px;
  background: var(--hero-chip); font-size: 14px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums;
}
.pill[data-k="closed"] { background: #fff; color: #b8372b; }
.hero-note { margin: 10px 0 0; text-align: center; font-size: 14px; color: var(--hero-mute); overflow-wrap: anywhere; }

.boot { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--tint); font-size: 15px; }
.notice { margin: 0; padding: 10px 12px; border: 1px solid var(--err); border-radius: 12px; color: var(--err); font-size: 14px; }
.preview { margin: 0; padding: 10px 12px; border: 1px dashed var(--muted); border-radius: 12px; color: var(--muted); font-size: 13px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }

/* 下一步提示與我的投票 */
.mine { --c: var(--c0); margin: 0 0 12px; padding: 12px 14px; border: 2px solid var(--c); border-radius: 14px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.mine[data-i="1"] { --c: var(--c1); }
.mine[data-i="2"] { --c: var(--c2); }
.mine[data-i="3"] { --c: var(--c3); }
.mine[data-i="4"] { --c: var(--c4); }
.mine[data-i="5"] { --c: var(--c5); }
.mine .m1 { font-size: 20px; font-weight: 800; color: var(--c); line-height: 1.4; }
.mine .m2 { margin-top: 2px; font-size: 13px; color: var(--muted); }
.guide {
  margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: var(--tint);
  font-size: 17px; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere;
}
.guide[data-k="ok"] { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.guide[data-k="err"] { background: color-mix(in srgb, var(--err) 14%, var(--surface)); color: var(--err); }
.guide[data-k="muted"] { background: var(--bg); color: var(--muted); }

.lab { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="password"], input[type="time"], textarea {
  width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 16px;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
#who { min-height: 56px; font-size: 21px; font-weight: 700; letter-spacing: 0.05em; }
.hint { margin: 6px 0 16px; font-size: 13px; color: var(--muted); }
.hint[data-k="err"] { color: var(--err); font-weight: 700; }
.hint[data-k="warn"] { color: var(--warn); font-weight: 700; }
.hint[data-k="ok"] { color: var(--ok); font-weight: 700; }

/* 選項 */
.opts { display: flex; flex-direction: column; gap: 10px; }
.optwrap { --c: var(--c0); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.optwrap[data-i="1"] { --c: var(--c1); }
.optwrap[data-i="2"] { --c: var(--c2); }
.optwrap[data-i="3"] { --c: var(--c3); }
.optwrap[data-i="4"] { --c: var(--c4); }
.optwrap[data-i="5"] { --c: var(--c5); }
.optwrap[data-sel="true"] { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); background: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.opts[data-closed="true"] .opt { cursor: default; }
.opt {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; min-height: 60px;
  padding: 10px 14px; border: 0; background: transparent; text-align: left; cursor: pointer;
}
.dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); }
.optwrap[data-sel="true"] .dot { border-color: var(--c); background: var(--c); box-shadow: inset 0 0 0 5px var(--surface); }
.oname { font-weight: 700; font-size: 18px; }
.mypill { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 99px; background: var(--c); color: var(--surface); font-size: 12px; font-weight: 700; vertical-align: middle; }
.cnt { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--c); min-width: 2ch; text-align: right; }
.opt-names { padding: 0 14px 12px 50px; font-size: 14px; line-height: 1.7; color: var(--muted); overflow-wrap: anywhere; }
.opt-names:empty { display: none; }
.opt-names .me { font-weight: 800; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

.primary {
  width: 100%; min-height: 56px; margin-top: 14px; border: 0; border-radius: 14px;
  background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 700; cursor: pointer;
}
.primary:disabled { opacity: 0.32; cursor: not-allowed; }
.ghost {
  width: 100%; min-height: 48px; margin-top: 12px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); font-weight: 700; cursor: pointer;
}

/* 尚未投票 */
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.head .small { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 99px;
  background: var(--bg); font-size: 15px; font-weight: 700; cursor: pointer;
}
.chip:disabled { cursor: default; opacity: 0.7; }
.chiphint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

/* 回報文字 */
.report {
  white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; border-radius: 12px;
  background: var(--bg); font-size: 15px; line-height: 1.85; user-select: text; -webkit-user-select: text;
}
.msg { min-height: 1.5em; margin: 8px 0 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.msg[data-k="ok"] { color: var(--ok); font-weight: 700; }
.msg[data-k="err"] { color: var(--err); font-weight: 700; }

/* 管理 */
.admin h2 { margin: 0 0 12px; font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: 14px; }
.field label { color: var(--muted); }
.field small { color: var(--muted); }
.checkrow { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 14px; }
.checkrow input { width: 18px; height: 18px; flex: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  flex: 1 1 140px; min-height: 46px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); font-weight: 700; cursor: pointer;
}
.btn.danger { color: var(--err); border-color: var(--err); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.sub { margin: 18px 0 8px; font-size: 14px; font-weight: 700; }
.vlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.vrow { display: flex; align-items: center; gap: 10px; padding: 6px 10px; min-height: 46px; }
.vrow + .vrow { border-top: 1px solid var(--line); }
.vrow .vn { flex: 1 1 auto; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.vrow .vs { flex: none; font-size: 13px; color: var(--muted); }
.vrow button {
  flex: none; min-height: 36px; padding: 4px 12px; border: 1px solid var(--err); border-radius: 8px;
  background: var(--surface); color: var(--err); font-size: 14px; cursor: pointer;
}
.vempty { margin: 0; padding: 10px; font-size: 14px; color: var(--muted); }
.foot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.linkbtn { border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 6px 10px; }
.sign { margin: 0; font-size: 13px; color: var(--muted); letter-spacing: 0.1em; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
  padding: 12px 20px; border-radius: 99px; background: var(--ink); color: var(--surface);
  font-size: 15px; font-weight: 700; text-align: center; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
}
.toast[data-k="err"] { background: var(--err); color: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <p class="hero-unit"><span id="unit"></span>　人員情況</p>
    <div class="datebar">
      <button id="prev" type="button" aria-label="前一天">‹</button>
      <div class="datepick">
        <span id="dBig" class="d-big">…</span>
        <span id="dSub" class="d-sub"></span>
        <input type="date" id="date" aria-label="選擇日期">
      </div>
      <button id="next" type="button" aria-label="後一天">›</button>
    </div>
    <p id="deadline" class="pill" hidden></p>
    <p id="note" class="hero-note" hidden></p>
  </header>

  <p id="boot" class="boot">載入中…　如果超過 10 秒還是空白，請改用 Safari 或 Chrome 開啟這個連結。</p>
  <p id="notice" class="notice" role="alert" hidden></p>
  <p id="preview" class="preview" hidden>預覽畫面：資料只存在這個畫面，重新整理就會消失。管理密碼是 1234。</p>

  <section class="card" aria-label="投票">
    <div id="mine" class="mine" role="status" hidden></div>
    <p id="guide" class="guide" role="status" data-k="todo">載入中…</p>
    <label class="lab" for="who">你的全名</label>
    <input type="text" id="who" maxlength="10" placeholder="例：王小明" autocomplete="off" enterkeyhint="done">
    <datalist id="rosterList"></datalist>
    <p id="nameHint" class="hint"></p>
    <div id="opts" class="opts" role="radiogroup" aria-label="狀態"></div>
    <button id="submit" class="primary" type="button" disabled>送出</button>
  </section>

  <section id="unvotedCard" class="card" aria-label="尚未投票" hidden>
    <div class="head"><h2 id="unvotedTitle">尚未投票</h2><span class="small">點自己的名字可以直接填入</span></div>
    <div id="unvoted" class="chips"></div>
  </section>

  <section class="card" aria-label="回報文字">
    <div class="head"><h2>回報文字</h2><span id="progress" class="small"></span></div>
    <div id="report" class="report"></div>
    <button id="copy" class="ghost" type="button">複製回報文字</button>
    <p id="copyMsg" class="msg" role="status"></p>
  </section>

  <section id="admin" class="card admin" aria-label="管理" hidden>
    <h2>管理</h2>
    <div id="adminLogin">
      <div class="field"><label for="aPin">管理密碼</label><input type="password" id="aPin" autocomplete="off"></div>
      <button id="unlock" class="btn" type="button" style="width:100%">解鎖</button>
    </div>
    <div id="adminBody" hidden>
      <div class="field"><label for="aUnit">單位名稱</label><input type="text" id="aUnit" maxlength="20" autocomplete="off"></div>
      <div class="field"><label for="aOptions">狀態選項</label><input type="text" id="aOptions" autocomplete="off"><small>2～6 個，用頓號分開，例：休假、留守、救災、到班</small></div>
      <div class="field"><label for="aNote">說明（可空白）</label><input type="text" id="aNote" autocomplete="off"></div>
      <div class="field"><label for="aCutoff">每天截止時間（投票日前一天，可空白）</label><input type="time" id="aCutoff"></div>
      <div class="field"><label for="aRoster">同仁名單（可空白）</label><textarea id="aRoster" autocomplete="off"></textarea><small>貼上全名，用頓號、逗號或換行分開。填了之後，頁面會列出「尚未投票」的人，同仁點名字就能填入，輸入的名字也會幫忙核對。</small></div>
      <label class="checkrow"><input type="checkbox" id="aShort"> 回報文字只留名字，省略姓氏</label>
      <div class="row">
        <button id="saveCfg" class="btn" type="button">儲存設定</button>
        <button id="clearBtn" class="btn danger" type="button">清空這一天的投票</button>
      </div>
      <p id="adminDay" class="sub"></p>
      <div id="voteList" class="vlist"></div>
    </div>
    <p id="adminMsg" class="msg" role="status"></p>
  </section>

  <div class="foot">
    <button id="adminToggle" class="linkbtn" type="button">管理</button>
    <p class="sign">吱吱製作</p>
  </div>
</main>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var DEFAULT_OPTIONS = ["休假", "留守", "救災", "到班"];
  var COMPOUND = ["歐陽", "司馬", "諸葛", "上官", "夏侯", "皇甫", "張簡", "范姜", "公孫", "慕容", "令狐", "司徒", "南宮", "東方", "尉遲", "長孫", "宇文", "單于"];
  var NAME_RE = /^[一-鿿A-Za-z·.]{2,10}$/;
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  var POLL_MS = 20000;

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, "0"); };

  var hasGAS = typeof google !== "undefined" && google.script && google.script.run;

  /* ---- 日期小工具（用字串計算，不受手機時區影響） ---- */
  function utcMs(ds) { var p = ds.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function addDays(ds, n) {
    var d = new Date(utcMs(ds) + n * 86400000);
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  function md(ds) { var p = ds.split("-"); return (+p[1]) + "/" + (+p[2]); }
  function weekText(ds, today) {
    var wk = "週" + WEEK[new Date(utcMs(ds)).getUTCDay()];
    return today && today.slice(0, 4) !== ds.slice(0, 4) ? ds.slice(0, 4) + "年　" + wk : wk;
  }
  function longDate(ds, today) {
    if (!ds) return "";
    var p = ds.split("-");
    return (+p[1]) + "月" + (+p[2]) + "日 " + weekText(ds, today);
  }
  function dayParen(ds) { return ds ? "(" + (+ds.split("-")[2]) + "日)" : ""; }

  /* ---- 預覽用假後端：只有在 Apps Script 以外開啟時才會用到 ---- */
  var MOCK = (function () {
    var PIN = "1234";
    var cfg = { unit: "軍械股", options: DEFAULT_OPTIONS.slice(), note: "", cutoff: "", short: true, roster: [] };
    var today = (function () { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); })();
    var byDate = {};
    function splitNames(s) { return String(s || "").split(/[、,，;；\s]+/).filter(Boolean); }
    function parseOpts(s) {
      var a = splitNames(s), seen = {};
      for (var i = 0; i < a.length; i++) { if (a[i].length > 6 || seen[a[i]]) return null; seen[a[i]] = 1; }
      return a.length >= 2 && a.length <= 6 ? a : null;
    }
    function closeInfo(date) {
      if (date < today) return { closed: true, reason: "past", closeAt: null };
      var closeAt = null;
      if (cfg.cutoff) {
        var hm = cfg.cutoff.split(":");
        var p = date.split("-");
        closeAt = new Date(+p[0], +p[1] - 1, +p[2] - 1, +hm[0], +hm[1]).getTime();
      }
      var closed = !!closeAt && Date.now() > closeAt;
      return { closed: closed, reason: closed ? "cutoff" : "", closeAt: closeAt };
    }
    return {
      getState: function (date) {
        if (!DATE_RE.test(date || "")) date = addDays(today, 1);
        var c = closeInfo(date);
        var votes = (byDate[date] || []).filter(function (v) { return cfg.options.indexOf(v.status) >= 0; });
        return { date: date, today: today, votes: votes, cfg: JSON.parse(JSON.stringify(cfg)),
          closed: c.closed, reason: c.reason, closeAt: c.closeAt, now: Date.now() };
      },
      submitVote: function (date, name, status) {
        name = String(name || "").replace(/[\s　]+/g, "");
        if (!DATE_RE.test(date || "")) return { ok: false, msg: "日期不正確" };
        if (!NAME_RE.test(name)) return { ok: false, msg: "請輸入中文全名（至少兩個字）" };
        if (cfg.options.indexOf(status) < 0) return { ok: false, msg: "請選擇狀態" };
        var c = closeInfo(date);
        if (c.closed) return { ok: false, msg: c.reason === "past" ? "這一天已結束，不能再投票" : "投票已截止" };
        var list = byDate[date] = byDate[date] || [];
        for (var i = 0; i < list.length; i++) {
          if (list[i].name === name) { list[i].status = status; list[i].t = Date.now(); return { ok: true }; }
        }
        list.push({ name: name, status: status, t: Date.now() });
        return { ok: true };
      },
      adminCheck: function (pin) { return pin === PIN; },
      adminSave: function (pin, c) {
        if (pin !== PIN) return { ok: false, msg: "密碼錯誤" };
        var unit = String(c.unit || "").trim();
        if (!unit || unit.length > 20) return { ok: false, msg: "單位名稱請填 1～20 個字" };
        var o = parseOpts(c.options);
        if (!o) return { ok: false, msg: "狀態選項請填 2～6 個，用頓號分開，不能重複" };
        var names = splitNames(c.roster), seen = {}, ok = [], bad = [];
        names.forEach(function (n) { if (seen[n]) return; seen[n] = 1; (NAME_RE.test(n) ? ok : bad).push(n); });
        if (bad.length) return { ok: false, msg: "這些名字不是中文全名：" + bad.slice(0, 3).join("、") + (bad.length > 3 ? " 等" : "") };
        cfg = { unit: unit, options: o, note: c.note || "", cutoff: c.cutoff || "", short: !!c.short, roster: ok };
        return { ok: true };
      },
      adminDelete: function (pin, date, name) { if (pin !== PIN) return { ok: false, msg: "密碼錯誤" }; byDate[date] = (byDate[date] || []).filter(function (v) { return v.name !== name; }); return { ok: true }; },
      adminClear: function (pin, date) { if (pin !== PIN) return { ok: false, msg: "密碼錯誤" }; byDate[date] = []; return { ok: true }; }
    };
  })();

  function call(fn, args) {
    return new Promise(function (resolve, reject) {
      if (hasGAS) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
        r[fn].apply(r, args);
      } else {
        setTimeout(function () {
          try { resolve(MOCK[fn].apply(null, args)); } catch (e) { reject(e); }
        }, 120);
      }
    });
  }

  var S = { date: "", today: "", votes: [], cfg: { unit: "", options: DEFAULT_OPTIONS.slice(), note: "", cutoff: "", short: true, roster: [] }, closed: false, reason: "", closeAt: null, now: Date.now() };
  var OPTS = DEFAULT_OPTIONS.slice();
  var ROSTER_KEY = "";
  var curDate = "", fetchedAt = 0;
  var skew = 0, loading = false, again = false, loaded = false;
  var pick = "", busy = false, sticky = "", stickyK = "", confirmClear = false, clearTimer = 0, toastTimer = 0;
  var pin = "", adminOpen = false;

  function nowMs() { return Date.now() + skew; }
  function isClosed() { return S.reason === "past" || (!!S.closeAt && nowMs() > S.closeAt); }
  function roster() { return S.cfg.roster || []; }
  function fmtTime(ms) {
    var d = new Date(ms);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function countdown(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 1) return "不到 1 分鐘";
    if (m < 60) return m + " 分鐘";
    var h = Math.floor(m / 60);
    if (h < 24) return h + " 小時 " + (m % 60) + " 分";
    return Math.floor(h / 24) + " 天 " + (h % 24) + " 小時";
  }
  function normName(s) { return String(s || "").replace(/[\s　]+/g, "").slice(0, 10); }
  function shortName(name) {
    var a = Array.from(name);
    if (a.length === 3) return a.slice(1).join("");
    if (a.length === 4 && COMPOUND.indexOf(a.slice(0, 2).join("")) >= 0) return a.slice(2).join("");
    return name;
  }
  function currentName() { return normName($("who").value); }
  function votersOf(o) {
    return S.votes.filter(function (v) { return v.status === o; }).map(function (v) { return v.name; });
  }
  function findVote(name) {
    for (var i = 0; i < S.votes.length; i++) if (S.votes[i].name === name) return S.votes[i];
    return null;
  }
  function joinOpts(a) {
    return a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join("、") + "及" + a[a.length - 1];
  }

  function buildReport() {
    var strip = S.cfg.short !== false;
    var L = [(S.cfg.unit || "") + dayParen(curDate) + "人員情況如下", joinOpts(OPTS) + "人員～"];
    OPTS.forEach(function (o) {
      var a = votersOf(o);
      if (strip) a = a.map(shortName);
      if (a.length) L.push(o + "：" + a.length + "員（" + a.join("、") + "）");
    });
    return L.join("\n");
  }

  function notice(t) { var el = $("notice"); el.textContent = t; el.hidden = !t; }
  function setMsg(t, k) { sticky = t || ""; stickyK = k || ""; }
  function copyMsg(t, k) { var el = $("copyMsg"); el.textContent = t || ""; el.dataset.k = k || ""; }
  function adminMsg(t, k) { var el = $("adminMsg"); el.textContent = t || ""; el.dataset.k = k || ""; }
  function toast(t, k) {
    var el = $("toast");
    el.textContent = t; el.dataset.k = k || ""; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
  }

  function buildOpts() {
    var box = $("opts");
    box.textContent = "";
    OPTS.forEach(function (o, i) {
      var wrap = document.createElement("div");
      wrap.className = "optwrap"; wrap.dataset.i = String(i); wrap.dataset.sel = "false";
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.dataset.o = o;
      b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false");
      var dot = document.createElement("span"); dot.className = "dot";
      var nm = document.createElement("span"); nm.className = "oname"; nm.textContent = o;
      var pill = document.createElement("span"); pill.className = "mypill"; pill.textContent = "✓ 你的選擇"; pill.hidden = true;
      nm.appendChild(pill);
      var cnt = document.createElement("span"); cnt.className = "cnt"; cnt.textContent = "–";
      b.appendChild(dot); b.appendChild(nm); b.appendChild(cnt);
      var names = document.createElement("div"); names.className = "opt-names";
      wrap.appendChild(b); wrap.appendChild(names);
      box.appendChild(wrap);
    });
  }
  function ensureOpts() {
    var o = S.cfg.options && S.cfg.options.length ? S.cfg.options : DEFAULT_OPTIONS;
    if (o.join("|") !== OPTS.join("|")) {
      OPTS = o.slice();
      if (OPTS.indexOf(pick) < 0) pick = "";
      buildOpts();
    }
  }
  function ensureRosterList() {
    var r = roster();
    var key = r.join("|");
    if (key === ROSTER_KEY) return;
    ROSTER_KEY = key;
    var dl = $("rosterList");
    dl.textContent = "";
    r.forEach(function (n) { var o = document.createElement("option"); o.value = n; dl.appendChild(o); });
    if (r.length) $("who").setAttribute("list", "rosterList"); else $("who").removeAttribute("list");
  }
  function renderNames(el, arr, me) {
    el.textContent = "";
    arr.forEach(function (n, i) {
      if (i) el.appendChild(document.createTextNode("、"));
      var s = document.createElement("span");
      s.textContent = n;
      if (n === me) s.className = "me";
      el.appendChild(s);
    });
  }
  function updateOpts() {
    var wraps = $("opts").children;
    var me = currentName();
    var mv = loaded && NAME_RE.test(me) ? findVote(me) : null;
    $("opts").dataset.closed = String(isClosed());
    for (var k = 0; k < wraps.length; k++) {
      var o = OPTS[k], a = votersOf(o);
      wraps[k].dataset.sel = String(pick === o);
      wraps[k].querySelector(".opt").setAttribute("aria-checked", String(pick === o));
      wraps[k].querySelector(".cnt").textContent = loaded ? String(a.length) : "–";
      renderNames(wraps[k].querySelector(".opt-names"), a, me);
      wraps[k].querySelector(".mypill").hidden = !(mv && mv.status === o);
    }
  }
  function updateHeader() {
    $("unit").textContent = S.cfg.unit || "";
    $("dBig").textContent = curDate ? md(curDate) : "…";
    $("dSub").textContent = curDate ? weekText(curDate, S.today) : "";
    if (curDate && $("date").value !== curDate) $("date").value = curDate;
    var n = $("note");
    n.textContent = S.cfg.note || "";
    n.hidden = !S.cfg.note;
    var d = $("deadline");
    var closed = isClosed();
    if (S.reason === "past") {
      d.textContent = "這一天已結束，只能查看"; d.dataset.k = "past"; d.hidden = false;
    } else if (S.closeAt) {
      if (closed) { d.textContent = "投票已截止，只能查看"; d.dataset.k = "closed"; }
      else {
        var left = S.closeAt - nowMs();
        d.textContent = "截止 " + fmtTime(S.closeAt) + (left < 36 * 3600000 ? "　還有 " + countdown(left) : "");
        d.dataset.k = "open";
      }
      d.hidden = false;
    } else {
      d.hidden = true;
    }
  }
  function updateReport() {
    $("report").textContent = buildReport();
    var t = "";
    if (!loaded) t = "讀取中…";
    else {
      var d = new Date(fetchedAt || Date.now());
      t = "已投票 " + S.votes.length + " 人　" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + " 更新";
    }
    $("progress").textContent = t;
  }
  function updateUnvoted() {
    var R = roster(), card = $("unvotedCard");
    card.hidden = !R.length;
    if (!R.length) return;
    var voted = {};
    S.votes.forEach(function (v) { voted[v.name] = 1; });
    var left = R.filter(function (n) { return !voted[n]; });
    $("unvotedTitle").textContent = !loaded ? "尚未投票" : (left.length ? "尚未投票　" + left.length + " 人" : "全員已投票 ✓");
    var box = $("unvoted");
    box.textContent = "";
    if (!loaded) return;
    var closed = isClosed();
    left.forEach(function (n) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = n; b.disabled = closed;
      box.appendChild(b);
    });
  }
  function updateNameHint() {
    var raw = $("who").value.replace(/[\s　]/g, "");
    var h = $("nameHint");
    var R = roster();
    if (!raw) {
      h.textContent = R.length ? "輸入全名，或點下面「尚未投票」裡自己的名字。" : "請輸入全名（例：王小明），不要用暱稱。";
      h.dataset.k = "";
      return;
    }
    var nm = normName(raw);
    if (!NAME_RE.test(nm)) {
      h.textContent = raw.length < 2 ? "至少要兩個字。" : "只能輸入中文或英文字母，不要數字或符號。";
      h.dataset.k = "err";
    } else if (R.length && R.indexOf(nm) < 0) {
      h.textContent = "名單裡沒有「" + nm + "」，請確認是不是全名。仍然可以送出。";
      h.dataset.k = "warn";
    } else if (R.length) {
      h.textContent = "✓ 名單中有這個名字";
      h.dataset.k = "ok";
    } else {
      h.textContent = "請確認這是你的全名。";
      h.dataset.k = "";
    }
  }
  function updateMine() {
    var el = $("mine"), nm = currentName();
    var v = loaded && NAME_RE.test(nm) ? findVote(nm) : null;
    if (!v) { el.hidden = true; return; }
    var i = OPTS.indexOf(v.status);
    el.dataset.i = String(i < 0 ? 0 : i);
    el.textContent = "";
    var a = document.createElement("div");
    a.className = "m1"; a.textContent = "✓ 你已投票：" + v.status;
    var b = document.createElement("div");
    b.className = "m2"; b.textContent = v.name + "　" + longDate(curDate, S.today);
    el.appendChild(a); el.appendChild(b);
    el.hidden = false;
  }
  function updateGuide() {
    var nm = currentName(), g, k = "todo";
    if (!loaded) { g = "載入中…"; }
    else if (sticky) { g = sticky; k = stickyK; }
    else if (isClosed()) { g = S.reason === "past" ? "這一天已經結束，只能查看。" : "投票已截止，只能查看。"; k = "muted"; }
    else if (!NAME_RE.test(nm)) { g = "第 1 步：輸入你的全名"; }
    else if (!pick) { g = findVote(nm) ? "要更改的話，請重新點選下面的選項" : "第 2 步：點選你的狀態"; }
    else { g = "第 3 步：按下面的「送出」才算完成"; }
    var el = $("guide");
    el.textContent = g; el.dataset.k = k;
  }
  function updateSubmit() {
    var nm = currentName();
    var ready = loaded && NAME_RE.test(nm) && !!pick && !busy && !isClosed();
    var b = $("submit");
    b.disabled = !ready;
    b.textContent = ready ? "送出：" + nm + "　" + pick + "（" + md(curDate) + "）" : (busy ? "送出中…" : "送出");
    updateMine();
    updateGuide();
  }
  function renderAdminList() {
    $("adminDay").textContent = longDate(curDate, S.today) + " 的投票名單（打錯或用暱稱的可以刪除）";
    var box = $("voteList");
    box.textContent = "";
    if (!S.votes.length) {
      var p = document.createElement("p");
      p.className = "vempty";
      p.textContent = "這一天沒有人投票。";
      box.appendChild(p);
      return;
    }
    S.votes.forEach(function (v) {
      var row = document.createElement("div");
      row.className = "vrow";
      var n = document.createElement("span");
      n.className = "vn"; n.textContent = v.name;
      var s = document.createElement("span");
      s.className = "vs"; s.textContent = v.status;
      var b = document.createElement("button");
      b.type = "button"; b.textContent = "刪除"; b.dataset.name = v.name;
      b.setAttribute("aria-label", "刪除 " + v.name + " 的投票");
      row.appendChild(n); row.appendChild(s); row.appendChild(b);
      box.appendChild(row);
    });
  }
  function updateAll() {
    ensureOpts();
    ensureRosterList();
    updateHeader(); updateOpts(); updateReport(); updateUnvoted(); updateNameHint(); updateSubmit();
    if (adminOpen) renderAdminList();
  }
  function syncAdmin() {
    var ids = ["aUnit", "aOptions", "aNote", "aCutoff", "aRoster"];
    var ae = document.activeElement;
    if (ae && ids.indexOf(ae.id) >= 0) return;
    $("aUnit").value = S.cfg.unit || "";
    $("aOptions").value = (S.cfg.options || []).join("、");
    $("aNote").value = S.cfg.note || "";
    $("aCutoff").value = S.cfg.cutoff || "";
    $("aRoster").value = roster().join("、");
    $("aShort").checked = S.cfg.short !== false;
  }

  function refresh() {
    if (loading) { again = true; return Promise.resolve(); }
    loading = true;
    var want = curDate;
    return call("getState", [want || null]).then(function (s) {
      if (want && s.date !== want) return;
      if (!curDate) curDate = s.date;
      if (s.date !== curDate) return;
      if (!s.cfg.roster) s.cfg.roster = [];
      S = s;
      skew = s.now - Date.now();
      fetchedAt = Date.now();
      loaded = true;
      $("boot").hidden = true;
      notice("");
      updateAll();
      syncAdmin();
    }).catch(function () {
      notice("讀不到投票資料，請重新整理頁面。如果還是不行，請改用 Safari 或 Chrome 開啟。");
    }).then(function () {
      loading = false;
      if (again) { again = false; return refresh(); }
    });
  }

  function setDate(ds) {
    if (!DATE_RE.test(ds) || ds === curDate) return;
    curDate = ds;
    pick = "";
    setMsg("", "");
    copyMsg("", "");
    loaded = false;
    S.votes = []; S.reason = ""; S.closeAt = null;
    updateAll();
    refresh();
  }

  $("prev").addEventListener("click", function () { if (curDate) setDate(addDays(curDate, -1)); });
  $("next").addEventListener("click", function () { if (curDate) setDate(addDays(curDate, 1)); });
  $("date").addEventListener("change", function () { setDate($("date").value); });

  $("who").addEventListener("input", function () { setMsg("", ""); updateNameHint(); updateOpts(); updateSubmit(); });
  $("who").addEventListener("change", function () { setMsg("", ""); updateNameHint(); updateOpts(); updateSubmit(); });
  $("who").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); $("who").blur(); } });
  $("unvoted").addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b || b.disabled) return;
    $("who").value = b.textContent;
    setMsg("", "");
    updateNameHint(); updateOpts(); updateSubmit();
    $("who").scrollIntoView({ behavior: "smooth", block: "center" });
  });
  $("opts").addEventListener("click", function (e) {
    var b = e.target.closest(".opt");
    if (!b) return;
    if (isClosed()) { setMsg("", ""); updateSubmit(); return; }
    if (!NAME_RE.test(currentName())) {
      setMsg("請先在上面輸入你的全名", "err");
      updateSubmit();
      $("who").focus();
      return;
    }
    pick = b.dataset.o;
    setMsg("", "");
    updateAll();
  });
  $("submit").addEventListener("click", function () {
    var nm = currentName();
    if (!loaded || !NAME_RE.test(nm) || !pick || busy || isClosed()) return;
    var o = pick, ds = curDate;
    busy = true; updateSubmit();
    call("submitVote", [ds, nm, o]).then(function (r) {
      if (r && r.ok) {
        pick = "";
        try { localStorage.setItem("armsStatusName", nm); } catch (e1) {}
        setMsg("✓ 已登記：" + nm + "　" + o + "（" + longDate(ds, S.today) + "）。要更改，重新選一次再送出就可以。", "ok");
        toast("✓ 已登記　" + nm + "　" + o);
      } else {
        setMsg((r && r.msg) || "送出失敗，請再試一次。", "err");
        toast((r && r.msg) || "送出失敗，請再試一次。", "err");
      }
    }).catch(function () {
      setMsg("送出失敗，請檢查網路後再試一次。", "err");
      toast("送出失敗，請檢查網路後再試一次。", "err");
    }).then(function () {
      busy = false;
      return refresh();
    }).then(updateAll);
  });
  $("copy").addEventListener("click", function () {
    var text = buildReport();
    function done() { copyMsg("", ""); toast("已複製，可以直接貼到 LINE"); }
    function fallback() {
      var r = document.createRange();
      r.selectNodeContents($("report"));
      var s = window.getSelection();
      s.removeAllRanges(); s.addRange(r);
      try {
        if (document.execCommand("copy")) { done(); return; }
      } catch (e2) {}
      copyMsg("無法自動複製，文字已選取，請長按後選「拷貝」。", "err");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  });

  /* ---- 管理 ---- */
  $("adminToggle").addEventListener("click", function () {
    var a = $("admin");
    a.hidden = !a.hidden;
    if (!a.hidden) a.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("unlock").addEventListener("click", function () {
    var p = $("aPin").value;
    call("adminCheck", [p]).then(function (ok) {
      if (ok) {
        pin = p; adminOpen = true;
        $("adminLogin").hidden = true;
        $("adminBody").hidden = false;
        adminMsg("", "");
        syncAdmin(); renderAdminList();
      } else {
        adminMsg("密碼錯誤。", "err");
      }
    }).catch(function () { adminMsg("連線失敗，請再試一次。", "err"); });
  });
  $("aPin").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); $("unlock").click(); } });
  $("saveCfg").addEventListener("click", function () {
    call("adminSave", [pin, {
      unit: $("aUnit").value.trim(), options: $("aOptions").value.trim(), note: $("aNote").value.trim(),
      cutoff: $("aCutoff").value, roster: $("aRoster").value, short: $("aShort").checked
    }]).then(function (r) {
      adminMsg(r && r.ok ? "已儲存。" : (r && r.msg) || "儲存失敗。", r && r.ok ? "ok" : "err");
      return refresh();
    }).catch(function () { adminMsg("儲存失敗，請再試一次。", "err"); });
  });
  $("voteList").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    b.disabled = true;
    call("adminDelete", [pin, curDate, b.dataset.name]).then(function (r) {
      adminMsg(r && r.ok ? "已刪除。" : (r && r.msg) || "刪除失敗。", r && r.ok ? "ok" : "err");
      return refresh();
    }).catch(function () { adminMsg("刪除失敗，請再試一次。", "err"); b.disabled = false; });
  });
  function resetClear() {
    confirmClear = false;
    clearTimeout(clearTimer);
    $("clearBtn").textContent = "清空這一天的投票";
  }
  $("clearBtn").addEventListener("click", function () {
    var btn = $("clearBtn");
    if (!confirmClear) {
      confirmClear = true;
      btn.textContent = "確定清空？再按一次";
      clearTimeout(clearTimer);
      clearTimer = setTimeout(resetClear, 4000);
      return;
    }
    resetClear();
    btn.disabled = true;
    call("adminClear", [pin, curDate]).then(function (r) {
      adminMsg(r && r.ok ? "已清空這一天的投票。" : (r && r.msg) || "清空失敗。", r && r.ok ? "ok" : "err");
      return refresh();
    }).catch(function () { adminMsg("清空失敗，請再試一次。", "err"); }).then(function () { btn.disabled = false; });
  });

  try {
    var saved = localStorage.getItem("armsStatusName");
    if (saved) $("who").value = normName(saved);
  } catch (e3) {}

  if (!hasGAS) $("preview").hidden = false;
  buildOpts();
  updateAll();
  refresh();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  setInterval(function () { if (!document.hidden) refresh(); }, POLL_MS);
  setInterval(function () { updateHeader(); updateOpts(); updateUnvoted(); updateSubmit(); }, 20000);
})();
</script>
</body>
</html>
