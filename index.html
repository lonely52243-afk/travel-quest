<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root[data-theme="dark"] { --bg-0:#06080F;--bg-1:#0B0F1A;--bg-2:#111827;--bg-elev:#1A2235;--neon:#22D3EE;--neon-2:#F472B6;--neon-3:#A3E635;--gold:#FBBF24;--text:#F1F5F9;--text-2:#94A3B8;--text-3:#475569;--line:#1E293B;--line-2:#334155;--danger:#F43F5E;--shadow-md:0 8px 24px -8px rgba(0,0,0,0.5); }
:root[data-theme="light"] { --bg-0:#F8FAFC;--bg-1:#FFFFFF;--bg-2:#F1F5F9;--bg-elev:#E2E8F0;--neon:#0891B2;--neon-2:#DB2777;--neon-3:#65A30D;--gold:#D97706;--text:#0F172A;--text-2:#475569;--text-3:#94A3B8;--line:#E2E8F0;--line-2:#CBD5E1;--danger:#DC2626;--shadow-md:0 8px 24px -8px rgba(15,23,42,0.12); }
html,body { min-height:100%;background:var(--bg-0);color:var(--text);font-family:-apple-system,"SF Pro Text","Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;overflow-x:hidden; }
:root[data-theme="dark"] body::before { content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(34,211,238,0.08),transparent 40%),radial-gradient(circle at 85% 80%,rgba(244,114,182,0.06),transparent 40%);pointer-events:none;z-index:0; }
.app-shell { position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column; }
.topbar { position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg-0) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line); }
.topbar-inner { max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px; }
.brand { display:flex;align-items:center;gap:12px; }
.brand-mark { width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--neon),var(--neon-2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#05070D;letter-spacing:-0.5px;box-shadow:0 0 24px -4px var(--neon); }
.brand-text { display:flex;flex-direction:column;line-height:1.1; }
.brand-title { font-size:15px;font-weight:800;color:var(--text); }
.brand-sub { font-size:10px;color:var(--text-3);letter-spacing:2px;text-transform:uppercase;margin-top:2px; }
.topbar-actions { display:flex;gap:8px;align-items:center; }
.icon-btn { width:40px;height:40px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);color:var(--text-2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center; }
.icon-btn:hover { border-color:var(--neon);color:var(--neon); }
.icon-btn.on { border-color:var(--neon);color:var(--neon);background:color-mix(in srgb,var(--neon) 12%,var(--bg-2)); }
.main { flex:1;max-width:1280px;width:100%;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:420px 1fr;gap:24px;align-items:start; }
.control-panel { position:sticky;top:90px;display:flex;flex-direction:column;gap:16px; }
.result-panel { min-height:400px;min-width:0; }
.mode-tabs { display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px;background:var(--bg-2);border-radius:14px;border:1px solid var(--line); }
.mode-tab { padding:14px 12px;border-radius:10px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-2);font-weight:700;font-size:14px; }

.input,.select { width:100%;padding:14px 16px;background:var(--bg-0);border:1.5px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:15px;font-weight:600;outline:none;appearance:none;-webkit-appearance:none; }
.select { background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2394A3B8' stroke-width='2.5'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;padding-right:42px;cursor:pointer; }

.transport-option.active { border-color:var(--neon);background:color-mix(in srgb,var(--neon) 10%,var(--bg-2));box-shadow:0 0 0 4px color-mix(in srgb,var(--neon) 12%,transparent); }
.transport-icon { font-size:22px;display:block;margin-bottom:4px; }

.transport-option.active .transport-name { color:var(--neon); }
.btn-primary { width:100%;padding:18px 24px;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:12px;cursor:pointer;color:#05070D;background:linear-gradient(135deg,var(--neon),var(--neon-3));display:flex;align-items:center;justify-content:center;gap:10px; }

.btn-ghost:hover { border-color:var(--neon);color:var(--neon); }
.checkbox-row { display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-0);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:16px;user-select:none; }

.result-header { display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap; }

.fare-info { display:flex;flex-wrap:wrap;gap:12px;padding:14px 16px;background:color-mix(in srgb,var(--gold) 8%,var(--bg-0));border:1px solid color-mix(in srgb,var(--gold) 25%,transparent);border-radius:10px;margin-bottom:20px; }

.fare-label { font-size:11px;font-weight:700;color:var(--gold); }

.stat-row { display:flex;gap:16px;padding:12px 16px;background:var(--bg-2);border-radius:10px;margin-bottom:20px; }

.action-row { display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px; }
.train-list { display:flex;flex-direction:column;gap:8px;max-height:640px;overflow-y:auto;padding-right:8px; }
.train-card { display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;padding:16px 18px;background:var(--bg-1);border:1.5px solid var(--line);border-radius:14px; }
.train-card.next { border-color:var(--neon-3);background:linear-gradient(135deg,color-mix(in srgb,var(--neon-3) 8%,var(--bg-1)),var(--bg-1)); }
.train-time-block { display:flex;flex-direction:column;align-items:center;text-align:center;padding-right:16px;margin-right:16px;border-right:1.5px solid var(--line); }
.train-dep { font-size:22px;font-weight:900;line-height:1.1; }
.train-dep-label { font-size:9px;color:var(--text-3);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:3px; }
.train-info-block { display:flex;flex-direction:column;gap:6px;min-width:0; }
.train-arrival { display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text-2); }
.train-arrival-arrow { color:var(--neon);font-size:12px; }
.train-arrival-time { color:var(--text); }
.train-meta { display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text-3);font-weight:600; }
.train-no { font-weight:800;color:var(--text-2); }
.train-type-name { color:var(--text-3); }
.train-badges { display:flex;gap:4px;flex-wrap:wrap;margin-top:2px; }
.badge { display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap; }
.badge-express { background:color-mix(in srgb,var(--neon) 15%,transparent);color:var(--neon); }
.badge-first { background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold); }
.badge-last { background:color-mix(in srgb,var(--neon-2) 15%,transparent);color:var(--neon-2); }
.badge-ontime { background:color-mix(in srgb,var(--neon-3) 15%,transparent);color:var(--neon-3); }
.badge-delay { background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger); }
.badge-soon { background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold); }
.badge-countdown { background:color-mix(in srgb,var(--neon-3) 15%,transparent);color:var(--neon-3); }
.train-actions-block { display:flex;flex-direction:column;align-items:flex-end;gap:8px; }
.train-duration { font-size:14px;font-weight:900;color:var(--text); }
.train-duration-label { font-size:9px;color:var(--text-3);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;text-align:right; }
.book-icon-btn { display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--neon-2);color:#fff;text-decoration:none;font-size:14px; }
.now-line { display:flex;align-items:center;gap:12px;margin:4px 0;padding:0 4px; }
.now-line::before,.now-line::after { content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--danger),transparent); }
.now-line-label { font-size:10px;font-weight:800;color:var(--danger);letter-spacing:2px;padding:2px 10px;border-radius:10px;background:color-mix(in srgb,var(--danger) 12%,transparent); }
.bus-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:20px; }
.bus-chip { padding:14px 6px;text-align:center;font-weight:800;font-size:16px;background:var(--bg-0);border:1.5px solid var(--line);border-radius:10px;color:var(--text); }

.parking-rank { width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--neon),var(--neon-2));color:#05070D;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center; }
.parking-info { display:flex;flex-direction:column;gap:6px;min-width:0; }
.parking-name { font-weight:800;font-size:15px;color:var(--text);text-decoration:none;word-break:break-word; }
.parking-name:hover { color:var(--neon); }
.parking-meta { display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-3);font-weight:600; }
.parking-badge { padding:4px 10px;border-radius:8px;font-weight:800;font-size:11px; }
.parking-badge.ok { background:color-mix(in srgb,var(--neon-3) 15%,transparent);color:var(--neon-3); }
.parking-badge.warn { background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold); }
.parking-badge.none { background:var(--bg-2);color:var(--text-3); }
.parking-map-btn { width:44px;height:44px;border-radius:10px;background:color-mix(in srgb,var(--neon) 10%,var(--bg-2));border:1.5px solid color-mix(in srgb,var(--neon) 40%,transparent);color:var(--neon);text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:18px; }
.error-card { background:color-mix(in srgb,var(--danger) 6%,var(--bg-1));border:1.5px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:16px;padding:40px 30px;text-align:center; }
.error-title { font-size:18px;font-weight:900;color:var(--danger);margin-bottom:10px; }
.error-msg { font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:24px; }
.loc-card { background:var(--bg-1);border:1.5px solid var(--line);border-radius:16px;padding:40px 30px;text-align:center; }
.loc-icon { font-size:56px;margin-bottom:16px; }
.loc-name { font-size:24px;font-weight:900;margin-bottom:32px; }
.loc-actions { display:flex;flex-direction:column;gap:10px;max-width:400px;margin:0 auto; }
.loc-link { display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 24px;border-radius:12px;font-weight:800;font-size:14px;text-decoration:none; }
.loc-link.primary { background:linear-gradient(135deg,var(--neon),var(--neon-3));color:#05070D; }
.loc-link.secondary { background:transparent;border:1.5px solid var(--neon-2);color:var(--neon-2); }
.chips-wrap { display:flex;flex-wrap:wrap;gap:6px; }
.chip { padding:8px 14px;border-radius:20px;background:var(--bg-0);border:1.5px solid var(--line);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px; }
.chip:hover { border-color:var(--neon);color:var(--neon); }
.chip-x { font-size:15px;opacity:0.5;padding:0 2px; }
.toast { position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--bg-1);border:1.5px solid var(--neon-3);color:var(--neon-3);padding:14px 28px;border-radius:12px;font-size:13px;font-weight:800;z-index:10000;transition:transform 0.35s; }
.toast.show { transform:translateX(-50%) translateY(0); }
@media (max-width:1024px) { .main { grid-template-columns:1fr;gap:20px; } .control-panel { position:static; } }
@media (max-width:640px) { .main { padding:16px 14px 50px; } .card { padding:20px 18px; } .location-group { grid-template-columns:1fr; } .action-row { grid-template-columns:1fr 1fr; } }

<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">TQ</div>
        <div class="brand-text">
          <div class="brand-title">旅運探險</div>
          <div class="brand-sub">Travel Quest</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle">🌙</button>
        <button class="icon-btn on" id="sound-toggle">🔊</button>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="control-panel">
      <div class="mode-tabs">
        <div class="mode-tab active" data-tab="transport"><span class="mode-tab-icon">🚄</span><span>交通</span></div>
        <div class="mode-tab" data-tab="parking"><span class="mode-tab-icon">🅿️</span><span>停車</span></div>
      </div>

      <div class="card" id="panel-transport">
        <div class="card-title">查詢設定</div>
        <div class="transport-picker">
          <div class="transport-option active" data-type="HSR"><span class="transport-icon">🚄</span><span class="transport-name">高鐵</span></div>
          <div class="transport-option" data-type="TRA"><span class="transport-icon">🚆</span><span class="transport-name">台鐵</span></div>
          <div class="transport-option" data-type="BUS"><span class="transport-icon">🚌</span><span class="transport-name">統聯</span></div>
        </div>
        <input type="hidden" id="tr-type" value="HSR">

        <div id="tr-stations">
          <div class="location-group">
            <div class="field" id="tr-from-region-field"><label class="field-label">縣市</label><select class="select" id="tr-from-region"></select></div>
            <div class="field"><label class="field-label">起站<span class="required">*</span></label><select class="select" id="tr-from"></select></div>
          </div>
          <div class="swap-row"><button class="swap-btn" id="swap-btn">⇅</button></div>
          <div class="location-group">
            <div class="field" id="tr-to-region-field"><label class="field-label">縣市</label><select class="select" id="tr-to-region"></select></div>
            <div class="field"><label class="field-label">迄站<span class="required">*</span></label><select class="select" id="tr-to"></select></div>
          </div>
        </div>

        <div id="tr-route" style="display:none"><div class="field"><label class="field-label">路線</label><select class="select" id="tr-route-idx"></select></div></div>

  today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); },
  timeToMin(t) { const p = String(t).split(':'); return (+p[0])*60 + (+p[1]); },
  timeDiff(s, e) { let a = this.timeToMin(s), b = this.timeToMin(e); if (b < a) b += 1440; return b - a; },
  formatDiff(min) { if (min < 60) return min + '分'; const h = Math.floor(min/60), m = min%60; return m === 0 ? h + '時' : h + '時' + m + '分'; },
  weekday(dateStr) { const idx = new Date(dateStr).getDay(); return '週' + ['日','一','二','三','四','五','六'][idx]; },
  weekdayKey(dateStr) { return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(dateStr).getDay()]; },

  async function queryTRA(fromId, toId, date, timeSlot, category, afterTime) {
    const [odRaw, stationRaw, delays] = await Promise.all([
      _fetch('/api/basic/v2/Rail/TRA/DailyTimetable/OD/' + fromId + '/to/' + toId + '/' + date + '?$format=JSON', 'TRA_OD_' + fromId + '_' + toId + '_' + date, 1800),
      _fetch('/api/basic/v2/Rail/TRA/DailyTimetable/Station/' + fromId + '/' + date + '?$format=JSON', 'TRA_ST_' + fromId + '_' + date, 1800),
      getTRADelays()
    ]);
    const odList = Array.isArray(odRaw) ? odRaw : [];
    const stationList = Array.isArray(stationRaw) ? stationRaw : [];
    const odTrainNos = new Set();
    let trains = [];
    for (const t of odList) {
      if (!t.OriginStopTime || !t.OriginStopTime.DepartureTime) continue;
      if (!t.DestinationStopTime || !t.DestinationStopTime.ArrivalTime) continue;
      const trainNo = t.DailyTrainInfo ? String(t.DailyTrainInfo.TrainNo) : '';
      const trainTypeId = t.DailyTrainInfo && t.DailyTrainInfo.TrainTypeID ? String(t.DailyTrainInfo.TrainTypeID) : '';
      const trainTypeName = t.DailyTrainInfo && t.DailyTrainInfo.TrainTypeName ? (t.DailyTrainInfo.TrainTypeName.Zh_tw || '') : '';
      const depTime = t.OriginStopTime.DepartureTime;
      const arrTime = t.DestinationStopTime.ArrivalTime;
      const info = _resolveTRA(trainTypeId, trainTypeName);
      if (category === 'fast' && !info.isFast) continue;
      if (category === 'normal' && info.isFast) continue;
      odTrainNos.add(trainNo);
      trains.push({ time: depTime, arrTime, trainNo, typeName: info.name, typeIcon: info.icon, diffMin: Utils.timeDiff(depTime, arrTime), delay: delays[trainNo] || 0, isDirect: true });
    }
    const addedFromStation = new Set();
    for (const t of stationList) {
      const trainNo = t.TrainNo ? String(t.TrainNo) : '';
      if (odTrainNos.has(trainNo) || addedFromStation.has(trainNo)) continue;
      const endingId = String(t.EndingStationID || '');
      if (endingId !== toId) continue;
      const depTime = t.DepartureTime;
      if (!depTime) continue;
      const trainTypeId = t.TrainTypeID ? String(t.TrainTypeID) : '';
      const trainTypeName = (t.TrainTypeName && t.TrainTypeName.Zh_tw) || '';
      const info = _resolveTRA(trainTypeId, trainTypeName);
      if (category === 'fast' && !info.isFast) continue;
      if (category === 'normal' && info.isFast) continue;
      addedFromStation.add(trainNo);
      trains.push({ time: depTime, arrTime: '', trainNo, typeName: info.name, typeIcon: info.icon, diffMin: 0, delay: delays[trainNo] || 0, isDirect: false });
    }
    trains.sort((a, b) => a.time.localeCompare(b.time));
    // ✅ 移除 _filterCutoff
    if (timeSlot) trains = _filterBySlot(trains, timeSlot);
    if (afterTime) trains = _filterAfter(trains, afterTime);
    if (trains.length > 0) { trains[0].isFirst = true; trains[trains.length - 1].isLast = true; }
    return { type:'TRA', from:fromId, to:toId, date, timeSlot, category, afterTime, totalCount: trains.length, directCount: trains.filter(t => t.isDirect).length, filtered: trains };
  }

  async function queryBus(routeIdx, date, afterTime) {
    const route = BUS_ROUTES[routeIdx];
    if (!route) throw new Error('路線錯誤');
    const wk = Utils.weekdayKey(date);
    let times = [];
    for (const rid of route.routeIds) {
      try {
        const sch = await _fetch('/api/basic/v2/Bus/Schedule/InterCity/' + rid + '?$format=JSON', 'BUS_SCH_' + rid, 1800);
        if (!Array.isArray(sch)) continue;
        for (const sub of sch) {
          if (sub.Direction !== route.direction) continue;
          if (!sub.Timetables) continue;
          for (const tt of sub.Timetables) {
            if (tt.ServiceDay && tt.ServiceDay[wk] !== 1) continue;
            if (tt.StopTimes && tt.StopTimes.length > 0) times.push(tt.StopTimes[0].DepartureTime);
          }
        }
      } catch (e) {}
    }
    times = [...new Set(times)].sort();
    // ✅ 移除「已發車班次過濾」
    if (afterTime) times = times.filter(t => t >= afterTime);
    return { type:'BUS', from:route.from, to:route.to, date, routeIdx, totalCount: times.length, times };
  }

  async function queryParkingBasic(city) {
    const d = await _fetch('/api/basic/v1/Parking/OffStreet/CarPark/City/' + city + '?$format=JSON', 'PARK_BASIC_' + city, 86400);
    return (d && d.CarParks) || [];
  }
  async function queryParkingAvail(city) {
    const d = await _fetch('/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/' + city + '?$format=JSON', 'PARK_AVAIL_' + city, 60);
    return (d && d.ParkingAvailabilities) || [];
  }

  return { getTRAStations, getTRADelays, queryHSR, queryHSRFare, queryTRA, queryTRAFare, queryBus, queryParkingBasic, queryParkingAvail };
})();

const Geo = {
  async geocode(address) {
    const url = 'https://maps.googleapis.com/maps/api/geocode/json?address=' + encodeURIComponent(address) + '&language=zh-TW&region=TW&key=' + GOOGLE_MAPS_API_KEY;
    const res = await fetch(url);
    if (!res.ok) return { error: 'HTTP_' + res.status };
    const data = await res.json();
    if (data.status !== 'OK') return { error: 'GEO_' + data.status };
    const r = data.results[0];
    let city = '';
    for (const c of r.address_components) if ((c.types || []).includes('administrative_area_level_1')) { city = c.long_name; break; }
    return { lat: r.geometry.location.lat, lng: r.geometry.location.lng, address: r.formatted_address, city };
  }
};

async function parkQuery(keyword, type, radiusKm) {
  const geo = await Geo.geocode(keyword);
  if (geo.error) {
    const em = geo.error;
    if (em === 'GEO_ZERO_RESULTS') return { error: '找不到「' + keyword + '」' };
    if (em === 'GEO_REQUEST_DENIED') return { error: '地圖服務未啟用' };
    if (em === 'GEO_OVER_QUERY_LIMIT') return { error: '地圖查詢額度已滿' };
    return { error: '位置解析失敗（' + em + '）' };
  }
  const cityCode = PARK_CITY_MAP[geo.city];
  if (!cityCode) return { error: '不支援的地區：' + (geo.city || '未知') };
  const [basic, avails] = await Promise.all([TDX.queryParkingBasic(cityCode), TDX.queryParkingAvail(cityCode)]);
  if (basic.length === 0) return { error: '該地區無停車場資料' };
  const idMap = {}, nameMap = {};
  for (const a of avails) {
    if (a.CarParkID) idMap[a.CarParkID] = a;
    const nm = a.CarParkName ? (a.CarParkName.Zh_tw || '') : '';
    if (nm) nameMap[nm] = a;
  }
  const typeCode = type === 'motor' ? '2' : '1';
  const nearby = [];
  for (const p of basic) {
    const pos = p.CarParkPosition || {};
    if (pos.PositionLat === undefined || pos.PositionLon === undefined) continue;
    if (String(p.CarParkType || '') !== typeCode) continue;
    const d = Utils.distance(geo.lat, geo.lng, pos.PositionLat, pos.PositionLon);
    if (d > radiusKm) continue;
    const pName = p.CarParkName ? (p.CarParkName.Zh_tw || '') : '';
    const av = idMap[p.CarParkID] || (pName ? nameMap[pName] : null);
    nearby.push({ name: pName || '(未命名)', distance: d, total: av && av.TotalSpaces !== undefined ? av.TotalSpaces : null, available: av && av.AvailableSpaces !== undefined ? av.AvailableSpaces : null, lat: pos.PositionLat, lng: pos.PositionLon });
  }
  nearby.sort((a, b) => { const aH = a.available !== null ? 1 : 0, bH = b.available !== null ? 1 : 0; if (aH !== bH) return bH - aH; return a.distance - b.distance; });
  return { keyword, type, geo, parks: nearby, radiusKm };
}

  addHist(h) { let hist = this.getHist(); hist = hist.filter(x => !(x.type===h.type && x.from===h.from && x.to===h.to)); hist.unshift(h); if (hist.length > 6) hist.length = 6; localStorage.setItem('tq_hist', JSON.stringify(hist)); },

};

async function fillTRAStationsAsync() {
  if (_traStationsInitialized) return;
  const fromRegion = $('tr-from-region'), toRegion = $('tr-to-region');
  const from = $('tr-from'), to = $('tr-to');
  fromRegion.innerHTML = '<option value="">載入中…</option>';
  toRegion.innerHTML = '<option value="">載入中…</option>';
  from.innerHTML = '<option value="">—</option>';
  to.innerHTML = '<option value="">—</option>';
  try {
    const list = await TDX.getTRAStations();
    _traStationsList = list;
    _traAllStations = list;
    _traCounties = {};
    for (const s of list) { const c = s.county || '其他'; if (!_traCounties[c]) _traCounties[c] = []; _traCounties[c].push(s); }
    const order = ['基隆市','台北市','新北市','桃園市','新竹市','新竹縣','苗栗縣','台中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','台南市','高雄市','屏東縣','宜蘭縣','花蓮縣','台東縣','其他'];
    const counties = Object.keys(_traCounties).sort((a,b) => { const ai = order.indexOf(a), bi = order.indexOf(b); return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi); });
    fromRegion.innerHTML = ''; toRegion.innerHTML = '';
    for (const c of counties) {
      const cnt = _traCounties[c].length;
      fromRegion.innerHTML += '<option value="' + c + '">' + c + '（' + cnt + '）</option>';
      toRegion.innerHTML += '<option value="' + c + '">' + c + '（' + cnt + '）</option>';
    }
    const tpC = counties.find(c => c === '台北市') || counties[0];
    const khC = counties.find(c => c === '高雄市') || counties[1];
    if (tpC) fromRegion.value = tpC;
    if (khC) toRegion.value = khC;
    fillTRAStationsByCounty('from');
    fillTRAStationsByCounty('to');
    const tpS = _traCounties[tpC]?.find(s => s.name === '台北');
    const khS = _traCounties[khC]?.find(s => s.name === '高雄');
    if (tpS) from.value = tpS.id;
    if (khS) to.value = khS.id;
    _traStationsLoaded = true;
    _traStationsInitialized = true;
  } catch (e) {
    fromRegion.innerHTML = '<option value="">載入失敗</option>';
    toRegion.innerHTML = '<option value="">載入失敗</option>';
  }
}

  showScanning();
  _lastResultText = ''; _lastResultTitle = '';
  try {
    const date = $('tr-date').value;
    const afterTime = (type === 'TRA') ? ($('tr-after').value || '') : '';
    if (!date) throw new Error('請選擇日期');
    if (type === 'BUS') {

      const r = await TDX.queryBus(idx, date, '');
      renderBus(r);
      Store.addHist({ type:'BUS', from:r.from, to:r.to });
    } else if (type === 'HSR') {
      Utils.checkDateRange(date, 'HSR');
      const from = $('tr-from').value, to = $('tr-to').value;
      if (from === to) throw new Error('起迄站不能相同');
      const expressOnly = $('tr-express-only').checked;
      const [r, f] = await Promise.all([TDX.queryHSR(from, to, date, null, '', expressOnly), TDX.queryHSRFare(from, to)]);
      renderTrain(r, '🚄 高鐵', '#22D3EE', f, 'HSR');
      Store.addHist({ type, from, to });
    } else {
      Utils.checkDateRange(date, 'TRA');
      const fromId = $('tr-from').value, toId = $('tr-to').value;
      if (!fromId || !toId) throw new Error('請選擇起迄站');
      if (fromId === toId) throw new Error('起迄站不能相同');
      const slot = $('tr-slot').value, cat = $('tr-cat').value;
      const [r, f] = await Promise.all([TDX.queryTRA(fromId, toId, date, slot, cat, afterTime), TDX.queryTRAFare(fromId, toId)]);
      renderTrain(r, '🚆 台鐵', '#A3E635', f, 'TRA');
      Store.addHist({ type, from: traIdToName(fromId), to: traIdToName(toId), fromId, toId });
    }
    Sound.win();
    renderHist();
  } catch (e) {
    Sound.error();

    btn.disabled = false;
    btn.innerHTML = '<span>查詢班次</span><span>→</span>';

function renderTrain(r, title, color, fare, mode) {
  const fromName = mode === 'TRA' ? traIdToName(r.from) : r.from;
  const toName = mode === 'TRA' ? traIdToName(r.to) : r.to;
  if (r.filtered.length === 0) {
    resultEl.innerHTML = '<div class="card"><div class="result-header"><div class="result-route"><div class="route-station"><div class="route-name">' + escapeHtml(fromName) + '</div></div><div class="route-arrow">→</div><div class="route-station"><div class="route-name">' + escapeHtml(toName) + '</div></div></div><div class="result-meta"><div class="route-time">' + r.date + ' ' + Utils.weekday(r.date) + '</div></div></div><div style="text-align:center;padding:60px 0;color:var(--text-3)"><div style="font-size:48px;margin-bottom:16px;opacity:0.4">✕</div><div style="font-size:14px;font-weight:700">此時段無班次</div></div><div style="text-align:center;margin-top:20px"><button class="btn-ghost" onclick="document.getElementById(\'tr-go\').click()">🔄 重新查詢</button></div></div>';
    return;
  }
  let fareHtml = '';
  if (fare) {
    const items = [];
    if (mode === 'HSR') { if (fare.standard) items.push({ label: '標準', price: fare.standard }); if (fare.business) items.push({ label: '商務', price: fare.business }); }
    else { if (fare.tzeChiang) items.push({ label: '自強', price: fare.tzeChiang }); if (fare.chuKuang) items.push({ label: '莒光', price: fare.chuKuang }); if (fare.local) items.push({ label: '區間', price: fare.local }); }
    if (items.length > 0) fareHtml = '<div class="fare-info">' + items.map(i => '<div class="fare-item"><span class="fare-label">' + i.label + '</span><span class="fare-price">$' + i.price + '</span></div>').join('') + '</div>';
  }
  let filterTags = [];
  if (r.timeSlot) { const labels = { morning:'☀️ 上午', afternoon:'🌤️ 下午', evening:'🌙 晚上' }; filterTags.push(labels[r.timeSlot] || r.timeSlot); }
  if (r.afterTime) filterTags.push('⏰ ' + r.afterTime + ' 後');
  if (r.expressOnly) filterTags.push('⚡ 僅直達');
  const filterHtml = filterTags.length > 0 ? '<div class="filter-tags">' + filterTags.map(t => '<span class="filter-tag">' + escapeHtml(t) + '</span>').join('') + '</div>' : '';
  let statHtml = '';
  if (mode === 'TRA' && r.directCount !== undefined) {
    const transferCount = r.totalCount - r.directCount;
    statHtml = '<div class="stat-row"><div class="stat-item">🚄 直達 <strong>' + r.directCount + '</strong></div><div class="stat-item">🔄 需轉乘 <strong>' + transferCount + '</strong></div></div>';
  }
  const nowTime = String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
  let rows = '';
  const list = r.filtered.slice(0, 80);
  let nowLineInserted = false;
  let nextTrainMarked = false;
  const copyLines = [title + ' ' + fromName + ' → ' + toName, r.date + ' ' + Utils.weekday(r.date)];
  list.forEach((t, i) => {
    if (!nowLineInserted && r.date === Utils.today() && t.time > nowTime) {
      rows += '<div class="now-line"><div class="now-line-label">⬇ 現在 ' + nowTime + '</div></div>';
      nowLineInserted = true;
    }
    let badges = '';
    if (t.isExpress) badges += '<span class="badge badge-express">⚡ 直達</span>';
    if (t.isFirst) badges += '<span class="badge badge-first">🌅 首班</span>';
    if (t.isLast) badges += '<span class="badge badge-last">🌙 末班</span>';
    let delayHtml = '';
    if (t.delay > 0) delayHtml = '<span class="badge badge-delay">⚠ 誤點 ' + t.delay + ' 分</span>';
    else if (r.date === Utils.today() && mode !== 'BUS') delayHtml = '<span class="badge badge-ontime">✓ 準點</span>';
    let countdownHtml = '';
    const mins = Utils.minutesUntil(t.time, r.date);
    if (mins !== null && mins >= 0) {
      if (mins <= 15) countdownHtml = '<span class="badge badge-soon">🔥 ' + mins + ' 分鐘</span>';
      else if (mins <= 60) countdownHtml = '<span class="badge badge-countdown">⏱ ' + mins + ' 分鐘</span>';
    }
    let isNext = false;
    if (!nextTrainMarked && r.date === Utils.today() && mins !== null && mins >= 0) { isNext = true; nextTrainMarked = true; }
    let bookHtml = '';
    if (mode === 'HSR') bookHtml = '<a class="book-icon-btn" href="https://www.thsrc.com.tw/" target="_blank" rel="noopener">🎫</a>';
    else if (mode === 'TRA') bookHtml = '<a class="book-icon-btn" href="https://tip.railway.gov.tw/tra-tip-web/tip" target="_blank" rel="noopener">🎫</a>';
    const arrDisplay = t.arrTime ? '<span class="train-arrival-arrow">→</span> <span class="train-arrival-time">' + t.arrTime + '</span>' : '<span class="train-arrival-arrow">→</span> <span style="opacity:0.4">？</span>';
    const durDisplay = t.isDirect ? '<div class="train-duration">' + Utils.formatDiff(t.diffMin) + '</div><div class="train-duration-label">車程</div>' : '<div class="train-duration" style="color:var(--neon-2)">🔄</div><div class="train-duration-label">需轉乘</div>';
    rows += '<div class="train-card ' + (isNext ? 'next' : '') + '" style="animation-delay:' + Math.min(i*30, 500) + 'ms"><div class="train-time-block"><div class="train-dep">' + t.time + '</div><div class="train-dep-label">出發</div></div><div class="train-info-block"><div class="train-arrival">' + arrDisplay + '</div><div class="train-meta"><span class="train-no">' + t.trainNo + '</span><span class="train-type-name">' + (t.typeName || title.replace(/[🚄🚆🚌]\s/, '')) + '</span></div><div class="train-badges">' + badges + countdownHtml + delayHtml + '</div></div><div class="train-actions-block">' + durDisplay + bookHtml + '</div></div>';
    copyLines.push(t.time + ' → ' + (t.arrTime || '?') + ' ' + t.trainNo + ' ' + (t.typeName || ''));
  });
  const headerHtml = '<div class="result-header"><div class="result-route"><div class="route-station"><div class="route-name">' + escapeHtml(fromName) + '</div><div class="route-time">' + r.date + '</div></div><div class="route-arrow">→</div><div class="route-station"><div class="route-name">' + escapeHtml(toName) + '</div><div class="route-time">' + Utils.weekday(r.date) + '</div></div></div><div class="result-meta"><div class="result-count">' + r.totalCount + '</div><div class="result-count-label">班次</div></div></div>';
  resultEl.innerHTML = '<div class="card" style="border-color:' + color + '30">' + headerHtml + filterHtml + statHtml + fareHtml + '<div class="action-row"><button class="btn-ghost" id="add-fav">★ 收藏</button><button class="btn-ghost" id="copy-result">📋 複製</button><button class="btn-ghost" id="share-result">📤 分享</button></div><div class="train-list">' + rows + '</div>' + (r.filtered.length > 80 ? '<div style="text-align:center;margin-top:16px;color:var(--text-3);font-size:12px">… 僅顯示前 80 班</div>' : '') + '</div>';
  _lastResultText = copyLines.join('\n');
  _lastResultTitle = title + ' ' + fromName + '→' + toName;
  $('add-fav').onclick = () => {
    Sound.click();
    const type = $('tr-type').value;
    const fav = { type };
    if (type === 'BUS') { const route = BUS_ROUTES[+$('tr-route-idx').value]; fav.from = route.from; fav.to = route.to; }
    else if (type === 'TRA') { const fid = $('tr-from').value, tid = $('tr-to').value; fav.fromId = fid; fav.toId = tid; fav.from = traIdToName(fid); fav.to = traIdToName(tid); }
    else { fav.from = $('tr-from').value; fav.to = $('tr-to').value; }
    const added = Store.addFav(fav);
    showToast(added ? '✅ 已收藏' : 'ℹ️ 已存在收藏');
    if (added) renderFavs();
  };
  $('copy-result').onclick = () => copyToClipboard(_lastResultText);
  $('share-result').onclick = () => shareContent(_lastResultTitle, _lastResultText);
}

function renderBus(r) {
  if (r.times.length === 0) {
    resultEl.innerHTML = '<div class="card"><div style="text-align:center;padding:60px 0;color:var(--text-3)"><div style="font-size:48px;margin-bottom:16px;opacity:0.4">✕</div><div style="font-size:14px;font-weight:700">當日無班次</div></div></div>';
    return;
  }
  let stopsHtml = '';
  const route = BUS_ROUTES[r.routeIdx];
  if (route) for (const rid of route.routeIds) { const stops = BUS_STOPS[rid]; if (stops) stopsHtml += '<div style="padding:14px 16px;background:var(--bg-0);border-radius:10px;margin-bottom:12px;font-size:12px;color:var(--text-2);line-height:1.7"><strong style="color:var(--neon);letter-spacing:1px">🚏 ' + rid + '</strong><br>' + stops.join(' → ') + '</div>'; }
  let cells = '';
  r.times.forEach((t, i) => { cells += '<div class="bus-chip" style="animation-delay:' + Math.min(i*20, 400) + 'ms">' + t + '</div>'; });
  _lastResultText = '🚌 統聯 ' + r.from + ' → ' + r.to + '\n' + r.date + ' ' + Utils.weekday(r.date) + '\n共 ' + r.totalCount + ' 班\n\n' + r.times.join('  ');
  _lastResultTitle = '統聯 ' + r.from + '→' + r.to;
  resultEl.innerHTML = '<div class="card"><div class="result-header"><div class="result-route"><div class="route-station"><div class="route-name">' + escapeHtml(r.from) + '</div><div class="route-time">' + r.date + '</div></div><div class="route-arrow">→</div><div class="route-station"><div class="route-name">' + escapeHtml(r.to) + '</div><div class="route-time">' + Utils.weekday(r.date) + '</div></div></div><div class="result-meta"><div class="result-count">' + r.totalCount + '</div><div class="result-count-label">班次</div></div></div>' + stopsHtml + '<div class="action-row"><button class="btn-ghost" id="add-fav">★ 收藏</button><button class="btn-ghost" id="copy-result">📋 複製</button><button class="btn-ghost" id="share-result">📤 分享</button></div><div class="bus-grid">' + cells + '</div></div>';
  $('add-fav').onclick = () => { Sound.click(); const added = Store.addFav({ type:'BUS', from:r.from, to:r.to }); showToast(added ? '✅ 已收藏' : 'ℹ️ 已存在收藏'); if (added) renderFavs(); };
  $('copy-result').onclick = () => copyToClipboard(_lastResultText);
  $('share-result').onclick = () => shareContent(_lastResultTitle, _lastResultText);
}

$('pk-map').onclick = () => {
  Sound.click();
  const kw = $('pk-kw').value.trim();
  if (!kw) { Sound.error(); return alert('請輸入地點'); }
  const enc = encodeURIComponent(kw);
  resultEl.innerHTML = '<div class="loc-card"><div class="loc-icon">📍</div><div class="loc-name">' + escapeHtml(kw) + '</div><div class="loc-actions"><a class="loc-link primary" href="https://www.google.com/maps/search/?api=1&query=' + enc + '" target="_blank" rel="noopener">🗺️ 在地圖上查看</a><a class="loc-link secondary" href="https://www.google.com/maps/dir/?api=1&destination=' + enc + '" target="_blank" rel="noopener">🧭 導航到此處</a></div></div>';
  Sound.win();
};

$('pk-kw').addEventListener('keydown', e => { if (e.key === 'Enter') $('pk-map').click(); });

$('pk-go').onclick = async () => {
  const btn = $('pk-go');
  if (btn.disabled) return;
  Sound.start();
  const kw = $('pk-kw').value.trim();
  if (!kw) { Sound.error(); return alert('請輸入地點'); }
  const type = $('pk-type').value;
  btn.disabled = true;
  showScanning();
  try {
    let r = await parkQuery(kw, type, 1);
    if (r.error) throw new Error(r.error);
    if (r.parks.length === 0) {
      r = await parkQuery(kw, type, 2);
      if (r.error) throw new Error(r.error);
      if (r.parks.length === 0) { resultEl.innerHTML = '<div class="card"><div style="text-align:center;padding:60px 0;color:var(--text-3)"><div style="font-size:48px;margin-bottom:16px;opacity:0.4">✕</div><div style="font-size:14px;font-weight:700">2 公里內無停車場</div></div></div>'; Sound.error(); return; }
      renderPark(r, '半徑 1km 無結果 · 已擴大至 2km');
      Sound.win();
      return;
    }
    renderPark(r, null);
    Sound.win();
  } catch (e) { Sound.error(); showError(e.message); }
  finally { btn.disabled = false; btn.innerHTML = '<span>查停車場</span>'; }
};

function renderPark(r, note) {
  const isMotor = r.type === 'motor';
  const vi = isMotor ? '🏍️' : '🚗';
  let items = '';
  const copyLines = [(isMotor ? '機車' : '汽車') + '停車場 · ' + r.keyword, '半徑 ' + r.radiusKm + 'km · 共 ' + r.parks.length + ' 座'];
  r.parks.forEach((p, i) => {
    let badge;
    if (p.available !== null && p.total !== null) { const ratio = p.available / Math.max(p.total, 1); const cls = ratio > 0.3 ? 'ok' : 'warn'; badge = '<span class="parking-badge ' + cls + '">' + vi + ' ' + p.available + '/' + p.total + '</span>'; }
    else if (p.available !== null) badge = '<span class="parking-badge ok">' + vi + ' ' + p.available + '</span>';
    else badge = '<span class="parking-badge none">⚠ 無即時車位</span>';
    const dist = p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km';
    const mapUrl = (p.lat != null && p.lng != null) ? 'https://www.google.com/maps/search/?api=1&query=' + Number(p.lat).toFixed(6) + ',' + Number(p.lng).toFixed(6) : null;
    const nameHtml = mapUrl ? '<a href="' + mapUrl + '" target="_blank" rel="noopener" class="parking-name">' + escapeHtml(p.name) + '</a>' : '<span class="parking-name">' + escapeHtml(p.name) + '</span>';
    const mapBtn = mapUrl ? '<a href="' + mapUrl + '" target="_blank" rel="noopener" class="parking-map-btn">🗺️</a>' : '';
    items += '<div class="parking-item"><div class="parking-rank">' + (i+1) + '</div><div class="parking-info">' + nameHtml + '<div class="parking-meta"><span>📏 ' + dist + '</span>' + badge + '</div></div>' + mapBtn + '</div>';
    copyLines.push((i+1) + '. ' + p.name + ' · ' + dist + ' · ' + (p.available !== null ? p.available + '/' + (p.total || '?') : '無即時車位') + (mapUrl ? ' · ' + mapUrl : ''));
  });
  _lastResultText = copyLines.join('\n');
  _lastResultTitle = (isMotor ? '機車' : '汽車') + '停車場 ' + r.keyword;
  resultEl.innerHTML = '<div class="card"><div class="result-header"><div class="result-route"><div class="route-station"><div class="route-name">' + escapeHtml(r.keyword) + '</div><div class="route-time">半徑 ' + r.radiusKm + 'km</div></div></div><div class="result-meta"><div class="result-count">' + r.parks.length + '</div><div class="result-count-label">停車場</div></div></div>' + (note ? '<div class="filter-tags"><span class="filter-tag">' + escapeHtml(note) + '</span></div>' : '') + '<div class="action-row" style="grid-template-columns:1fr 1fr"><button class="btn-ghost" id="copy-result">📋 複製</button><button class="btn-ghost" id="share-result">📤 分享</button></div><div class="parking-list">' + items + '</div></div>';
  $('copy-result').onclick = () => copyToClipboard(_lastResultText);
  $('share-result').onclick = () => shareContent(_lastResultTitle, _lastResultText);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    resultEl.innerHTML = '<div class="result-empty"><div class="result-empty-icon">🧭</div><div class="result-empty-title">準備開始查詢</div><div class="result-empty-sub">選擇交通工具與起迄站<br>即可開始你的旅運探險</div></div>';
  }
});
</script>
</body>
</html>
