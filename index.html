/* ---- 附近停車（附屬於地圖） ---- */
async function loadParking() {
  const md = state.mapData;
  if (!md) return;
  const token = md.token = (md.token || 0) + 1;
  md.parkErr = ''; md.parkNote = ''; md.parks = null; md.shown = 20;
  updateParking();
  try {
    const g = md.geo;
    let code = PARK_CITY_MAP[g.city] || '';
    if (!code) code = nearestCityCode(g.lat, g.lng);
    let parks = [], note = '';
    if (!code) note = '這個地區目前沒有停車場即時資料';
    else parks = await fetchNearbyParking(code, g, 3);
    if (state.mapData !== md || md.token !== token) return;
    md.parks = parks;
    md.parkNote = note;
  } catch (e) {
    if (state.mapData !== md || md.token !== token) return;
    md.parks = null;
    md.parkErr = (e && e.message) || '停車資料暫時無法取得';
  }
  md.fresh = true;
  updateParking();
}

function updateParking() {
  const md = state.mapData;
  if (!md || !$('pk-list')) return;
  const km = state.pkRadius;
  const isMotor = state.pkType === 'motor';
  const label = isMotor ? '機車' : '汽車';
  const list = $('pk-list'), sub = $('pk-sub'), more = $('pk-more');
  $('pk-range-val').textContent = Utils.radLabel(km);
  $('pk-title').textContent = label + '停車場 · ' + Utils.radLabel(km) + '內';
  more.innerHTML = '';
  state.parkShareText = '';
  if (state.map) { state.map.circle.setRadius(km * 1000); state.map.layer.clearLayers(); state.map.markers = []; }
  if (md.parkErr) {
    sub.innerHTML = '';
    list.innerHTML = '<div class="inline-empty"><p>' + escapeHtml(md.parkErr) + '</p><button class="btn btn-outline btn-sm" data-act="park-retry">' + ic('refresh-cw') + '<span>重新載入</span></button></div>';
    drawIcons();
    return;
  }
  if (md.parks === null) {
    sub.innerHTML = '';
    list.innerHTML = '<div class="sk" style="height:72px"></div><div class="sk" style="height:72px;opacity:.7"></div>';
    return;
  }
  if (md.parkNote) {
    sub.innerHTML = '';
    list.innerHTML = '<div class="inline-empty"><p>' + escapeHtml(md.parkNote) + '</p></div>';
    return;
  }
  const typeCode = isMotor ? '2' : '1';
  const arr = md.parks.filter(p => p.ptype === typeCode && p.distance <= km);
  if (state.pkSort === 'avail') {
    arr.sort((a, b) => {
      const av = a.available === null ? -1 : a.available, bv = b.available === null ? -1 : b.available;
      if (av !== bv) return bv - av;
      return a.distance - b.distance;
    });
  } else arr.sort((a, b) => a.distance - b.distance);

  const subs = '<span class="count"><b class="num">' + arr.length + '</b>座</span>' +
    '<span class="tag">' + (state.pkSort === 'avail' ? '空位最多優先' : '距離最近優先') + '</span>' +
    (md.moved ? '<span class="tag tag-primary">以地圖中心搜尋</span>' : '');
  sub.innerHTML = subs;

  if (arr.length === 0) {
    list.innerHTML = '<div class="inline-empty"><p>' + Utils.radLabel(km) + '內找不到' + label + '停車場</p>' +
      (km < 3 ? '<button class="btn btn-outline btn-sm" data-act="park-expand">' + ic('maximize-2') + '<span>擴大範圍</span></button>' : '') + '</div>';
    state.parkShareText = label + '停車場 · ' + md.kw + '\n' + Utils.radLabel(km) + '內無結果';
    drawIcons();
    return;
  }

  if (state.map && window.L) {
    arr.slice(0, 60).forEach((p, i) => {
      const hasAv = p.available !== null;
      const ratio = hasAv && p.total ? p.available / Math.max(p.total, 1) : null;
      const cls = !hasAv ? 'na' : ((ratio !== null && ratio <= 0.3) || p.available === 0 ? 'low' : 'ok');
      const mk = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'mk-park', html: '<b class="' + cls + '">' + (hasAv ? p.available : 'P') + '</b>', iconSize: [36, 26], iconAnchor: [18, 13] }) });
      const dist = p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km';
      mk.bindPopup('<div class="pop-name">' + escapeHtml(p.name) + '</div><div class="pop-meta">' + dist + ' · ' + (hasAv ? '空位 ' + p.available + (p.total ? ' / ' + p.total : '') : '無即時資料') + (p.fare ? '<br>' + escapeHtml(p.fare) : '') + '</div><a href="#" class="pop-nav" data-nav="' + p.lat + ',' + p.lng + '">導航過去</a>');
      mk.addTo(state.map.layer);
      state.map.markers[i] = mk;
    });
  }

  const shown = arr.slice(0, md.shown);
  const copyLines = [label + '停車場 · ' + md.kw, '半徑 ' + Utils.radLabel(km) + ' · 共 ' + arr.length + ' 座'];
  list.innerHTML = shown.map((p, i) => {
    const dist = p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km';
    let avail, bar = '';
    if (p.available !== null && p.total !== null && p.total > 0) {
      const ratio = p.available / Math.max(p.total, 1);
      avail = '<span class="tag ' + (ratio > 0.3 ? 'tag-ok' : 'tag-warn') + ' num">空位 ' + p.available + ' / ' + p.total + '</span>';
      bar = '<div class="bar"><i class="' + (ratio > 0.3 ? '' : 'low') + '" style="width:' + Math.max(3, Math.min(100, Math.round(ratio * 100))) + '%"></i></div>';
    } else if (p.available !== null) avail = '<span class="tag tag-ok num">空位 ' + p.available + '</span>';
    else avail = '<span class="tag">無即時資料</span>';
    copyLines.push((i + 1) + '. ' + p.name + ' · ' + dist + ' · ' + (p.available !== null ? '空位 ' + p.available + (p.total ? '/' + p.total : '') : '無即時車位') + ' · https://www.google.com/maps/search/?api=1&query=' + Number(p.lat).toFixed(6) + ',' + Number(p.lng).toFixed(6));
    return '<div class="park ' + (p.available === null ? 'na' : (((p.total && p.available / p.total <= 0.3) || p.available === 0) ? 'low' : 'ok')) + '"><div class="park-rank num">' + (i + 1) + '</div>' +
      '<div class="park-click" data-park-focus="' + i + '"><span class="park-name">' + escapeHtml(p.name) + '</span>' +
      '<div class="park-meta"><span class="dist num">' + ic('ruler') + dist + '</span>' + avail + '</div>' + bar +
      (p.fare ? '<div class="park-fare">費率：' + escapeHtml(p.fare) + '</div>' : '') + '</div>' +
      '<button class="icon-btn" data-nav="' + Number(p.lat).toFixed(6) + ',' + Number(p.lng).toFixed(6) + '" aria-label="導航" title="導航">' + ic('navigation') + '</button></div>';
  }).join('');
  if (arr.length > shown.length) {
    more.innerHTML = '<div class="more-row"><button class="btn btn-outline btn-sm" data-act="park-more">' + ic('chevrons-down') + '<span>顯示更多（還有 ' + (arr.length - shown.length) + ' 座）</span></button></div>';
  }
  state.parkShareText = copyLines.join('\n');
  if (md.fresh) { md.fresh = false; list.classList.add('anim-in'); animateCounts(sub); }
  else list.classList.remove('anim-in');
  drawIcons();
}

let _rangeTimer = null;
document.addEventListener('input', (e) => {

    const v = Math.round(parseFloat(e.target.value) * 10) / 10;
    state.pkRadius = v;

});

/* ========== 全域事件 ========== */
function setPillActive(container, btn) {
  container.querySelectorAll('.pill').forEach(x => x.classList.toggle('active', x === btn));
}
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); tap(); window.open(navUrl(nav.dataset.nav, nav.dataset.navMode), '_blank', 'noopener'); return; }
  const nm = e.target.closest('[data-navmode]');
  if (nm) { tap(); state.navMode = nm.dataset.navmode; savePrefs(); document.querySelectorAll('#nav-mode .pill').forEach(x => x.classList.toggle('active', x === nm)); return; }
  const near = e.target.closest('[data-near]');
  if (near) {
    tap();
    const q = near.dataset.near, md = state.mapData;
    let url;
    if (md) url = 'https://www.google.com/maps/search/' + encodeURIComponent(q) + '/@' + md.geo.lat.toFixed(6) + ',' + md.geo.lng.toFixed(6) + ',16z';
    else {
      const kw = $('mp-kw').value.trim();
      if (!kw) { showToast('請先輸入地點', 'map-pin'); return; }
      url = 'https://www.google.com/maps/search/' + encodeURIComponent(q + ' ' + kw);
    }
    window.open(url, '_blank', 'noopener');
    return;
  }
  const pf = e.target.closest('[data-park-focus]');
  if (pf) {
    tap();
    const i = +pf.dataset.parkFocus;
    if (state.map && state.map.markers[i]) {
      const mk = state.map.markers[i];
      $('map-view').scrollIntoView({ behavior: 'smooth', block: 'center' });
      state.map.map.flyTo(mk.getLatLng(), 17, { duration: 0.6 });
      setTimeout(() => { try { mk.openPopup(); } catch (err) {} }, 650);
    }
    return;
  }
  if (e.target.closest('#map-here')) {
    tap();
    const md = state.mapData;
    if (md && state.map) {
      const c = state.map.map.getCenter();
      const sameArea = Utils.distance(c.lat, c.lng, md.geo.lat, md.geo.lng) < 15;
      md.geo = { lat: c.lat, lng: c.lng, address: '', city: sameArea ? md.geo.city : '' };
      md.moved = true;
      state.map.center.setLatLng(c);
      state.map.circle.setLatLng(c);
      $('map-here').hidden = true;
      loadParking();
    }
    return;
  }
  const pk = e.target.closest('[data-pk]');
  if (pk) {
    tap();
    const a = pk.dataset.pk, p = Parked.get();
    if (a === 'save') saveParked();
    if (a === 'view' && p) {
      state.mpGeo = { kw: '愛車位置', geo: { lat: p.lat, lng: p.lng, address: p.note || '', city: '' } };
      state.routeFrom = null;
      $('mp-kw').value = '愛車位置';
      runMap();
    }
    if (a === 'share' && p) sharePlace('我的愛車停在這裡' + (p.note ? '（' + p.note + '）' : ''), p.lat, p.lng);
    if (a === 'note' && p) {
      let n = null;
      try { n = prompt('備註（樓層、車位號碼）', p.note || ''); } catch (err) {}
      if (n !== null) { p.note = String(n).trim().slice(0, 60); Parked.set(p); renderParked(); refreshParkedMarker(); }
    }
    if (a === 'clear') { Parked.clear(); renderParked(); refreshParkedMarker(); showToast('已清除停車記錄', 'trash-2'); }
    return;
  }
  const ptype = e.target.closest('[data-pktype]');
  if (ptype) {
    tap();
    state.pkType = ptype.dataset.pktype;
    savePrefs();
    setPillActive($('pk-type2'), ptype);
    if (state.mapData) state.mapData.shown = 20;
    updateParking();
    return;
  }
  const psort = e.target.closest('[data-pksort]');
  if (psort) {
    tap();
    state.pkSort = psort.dataset.pksort;
    savePrefs();
    setPillActive($('pk-sort2'), psort);
    if (state.mapData) state.mapData.shown = 20;
    updateParking();
    return;
  }
  const pl = e.target.closest('[data-place-idx]');
  if (pl) {
    tap();
    const name = Places.get()[+pl.dataset.placeIdx];
    if (name) { $('mp-kw').value = name; state.mpGeo = null; state.routeFrom = null; runMap(); }
    return;
  }
  if (e.target.closest('#clear-places')) { tap(); Places.clear(); renderPlaces(); return; }

  const ics = e.target.closest('[data-ics]');
  if (ics) { tap(); downloadTripICS(+ics.dataset.ics); return; }
  const pt = e.target.closest('[data-past-toggle]');
  if (pt) { tap(); state.showPast = !state.showPast; rerenderTrip(); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'park-refresh' || a === 'park-retry') { tap(); loadParking(); return; }
    if (a === 'park-expand') {
      tap();
      state.pkRadius = Math.min(3, Math.round((state.pkRadius + 1) * 10) / 10);
      const r = $('pk-range');
      if (r) { r.value = state.pkRadius; paintRange(r); }
      savePrefs(); updateParking(); fitRadius();
      return;
    }
    if (a === 'park-more') { tap(); if (state.mapData) { state.mapData.shown += 20; updateParking(); } return; }
    if (a === 'park-copy') { if (state.parkShareText) copyToClipboard(state.parkShareText); else showToast('目前沒有可複製的清單', 'circle-alert'); return; }
    if (a === 'place-share') {
      const md = state.mapData;
      if (md) sharePlace((md.kw === '我的位置' || COORD_RE.test(md.kw)) ? '我的位置' : md.kw, md.dest.lat.toFixed(6), md.dest.lng.toFixed(6));
      return;
    }
    const tab = act.closest('.result').id.replace('result-', '');
    const sh = state.share[tab];
    if (a === 'copy' && sh) copyToClipboard(sh.text);
    if (a === 'share' && sh) shareContent(sh.title, sh.text);
    if (a === 'refresh' && tab === 'trip') { tap(); runTripQuery(); }
    if (a === 'fav' && state.lastQuery) {
      tap();
      const added = Store.addFav(Object.assign({}, state.lastQuery));
      act.classList.add('on', 'pop');
      showToast(added ? '已加入收藏' : '這條路線已在收藏中', 'star');
      if (added) renderFavs();
    }
    return;
  }
  const cta = e.target.closest('[data-cta]');
  if (cta) {
    const a = cta.dataset.cta;
    if (a === 'trip-go') runTripQuery();
    if (a === 'trip-all') { $('tr-time').value = ''; $('tr-express-only').checked = false; updateDateLabel(); runTripQuery(); }
    if (a === 'trip-tomorrow') { $('tr-date').value = Utils.addDays(1); $('tr-time').value = ''; updateDateLabel(); runTripQuery(); }
    if (a === 'map-demo') { $('mp-kw').value = '台北車站'; state.mpGeo = null; state.routeFrom = null; runMap(); }
    return;
  }
  const retry = e.target.closest('[data-retry]');
  if (retry) {
    const t = retry.dataset.retry;
    if (t === 'trip') runTripQuery();
    if (t === 'map') runMap();
  }
});

/* ========== 初始化 ========== */
updateOnline();
updateTransportUI();
TABS.forEach(renderEmpty);
applyAccent();
renderPlaces();
renderParked();
renderFavs();
renderHist();
drawIcons();
window.addEventListener('load', drawIcons);
(async function restoreLast() {
  const last = lsJson('tq_last', null);
  if (!last || !TYPE_META[last.type] || !last.from || !last.to) return;
  try { await applyRouteValues(last); } catch (e) {}
})();
</script>
</body>
</html>
