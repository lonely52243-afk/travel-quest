<style>
:root{--bg:#f7f3eb;--card:#fffdf8;--line:#e6dfd2;--ink:#2e2a24;--sub:#8c8577;--acc:#a67c52;--exp:#b8603e;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.mo{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:600}
.mo button{width:36px;height:36px;border-radius:18px;font-size:22px;color:var(--sub)}
.mo button:disabled{opacity:.25}
.ico{width:40px;height:40px;border-radius:20px;font-size:20px;color:var(--sub)}
.total{padding:8px 0 4px}
.total .n{font-family:Georgia,"Songti TC",serif;font-size:42px;font-weight:700;color:var(--exp);letter-spacing:.5px}
.total .n small{font-size:18px;margin-right:6px;font-weight:600}
.total .c{color:var(--sub);font-size:14px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:12px 0 10px}
.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip b{font-weight:600}
.chip .dot{width:9px;height:9px;border-radius:5px}
.inc{font-size:14px;color:var(--sub);margin-top:2px}.inc b{color:#4f8a5b;font-weight:700}
.row.in .ic{background:rgba(79,138,91,.16);color:#4f8a5b}.row.in .am{color:#4f8a5b}
.chip.on{border-color:var(--acc);background:#f1e7d8}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:18px 2px 8px;border-bottom:2px solid var(--ink);margin-top:6px}
.day span:first-child{font-weight:700;font-size:16px}
.day span:last-child{font-family:Georgia,"Songti TC",serif;color:var(--sub);font-size:15px}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .ic{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.row .mid{flex:1;min-width:0}
.row .st{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sb{font-size:13px;color:var(--sub);margin-top:3px}
.row .am{font-family:Georgia,"Songti TC",serif;font-size:21px;font-weight:700;color:var(--exp);white-space:nowrap}
.row .am small{font-size:11px;margin-right:3px;font-family:inherit}
.row.x .st,.row.x .am{text-decoration:line-through;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:56px 0;font-size:15px}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:31px;background:var(--acc);color:#fff;font-size:34px;line-height:1;box-shadow:0 8px 22px rgba(120,80,40,.35)}
.mask{position:fixed;inset:0;background:rgba(30,25,20,.45);display:none;z-index:10}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .22s}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.lab{font-size:13px;color:var(--sub);margin:14px 0 6px}
.fld{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px}
.amt{font-family:Georgia,"Songti TC",serif;font-size:30px;font-weight:700;color:var(--exp)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px}
.opt.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:14px;font-size:17px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:#b3402e;flex:0 0 auto;padding:14px 18px}
.err{color:#b3402e;font-size:14px;min-height:20px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2e2a24;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:80%}
.login{padding-top:18vh;text-align:center}
.login h1{font-size:26px;margin:0 0 6px}
.login p{color:var(--sub);margin:0 0 22px;font-size:15px}
.hide{display:none!important}
.sheet.z2{z-index:13}.sheet.z3{z-index:14}
textarea.fld{font-family:inherit;resize:none;font-size:16px;line-height:1.5}
.mgrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.mgrow .dot{width:14px;height:14px;border-radius:7px;flex:none}
.mgrow .mid{flex:1;min-width:0;text-align:left}
.mgrow .nm{font-size:16px;font-weight:600}
.mgrow .kw{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrow .arr{width:36px;height:36px;border-radius:18px;color:var(--sub);font-size:18px;background:var(--card);border:1px solid var(--line)}
.mgrow .arr:disabled{opacity:.25}
.sw{width:34px;height:34px;border-radius:17px;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
select.fld{appearance:none;-webkit-appearance:none}
.hint{font-size:13px;color:var(--sub);line-height:1.5;margin:0 0 10px}
.sub2{font-size:12px;color:var(--sub);margin-top:6px;word-break:break-all}
</style>
</head>
<body>

<div id="loginV" class="wrap login hide">
  <h1>吱吱記帳</h1>
  <p>輸入看帳密碼</p>
  <input id="keyIn" class="fld" type="password" autocomplete="off" placeholder="看帳密碼">
  <div class="btns"><button id="loginB" class="btn p">進入</button></div>
  <div id="loginErr" class="err"></div>
</div>

<div id="mainV" class="wrap hide">
  <div class="top">
    <div class="mo"><button id="prev" aria-label="上個月">‹</button><span id="moT"></span><button id="next" aria-label="下個月">›</button></div>
    <div><button id="refresh" class="ico" aria-label="重新整理">↻</button><button id="gear" class="ico" aria-label="設定">⚙</button></div>
  </div>
  <div class="total"><div class="n"><small>NT$</small><span id="tot">0</span></div><div class="c" id="cnt"></div><div class="inc hide" id="inc"></div></div>
  <div class="bar" id="bar"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

<button id="fab" class="fab hide" aria-label="記一筆">+</button>

<div id="mask" class="mask"></div>

<div id="sheet" class="sheet"><div class="in">
  <h3 id="shT">記一筆</h3>
  <div class="opts" id="fType"></div>
  <div class="lab">金額</div>
  <input id="fAmt" class="fld amt" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
  <div class="lab" id="storeLab">店名</div>
  <input id="fStore" class="fld" type="text" maxlength="40" placeholder="例如：全家" autocomplete="off">
  <div id="expBox">
  <div class="lab">分類</div>
  <div class="opts" id="fCats"></div>
  <div class="lab">來源</div>
  <div class="opts" id="fSrc"></div>
  <div id="tagBox"><div class="lab">品項（選填）</div><div class="opts" id="fTags"></div></div>
  </div>
  <div class="lab">時間</div>
  <input id="fTime" class="fld" type="datetime-local">
  <div class="err" id="shErr"></div>
  <div class="btns">
    <button id="shDel" class="btn d hide">刪除</button>
    <button id="shCancel" class="btn">取消</button>
    <button id="shSave" class="btn p">儲存</button>
  </div>
</div></div>

<div id="setSheet" class="sheet"><div class="in">
  <h3>設定</h3>
  <div class="lab">整理</div>
  <div class="opts"><button id="mgCat" class="opt">管理分類</button><button id="mgTag" class="opt">管理品項</button></div>
  <div class="lab">版本</div>
  <div id="verT" class="sub2"></div>
  <div class="lab">後端網址</div>
  <input id="apiIn" class="fld" type="url" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="btns">
    <button id="logout" class="btn d">登出</button>
    <button id="setClose" class="btn">關閉</button>
    <button id="setSave" class="btn p">儲存網址</button>
  </div>
</div></div>

<div id="mgSheet" class="sheet z2"><div class="in">
  <h3 id="mgT"></h3>
  <p class="hint" id="mgHint"></p>
  <div id="mgList"></div>
  <div class="btns">
    <button id="mgAdd" class="btn">＋ 新增</button>
    <button id="mgRe" class="btn">套用到舊資料</button>
    <button id="mgClose" class="btn p">完成</button>
  </div>
</div></div>

<div id="edSheet" class="sheet z3"><div class="in">
  <h3 id="edT"></h3>
  <div class="lab">名稱</div>
  <input id="edName" class="fld" type="text" maxlength="12" autocomplete="off">
  <div id="edColorBox"><div class="lab">顏色</div><div class="opts" id="edColors"></div></div>
  <div class="lab">關鍵字（用逗號分開）</div>
  <textarea id="edKw" class="fld" rows="3" autocomplete="off" placeholder="例如：全家,萊爾富,7-ELEVEN"></textarea>
  <div id="edDelBox" class="hide"><div class="lab" id="edDelLab"></div><select id="edMove" class="fld"></select></div>
  <div class="err" id="edErr"></div>
  <div class="btns">
    <button id="edDel" class="btn d">刪除</button>
    <button id="edCancel" class="btn">取消</button>
    <button id="edSave" class="btn p">儲存</button>
  </div>
</div></div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';
  var DEFAULT_API = 'https://script.google.com/macros/s/AKfycbxPkzgIjUT7O4YMPVPjFi5u9JsZL_WWcNhAgVXnH_Erg5Z3jWo2ZgTnpiZTRGUYZqun/exec';
  var S = { key: '', api: '', rows: [], income: [], isInc: false, tags: [], fallback: '其他', mg: '', ed: null, delArmed: false, cats: [], sources: [], ver: '', y: 0, m: 0, filter: '', editId: '' };
  var $ = function (id) { return document.getElementById(id); };

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function money(n) { return Math.round(n).toLocaleString('en-US'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var WD = ['日', '一', '二', '三', '四', '五', '六'];

  var tTimer = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(tTimer);
    tTimer = setTimeout(function () { t.style.display = 'none'; }, 2400);
  }

  function call(body) {
    body.key = S.key;
    return fetch(S.api, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) throw new Error(j && j.msg === 'unauthorized' ? '密碼不對' : ((j && j.msg) || '失敗'));
      return j.result;
    });
  }

  function setData(res) {
    S.rows = res.rows || [];
    S.income = res.income || [];
    S.income.sort(function (a, b) { return b.time - a.time; });
    S.cats = res.cats || [];
    S.tags = res.tags || [];
    S.fallback = res.fallback || '其他';
    S.sources = res.sources || [];
    S.ver = res.version || '';
    S.rows.sort(function (a, b) { return b.time - a.time; });
    render();
  }

  function load(quiet) {
    return call({ action: 'list' }).then(function (res) {
      setData(res);
      try { lsSet('zz_cache', JSON.stringify(res)); } catch (e) {}
    }).catch(function (e) {
      if (e.message === '密碼不對') { lsDel('zz_key'); show('login'); $('loginErr').textContent = '密碼不對，請重新輸入'; return; }
      if (!quiet) toast('讀取失敗：' + e.message);
      else toast('連不上，顯示上次的資料');
    });
  }

  function show(which) {
    $('loginV').classList.toggle('hide', which !== 'login');
    $('mainV').classList.toggle('hide', which !== 'main');
    $('fab').classList.toggle('hide', which !== 'main');
  }

  function catColor(name) {
    for (var i = 0; i < S.cats.length; i++) if (S.cats[i].name === name) return S.cats[i].color;
    return '#8c8577';
  }
  function tint(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',.16)';
  }

  function inMonth(t) {
    var d = new Date(t);
    return d.getFullYear() === S.y && d.getMonth() === S.m;
  }

  function render() {
    $('moT').textContent = S.y + '年' + (S.m + 1) + '月';
    var now = new Date();
    $('next').disabled = (S.y === now.getFullYear() && S.m === now.getMonth());

    var monthRows = S.rows.filter(function (r) { return inMonth(r.time); });
    var live = monthRows.filter(function (r) { return r.status !== '已取消'; });
    var total = 0, byCat = {};
    live.forEach(function (r) { total += r.amount; byCat[r.category] = (byCat[r.category] || 0) + r.amount; });
    $('tot').textContent = money(total);
    $('cnt').textContent = '共 ' + live.length + ' 筆';
    var monthInc = S.income.filter(function (r) { return inMonth(r.time); });
    var incTotal = 0; monthInc.forEach(function (r) { incTotal += r.amount; });
    var incEl = $('inc'); incEl.textContent = '';
    incEl.classList.toggle('hide', !incTotal);
    if (incTotal) {
      incEl.appendChild(document.createTextNode('收入 '));
      incEl.appendChild(el('b', '', '+' + money(incTotal)));
      var bal = incTotal - total;
      incEl.appendChild(document.createTextNode('　結餘 ' + (bal < 0 ? '-' : '') + money(Math.abs(bal))));
    }

    var names = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
    var bar = $('bar'); bar.textContent = '';
    names.forEach(function (n) {
      var i = el('i'); i.style.width = (byCat[n] / total * 100) + '%'; i.style.background = catColor(n); bar.appendChild(i);
    });
    bar.classList.toggle('hide', !names.length);
    if (S.filter && !byCat[S.filter]) S.filter = '';
    var chips = $('chips'); chips.textContent = '';
    if (names.length) {
      var all = el('button', 'chip' + (S.filter ? '' : ' on'));
      all.appendChild(el('b', '', '全部'));
      all.onclick = function () { S.filter = ''; render(); };
      chips.appendChild(all);
      names.forEach(function (n) {
        var c = el('button', 'chip' + (S.filter === n ? ' on' : ''));
        var d = el('span', 'dot'); d.style.background = catColor(n);
        c.appendChild(d); c.appendChild(el('span', '', n)); c.appendChild(el('b', '', money(byCat[n])));
        c.onclick = function () { S.filter = (S.filter === n ? '' : n); render(); };
        chips.appendChild(c);
      });
    }

    var shown = monthRows.filter(function (r) { return !S.filter || r.category === S.filter; });
    if (!S.filter) {
      monthInc.forEach(function (r) { shown.push({ id: r.id, time: r.time, amount: r.amount, store: r.note, category: '收', source: '', status: '正常', inc: true }); });
      shown.sort(function (a, b) { return b.time - a.time; });
    }
    var list = $('list'); list.textContent = '';
    if (!shown.length) { list.appendChild(el('div', 'empty', '這個月還沒有紀錄')); return; }
    var curDay = '', dayTotal = null, dayHead = null;
    shown.forEach(function (r) {
      var d = new Date(r.time);
      var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      if (key !== curDay) {
        curDay = key;
        dayHead = el('div', 'day');
        dayHead.appendChild(el('span', '', (d.getMonth() + 1) + '月' + d.getDate() + '日　' + WD[d.getDay()]));
        dayTotal = el('span', '', '');
        dayHead._sum = 0;
        dayHead.appendChild(dayTotal);
        list.appendChild(dayHead);
      }
      if (r.status !== '已取消' && !r.inc) dayHead._sum += r.amount;
      dayTotal.textContent = dayHead._sum ? 'NT$ ' + money(dayHead._sum) : '';
      var col = catColor(r.category);
      var b = el('button', 'row' + (r.status === '已取消' ? ' x' : '') + (r.inc ? ' in' : ''));
      var ic = el('div', 'ic', r.category.charAt(0)); if (!r.inc) { ic.style.background = tint(col); ic.style.color = col; }
      var mid = el('div', 'mid');
      mid.appendChild(el('div', 'st', r.store || '（沒有店名）'));
      mid.appendChild(el('div', 'sb', r.inc ? ('收入　' + pad(d.getHours()) + ':' + pad(d.getMinutes())) : (r.category + (r.tag ? '·' + r.tag : '') + '　' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '　' + r.source + (r.status === '已取消' ? '　已取消' : ''))));
      var am = el('div', 'am'); am.appendChild(el('small', '', r.inc ? '+NT$' : 'NT$')); am.appendChild(document.createTextNode(money(r.amount)));
      b.appendChild(ic); b.appendChild(mid); b.appendChild(am);
      b.onclick = function () { openEdit(r.id); };
      list.appendChild(b);
    });
  }

  /* ---------- 編輯／新增 ---------- */
  var fCat = '', fSrc = '';
  function localInput(t) {
    var d = new Date(t);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function drawOpts(boxId, list, cur, onPick) {
    var box = $(boxId); box.textContent = '';
    list.forEach(function (n) {
      var b = el('button', 'opt' + (n === cur ? ' on' : ''), n);
      b.onclick = function () { onPick(n); drawOpts(boxId, list, n, onPick); };
      box.appendChild(b);
    });
  }
  function catNames() { return S.cats.map(function (c) { return c.name; }); }
  var fTag = '';
  function drawTags() {
    $('tagBox').classList.toggle('hide', !S.tags.length);
    var names = S.tags.map(function (x) { return x.name; });
    drawOpts('fTags', names, fTag, function (n) { fTag = (fTag === n ? '' : n); drawTags(); });
  }
  function setType(inc, canSwitch) {
    S.isInc = inc;
    $('expBox').classList.toggle('hide', inc);
    $('storeLab').textContent = inc ? '摘要' : '店名';
    $('fStore').placeholder = inc ? '例如：薪資、修護獎金' : '例如：全家';
    var box = $('fType'); box.textContent = '';
    box.classList.toggle('hide', !canSwitch);
    [['支出', false], ['收入', true]].forEach(function (p) {
      var b = el('button', 'opt' + (p[1] === inc ? ' on' : ''), p[0]);
      b.onclick = function () { setType(p[1], true); };
      box.appendChild(b);
    });
  }
  function openSheet() { $('mask').classList.add('on'); $('sheet').classList.add('on'); }
  function closeAll() {
    $('mask').classList.remove('on'); ['sheet', 'setSheet', 'mgSheet', 'edSheet'].forEach(function (id) { $(id).classList.remove('on'); });
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  }
  function openAdd() {
    S.editId = '';
    $('shT').textContent = '記一筆';
    $('fAmt').value = ''; $('fStore').value = '';
    fCat = ''; fSrc = '現金';
    $('fTime').value = localInput(Date.now());
    $('shDel').classList.add('hide'); $('shErr').textContent = '';
    setType(false, true);
    fTag = ''; drawTags();
    drawOpts('fCats', catNames(), fCat, function (n) { fCat = (fCat === n ? '' : n); });
    drawOpts('fSrc', S.sources, fSrc, function (n) { fSrc = n; });
    openSheet();
    setTimeout(function () { $('fAmt').focus(); }, 260);
  }
  function openEdit(id) {
    var r = null, isInc = false;
    S.rows.forEach(function (x) { if (x.id === id) r = x; });
    if (!r) S.income.forEach(function (x) { if (x.id === id) { r = { amount: x.amount, store: x.note, time: x.time, category: '', source: '' }; isInc = true; } });
    if (!r) return;
    S.editId = id;
    setType(isInc, false);
    fTag = r.tag || ''; drawTags();
    $('shT').textContent = '修改';
    $('fAmt').value = String(r.amount); $('fStore').value = r.store;
    fCat = r.category; fSrc = r.source;
    $('fTime').value = localInput(r.time);
    $('shDel').classList.remove('hide'); $('shErr').textContent = '';
    var srcs = S.sources.slice(); if (srcs.indexOf(fSrc) < 0 && fSrc) srcs.push(fSrc);
    drawOpts('fCats', catNames(), fCat, function (n) { fCat = n; });
    drawOpts('fSrc', srcs, fSrc, function (n) { fSrc = n; });
    openSheet();
  }
  function save() {
    var amt = parseFloat(String($('fAmt').value).replace(/,/g, ''));
    if (!(amt > 0)) { $('shErr').textContent = '請輸入金額'; return; }
    var t = new Date($('fTime').value).getTime();
    var body = { action: S.editId ? 'update' : 'add', type: S.isInc ? 'income' : 'expense', amount: amt, store: $('fStore').value, category: fCat, source: fSrc, tag: fTag, time: isNaN(t) ? 0 : t };
    if (!S.editId && !fTag) delete body.tag;
    if (S.editId) body.id = S.editId;
    $('shSave').disabled = true; $('shErr').textContent = '';
    call(body).then(function (res) {
      $('shSave').disabled = false;
      closeAll(); setData(res); toast(S.editId ? '已修改' : '已記下');
    }).catch(function (e) { $('shSave').disabled = false; $('shErr').textContent = e.message; });
  }
  function del() {
    if (!S.editId) return;
    if (!window.confirm('刪除這一筆？')) return;
    call({ action: 'delete', id: S.editId }).then(function (res) { closeAll(); setData(res); toast('已刪除'); })
      .catch(function (e) { $('shErr').textContent = e.message; });
  }

/* ---------- 分類／品項管理 ---------- */
  var PALETTE = ['#b8603e', '#6d9a9a', '#8a6f9e', '#3d5a73', '#c9a24a', '#7d8f69', '#a85a6a', '#5f7fa8', '#8c8577', '#9a7b5b', '#4f8a8b', '#d4793a'];
  function mgList() { return S.mg === 'cat' ? S.cats : S.tags; }
  function countOf(name) {
    var n = 0, f = S.mg === 'cat' ? 'category' : 'tag';
    S.rows.forEach(function (r) { if (r[f] === name) n++; });
    return n;
  }
  function openMg(kind) {
    S.mg = kind;
    $('setSheet').classList.remove('on');
    $('mgT').textContent = kind === 'cat' ? '管理分類' : '管理品項';
    $('mgHint').textContent = kind === 'cat'
      ? '點一個分類可改名、換色、改關鍵字。店名含關鍵字就歸這一類；同時符合好幾類時，以比較長的關鍵字為準。↑↓ 調整順序。「' + S.fallback + '」放猜不到的，不能改名或刪除。'
      : '品項是記帳時的選填標籤（例如 3C網路、戶外露營）。點一個品項可改名或改關鍵字；店名含關鍵字就自動帶入。';
    renderMg();
    $('mask').classList.add('on'); $('mgSheet').classList.add('on');
  }
  function renderMg() {
    var box = $('mgList'); box.textContent = '';
    var list = mgList();
    list.forEach(function (it, i) {
      var fb = (S.mg === 'cat' && it.name === S.fallback);
      var row = el('div', 'mgrow');
      if (S.mg === 'cat') { var d = el('span', 'dot'); d.style.background = it.color; row.appendChild(d); }
      var mid = el('button', 'mid');
      mid.appendChild(el('div', 'nm', it.name + '　' + countOf(it.name) + ' 筆'));
      mid.appendChild(el('div', 'kw', it.keywords || '（沒有關鍵字）'));
      mid.onclick = function () { openEd(it); };
      row.appendChild(mid);
      var up = el('button', 'arr', '↑'), dn = el('button', 'arr', '↓');
      var lastIdx = list.length - (S.mg === 'cat' ? 2 : 1);   // 分類的最後一個是「其他」，不參與
      up.disabled = fb || i === 0; dn.disabled = fb || i >= lastIdx;
      up.onclick = function () { moveItem(it.name, -1); };
      dn.onclick = function () { moveItem(it.name, 1); };
      row.appendChild(up); row.appendChild(dn);
      box.appendChild(row);
    });
    if (!list.length) box.appendChild(el('div', 'empty', '還沒有品項，按「＋ 新增」'));
  }
  function moveItem(name, dir) {
    call({ action: S.mg + 'Move', name: name, dir: dir }).then(function (res) { setData(res); renderMg(); }).catch(function (e) { toast(e.message); });
  }
  var edColor = '';
  function openEd(it) {
    S.ed = it; S.delArmed = false;
    var isCat = S.mg === 'cat', fb = isCat && it && it.name === S.fallback;
    $('edT').textContent = (it ? '修改' : '新增') + (isCat ? '分類' : '品項');
    $('edName').value = it ? it.name : ''; $('edName').disabled = !!fb;
    $('edKw').value = it ? it.keywords : '';
    $('edErr').textContent = '';
    $('edColorBox').classList.toggle('hide', !isCat);
    $('edDelBox').classList.add('hide');
    $('edDel').textContent = '刪除';
    $('edDel').classList.toggle('hide', !it || fb);
    edColor = it ? it.color : unusedColor();
    drawColors();
    $('mgSheet').classList.remove('on');
    $('edSheet').classList.add('on');
  }
  function closeEd() { $('edSheet').classList.remove('on'); $('mgSheet').classList.add('on'); }
  function unusedColor() {
    var used = S.cats.map(function (c) { return c.color; });
    for (var i = 0; i < PALETTE.length; i++) if (used.indexOf(PALETTE[i]) < 0) return PALETTE[i];
    return PALETTE[0];
  }
  function drawColors() {
    var box = $('edColors'); box.textContent = '';
    PALETTE.forEach(function (c) {
      var b = el('button', 'sw' + (c === edColor ? ' on' : '')); b.style.background = c;
      b.onclick = function () { edColor = c; drawColors(); };
      box.appendChild(b);
    });
  }
  function edSave() {
    var body = { action: S.mg + 'Save', oldName: S.ed ? S.ed.name : '', name: $('edName').value, keywords: $('edKw').value };
    if (S.mg === 'cat') body.color = edColor;
    $('edSave').disabled = true; $('edErr').textContent = '';
    call(body).then(function (res) {
      $('edSave').disabled = false; closeEd(); setData(res); renderMg(); toast('已儲存');
    }).catch(function (e) { $('edSave').disabled = false; $('edErr').textContent = e.message; });
  }
  function edDel() {
    var it = S.ed; if (!it) return;
    var n = countOf(it.name);
    if (!S.delArmed) {
      S.delArmed = true;
      $('edDelBox').classList.remove('hide');
      if (S.mg === 'cat') {
        $('edDelLab').textContent = n ? ('這一類的 ' + n + ' 筆要移到哪一類？') : '這一類沒有消費，可以直接刪除';
        var sel = $('edMove'); sel.textContent = '';
        S.cats.forEach(function (c) { if (c.name !== it.name) { var o = el('option', '', c.name); o.value = c.name; if (c.name === S.fallback) o.selected = true; sel.appendChild(o); } });
        sel.classList.toggle('hide', !n);
      } else {
        $('edDelLab').textContent = n ? (n + ' 筆消費的品項會被清空，消費本身不會刪') : '這個品項沒有消費，可以直接刪除';
        $('edMove').classList.add('hide');
      }
      $('edDel').textContent = '確定刪除';
      return;
    }
    var body = { action: S.mg + 'Delete', name: it.name };
    if (S.mg === 'cat') body.moveTo = $('edMove').value;
    call(body).then(function (res) { closeEd(); setData(res); renderMg(); toast('已刪除'); })
      .catch(function (e) { $('edErr').textContent = e.message; });
  }
  function recat() {
    call({ action: 'recat' }).then(function (res) { setData(res); renderMg(); toast(res.changed ? ('已重新整理 ' + res.changed + ' 筆') : '沒有需要調整的'); })
      .catch(function (e) { toast(e.message); });
  }

  /* ---------- 其他 ---------- */
  function go(delta) {
    var d = new Date(S.y, S.m + delta, 1);
    S.y = d.getFullYear(); S.m = d.getMonth(); S.filter = ''; render();
  }
  function start() {
    var now = new Date(); S.y = now.getFullYear(); S.m = now.getMonth();
    S.api = lsGet('zz_api') || DEFAULT_API;
    S.key = lsGet('zz_key');
    if (!S.key) { show('login'); return; }
    show('main');
    try { var c = JSON.parse(lsGet('zz_cache') || 'null'); if (c) setData(c); else render(); } catch (e) { render(); }
    load(true);
  }

  $('loginB').onclick = function () {
    var k = $('keyIn').value.trim();
    if (!k) { $('loginErr').textContent = '請輸入密碼'; return; }
    S.key = k; S.api = lsGet('zz_api') || DEFAULT_API; $('loginErr').textContent = '登入中…';
    call({ action: 'list' }).then(function (res) {
      lsSet('zz_key', k); $('keyIn').value = ''; $('loginErr').textContent = '';
      show('main'); setData(res);
      try { lsSet('zz_cache', JSON.stringify(res)); } catch (e) {}
    }).catch(function (e) { $('loginErr').textContent = e.message; });
  };
  $('keyIn').onkeydown = function (e) { if (e.key === 'Enter') $('loginB').onclick(); };
  $('prev').onclick = function () { go(-1); };
  $('next').onclick = function () { go(1); };
  $('refresh').onclick = function () { load(false).then(function () { toast('已更新'); }); };
  $('fab').onclick = openAdd;
  $('mask').onclick = closeAll;
  $('shCancel').onclick = closeAll;
  $('shSave').onclick = save;
  $('shDel').onclick = del;
  $('gear').onclick = function () {
    $('verT').textContent = S.ver ? ('後端 v' + S.ver) : '尚未讀到';
    $('apiIn').value = S.api;
    $('mask').classList.add('on'); $('setSheet').classList.add('on');
  };
  $('setClose').onclick = closeAll;
  $('mgCat').onclick = function () { openMg('cat'); };
  $('mgTag').onclick = function () { openMg('tag'); };
  $('mgAdd').onclick = function () { openEd(null); };
  $('mgRe').onclick = recat;
  $('mgClose').onclick = closeAll;
  $('edCancel').onclick = closeEd;
  $('edSave').onclick = edSave;
  $('edDel').onclick = edDel;
  $('setSave').onclick = function () {
    var v = $('apiIn').value.trim();
    if (v && !/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(v)) { toast('網址要是 https://script.google.com/macros/s/…/exec'); return; }
    if (v) { lsSet('zz_api', v); S.api = v; }
    closeAll(); load(false);
  };
  $('logout').onclick = function () {
    lsDel('zz_key'); lsDel('zz_cache'); S.key = ''; S.rows = []; closeAll(); show('login');
  };
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.key) load(true); });

  start();
})();
</script>
</body>
</html>
