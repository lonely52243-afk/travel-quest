<style>
:root {
  --paper: #f5f1e8;
  --paper2: #ece6d8;
  --ink: #2a2724;
  --sub: #7a736a;
  --line: #d9d1c1;
  --ai: #3d5a73;
  --shu: #c4412d;
  --serif: "Hiragino Mincho ProN", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
body {
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(120px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; text-align: left; padding: 0; }
.hidden { display: none !important; }
.wrap { max-width: 520px; margin: 0 auto; padding: 0 22px; }
.serif { font-family: var(--serif); }

/* 登入 */
#login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px; }
.login-box { width: 100%; max-width: 320px; text-align: center; }
.login-box h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; letter-spacing: .3em; margin: 0 0 6px 0.3em; }
.login-box .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--shu); margin: 0 auto 22px; }
.login-box p { margin: 0 0 22px; color: var(--sub); font-size: 14px; letter-spacing: .15em; }
.input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; padding: 10px 2px; outline: none; font-size: 16px; }
.input:focus { border-bottom-color: var(--shu); }
select.input { appearance: none; -webkit-appearance: none; }
.btn { display: block; width: 100%; text-align: center; background: var(--ink); color: var(--paper); padding: 13px; margin-top: 22px; letter-spacing: .3em; border-radius: 2px; }
.btn.line { background: transparent; color: var(--ink); border: 1px solid var(--ink); margin-top: 10px; }
.btn.shu { background: transparent; color: var(--shu); border: 1px solid var(--shu); margin-top: 10px; }
.btn:disabled { opacity: .5; }
.err { color: var(--shu); font-size: 14px; min-height: 22px; margin-top: 12px; }
details.adv { margin-top: 26px; color: var(--sub); font-size: 13px; text-align: left; }
details.adv summary { text-align: center; cursor: pointer; }
details.adv .input { margin-top: 8px; font-size: 13px; }

/* 頂部 */
header { padding-top: calc(env(safe-area-inset-top) + 14px); }
.head-row { display: flex; align-items: center; justify-content: space-between; }
.month { display: flex; align-items: center; gap: 6px; }
.month b { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: .12em; min-width: 124px; text-align: center; }
.arrow { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--sub); text-align: center; }
.arrow:disabled { opacity: .25; }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.sum { padding: 30px 0 22px; text-align: center; border-bottom: 1px solid var(--line); }
.sum-label { font-size: 12px; letter-spacing: .3em; color: var(--sub); }
.sum-total { font-family: var(--serif); font-size: 42px; font-weight: 600; letter-spacing: .02em; margin: 6px 0 8px; }
.sum-total small { font-size: 16px; font-weight: 400; margin-right: 6px; color: var(--sub); }
.sum-sub { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--sub); }
.sum-sub b { color: var(--ink); font-weight: 500; }
.up { color: var(--shu); } .down { color: var(--ai); }

/* 分頁 */
.tabs { display: flex; justify-content: center; gap: 44px; padding: 16px 0 4px; }
.tab { font-family: var(--serif); font-size: 17px; letter-spacing: .3em; color: var(--sub); padding: 6px 0 8px 0.3em; border-bottom: 2px solid transparent; }
.tab.on { color: var(--ink); border-bottom-color: var(--shu); }

.chips { display: flex; gap: 18px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: none; justify-content: flex-start; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 14px; color: var(--sub); padding: 2px 0; border-bottom: 1px solid transparent; }
.chip.on { color: var(--ink); border-bottom-color: var(--ink); }

.filter-note { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--sub); }
.filter-note button { color: var(--shu); font-size: 13px; }

/* 明細 */
.day { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 2px; font-size: 12px; letter-spacing: .12em; color: var(--sub); }
.item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.item:active { background: var(--paper2); }
.i-main { min-width: 0; flex: 1; }
.i-store { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.i-store.empty { color: var(--sub); }
.i-meta { margin-top: 2px; font-size: 12px; color: var(--sub); letter-spacing: .04em; }
.i-meta .cat-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.i-amt { font-family: var(--serif); font-size: 18px; font-weight: 600; white-space: nowrap; }
.item.off .i-store, .item.off .i-amt { text-decoration: line-through; color: var(--sub); }
.off-mark { color: var(--shu); margin-left: 6px; }
.empty-box { text-align: center; color: var(--sub); padding: 56px 0; letter-spacing: .2em; font-size: 14px; }

/* 分析 */
.sec { margin-top: 34px; }
.sec h3 { font-family: var(--serif); font-weight: 600; font-size: 15px; letter-spacing: .25em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
.sec h3::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--shu); }
.sec .note { font-size: 12px; color: var(--sub); margin-bottom: 8px; letter-spacing: .05em; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--sans); }
.bv { font-size: 9px; fill: var(--sub); text-anchor: middle; }
.bm { font-size: 10px; fill: var(--sub); text-anchor: middle; }
.bm.on { fill: var(--ink); font-weight: 600; }
.barg { cursor: pointer; }

.donut-wrap { display: flex; align-items: center; gap: 18px; }
.donut { width: 150px; flex: none; }
.legend { flex: 1; min-width: 0; }
.leg { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 0; font-size: 14px; }
.leg i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.leg .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leg .p { color: var(--sub); font-size: 12px; }
.catrow { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.catrow .l { display: flex; align-items: center; gap: 10px; }
.catrow i { width: 9px; height: 9px; border-radius: 50%; }
.catrow .r { font-family: var(--serif); font-weight: 600; }
.catrow .r small { font-family: var(--sans); font-weight: 400; color: var(--sub); margin-left: 8px; font-size: 12px; }

.stats { display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 10px; }
.stat { flex: 1; padding: 12px 0; text-align: center; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .k { font-size: 11px; letter-spacing: .15em; color: var(--sub); }
.stat .v { font-family: var(--serif); font-weight: 600; font-size: 16px; margin-top: 2px; }
.stat .s { font-size: 11px; color: var(--sub); }

.rank { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.rank .no { font-family: var(--serif); width: 18px; color: var(--shu); font-weight: 600; }
.rank .mid { flex: 1; min-width: 0; }
.rank .nm { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .ct { font-size: 12px; color: var(--sub); }
.rank .am { font-family: var(--serif); font-weight: 600; }
.thin { height: 3px; background: var(--paper2); margin-top: 6px; }
.thin i { display: block; height: 100%; background: var(--ai); }

/* 新增鈕 */
.fab { position: fixed; right: 22px; bottom: calc(26px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border-radius: 50%; background: var(--shu); color: var(--paper); font-size: 28px; font-weight: 300; line-height: 1; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 0 0 5px var(--paper), 0 0 0 6px var(--line); z-index: 6; }

/* 面板 */
.mask { position: fixed; inset: 0; background: rgba(42, 39, 36, .42); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; background: var(--paper); border-radius: 14px 14px 0 0; padding: 22px 24px calc(22px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
.sheet h2 { font-family: var(--serif); font-weight: 600; font-size: 16px; letter-spacing: .3em; margin: 0 0 14px; text-align: center; }
.d-amt { font-family: var(--serif); font-size: 36px; font-weight: 600; text-align: center; margin: 4px 0 2px; }
.d-amt.off { text-decoration: line-through; color: var(--sub); }
.d-store { text-align: center; color: var(--sub); font-size: 15px; margin-bottom: 18px; }
.drow { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 15px; }
.drow:last-of-type { border-bottom: 1px solid var(--line); }
.drow .k { color: var(--sub); font-size: 13px; letter-spacing: .1em; white-space: nowrap; }
.drow .v { text-align: right; word-break: break-all; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; letter-spacing: .15em; color: var(--sub); }
.row2 { display: flex; gap: 18px; }
.row2 .field { flex: 1; }

#toast { position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 2px; font-size: 14px; letter-spacing: .05em; z-index: 40; max-width: 88%; text-align: center; }
  .ver { font-size: 11px; letter-spacing: .12em; color: var(--sub); margin-top: 22px; }
/* 圓環動畫 */
.donut-box { margin-top: 4px; }
.sl { cursor: pointer; transition: transform .3s cubic-bezier(.3,1.5,.5,1), opacity .25s; }
.sl.pop { transform: translate(var(--dx), var(--dy)); }
.sl.dim { opacity: .28; }
.lbl { opacity: 0; transition: opacity .45s; pointer-events: none; }
.lbl.in { opacity: 1; }
.lbl.dim.in { opacity: .22; }
.lbl .pc { font-size: 10px; font-weight: 600; fill: #2a2724; }
.lbl .nm { font-size: 9px; fill: #7a736a; }
.lbl polyline { fill: none; stroke: #b9b09d; stroke-width: .8; }
.spark { transform-box: fill-box; transform-origin: center; opacity: 0; animation: tw 3.4s ease-in-out infinite; pointer-events: none; }
@keyframes tw { 0%, 100% { opacity: 0; transform: scale(.25) rotate(0deg); } 50% { opacity: .9; transform: scale(1) rotate(45deg); } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.donut-act { text-align: center; min-height: 34px; }
.link { color: var(--shu); font-size: 14px; letter-spacing: .1em; padding: 6px 10px; text-align: center; }
.catrow.on { background: var(--paper2); }
@media (prefers-reduced-motion: reduce) { .grow, .spark { animation: none; } .spark { display: none; } .sl, .lbl { transition: none; } }
footer .ver { margin-top: 6px; }
footer { text-align: center; color: var(--sub); font-size: 11px; letter-spacing: .3em; padding: 40px 0 6px; }
</style>
</head>
<body>

<!-- 登入 -->
<div id="login" class="hidden">
  <div class="login-box">
    <h1>吱吱記帳</h1>
    <div class="dot"></div>
    <p>請輸入看帳密碼</p>
    <input id="pw" class="input" type="password" placeholder="密碼" autocomplete="current-password" style="text-align:center">
    <button id="loginBtn" class="btn">進　入</button>
    <div id="loginErr" class="err"></div>
    <div class="ver" id="verLogin"></div>
    <details class="adv">
      <summary>後端網址（一般不用改）</summary>
      <input id="apiInput" class="input" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    </details>
  </div>
</div>

<!-- 主畫面 -->
<div id="app" class="hidden">
  <div class="wrap">
    <header>
      <div class="head-row">
        <div class="month">
          <button id="prevBtn" class="arrow" aria-label="上個月">‹</button>
          <b id="monthLabel"></b>
          <button id="nextBtn" class="arrow" aria-label="下個月">›</button>
        </div>
        <button id="refreshBtn" class="arrow" aria-label="重新整理">↻</button>
      </div>
    </header>

    <div class="sum">
      <div class="sum-label" id="sumLabel">本月支出</div>
      <div class="sum-total"><small>NT$</small><span id="sumTotal">0</span></div>
      <div class="sum-sub" id="sumSub"></div>
    </div>

    <div class="tabs">
      <button id="tabList" class="tab on">明　細</button>
      <button id="tabAna" class="tab">分　析</button>
    </div>
    <div class="chips" id="sourceChips"></div>

    <div id="viewList">
      <div class="filter-note hidden" id="filterNote"><span id="filterText"></span><button id="clearCat">解除</button></div>
      <div id="list"></div>
    </div>

    <div id="viewAna" class="hidden"></div>

    <footer>吱吱製作<div class="ver" id="verFoot"></div></footer>
  </div>

  <button id="fab" class="fab" aria-label="記一筆">+</button>
</div>

<!-- 詳細資料／編輯／新增 -->
<div id="mask" class="mask hidden">
  <div class="sheet">
    <div id="detailPanel">
      <h2>詳　細</h2>
      <div class="d-amt" id="dAmt"></div>
      <div class="d-store" id="dStore"></div>
      <div id="dRows"></div>
      <button id="editBtn" class="btn">編　輯</button>
      <button id="dCloseBtn" class="btn line">關　閉</button>
    </div>

    <div id="editPanel" class="hidden">
      <h2 id="editTitle">編　輯</h2>
      <div class="row2">
        <div class="field"><label>金額</label><input id="fAmount" class="input" type="number" inputmode="decimal" min="0" step="any"></div>
        <div class="field" id="statusField"><label>狀態</label>
          <select id="fStatus" class="input"><option value="正常">正常</option><option value="已取消">已取消</option></select>
        </div>
      </div>
      <div class="field"><label>店名</label><input id="fStore" class="input" type="text" autocomplete="off"></div>
      <div class="field"><label>分類</label><input id="fCat" class="input" type="text" list="catList" autocomplete="off" placeholder="點一下選擇，也可以直接打新分類"></div>
      <datalist id="catList"></datalist>
      <div id="addExtra">
        <div class="field"><label>來源</label><input id="fSource" class="input" type="text" list="srcList" autocomplete="off"></div>
        <datalist id="srcList"></datalist>
        <div class="field"><label>時間</label><input id="fTime" class="input" type="datetime-local"></div>
      </div>
      <button id="saveBtn" class="btn">儲　存</button>
      <button id="deleteBtn" class="btn shu">刪除這筆</button>
      <button id="cancelBtn" class="btn line">取　消</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
(function () {
  'use strict';

  var DEFAULT_API = 'https://script.google.com/macros/s/AKfycbxPkzgIjUT7O4YMPVPjFi5u9JsZL_WWcNhAgVXnH_Erg5Z3jWo2ZgTnpiZTRGUYZqun/exec';
  var PAGE_VERSION = '4.1';
  var LS_KEY = 'zz_expense_key';
  var LS_API = 'zz_expense_api';
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  // 和色：藍鼠、柿、若竹、山吹、藤、青磁、茜、利休鼠
  var PALETTE = ['#3d5a73', '#b8603e', '#7d8f69', '#c9a24a', '#8a6f9e', '#6d9a9a', '#a85a6a', '#8c8577'];

  var state = {
    key: '', rows: [], cats: [],
    y: 0, m: 0,
    tab: 'list',
    source: '全部', cat: '',
    mode: 'edit', editing: null, busy: false,
    ana: null, catColors: {}, serverColors: {}, sources: [], backendVersion: ''
  };

  function $(id) { return document.getElementById(id); }
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function num(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function money(n) { return 'NT$ ' + num(n); }
  function shortNum(n) {
    if (!n) return '';
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '萬';
    return Math.round(n).toLocaleString('en-US');
  }
  function getApi() { return lsGet(LS_API) || DEFAULT_API; }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  /* ---------- 後端 ---------- */

  function apiList() {
    return fetch(getApi() + '?action=list&key=' + encodeURIComponent(state.key))
      .then(function (r) { return r.json(); });
  }
  function apiPost(obj) {
    obj.key = state.key;
    return fetch(getApi(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(obj)
    }).then(function (r) { return r.json(); });
  }

  /* ---------- 畫面切換 ---------- */

  function showVersion() {
    var txt = '網頁 v' + PAGE_VERSION + (state.backendVersion ? '　·　後端 v' + state.backendVersion : '');
    $('verLogin').textContent = '網頁 v' + PAGE_VERSION;
    $('verFoot').textContent = txt;
  }

  function showLogin(msg) {
    showVersion();
    fetch(getApi()).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.version) { state.backendVersion = d.version; showVersion(); $('verLogin').textContent = $('verFoot').textContent; }
    }).catch(function () {});
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('loginErr').textContent = msg || '';
    $('apiInput').value = lsGet(LS_API);
  }
  function showApp() {
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 2600);
  }
  function setBusy(b) {
    state.busy = b;
    var r = $('refreshBtn');
    if (b) r.classList.add('spin'); else r.classList.remove('spin');
  }

  /* ---------- 載入 ---------- */

  function refresh() {
    if (state.busy) return;
    setBusy(true);
    apiList().then(function (d) {
      if (!d || !d.ok) {
        if (d && d.msg === 'unauthorized') {
          lsDel(LS_KEY);
          state.key = '';
          showLogin('密碼不對');
        } else {
          toast('讀取失敗：' + ((d && d.msg) || '未知錯誤'));
        }
        return;
      }
      state.rows = d.rows || [];
      state.cats = d.categories || [];
      state.serverColors = d.colors || {};
      state.sources = d.sources || [];
      state.backendVersion = d.version || '';
      buildCatColors();
      showVersion();
      showApp();
      render();
    }).catch(function () {
      toast('連不上後端，請檢查網路或後端網址');
    }).then(function () {
      setBusy(false);
    });
  }

  // 每個分類固定一個顏色（依分類名稱排序，重新整理後顏色不會亂跳）
  function buildCatColors() {
    var names = [];
    state.rows.forEach(function (r) { if (names.indexOf(r.category) < 0) names.push(r.category); });
    state.cats.forEach(function (c) { if (names.indexOf(c) < 0) names.push(c); });
    names.sort();
    state.catColors = {};
    names.forEach(function (n, i) { state.catColors[n] = state.serverColors[n] || PALETTE[i % PALETTE.length]; });
  }
  function colorOf(c) { return state.catColors[c] || PALETTE[7]; }

  /* ---------- 計算 ---------- */

  function inMonth(t, y, m) {
    var d = new Date(t);
    return d.getFullYear() === y && d.getMonth() === m;
  }
  function srcOk(r) { return state.source === '全部' || r.source === state.source; }
  function isOn(r) { return r.status !== '已取消'; }

  function monthTotal(y, m) {
    var s = 0;
    state.rows.forEach(function (r) {
      if (isOn(r) && srcOk(r) && inMonth(r.time, y, m)) s += r.amount;
    });
    return s;
  }

  /* ---------- 主畫面 ---------- */

  function render() {
    var now = new Date();
    var isCurrent = (state.y === now.getFullYear() && state.m === now.getMonth());
    $('monthLabel').textContent = state.y + '年' + (state.m + 1) + '月';
    $('nextBtn').disabled = isCurrent;
    $('tabList').classList.toggle('on', state.tab === 'list');
    $('tabAna').classList.toggle('on', state.tab === 'ana');
    $('viewList').classList.toggle('hidden', state.tab !== 'list');
    $('viewAna').classList.toggle('hidden', state.tab !== 'ana');

    var monthAll = state.rows.filter(function (r) { return inMonth(r.time, state.y, state.m); });

    // 來源
    var sources = ['全部'];
    monthAll.forEach(function (r) { if (sources.indexOf(r.source) < 0) sources.push(r.source); });
    if (sources.indexOf(state.source) < 0) state.source = '全部';
    var ch = '';
    sources.forEach(function (s) {
      ch += '<button class="chip' + (s === state.source ? ' on' : '') + '" data-source="' + esc(s) + '">' + esc(s) + '</button>';
    });
    $('sourceChips').innerHTML = ch;

    var rows = monthAll.filter(srcOk);
    var counted = rows.filter(isOn);
    var total = 0;
    counted.forEach(function (r) { total += r.amount; });
    var days = isCurrent ? now.getDate() : new Date(state.y, state.m + 1, 0).getDate();
    var avg = days ? total / days : 0;

    var py = state.m === 0 ? state.y - 1 : state.y;
    var pm = state.m === 0 ? 11 : state.m - 1;
    var prevTotal = monthTotal(py, pm);

    $('sumLabel').textContent = (isCurrent ? '本　月' : (state.m + 1) + '　月') + '　支　出' + (state.source === '全部' ? '' : '　·　' + state.source);
    $('sumTotal').textContent = num(total);
    var sub = '<span><b>' + counted.length + '</b> 筆</span><span>日均 <b>' + num(Math.round(avg)) + '</b></span>';
    if (prevTotal > 0) {
      var diff = (total - prevTotal) / prevTotal * 100;
      sub += '<span>較上月 <b class="' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '+' : '') + diff.toFixed(0) + '%</b></span>';
    }
    $('sumSub').innerHTML = sub;

    if (state.tab === 'list') renderList(rows); else renderAnalysis(monthAll, rows, counted, total);
  }

  /* ---------- 明細 ---------- */

  function renderList(rows) {
    var names = {};
    rows.forEach(function (r) { names[r.category] = true; });
    if (state.cat && !names[state.cat]) state.cat = '';
    $('filterNote').classList.toggle('hidden', !state.cat);
    $('filterText').textContent = state.cat ? '只看分類：' + state.cat : '';

    var list = rows.filter(function (r) { return !state.cat || r.category === state.cat; });
    list.sort(function (a, b) { return b.time - a.time; });

    var dayTotals = {};
    list.forEach(function (r) {
      if (!isOn(r)) return;
      var k = dayKey(new Date(r.time));
      dayTotals[k] = (dayTotals[k] || 0) + r.amount;
    });

    var html = '';
    var cur = '';
    list.forEach(function (r) {
      var d = new Date(r.time);
      var k = dayKey(d);
      if (k !== cur) {
        cur = k;
        html += '<div class="day"><span>' + (d.getMonth() + 1) + '月' + d.getDate() + '日　' + WEEK[d.getDay()] + '</span><span>' + money(dayTotals[k] || 0) + '</span></div>';
      }
      var off = !isOn(r);
      html += '<button class="item' + (off ? ' off' : '') + '" data-row="' + r.row + '">' +
        '<div class="i-main"><div class="i-store' + (r.store ? '' : ' empty') + '">' + esc(r.store || '（沒有店名）') + '</div>' +
        '<div class="i-meta">' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '　·　' +
        '<span class="cat-dot" style="background:' + colorOf(r.category) + '"></span>' + esc(r.category) +
        '　·　' + esc(r.source) + (off ? '<span class="off-mark">已取消</span>' : '') + '</div></div>' +
        '<div class="i-amt">' + num(r.amount) + '</div></button>';
    });
    $('list').innerHTML = html || '<div class="empty-box">這個月還沒有紀錄</div>';
  }

  /* ---------- 分析 ---------- */

  function sixMonthSvg() {
    var curIdx = state.y * 12 + state.m;
    var items = [];
    var max = 0;
    for (var i = 5; i >= 0; i--) {
      var idx = curIdx - i;
      var y = Math.floor(idx / 12);
      var m = idx % 12;
      var v = monthTotal(y, m);
      if (v > max) max = v;
      items.push({ idx: idx, y: y, m: m, v: v });
    }
    if (!max) max = 1;
    var W = 320, H = 180, padX = 6, top = 24, bottom = 26;
    var step = (W - padX * 2) / 6;
    var bw = 26;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="近六個月支出">';
    svg += '<line x1="' + padX + '" y1="' + (H - bottom) + '" x2="' + (W - padX) + '" y2="' + (H - bottom) + '" stroke="#d9d1c1" stroke-width="1"/>';
    items.forEach(function (it, k) {
      var h = Math.round((H - top - bottom) * it.v / max);
      var x = padX + step * k + (step - bw) / 2;
      var y = H - bottom - h;
      var on = it.idx === curIdx;
      var cx = x + bw / 2;
      svg += '<g class="barg" data-ym="' + it.y + '-' + it.m + '">' +
        '<rect x="' + (padX + step * k) + '" y="0" width="' + step + '" height="' + H + '" fill="transparent"/>' +
        '<rect class="grow" style="animation-delay:' + (k * 70) + 'ms" x="' + x + '" y="' + (it.v ? y : H - bottom - 1) + '" width="' + bw + '" height="' + (it.v ? Math.max(h, 2) : 1) + '" fill="' + (on ? '#c4412d' : '#3d5a73') + '" opacity="' + (on ? 1 : 0.55) + '"/>' +
        '<text class="bv" x="' + cx + '" y="' + (y - 6) + '">' + shortNum(it.v) + '</text>' +
        '<text class="bm' + (on ? ' on' : '') + '" x="' + cx + '" y="' + (H - 9) + '">' + (it.m + 1) + '月</text></g>';
    });
    return svg + '</svg>';
  }

  function donutSvg(entries, total) {
    var CX = 160, CY = 126, R = 58, SW = 24, C = 2 * Math.PI * R, DUR = 900;
    var svg = '<svg id="donutSvg" viewBox="0 0 320 252" role="img" aria-label="分類比例">';
    svg += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="#ece6d8" stroke-width="' + SW + '"/>';
    var acc = 0, labels = [], sl = '';
    entries.forEach(function (e, i) {
      var len = e.value / total * C;
      var draw = Math.max(len - (entries.length > 1 ? 2 : 0), 0.6);
      var ang = (acc + len / 2) / C * 2 * Math.PI - Math.PI / 2;
      var dx = Math.cos(ang), dy = Math.sin(ang);
      var delay = Math.round(acc / C * DUR);
      var dur = Math.max(Math.round(len / C * DUR), 60);
      sl += '<g class="sl" data-i="' + i + '" style="--dx:' + (dx * 7).toFixed(2) + 'px;--dy:' + (dy * 7).toFixed(2) + 'px">' +
        '<circle class="slice" cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="' + e.color + '" stroke-width="' + SW + '"' +
        ' stroke-dasharray="0 ' + C.toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 ' + CX + ' ' + CY + ')"' +
        ' data-d="' + draw.toFixed(2) + '" data-r="' + (C - draw).toFixed(2) + '"' +
        ' style="transition:stroke-dasharray ' + dur + 'ms linear ' + delay + 'ms"/></g>';
      if (e.value / total >= 0.04) {
        var rr = R + SW / 2;
        labels.push({ i: i, ax: CX + dx * (rr + 3), ay: CY + dy * (rr + 3), ex: CX + dx * (rr + 14), ey: CY + dy * (rr + 14),
          right: dx >= 0, delay: delay + Math.round(dur / 2), pct: Math.round(e.value / total * 100), name: e.name });
      }
      acc += len;
    });
    svg += sl;

    // 外圍標籤：左右各自由上到下排，太近就往下推開，避免文字重疊
    [true, false].forEach(function (side) {
      var arr = labels.filter(function (l) { return l.right === side; }).sort(function (a, b) { return a.ey - b.ey; });
      var prev = -999;
      arr.forEach(function (l) {
        l.ly = Math.max(l.ey, prev + 24);
        prev = l.ly;
      });
    });
    labels.forEach(function (l) {
      var tx = l.ex + (l.right ? 8 : -8);
      var nm = l.name.length > 5 ? l.name.slice(0, 5) + '…' : l.name;
      svg += '<g class="lbl" data-i="' + l.i + '" style="transition-delay:' + l.delay + 'ms">' +
        '<polyline points="' + l.ax.toFixed(1) + ',' + l.ay.toFixed(1) + ' ' + l.ex.toFixed(1) + ',' + l.ly.toFixed(1) + ' ' + tx.toFixed(1) + ',' + l.ly.toFixed(1) + '"/>' +
        '<text class="pc" x="' + (tx + (l.right ? 3 : -3)).toFixed(1) + '" y="' + (l.ly - 1).toFixed(1) + '" text-anchor="' + (l.right ? 'start' : 'end') + '">' + l.pct + '%</text>' +
        '<text class="nm" x="' + (tx + (l.right ? 3 : -3)).toFixed(1) + '" y="' + (l.ly + 10).toFixed(1) + '" text-anchor="' + (l.right ? 'start' : 'end') + '">' + esc(nm) + '</text></g>';
    });

    // 環上的小星光（很淡、很慢）
    [24, 78, 133, 198, 252, 318].forEach(function (deg, k) {
      var a2 = deg * Math.PI / 180 - Math.PI / 2, s = k % 2 ? 4 : 5.5, q = s * 0.25;
      svg += '<g transform="translate(' + (CX + Math.cos(a2) * R).toFixed(1) + ' ' + (CY + Math.sin(a2) * R).toFixed(1) + ')">' +
        '<path class="spark" style="animation-delay:' + (1100 + k * 520) + 'ms" fill="#fffaf0" d="M0,' + -s + ' L' + q + ',' + -q + ' L' + s + ',0 L' + q + ',' + q + ' L0,' + s + ' L' + -q + ',' + q + ' L' + -s + ',0 L' + -q + ',' + -q + 'Z"/></g>';
    });

    // 中央資訊（預設顯示總額，點分類後換成該分類）
    svg += '<text style="pointer-events:none" id="cLabel" x="' + CX + '" y="' + (CY - 11) + '" text-anchor="middle" font-size="9" fill="#7a736a" letter-spacing="2">支出</text>';
    svg += '<text id="cVal" x="' + CX + '" y="' + (CY + 10) + '" text-anchor="middle" font-size="17" font-weight="600" fill="#2a2724" style="font-family:var(--serif);pointer-events:none">0</text>';
    svg += '<text style="pointer-events:none" id="cSub" x="' + CX + '" y="' + (CY + 25) + '" text-anchor="middle" font-size="8.5" fill="#7a736a"></text>';
    svg += '<text style="pointer-events:none" id="cSub2" x="' + CX + '" y="' + (CY + 37) + '" text-anchor="middle" font-size="8.5" fill="#7a736a"></text>';
    return svg + '</svg>';
  }

  var cuTimer = null;
  function countUp(el, to, ms) {
    cancelAnimationFrame(cuTimer);
    if (!el) return;
    if (!ms) { el.textContent = num(to); return; }
    var t0 = null;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min((ts - t0) / ms, 1);
      var e = 1 - Math.pow(1 - k, 3);
      el.textContent = num(Math.round(to * e));
      if (k < 1) cuTimer = requestAnimationFrame(step);
    }
    cuTimer = requestAnimationFrame(step);
  }
  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  // 圓環掃出來、標籤淡入、總額數字跳動
  function startAnaAnim() {
    var svg = $('donutSvg');
    if (!svg || !state.ana) return;
    var slices = svg.querySelectorAll('.slice');
    var reduce = reduceMotion();
    var i;
    if (reduce) { for (i = 0; i < slices.length; i++) slices[i].style.transition = 'none'; }
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var k;
        for (k = 0; k < slices.length; k++) {
          slices[k].style.strokeDasharray = slices[k].getAttribute('data-d') + ' ' + slices[k].getAttribute('data-r');
        }
        var ls = svg.querySelectorAll('.lbl');
        for (k = 0; k < ls.length; k++) ls[k].classList.add('in');
      });
    });
    setCenter('支出', state.ana.total, '', '', reduce ? 0 : 900);
  }

  function setCenter(label, val, sub, sub2html, ms) {
    $('cLabel').textContent = label;
    $('cSub').textContent = sub;
    var s2 = $('cSub2');
    s2.textContent = sub2html.text || '';
    s2.setAttribute('fill', sub2html.color || '#7a736a');
    countUp($('cVal'), val, ms);
  }

  function selectSlice(i) {
    var ana = state.ana;
    if (!ana) return;
    if (ana.sel === i) i = -1;
    ana.sel = i;
    var svg = $('donutSvg');
    var gs = svg.querySelectorAll('.sl'), ls = svg.querySelectorAll('.lbl'), k;
    for (k = 0; k < gs.length; k++) {
      var on = Number(gs[k].getAttribute('data-i')) === i;
      gs[k].classList.toggle('pop', on);
      gs[k].classList.toggle('dim', i >= 0 && !on);
    }
    for (k = 0; k < ls.length; k++) {
      ls[k].classList.toggle('dim', i >= 0 && Number(ls[k].getAttribute('data-i')) !== i);
    }
    var rows = document.querySelectorAll('.catrow');
    for (k = 0; k < rows.length; k++) {
      rows[k].classList.toggle('on', i >= 0 && rows[k].getAttribute('data-cat') === ana.entries[i].name);
    }
    var ms = reduceMotion() ? 0 : 450;
    if (i < 0) {
      setCenter('支出', ana.total, '', {}, ms);
      $('donutAct').innerHTML = '';
    } else {
      var e = ana.entries[i];
      var sub2 = {};
      if (e.prev > 0) {
        var d = (e.value - e.prev) / e.prev * 100;
        sub2 = { text: '較上月 ' + (d > 0 ? '▲' : '▼') + Math.abs(Math.round(d)) + '%', color: d > 0 ? '#c4412d' : '#3d5a73' };
      } else if (!e.members) {
        sub2 = { text: '上月沒有紀錄' };
      }
      var nm = e.name.length > 6 ? e.name.slice(0, 6) + '…' : e.name;
      setCenter(nm, e.value, '占 ' + Math.round(e.value / ana.total * 100) + '%　' + e.count + ' 筆', sub2, ms);
      $('donutAct').innerHTML = e.members ? '' : '<button class="link" id="goCat">查看「' + esc(e.name) + '」明細 ›</button>';
    }
    if (navigator.vibrate) { try { navigator.vibrate(6); } catch (x) {} }
  }

  function dailySvg(counted) {
    var n = new Date(state.y, state.m + 1, 0).getDate();
    var sums = [];
    for (var i = 0; i < n; i++) sums.push(0);
    counted.forEach(function (r) { sums[new Date(r.time).getDate() - 1] += r.amount; });
    var max = 0, maxDay = -1;
    sums.forEach(function (v, i) { if (v > max) { max = v; maxDay = i; } });
    var W = 320, H = 100, padX = 6, top = 6, bottom = 18;
    var step = (W - padX * 2) / n;
    var bw = Math.max(step * 0.58, 2);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="每日支出">';
    svg += '<line x1="' + padX + '" y1="' + (H - bottom) + '" x2="' + (W - padX) + '" y2="' + (H - bottom) + '" stroke="#d9d1c1" stroke-width="1"/>';
    sums.forEach(function (v, i) {
      if (!v) return;
      var h = Math.max(Math.round((H - top - bottom) * v / max), 2);
      var x = padX + step * i + (step - bw) / 2;
      svg += '<rect class="grow" style="animation-delay:' + (i * 14) + 'ms" x="' + x.toFixed(2) + '" y="' + (H - bottom - h) + '" width="' + bw.toFixed(2) + '" height="' + h + '" fill="' + (i === maxDay ? '#c4412d' : '#3d5a73') + '" opacity="' + (i === maxDay ? 1 : 0.55) + '"/>';
    });
    var marks = [1, 10, 20, n];
    var drawn = {};
    marks.forEach(function (d) {
      if (drawn[d] || d > n) return;
      drawn[d] = true;
      svg += '<text class="bm" x="' + (padX + step * (d - 1) + step / 2).toFixed(2) + '" y="' + (H - 4) + '">' + d + '</text>';
    });
    svg += '</svg>';
    return { svg: svg, max: max, maxDay: maxDay };
  }

  function renderAnalysis(monthAll, rows, counted, total) {
    var html = '';

    // 近六個月
    var prevIdx = state.y * 12 + state.m - 1;
    var prevTotal = monthTotal(Math.floor(prevIdx / 12), prevIdx % 12);
    var cmp = '';
    if (prevTotal > 0 || total > 0) {
      var d = total - prevTotal;
      cmp = d === 0 ? '與上個月相同' : '較上個月' + (d > 0 ? '多' : '少') + ' ' + money(Math.abs(d));
    }
    html += '<div class="sec"><h3>近六個月</h3><div class="note">' + esc(cmp) + '　·　點長條可切換月份</div>' + sixMonthSvg() + '</div>';

    if (!counted.length) {
      html += '<div class="empty-box">這個月還沒有可分析的消費</div>';
      state.ana = null;
      $('viewAna').innerHTML = html;
      return;
    }

    // 分類
    var byCat = {};
    counted.forEach(function (r) { byCat[r.category] = byCat[r.category] || { v: 0, n: 0 }; byCat[r.category].v += r.amount; byCat[r.category].n++; });
    var names = Object.keys(byCat).sort(function (a, b) { return byCat[b].v - byCat[a].v; });
    var entries = names.map(function (n) { return { name: n, value: byCat[n].v, count: byCat[n].n, color: colorOf(n) }; });
    var pY = Math.floor(prevIdx / 12), pM = prevIdx % 12;
    var prevByCat = {};
    state.rows.forEach(function (r) {
      if (isOn(r) && srcOk(r) && inMonth(r.time, pY, pM)) prevByCat[r.category] = (prevByCat[r.category] || 0) + r.amount;
    });
    var main = [], rest = [];
    entries.forEach(function (e, i) {
      e.prev = prevByCat[e.name] || 0;
      if (i < 6 && e.value / total >= 0.03) main.push(e); else rest.push(e);
    });
    if (rest.length === 1) { main.push(rest[0]); rest = []; }
    if (rest.length) {
      var rv = 0, rc = 0, rp = 0;
      rest.forEach(function (e) { rv += e.value; rc += e.count; rp += e.prev; });
      main.push({ name: '其他', value: rv, count: rc, color: PALETTE[7], prev: rp, members: rest.map(function (e) { return e.name; }) });
    }
    state.ana = { entries: main, total: total, sel: -1 };
    html += '<div class="sec"><h3>分　類</h3><div class="note">點圓環上的分類看重點，再點一次還原</div>' +
      '<div class="donut-box">' + donutSvg(main, total) + '</div><div class="donut-act" id="donutAct"></div>';
    entries.forEach(function (e) {
      html += '<button class="catrow" data-cat="' + esc(e.name) + '"><span class="l"><i style="background:' + e.color + '"></i>' + esc(e.name) + '</span>' +
        '<span class="r">' + num(e.value) + '<small>' + Math.round(e.value / total * 100) + '%　' + e.count + ' 筆</small></span></button>';
    });
    html += '</div>';

    // 每日
    var daily = dailySvg(counted);
    var best = null;
    counted.forEach(function (r) { if (!best || r.amount > best.amount) best = r; });
    html += '<div class="sec"><h3>每日支出</h3>' + daily.svg +
      '<div class="stats">' +
      '<div class="stat"><div class="k">最高單日</div><div class="v">' + num(daily.max) + '</div><div class="s">' + (state.m + 1) + '/' + (daily.maxDay + 1) + '</div></div>' +
      '<div class="stat"><div class="k">最高單筆</div><div class="v">' + num(best.amount) + '</div><div class="s">' + esc(best.store || '（沒有店名）') + '</div></div>' +
      '</div></div>';

    // 商家
    var byStore = {};
    counted.forEach(function (r) {
      if (!r.store) return;
      byStore[r.store] = byStore[r.store] || { v: 0, n: 0 };
      byStore[r.store].v += r.amount;
      byStore[r.store].n++;
    });
    var storeNames = Object.keys(byStore).sort(function (a, b) { return byStore[b].v - byStore[a].v; }).slice(0, 5);
    if (storeNames.length) {
      var smax = byStore[storeNames[0]].v;
      html += '<div class="sec"><h3>商家　前五</h3>';
      storeNames.forEach(function (s, i) {
        html += '<div class="rank"><span class="no">' + (i + 1) + '</span><div class="mid"><div class="nm">' + esc(s) + '</div>' +
          '<div class="ct">共 ' + byStore[s].n + ' 筆</div><div class="thin"><i style="width:' + Math.round(byStore[s].v / smax * 100) + '%"></i></div></div>' +
          '<span class="am">' + num(byStore[s].v) + '</span></div>';
      });
      html += '</div>';
    }

    // 來源（不受來源篩選影響，方便比較）
    var bySrc = {};
    monthAll.filter(isOn).forEach(function (r) { bySrc[r.source] = bySrc[r.source] || { v: 0, n: 0 }; bySrc[r.source].v += r.amount; bySrc[r.source].n++; });
    var srcNames = Object.keys(bySrc).sort(function (a, b) { return bySrc[b].v - bySrc[a].v; });
    if (srcNames.length > 1) {
      var smax2 = bySrc[srcNames[0]].v;
      html += '<div class="sec"><h3>來　源</h3>';
      srcNames.forEach(function (s) {
        html += '<div class="rank"><span class="no"></span><div class="mid"><div class="nm">' + esc(s) + '</div>' +
          '<div class="ct">共 ' + bySrc[s].n + ' 筆</div><div class="thin"><i style="width:' + Math.round(bySrc[s].v / smax2 * 100) + '%"></i></div></div>' +
          '<span class="am">' + num(bySrc[s].v) + '</span></div>';
      });
      html += '</div>';
    }

    $('viewAna').innerHTML = html;
    startAnaAnim();
  }

  /* ---------- 詳細／編輯／新增 ---------- */

  function fillCatList() {
    var seen = {};
    var html = '';
    var all = state.cats.slice();
    state.rows.forEach(function (r) { if (all.indexOf(r.category) < 0) all.push(r.category); });
    all.forEach(function (c) {
      if (c && !seen[c]) { seen[c] = true; html += '<option value="' + esc(c) + '"></option>'; }
    });
    $('catList').innerHTML = html;
    var sh = '';
    state.sources.forEach(function (x) { sh += '<option value="' + esc(x) + '"></option>'; });
    $('srcList').innerHTML = sh;
  }
  function localInputValue(t) {
    var d = new Date(t);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function showPanel(which) {
    $('detailPanel').classList.toggle('hidden', which !== 'detail');
    $('editPanel').classList.toggle('hidden', which !== 'edit');
    $('mask').classList.remove('hidden');
  }
  function closeSheet() {
    $('mask').classList.add('hidden');
    state.editing = null;
  }

  function openDetail(r) {
    state.editing = r;
    var d = new Date(r.time);
    var off = !isOn(r);
    $('dAmt').textContent = money(r.amount);
    $('dAmt').classList.toggle('off', off);
    $('dStore').textContent = r.store || '（沒有店名）';

    // 本月同店紀錄
    var sameN = 0, sameV = 0;
    if (r.store) {
      state.rows.forEach(function (x) {
        if (x.store === r.store && isOn(x) && inMonth(x.time, d.getFullYear(), d.getMonth())) { sameN++; sameV += x.amount; }
      });
    }
    var rowsHtml = '';
    function add(k, v) { rowsHtml += '<div class="drow"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
    add('日期', d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '（' + WEEK[d.getDay()] + '）');
    add('時間', pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()));
    add('分類', '<span class="cat-dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:' + colorOf(r.category) + '"></span>' + esc(r.category));
    add('來源', esc(r.source));
    if (r.card) add('卡片', esc(r.card));
    add('狀態', off ? '<span style="color:var(--shu)">已取消</span>' : '正常');
    if (sameN > 1) add('本月同店', sameN + ' 筆，合計 ' + money(sameV));
    $('dRows').innerHTML = rowsHtml;
    showPanel('detail');
  }

  function openEdit(mode, r) {
    state.mode = mode;
    state.editing = r || null;
    fillCatList();
    var isAdd = (mode === 'add');
    $('editTitle').textContent = isAdd ? '記　一　筆' : '編　輯';
    $('statusField').classList.toggle('hidden', isAdd);
    $('addExtra').classList.toggle('hidden', !isAdd);
    $('deleteBtn').classList.toggle('hidden', isAdd);
    if (isAdd) {
      $('fAmount').value = '';
      $('fStore').value = '';
      $('fCat').value = '';
      $('fSource').value = state.sources[0] || '現金';
      $('fTime').value = localInputValue(Date.now());
      $('fStatus').value = '正常';
    } else {
      $('fAmount').value = r.amount;
      $('fStore').value = r.store;
      $('fCat').value = r.category;
      $('fStatus').value = isOn(r) ? '正常' : '已取消';
    }
    showPanel('edit');
    if (isAdd) { setTimeout(function () { $('fAmount').focus(); }, 80); }
  }

  function afterAction(res, okMsg) {
    if (!res || !res.ok) {
      toast('失敗：' + ((res && res.msg) || '未知錯誤'));
      return;
    }
    if (res.result === 'stale') {
      toast('資料已經變動，已重新載入，請再操作一次');
      closeSheet();
      refresh();
    } else if (res.result === 'bad amount') {
      toast('金額不對，請輸入數字');
    } else {
      toast(okMsg);
      closeSheet();
      refresh();
    }
  }

  function save() {
    var amount = parseFloat($('fAmount').value);
    if (!amount || amount <= 0) { toast('請輸入金額'); return; }
    var btn = $('saveBtn');
    btn.disabled = true;
    var p;
    if (state.mode === 'add') {
      var t = $('fTime').value ? new Date($('fTime').value).getTime() : Date.now();
      p = apiPost({
        action: 'add', amount: amount, store: $('fStore').value,
        category: $('fCat').value, source: $('fSource').value, time: t
      }).then(function (res) { afterAction(res, '已新增'); });
    } else {
      var r = state.editing;
      p = apiPost({
        action: 'update', row: r.row, time: r.time, oldAmount: r.amount,
        amount: amount, store: $('fStore').value, category: $('fCat').value, status: $('fStatus').value
      }).then(function (res) { afterAction(res, '已儲存'); });
    }
    p.catch(function () { toast('連不上後端'); }).then(function () { btn.disabled = false; });
  }

  function remove() {
    var r = state.editing;
    if (!r) return;
    if (!window.confirm('確定刪除這筆嗎？刪除後無法復原。')) return;
    var btn = $('deleteBtn');
    btn.disabled = true;
    apiPost({ action: 'delete', row: r.row, time: r.time, oldAmount: r.amount })
      .then(function (res) { afterAction(res, '已刪除'); })
      .catch(function () { toast('連不上後端'); })
      .then(function () { btn.disabled = false; });
  }

  /* ---------- 事件 ---------- */

  function gotoMonth(y, m) {
    state.y = y;
    state.m = m;
    state.cat = '';
    render();
    window.scrollTo(0, 0);
  }

  function bind() {
    $('loginBtn').addEventListener('click', doLogin);
    $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

    $('prevBtn').addEventListener('click', function () {
      var y = state.y, m = state.m - 1;
      if (m < 0) { m = 11; y--; }
      gotoMonth(y, m);
    });
    $('nextBtn').addEventListener('click', function () {
      var now = new Date();
      if (state.y === now.getFullYear() && state.m === now.getMonth()) return;
      var y = state.y, m = state.m + 1;
      if (m > 11) { m = 0; y++; }
      gotoMonth(y, m);
    });
    $('refreshBtn').addEventListener('click', refresh);
    $('fab').addEventListener('click', function () { openEdit('add', null); });

    $('tabList').addEventListener('click', function () { state.tab = 'list'; render(); });
    $('tabAna').addEventListener('click', function () { state.tab = 'ana'; render(); });

    $('sourceChips').addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      state.source = b.getAttribute('data-source');
      state.cat = '';
      render();
    });
    $('clearCat').addEventListener('click', function () { state.cat = ''; render(); });

    $('list').addEventListener('click', function (e) {
      var b = e.target.closest('.item');
      if (!b) return;
      var row = Number(b.getAttribute('data-row'));
      for (var i = 0; i < state.rows.length; i++) {
        if (state.rows[i].row === row) { openDetail(state.rows[i]); return; }
      }
    });

    $('viewAna').addEventListener('click', function (e) {
      var sl = e.target.closest('.sl');
      if (sl) { selectSlice(Number(sl.getAttribute('data-i'))); return; }
      if (e.target.id === 'goCat' && state.ana && state.ana.sel >= 0) {
        state.cat = state.ana.entries[state.ana.sel].name;
        state.tab = 'list';
        render();
        window.scrollTo(0, 0);
        return;
      }
      var g = e.target.closest('.barg');
      if (g) {
        var p = g.getAttribute('data-ym').split('-');
        gotoMonth(Number(p[0]), Number(p[1]));
        return;
      }
      var c = e.target.closest('.catrow');
      if (c) {
        state.cat = c.getAttribute('data-cat');
        state.tab = 'list';
        render();
        window.scrollTo(0, 0);
      }
    });

    $('editBtn').addEventListener('click', function () { openEdit('edit', state.editing); });
    $('dCloseBtn').addEventListener('click', closeSheet);
    $('saveBtn').addEventListener('click', save);
    $('deleteBtn').addEventListener('click', remove);
    $('cancelBtn').addEventListener('click', function () {
      if (state.mode === 'edit' && state.editing) openDetail(state.editing); else closeSheet();
    });
    $('mask').addEventListener('click', function (e) { if (e.target === $('mask')) closeSheet(); });
  }

  function doLogin() {
    var pw = $('pw').value.trim();
    var api = $('apiInput').value.trim();
    if (!pw) { $('loginErr').textContent = '請輸入密碼'; return; }
    if (api) lsSet(LS_API, api); else lsDel(LS_API);
    state.key = pw;
    lsSet(LS_KEY, pw);
    $('pw').value = '';
    $('loginErr').textContent = '';
    refresh();
  }

  function init() {
    var now = new Date();
    state.y = now.getFullYear();
    state.m = now.getMonth();
    bind();
    var k = lsGet(LS_KEY);
    if (k) {
      state.key = k;
      refresh();
    } else {
      showLogin('');
    }
  }

  init();
})();
</script>
</body>
</html>
