<style>
:root {
  --paper: #f5f1e8; --paper2: #ece6d8; --ink: #2a2724; --sub: #655d53; --line: #d9d1c1;
  --shu: #b53a27; --ai: #3d5a73; --on-ink: #f5f1e8; --sheet: #f5f1e8; --mask: rgba(42,39,36,.45);
  --serif: "Hiragino Mincho ProN", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --tab: calc(68px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1c1b19; --paper2: #2a2823; --ink: #ece7dc; --sub: #a79f91; --line: #3b372f;
    --shu: #e27a64; --ai: #92b4d0; --on-ink: #1c1b19; --sheet: #23211e; --mask: rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); font-size: 1rem; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; padding-bottom: calc(var(--tab) + 28px); }
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; text-align: left; padding: 0; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; border-radius: 4px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 520px; margin: 0 auto; padding: 0 20px; }
.serif { font-family: var(--serif); }

/* 登入 */
#login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px; }
.login-box { width: 100%; max-width: 320px; text-align: center; }
.login-box h1 { font-family: var(--serif); font-weight: 600; font-size: 1.75rem; letter-spacing: .3em; margin: 0 0 6px .3em; }
.login-box .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--shu); margin: 0 auto 22px; }
.login-box p { margin: 0 0 18px; color: var(--sub); letter-spacing: .12em; }
.input { width: 100%; min-height: 48px; background: transparent; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; padding: 10px 2px; outline: none; font-size: 1rem; }
.input:focus { border-bottom: 2px solid var(--shu); }
select.input { appearance: none; -webkit-appearance: none; }
.btn { display: block; width: 100%; min-height: 52px; text-align: center; background: var(--ink); color: var(--on-ink); padding: 14px; margin-top: 18px; letter-spacing: .3em; border-radius: 4px; }
.btn.line { background: transparent; color: var(--ink); border: 1px solid var(--ink); margin-top: 10px; }
.btn.shu { background: transparent; color: var(--shu); border: 1px solid var(--shu); margin-top: 10px; }
.btn:disabled { opacity: .5; }
.err { color: var(--shu); min-height: 24px; margin-top: 10px; }
.ver { font-size: .75rem; letter-spacing: .1em; color: var(--sub); margin-top: 20px; }
details.adv { margin-top: 22px; color: var(--sub); font-size: .85rem; text-align: left; }
details.adv summary { text-align: center; cursor: pointer; min-height: 44px; display: flex; align-items: center; justify-content: center; }
details.adv .input { font-size: .85rem; }

/* 頂部（月份切換，固定在上方） */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line); }
.month { display: flex; align-items: center; justify-content: center; }
.month b { font-family: var(--serif); font-weight: 600; font-size: 1.15rem; letter-spacing: .12em; min-width: 140px; text-align: center; }
.arrow { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--ink); text-align: center; }
.arrow:disabled { opacity: .25; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 20px 10px; scrollbar-width: none; max-width: 520px; margin: 0 auto; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line); color: var(--sub); font-size: .9rem; display: flex; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.up { color: var(--shu); } .down { color: var(--ai); }

/* 總覽 */
.hero { padding: 26px 0 18px; text-align: center; }
.cap { font-size: .8rem; letter-spacing: .3em; color: var(--sub); }
.hero-num { font-family: var(--serif); font-size: 2.9rem; font-weight: 600; line-height: 1.15; margin: 4px 0; }
.hero-num small { font-size: 1rem; font-weight: 400; margin-right: 6px; color: var(--sub); }
.hero-sub { color: var(--sub); font-size: .9rem; }
.hero-sub b { color: var(--ink); font-weight: 500; }
.card { border-top: 1px solid var(--line); padding: 18px 0; }
.card h3 { font-family: var(--serif); font-size: .95rem; letter-spacing: .25em; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
.card h3::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--shu); }
.meter { height: 10px; background: var(--paper2); border-radius: 5px; overflow: hidden; margin: 8px 0 10px; }
.meter i { display: block; height: 100%; background: var(--ai); border-radius: 5px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.meter.warn i { background: var(--shu); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: .95rem; padding: 3px 0; }
.kv span:first-child { color: var(--sub); }
.linkbtn { color: var(--shu); min-height: 44px; display: inline-flex; align-items: center; font-size: .95rem; letter-spacing: .08em; }
.todo { width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid var(--shu); border-radius: 8px; color: var(--ink); }

.week { display: flex; align-items: flex-end; gap: 8px; height: 84px; margin-top: 6px; }

.wk.today i { background: var(--shu); opacity: 1; }
.wk.today { color: var(--ink); font-weight: 600; }

/* 明細 */
.search { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--ink); margin: 14px 0 4px; }
.search input { flex: 1; border: 0; background: transparent; min-height: 48px; outline: none; font-size: 1rem; }
.search svg { width: 20px; height: 20px; flex: none; stroke: var(--sub); }
.list-sum { font-size: .85rem; color: var(--sub); padding: 8px 0 0; display: flex; justify-content: space-between; }
.day { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 2px; font-size: .8rem; letter-spacing: .1em; color: var(--sub); }
.item { width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:active { background: var(--paper2); }
.i-main { min-width: 0; flex: 1; }

.i-meta { margin-top: 1px; font-size: .78rem; color: var(--sub); }
.cat-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.i-amt { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; white-space: nowrap; }
.item.off .i-store, .item.off .i-amt { text-decoration: line-through; color: var(--sub); }
.off-mark { color: var(--shu); margin-left: 6px; }

/* 分析 */
.sec { margin-top: 30px; }
.sec h3 { font-family: var(--serif); font-weight: 600; font-size: .95rem; letter-spacing: .25em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
.sec h3::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--shu); }
.sec .note { font-size: .78rem; color: var(--sub); margin-bottom: 8px; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--sans); }
.bv { font-size: 9px; fill: var(--sub); text-anchor: middle; }
.bm { font-size: 10px; fill: var(--sub); text-anchor: middle; }
.bm.on { fill: var(--ink); font-weight: 600; }
.barg { cursor: pointer; }
.catrow { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.catrow .l { display: flex; align-items: center; gap: 10px; }
.catrow i { width: 9px; height: 9px; border-radius: 50%; }
.catrow .r { font-family: var(--serif); font-weight: 600; }
.catrow .r small { font-family: var(--sans); font-weight: 400; color: var(--sub); margin-left: 8px; font-size: .75rem; }
.catrow.on { background: var(--paper2); }
.stats { display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 10px; }
.stat { flex: 1; padding: 12px 0; text-align: center; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .k { font-size: .7rem; letter-spacing: .15em; color: var(--sub); }
.stat .v { font-family: var(--serif); font-weight: 600; font-size: 1rem; margin-top: 2px; }
.stat .s { font-size: .7rem; color: var(--sub); }
.rank { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.rank .no { font-family: var(--serif); width: 18px; color: var(--shu); font-weight: 600; }
.rank .mid { flex: 1; min-width: 0; }
.rank .nm { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .ct { font-size: .75rem; color: var(--sub); }
.rank .am { font-family: var(--serif); font-weight: 600; }
.thin { height: 3px; background: var(--paper2); margin-top: 6px; }
.thin i { display: block; height: 100%; background: var(--ai); }
.donut-box { margin-top: 4px; }
.sl { cursor: pointer; transition: transform .3s cubic-bezier(.3,1.5,.5,1), opacity .25s; }
.sl.pop { transform: translate(var(--dx), var(--dy)); }
.sl.dim { opacity: .28; }
.lbl { opacity: 0; transition: opacity .45s; pointer-events: none; }
.lbl.in { opacity: 1; }
.lbl.dim.in { opacity: .22; }
.lbl .pc { font-size: 10px; font-weight: 600; fill: var(--ink); }
.lbl .nm { font-size: 9px; fill: var(--sub); }
.lbl polyline { fill: none; stroke: var(--sub); stroke-width: .8; opacity: .6; }
.spark { transform-box: fill-box; transform-origin: center; opacity: 0; animation: tw 3.4s ease-in-out infinite; pointer-events: none; }
@keyframes tw { 0%, 100% { opacity: 0; transform: scale(.25) rotate(0deg); } 50% { opacity: .9; transform: scale(1) rotate(45deg); } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.donut-act { text-align: center; min-height: 48px; }
.link { color: var(--shu); font-size: .95rem; letter-spacing: .08em; min-height: 48px; padding: 6px 12px; text-align: center; }

/* 底部分頁列（拇指區） */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--line); height: var(--tab); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 520px; margin: 0 auto; height: 68px; display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: center; }

.tb svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tb[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tb[aria-selected="true"] svg { stroke: var(--shu); }
.addbtn { justify-self: center; width: 64px; height: 64px; margin-top: -22px; border-radius: 50%; background: var(--shu); color: #fff; font-size: 2rem; font-weight: 300; line-height: 1; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 0 0 5px var(--paper), 0 0 0 6px var(--line); }
.addbtn:active { transform: scale(.94); }

/* 面板 */
.mask { position: fixed; inset: 0; background: var(--mask); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; background: var(--sheet); border-radius: 16px 16px 0 0; padding: 20px 22px calc(18px + env(safe-area-inset-bottom)); max-height: 94vh; overflow-y: auto; }
.sheet h2 { font-family: var(--serif); font-weight: 600; font-size: 1rem; letter-spacing: .3em; margin: 0 0 14px; text-align: center; outline: none; }
.d-amt { font-family: var(--serif); font-size: 2.2rem; font-weight: 600; text-align: center; margin: 4px 0 2px; }
.d-amt.off { text-decoration: line-through; color: var(--sub); }
.d-store { text-align: center; color: var(--sub); margin-bottom: 16px; }
.drow { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.drow:last-of-type { border-bottom: 1px solid var(--line); }
.drow .k { color: var(--sub); font-size: .85rem; letter-spacing: .1em; white-space: nowrap; }
.drow .v { text-align: right; word-break: break-all; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .8rem; letter-spacing: .12em; color: var(--sub); }
.row2 { display: flex; gap: 18px; }
.row2 .field { flex: 1; }
.check { display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: .95rem; }
.check input { width: 22px; height: 22px; accent-color: var(--shu); }

/* 記帳面板 */
.a-amt { font-family: var(--serif); font-size: 3rem; font-weight: 600; text-align: center; min-height: 64px; font-variant-numeric: tabular-nums; }
.a-amt.empty { color: var(--sub); opacity: .6; }
.a-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 10px; }
.a-cat { min-height: 56px; border-radius: 12px; border: 1px solid var(--line); text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 1rem; }
.a-cat:active { background: var(--ink); color: var(--on-ink); }
.a-cat.more { color: var(--sub); }
.a-src { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
.a-src::-webkit-scrollbar { display: none; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { min-height: 56px; border-radius: 12px; background: var(--paper2); font-size: 1.5rem; font-weight: 300; text-align: center; display: flex; align-items: center; justify-content: center; }
.key:active { background: var(--line); }
.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* 整理未分類 */
.tidy { padding: 14px 0; border-bottom: 1px solid var(--line); }
.tidy .nm { font-size: 1rem; }
.tidy .ct { font-size: .78rem; color: var(--sub); margin-bottom: 8px; }
.tidy .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.more-item { width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-size: 1rem; }
.more-item span:last-child { color: var(--sub); font-size: .85rem; }

#toast { position: fixed; left: 50%; bottom: calc(var(--tab) + 18px); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 12px 18px; border-radius: 8px; font-size: .95rem; z-index: 60; max-width: 90%; display: flex; gap: 16px; align-items: center; }
#toast button { color: var(--on-ink); font-weight: 600; text-decoration: underline; min-height: 40px; padding: 0 4px; }
.imp-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.imp-row span:first-child { color: var(--sub); white-space: nowrap; }
.imp-row b { font-family: var(--serif); }
@media (prefers-reduced-motion: reduce) { .grow, .spark { animation: none; } .spark { display: none; } .sl, .lbl, .meter i { transition: none; } }
</style>

<body>

<div id="login" class="hidden">
  <div class="login-box">
    <h1>吱吱記帳</h1>
    <div class="dot"></div>
    <p>請輸入看帳密碼</p>

    <button id="loginBtn" class="btn">進　入</button>

    <details class="adv">
      <summary>後端網址（一般不用改）</summary>

</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="month">
      <button id="prevBtn" class="arrow" aria-label="上個月">‹</button>
      <b id="monthLabel" aria-live="polite"></b>
      <button id="nextBtn" class="arrow" aria-label="下個月">›</button>
    </div>
    <div class="chips hidden" id="sourceChips" role="group" aria-label="依來源篩選"></div>
  </header>

  <main class="wrap">
    <section id="vHome" role="tabpanel" aria-label="總覽"></section>

    <section id="vList" role="tabpanel" aria-label="明細" class="hidden">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <label class="sr" for="qInput">搜尋店名、分類或金額</label>
        <input id="qInput" type="search" placeholder="搜尋店名、分類、金額" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="chips" id="catChips" role="group" aria-label="依分類篩選" style="padding:8px 0"></div>
      <div class="list-sum" id="listSum"></div>
      <div id="list"></div>

    <section id="viewAna" role="tabpanel" aria-label="分析" class="hidden"></section>

      <button class="tb" id="tbList" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>明細</button>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19V11M12 19V5M18 19v-6"/></svg>分析</button>
      <button class="tb" id="tbMore" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg>更多</button>
    </div>
  </nav>
</div>

<div id="mask" class="mask hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

    <div id="pDetail" class="hidden">
      <h2 tabindex="-1" id="sheetTitle">詳　細</h2>
      <div class="d-amt" id="dAmt"></div>
      <div class="d-store" id="dStore"></div>
      <div id="dRows"></div>
      <button id="editBtn" class="btn">編　輯</button>
      <button class="btn line" data-close>關　閉</button>
    </div>

    <div id="pEdit" class="hidden">
      <h2 tabindex="-1" id="editTitle">編　輯</h2>

        <div class="field"><label for="fAmount">金額</label><input id="fAmount" class="input" type="number" inputmode="decimal" min="0" step="any"></div>

<script>
(function () {
  'use strict';

  var DEFAULT_API = 'https://script.google.com/macros/s/AKfycbxPkzgIjUT7O4YMPVPjFi5u9JsZL_WWcNhAgVXnH_Erg5Z3jWo2ZgTnpiZTRGUYZqun/exec';
  var PAGE_VERSION = '5.1';
  var LS_KEY = 'zz_expense_key';
  var LS_API = 'zz_expense_api';
  var LS_CACHE = 'zz_expense_cache';
  var LS_SRC = 'zz_last_source';
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var PALETTE = ['#3d5a73', '#b8603e', '#7d8f69', '#c9a24a', '#8a6f9e', '#6d9a9a', '#a85a6a', '#8c8577'];

  var state = {
    key: '', rows: [], cats: [], budget: 0,
    y: 0, m: 0, tab: 'home',
    source: '全部', cat: '', q: '',
    mode: 'edit', editing: null, busy: false,
    ana: null, catColors: {}, serverColors: {}, sources: [], backendVersion: '',
    loadedAt: 0, lastAdd: null, addBuf: '', addSource: '', addAll: false, panel: '', opener: null
  };

  function $(id) { return document.getElementById(id); }
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function num(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function money(n) { return 'NT$ ' + num(n); }
  function shortNum(n) {
    if (!n) return '';
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '萬';
    return Math.round(n).toLocaleString('en-US');
  }
  function getApi() { return lsGet(LS_API) || DEFAULT_API; }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  /* ---------- 後端 ---------- */

  function apiList() {
    return fetch(getApi() + '?action=list&key=' + encodeURIComponent(state.key)).then(function (r) { return r.json(); });
  }
  function apiPost(obj) {
    obj.key = state.key;
    return fetch(getApi(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(obj)
    }).then(function (r) { return r.json(); });
  }

  /* ---------- 提示 ---------- */

  var toastTimer = null;
  function toast(msg, undoFn) {
    var t = $('toast');
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (undoFn ? '<button id="undoBtn">復原</button>' : '');
    t.classList.remove('hidden');
    if (undoFn) $('undoBtn').addEventListener('click', function () { t.classList.add('hidden'); undoFn(); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add('hidden'); }, undoFn ? 5000 : 3000);
  }
  function buzz() { if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} } }

  /* ---------- 版本與登入 ---------- */

  function versionText() {
    return '網頁 v' + PAGE_VERSION + (state.backendVersion ? '　·　後端 v' + state.backendVersion : '');
  }
  function showLogin(msg) {
    $('verLogin').textContent = '網頁 v' + PAGE_VERSION;
    fetch(getApi()).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.version) { state.backendVersion = d.version; $('verLogin').textContent = versionText(); }
    }).catch(function () {});
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('loginErr').textContent = msg || '';
    $('apiInput').value = lsGet(LS_API);
  }
  function showApp() {
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
  }
  function doLogin() {
    var pw = $('pw').value.trim();
    var api = $('apiInput').value.trim();
    if (!pw) { $('loginErr').textContent = '請輸入密碼'; return; }
    if (api) lsSet(LS_API, api); else lsDel(LS_API);
    state.key = pw;
    lsSet(LS_KEY, pw);
    $('pw').value = '';
    $('loginErr').textContent = '';
    refresh();
  }
  function logout() {
    lsDel(LS_KEY); lsDel(LS_CACHE);
    state.key = ''; state.rows = [];
    closeSheet();
    showLogin('');
  }

  /* ---------- 載入（先顯示上次快取，再背景更新） ---------- */

  function applyData(d) {
    state.rows = d.rows || [];
    state.cats = d.categories || [];
    state.serverColors = d.colors || {};
    state.sources = d.sources || [];
    state.budget = Number(d.budget) || 0;
    state.backendVersion = d.version || '';
    state.loadedAt = Date.now();
    buildCatColors();
  }
  function refresh(quiet) {
    if (state.busy) return;
    state.busy = true;
    apiList().then(function (d) {
      if (!d || !d.ok) {
        if (d && d.msg === 'unauthorized') {
          lsDel(LS_KEY); lsDel(LS_CACHE);
          state.key = '';
          showLogin('密碼不對');
        } else if (!quiet) {
          toast('讀取失敗：' + ((d && d.msg) || '未知錯誤'));
        }
        return;
      }
      applyData(d);
      lsSet(LS_CACHE, JSON.stringify(d));
      showApp();
      render();
      if (state.panel === 'tidy') buildTidy();
      if (state.panel === 'more') buildMore();
    }).catch(function () {
      if (!quiet) toast('連不上後端，目前顯示的是上次的資料');
    }).then(function () { state.busy = false; });
  }

  function buildCatColors() {
    var names = [];
    state.rows.forEach(function (r) { if (names.indexOf(r.category) < 0) names.push(r.category); });
    state.cats.forEach(function (c) { if (names.indexOf(c) < 0) names.push(c); });
    names.sort();
    state.catColors = {};
    names.forEach(function (n, i) { state.catColors[n] = state.serverColors[n] || PALETTE[i % PALETTE.length]; });
  }
  function colorOf(c) { return state.catColors[c] || PALETTE[7]; }

  /* ---------- 計算 ---------- */

  function inMonth(t, y, m) { var d = new Date(t); return d.getFullYear() === y && d.getMonth() === m; }
  function srcOk(r) { return state.source === '全部' || r.source === state.source; }
  function isOn(r) { return r.status !== '已取消'; }
  function monthTotal(y, m) {
    var s = 0;
    state.rows.forEach(function (r) { if (isOn(r) && srcOk(r) && inMonth(r.time, y, m)) s += r.amount; });
    return s;
  }
  function sumMonthAll(y, m) {
    var s = 0;
    state.rows.forEach(function (r) { if (isOn(r) && inMonth(r.time, y, m)) s += r.amount; });
    return s;
  }
  function findRow(id) {
    for (var i = 0; i < state.rows.length; i++) if (state.rows[i].row === id) return state.rows[i];
    return null;
  }

  /* ---------- 主畫面調度 ---------- */

  function render() {
    var now = new Date();
    var isCurrent = (state.y === now.getFullYear() && state.m === now.getMonth());
    $('monthLabel').textContent = state.y + '年' + (state.m + 1) + '月';
    $('nextBtn').disabled = isCurrent;

    var tabs = { home: 'tbHome', list: 'tbList', ana: 'tbAna' };
    Object.keys(tabs).forEach(function (k) { $(tabs[k]).setAttribute('aria-selected', state.tab === k ? 'true' : 'false'); });
    $('vHome').classList.toggle('hidden', state.tab !== 'home');
    $('vList').classList.toggle('hidden', state.tab !== 'list');
    $('viewAna').classList.toggle('hidden', state.tab !== 'ana');

    var monthAll = state.rows.filter(function (r) { return inMonth(r.time, state.y, state.m); });

    // 來源篩選只在明細與分析出現
    var sources = ['全部'];
    monthAll.forEach(function (r) { if (sources.indexOf(r.source) < 0) sources.push(r.source); });
    if (sources.indexOf(state.source) < 0) state.source = '全部';
    var showChips = state.tab !== 'home' && sources.length > 2;
    $('sourceChips').classList.toggle('hidden', !showChips);
    var ch = '';
    sources.forEach(function (s) {
      ch += '<button class="chip" aria-pressed="' + (s === state.source) + '" data-source="' + esc(s) + '">' + esc(s) + '</button>';
    });
    $('sourceChips').innerHTML = ch;

    var rows = monthAll.filter(srcOk);
    var counted = rows.filter(isOn);
    var total = 0;
    counted.forEach(function (r) { total += r.amount; });

    if (state.tab === 'home') renderHome(now, isCurrent);
    else if (state.tab === 'list') renderList(rows);
    else renderAnalysis(monthAll, rows, counted, total);
  }

  /* ---------- 總覽 ---------- */

  function itemHtml(r, withDate) {
    var d = new Date(r.time);
    var off = !isOn(r);
    var when = (withDate ? (d.getMonth() + 1) + '/' + d.getDate() + '　' : '') + pad(d.getHours()) + ':' + pad(d.getMinutes());
    return '<button class="item' + (off ? ' off' : '') + '" data-row="' + r.row + '" aria-label="' + esc((r.store || '沒有店名') + '，' + r.amount + '元，' + r.category + (off ? '，已取消' : '')) + '">' +
      '<div class="i-main"><div class="i-store' + (r.store ? '' : ' empty') + '">' + esc(r.store || '（沒有店名）') + '</div>' +
      '<div class="i-meta">' + when + '　·　<span class="cat-dot" style="background:' + colorOf(r.category) + '"></span>' + esc(r.category) +
      '　·　' + esc(r.source) + (off ? '<span class="off-mark">已取消</span>' : '') + '</div></div>' +
      '<div class="i-amt">' + num(r.amount) + '</div></button>';
  }

  function uncategorized() {
    var map = {}, list = [];
    state.rows.forEach(function (r) {
      if (isOn(r) && r.category === '未分類' && r.store) {
        if (!map[r.store]) { map[r.store] = { store: r.store, n: 0, v: 0 }; list.push(map[r.store]); }
        map[r.store].n++; map[r.store].v += r.amount;
      }
    });
    list.sort(function (a, b) { return b.n - a.n || b.v - a.v; });
    return list;
  }

  function renderHome(now, isCurrent) {
    var monthRows = state.rows.filter(function (r) { return isOn(r) && inMonth(r.time, state.y, state.m); });
    var total = 0, today = 0, todayN = 0;
    monthRows.forEach(function (r) {
      total += r.amount;
      if (isCurrent && new Date(r.time).getDate() === now.getDate()) { today += r.amount; todayN++; }
    });
    var pIdx = state.y * 12 + state.m - 1;
    var prevTotal = sumMonthAll(Math.floor(pIdx / 12), pIdx % 12);
    var days = isCurrent ? now.getDate() : new Date(state.y, state.m + 1, 0).getDate();
    var dim = new Date(state.y, state.m + 1, 0).getDate();

    var h = '<div class="hero"><div class="cap">' + (isCurrent ? '本月支出' : (state.m + 1) + '月支出') + '</div>' +
      '<div class="hero-num"><small>NT$</small>' + num(total) + '</div><div class="hero-sub"><b>' + monthRows.length + '</b> 筆　日均 <b>' + num(Math.round(total / (days || 1))) + '</b>';
    if (prevTotal > 0) {
      var diff = (total - prevTotal) / prevTotal * 100;
      h += '　較上月 <b class="' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '▲ 多' : '▼ 少') + Math.abs(Math.round(diff)) + '%</b>';
    }
    h += '</div></div>';

    // 預算
    h += '<div class="card"><h3>預　算</h3>';
    if (state.budget > 0) {
      var pct = total / state.budget * 100;
      var left = state.budget - total;
      var warn = pct >= 90;
      h += '<div class="meter' + (warn ? ' warn' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.min(Math.round(pct), 100) + '" aria-label="本月預算使用比例"><i style="width:' + Math.min(pct, 100).toFixed(1) + '%"></i></div>' +
        '<div class="kv"><span>預算</span><span>' + money(state.budget) + '</span></div>' +
        '<div class="kv"><span>已用</span><span>' + Math.round(pct) + '%' + (pct >= 100 ? '　已超出' : pct >= 90 ? '　快用完了' : '') + '</span></div>';
      if (left >= 0) {
        h += '<div class="kv"><span>還剩</span><span>' + money(left) + '</span></div>';
        if (isCurrent) {
          var daysLeft = dim - now.getDate() + 1;
          h += '<div class="kv"><span>每天可用</span><span>' + money(Math.floor(left / daysLeft)) + '（剩 ' + daysLeft + ' 天）</span></div>';
        }
      } else {
        h += '<div class="kv"><span>超出</span><span class="up">' + money(-left) + '</span></div>';
      }
      h += '<button class="linkbtn" id="hBudget">調整預算</button>';
    } else {
      h += '<div class="hero-sub" style="text-align:left">還沒有設定每月預算。設定後這裡會顯示還剩多少、每天可以花多少。</div><button class="linkbtn" id="hBudget">設定每月預算 ›</button>';
    }
    h += '</div>';

    // 今天
    if (isCurrent) {
      h += '<div class="card"><h3>今　天</h3><div class="kv"><span>今天花了</span><span><b class="serif" style="font-size:1.2rem">' + money(today) + '</b>　' + todayN + ' 筆</span></div></div>';
    }

    // 待整理
    var un = uncategorized();
    if (un.length) {
      var cnt = 0;
      un.forEach(function (u) { cnt += u.n; });
      h += '<div class="card"><button class="todo" id="hTidy"><span>有 <b>' + cnt + '</b> 筆還沒分類（' + un.length + ' 家店）</span><span>整理 ›</span></button></div>';
    }

    // 近 7 天
    var wk = '';
    var maxd = 0, vals = [];
    for (var i = 6; i >= 0; i--) {
      var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var s = 0;
      state.rows.forEach(function (r) { if (isOn(r) && dayKey(new Date(r.time)) === dayKey(d0)) s += r.amount; });
      vals.push({ d: d0, v: s });
      if (s > maxd) maxd = s;
    }
    vals.forEach(function (x, k) {
      var hh = maxd ? Math.max(Math.round(x.v / maxd * 56), x.v ? 3 : 2) : 2;
      wk += '<div class="wk' + (k === 6 ? ' today' : '') + '" role="img" aria-label="' + (x.d.getMonth() + 1) + '月' + x.d.getDate() + '日 ' + x.v + '元"><i style="height:' + hh + 'px"></i>' + WEEK[x.d.getDay()] + '</div>';
    });
    h += '<div class="card"><h3>近七天</h3><div class="week">' + wk + '</div></div>';

    // 最近
    var recent = state.rows.slice().sort(function (a, b) { return b.time - a.time; }).slice(0, 5);
    h += '<div class="card"><h3>最　近</h3>';
    recent.forEach(function (r) { h += itemHtml(r, true); });
    if (!recent.length) h += '<div class="empty-box">按下方「＋」記第一筆</div>';
    else h += '<button class="linkbtn" id="hAll">全部明細 ›</button>';
    h += '</div>';

    $('vHome').innerHTML = h;
  }

  /* ---------- 明細 ---------- */

  function renderList(rows) {
    var names = {};
    rows.forEach(function (r) { names[r.category] = (names[r.category] || 0) + 1; });
    if (state.cat && !names[state.cat]) state.cat = '';
    var cl = Object.keys(names).sort(function (a, b) { return names[b] - names[a]; });
    var ch = '<button class="chip" aria-pressed="' + (!state.cat) + '" data-cat="">全部分類</button>';
    cl.forEach(function (c) {
      ch += '<button class="chip" aria-pressed="' + (state.cat === c) + '" data-cat="' + esc(c) + '"><span class="cat-dot" style="background:' + colorOf(c) + '"></span>' + esc(c) + '</button>';
    });
    $('catChips').innerHTML = ch;

    var q = state.q.trim().toLowerCase();
    var list = rows.filter(function (r) {
      if (state.cat && r.category !== state.cat) return false;
      if (!q) return true;
      return (r.store + ' ' + r.category + ' ' + r.source + ' ' + r.card + ' ' + r.amount).toLowerCase().indexOf(q) >= 0;
    });
    list.sort(function (a, b) { return b.time - a.time; });

    var sum = 0, n = 0, dayTotals = {};
    list.forEach(function (r) {
      if (!isOn(r)) return;
      sum += r.amount; n++;
      var k = dayKey(new Date(r.time));
      dayTotals[k] = (dayTotals[k] || 0) + r.amount;
    });
    $('listSum').innerHTML = '<span>' + (q || state.cat ? '符合 ' : '共 ') + n + ' 筆</span><span>合計 ' + money(sum) + '</span>';

    var html = '', cur = '';
    list.forEach(function (r) {
      var d = new Date(r.time), k = dayKey(d);
      if (k !== cur) {
        cur = k;
        html += '<div class="day"><span>' + (d.getMonth() + 1) + '月' + d.getDate() + '日　' + WEEK[d.getDay()] + '</span><span>' + money(dayTotals[k] || 0) + '</span></div>';
      }
      html += itemHtml(r, false);
    });
    $('list').innerHTML = html || '<div class="empty-box">' + (q || state.cat ? '找不到符合的紀錄' : '這個月還沒有紀錄') + '</div>';
  }

  /* ---------- 分析 ---------- */

  function sixMonthSvg() {
    var curIdx = state.y * 12 + state.m;
    var items = [];
    var max = 0;
    for (var i = 5; i >= 0; i--) {
      var idx = curIdx - i;
      var y = Math.floor(idx / 12);
      var m = idx % 12;
      var v = monthTotal(y, m);
      if (v > max) max = v;
      items.push({ idx: idx, y: y, m: m, v: v });
    }
    if (!max) max = 1;
    var W = 320, H = 180, padX = 6, top = 24, bottom = 26;
    var step = (W - padX * 2) / 6;
    var bw = 26;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="近六個月支出">';
    svg += '<line x1="' + padX + '" y1="' + (H - bottom) + '" x2="' + (W - padX) + '" y2="' + (H - bottom) + '" stroke="var(--line)" stroke-width="1"/>';
    items.forEach(function (it, k) {
      var h = Math.round((H - top - bottom) * it.v / max);
      var x = padX + step * k + (step - bw) / 2;
      var y = H - bottom - h;
      var on = it.idx === curIdx;
      var cx = x + bw / 2;
      svg += '<g class="barg" data-ym="' + it.y + '-' + it.m + '">' +
        '<rect x="' + (padX + step * k) + '" y="0" width="' + step + '" height="' + H + '" fill="transparent"/>' +
        '<rect class="grow" style="animation-delay:' + (k * 70) + 'ms" x="' + x + '" y="' + (it.v ? y : H - bottom - 1) + '" width="' + bw + '" height="' + (it.v ? Math.max(h, 2) : 1) + '" fill="' + (on ? 'var(--shu)' : 'var(--ai)') + '" opacity="' + (on ? 1 : 0.55) + '"/>' +
        '<text class="bv" x="' + cx + '" y="' + (y - 6) + '">' + shortNum(it.v) + '</text>' +
        '<text class="bm' + (on ? ' on' : '') + '" x="' + cx + '" y="' + (H - 9) + '">' + (it.m + 1) + '月</text></g>';
    });
    return svg + '</svg>';
  }

  function donutSvg(entries, total) {
    var CX = 160, CY = 126, R = 58, SW = 24, C = 2 * Math.PI * R, DUR = 900;
    var svg = '<svg id="donutSvg" viewBox="0 0 320 252" role="img" aria-label="分類比例">';
    svg += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="var(--paper2)" stroke-width="' + SW + '"/>';
    var acc = 0, labels = [], sl = '';
    entries.forEach(function (e, i) {
      var len = e.value / total * C;
      var draw = Math.max(len - (entries.length > 1 ? 2 : 0), 0.6);
      var ang = (acc + len / 2) / C * 2 * Math.PI - Math.PI / 2;
      var dx = Math.cos(ang), dy = Math.sin(ang);
      var delay = Math.round(acc / C * DUR);
      var dur = Math.max(Math.round(len / C * DUR), 60);
      sl += '<g class="sl" data-i="' + i + '" style="--dx:' + (dx * 7).toFixed(2) + 'px;--dy:' + (dy * 7).toFixed(2) + 'px">' +
        '<circle class="slice" cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="' + e.color + '" stroke-width="' + SW + '"' +
        ' stroke-dasharray="0 ' + C.toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 ' + CX + ' ' + CY + ')"' +
        ' data-d="' + draw.toFixed(2) + '" data-r="' + (C - draw).toFixed(2) + '"' +
        ' style="transition:stroke-dasharray ' + dur + 'ms linear ' + delay + 'ms"/></g>';
      if (e.value / total >= 0.04) {
        var rr = R + SW / 2;
        labels.push({ i: i, ax: CX + dx * (rr + 3), ay: CY + dy * (rr + 3), ex: CX + dx * (rr + 14), ey: CY + dy * (rr + 14),
          right: dx >= 0, delay: delay + Math.round(dur / 2), pct: Math.round(e.value / total * 100), name: e.name });
      }
      acc += len;
    });
    svg += sl;

    // 外圍標籤：左右各自由上到下排，太近就往下推開，避免文字重疊
    [true, false].forEach(function (side) {
      var arr = labels.filter(function (l) { return l.right === side; }).sort(function (a, b) { return a.ey - b.ey; });
      var prev = -999;
      arr.forEach(function (l) {
        l.ly = Math.max(l.ey, prev + 24);
        prev = l.ly;
      });
    });
    labels.forEach(function (l) {
      var tx = l.ex + (l.right ? 8 : -8);
      var nm = l.name.length > 5 ? l.name.slice(0, 5) + '…' : l.name;
      svg += '<g class="lbl" data-i="' + l.i + '" style="transition-delay:' + l.delay + 'ms">' +
        '<polyline points="' + l.ax.toFixed(1) + ',' + l.ay.toFixed(1) + ' ' + l.ex.toFixed(1) + ',' + l.ly.toFixed(1) + ' ' + tx.toFixed(1) + ',' + l.ly.toFixed(1) + '"/>' +
        '<text class="pc" x="' + (tx + (l.right ? 3 : -3)).toFixed(1) + '" y="' + (l.ly - 1).toFixed(1) + '" text-anchor="' + (l.right ? 'start' : 'end') + '">' + l.pct + '%</text>' +
        '<text class="nm" x="' + (tx + (l.right ? 3 : -3)).toFixed(1) + '" y="' + (l.ly + 10).toFixed(1) + '" text-anchor="' + (l.right ? 'start' : 'end') + '">' + esc(nm) + '</text></g>';
    });

    // 環上的小星光（很淡、很慢）
    [24, 78, 133, 198, 252, 318].forEach(function (deg, k) {
      var a2 = deg * Math.PI / 180 - Math.PI / 2, s = k % 2 ? 4 : 5.5, q = s * 0.25;
      svg += '<g transform="translate(' + (CX + Math.cos(a2) * R).toFixed(1) + ' ' + (CY + Math.sin(a2) * R).toFixed(1) + ')">' +
        '<path class="spark" style="animation-delay:' + (1100 + k * 520) + 'ms" fill="#fffaf0" d="M0,' + -s + ' L' + q + ',' + -q + ' L' + s + ',0 L' + q + ',' + q + ' L0,' + s + ' L' + -q + ',' + q + ' L' + -s + ',0 L' + -q + ',' + -q + 'Z"/></g>';
    });

    // 中央資訊（預設顯示總額，點分類後換成該分類）
    svg += '<text style="pointer-events:none" id="cLabel" x="' + CX + '" y="' + (CY - 11) + '" text-anchor="middle" font-size="9" fill="var(--sub)" letter-spacing="2">支出</text>';
    svg += '<text id="cVal" x="' + CX + '" y="' + (CY + 10) + '" text-anchor="middle" font-size="17" font-weight="600" fill="var(--ink)" style="font-family:var(--serif);pointer-events:none">0</text>';
    svg += '<text style="pointer-events:none" id="cSub" x="' + CX + '" y="' + (CY + 25) + '" text-anchor="middle" font-size="8.5" fill="var(--sub)"></text>';
    svg += '<text style="pointer-events:none" id="cSub2" x="' + CX + '" y="' + (CY + 37) + '" text-anchor="middle" font-size="8.5" fill="var(--sub)"></text>';
    return svg + '</svg>';
  }

  var cuTimer = null;
  function countUp(el, to, ms) {
    cancelAnimationFrame(cuTimer);
    if (!el) return;
    if (!ms) { el.textContent = num(to); return; }
    var t0 = null;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min((ts - t0) / ms, 1);
      var e = 1 - Math.pow(1 - k, 3);
      el.textContent = num(Math.round(to * e));
      if (k < 1) cuTimer = requestAnimationFrame(step);
    }
    cuTimer = requestAnimationFrame(step);
  }
  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  // 圓環掃出來、標籤淡入、總額數字跳動
  function startAnaAnim() {
    var svg = $('donutSvg');
    if (!svg || !state.ana) return;
    var slices = svg.querySelectorAll('.slice');
    var reduce = reduceMotion();
    var i;
    if (reduce) { for (i = 0; i < slices.length; i++) slices[i].style.transition = 'none'; }
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var k;
        for (k = 0; k < slices.length; k++) {
          slices[k].style.strokeDasharray = slices[k].getAttribute('data-d') + ' ' + slices[k].getAttribute('data-r');
        }
        var ls = svg.querySelectorAll('.lbl');
        for (k = 0; k < ls.length; k++) ls[k].classList.add('in');
      });
    });
    setCenter('支出', state.ana.total, '', '', reduce ? 0 : 900);
  }

  function setCenter(label, val, sub, sub2html, ms) {
    $('cLabel').textContent = label;
    $('cSub').textContent = sub;
    var s2 = $('cSub2');
    s2.textContent = sub2html.text || '';
    s2.setAttribute('fill', sub2html.color || 'var(--sub)');
    countUp($('cVal'), val, ms);
  }

  function selectSlice(i) {
    var ana = state.ana;
    if (!ana) return;
    if (ana.sel === i) i = -1;
    ana.sel = i;
    var svg = $('donutSvg');
    var gs = svg.querySelectorAll('.sl'), ls = svg.querySelectorAll('.lbl'), k;
    for (k = 0; k < gs.length; k++) {
      var on = Number(gs[k].getAttribute('data-i')) === i;
      gs[k].classList.toggle('pop', on);
      gs[k].classList.toggle('dim', i >= 0 && !on);
    }
    for (k = 0; k < ls.length; k++) {
      ls[k].classList.toggle('dim', i >= 0 && Number(ls[k].getAttribute('data-i')) !== i);
    }
    var rows = document.querySelectorAll('.catrow');
    for (k = 0; k < rows.length; k++) {
      rows[k].classList.toggle('on', i >= 0 && rows[k].getAttribute('data-cat') === ana.entries[i].name);
    }
    var ms = reduceMotion() ? 0 : 450;
    if (i < 0) {
      setCenter('支出', ana.total, '', {}, ms);
      $('donutAct').innerHTML = '';
    } else {
      var e = ana.entries[i];
      var sub2 = {};
      if (e.prev > 0) {
        var d = (e.value - e.prev) / e.prev * 100;
        sub2 = { text: '較上月 ' + (d > 0 ? '▲' : '▼') + Math.abs(Math.round(d)) + '%', color: d > 0 ? 'var(--shu)' : 'var(--ai)' };
      } else if (!e.members) {
        sub2 = { text: '上月沒有紀錄' };
      }
      var nm = e.name.length > 6 ? e.name.slice(0, 6) + '…' : e.name;
      setCenter(nm, e.value, '占 ' + Math.round(e.value / ana.total * 100) + '%　' + e.count + ' 筆', sub2, ms);
      $('donutAct').innerHTML = e.members ? '' : '<button class="link" id="goCat">查看「' + esc(e.name) + '」明細 ›</button>';
    }
    if (navigator.vibrate) { try { navigator.vibrate(6); } catch (x) {} }
  }

  function dailySvg(counted) {
    var n = new Date(state.y, state.m + 1, 0).getDate();
    var sums = [];
    for (var i = 0; i < n; i++) sums.push(0);
    counted.forEach(function (r) { sums[new Date(r.time).getDate() - 1] += r.amount; });
    var max = 0, maxDay = -1;
    sums.forEach(function (v, i) { if (v > max) { max = v; maxDay = i; } });
    var W = 320, H = 100, padX = 6, top = 6, bottom = 18;
    var step = (W - padX * 2) / n;
    var bw = Math.max(step * 0.58, 2);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="每日支出">';
    svg += '<line x1="' + padX + '" y1="' + (H - bottom) + '" x2="' + (W - padX) + '" y2="' + (H - bottom) + '" stroke="var(--line)" stroke-width="1"/>';
    sums.forEach(function (v, i) {
      if (!v) return;
      var h = Math.max(Math.round((H - top - bottom) * v / max), 2);
      var x = padX + step * i + (step - bw) / 2;
      svg += '<rect class="grow" style="animation-delay:' + (i * 14) + 'ms" x="' + x.toFixed(2) + '" y="' + (H - bottom - h) + '" width="' + bw.toFixed(2) + '" height="' + h + '" fill="' + (i === maxDay ? 'var(--shu)' : 'var(--ai)') + '" opacity="' + (i === maxDay ? 1 : 0.55) + '"/>';
    });
    var marks = [1, 10, 20, n];
    var drawn = {};
    marks.forEach(function (d) {
      if (drawn[d] || d > n) return;
      drawn[d] = true;
      svg += '<text class="bm" x="' + (padX + step * (d - 1) + step / 2).toFixed(2) + '" y="' + (H - 4) + '">' + d + '</text>';
    });
    svg += '</svg>';
    return { svg: svg, max: max, maxDay: maxDay };
  }

  function renderAnalysis(monthAll, rows, counted, total) {
    var html = '';

    // 近六個月
    var prevIdx = state.y * 12 + state.m - 1;
    var prevTotal = monthTotal(Math.floor(prevIdx / 12), prevIdx % 12);
    var cmp = '';
    if (prevTotal > 0 || total > 0) {
      var d = total - prevTotal;
      cmp = d === 0 ? '與上個月相同' : '較上個月' + (d > 0 ? '多' : '少') + ' ' + money(Math.abs(d));
    }
    html += '<div class="sec"><h3>近六個月</h3><div class="note">' + esc(cmp) + '　·　點長條可切換月份</div>' + sixMonthSvg() + '</div>';

    if (!counted.length) {
      html += '<div class="empty-box">這個月還沒有可分析的消費</div>';
      state.ana = null;
      $('viewAna').innerHTML = html;
      return;
    }

    // 分類
    var byCat = {};
    counted.forEach(function (r) { byCat[r.category] = byCat[r.category] || { v: 0, n: 0 }; byCat[r.category].v += r.amount; byCat[r.category].n++; });
    var names = Object.keys(byCat).sort(function (a, b) { return byCat[b].v - byCat[a].v; });
    var entries = names.map(function (n) { return { name: n, value: byCat[n].v, count: byCat[n].n, color: colorOf(n) }; });
    var pY = Math.floor(prevIdx / 12), pM = prevIdx % 12;
    var prevByCat = {};
    state.rows.forEach(function (r) {
      if (isOn(r) && srcOk(r) && inMonth(r.time, pY, pM)) prevByCat[r.category] = (prevByCat[r.category] || 0) + r.amount;
    });
    var main = [], rest = [];
    entries.forEach(function (e, i) {
      e.prev = prevByCat[e.name] || 0;
      if (i < 6 && e.value / total >= 0.03) main.push(e); else rest.push(e);
    });
    if (rest.length === 1) { main.push(rest[0]); rest = []; }
    if (rest.length) {
      var rv = 0, rc = 0, rp = 0;
      rest.forEach(function (e) { rv += e.value; rc += e.count; rp += e.prev; });
      main.push({ name: '其他', value: rv, count: rc, color: PALETTE[7], prev: rp, members: rest.map(function (e) { return e.name; }) });
    }
    state.ana = { entries: main, total: total, sel: -1 };
    html += '<div class="sec"><h3>分　類</h3><div class="note">點圓環上的分類看重點，再點一次還原</div>' +
      '<div class="donut-box">' + donutSvg(main, total) + '</div><div class="donut-act" id="donutAct"></div>';
    entries.forEach(function (e) {
      html += '<button class="catrow" data-cat="' + esc(e.name) + '"><span class="l"><i style="background:' + e.color + '"></i>' + esc(e.name) + '</span>' +
        '<span class="r">' + num(e.value) + '<small>' + Math.round(e.value / total * 100) + '%　' + e.count + ' 筆</small></span></button>';
    });
    html += '</div>';

    // 每日
    var daily = dailySvg(counted);
    var best = null;
    counted.forEach(function (r) { if (!best || r.amount > best.amount) best = r; });
    html += '<div class="sec"><h3>每日支出</h3>' + daily.svg +
      '<div class="stats">' +
      '<div class="stat"><div class="k">最高單日</div><div class="v">' + num(daily.max) + '</div><div class="s">' + (state.m + 1) + '/' + (daily.maxDay + 1) + '</div></div>' +
      '<div class="stat"><div class="k">最高單筆</div><div class="v">' + num(best.amount) + '</div><div class="s">' + esc(best.store || '（沒有店名）') + '</div></div>' +
      '</div></div>';

    // 商家
    var byStore = {};
    counted.forEach(function (r) {
      if (!r.store) return;
      byStore[r.store] = byStore[r.store] || { v: 0, n: 0 };
      byStore[r.store].v += r.amount;
      byStore[r.store].n++;
    });
    var storeNames = Object.keys(byStore).sort(function (a, b) { return byStore[b].v - byStore[a].v; }).slice(0, 5);
    if (storeNames.length) {
      var smax = byStore[storeNames[0]].v;
      html += '<div class="sec"><h3>商家　前五</h3>';
      storeNames.forEach(function (s, i) {
        html += '<div class="rank"><span class="no">' + (i + 1) + '</span><div class="mid"><div class="nm">' + esc(s) + '</div>' +
          '<div class="ct">共 ' + byStore[s].n + ' 筆</div><div class="thin"><i style="width:' + Math.round(byStore[s].v / smax * 100) + '%"></i></div></div>' +
          '<span class="am">' + num(byStore[s].v) + '</span></div>';
      });
      html += '</div>';
    }

    // 來源（不受來源篩選影響，方便比較）
    var bySrc = {};
    monthAll.filter(isOn).forEach(function (r) { bySrc[r.source] = bySrc[r.source] || { v: 0, n: 0 }; bySrc[r.source].v += r.amount; bySrc[r.source].n++; });
    var srcNames = Object.keys(bySrc).sort(function (a, b) { return bySrc[b].v - bySrc[a].v; });
    if (srcNames.length > 1) {
      var smax2 = bySrc[srcNames[0]].v;
      html += '<div class="sec"><h3>來　源</h3>';
      srcNames.forEach(function (s) {
        html += '<div class="rank"><span class="no"></span><div class="mid"><div class="nm">' + esc(s) + '</div>' +
          '<div class="ct">共 ' + bySrc[s].n + ' 筆</div><div class="thin"><i style="width:' + Math.round(bySrc[s].v / smax2 * 100) + '%"></i></div></div>' +
          '<span class="am">' + num(bySrc[s].v) + '</span></div>';
      });
      html += '</div>';
    }

    $('viewAna').innerHTML = html;
    startAnaAnim();
  }

  /* ---------- 面板（詳細／編輯／記帳／預算／整理／更多） ---------- */

  var PANELS = { import: 'pImport', detail: 'pDetail', edit: 'pEdit', add: 'pAdd', budget: 'pBudget', tidy: 'pTidy', more: 'pMore' };

  function showPanel(which) {
    var wasOpen = !$('mask').classList.contains('hidden');
    if (!wasOpen) state.opener = document.activeElement;
    Object.keys(PANELS).forEach(function (k) { $(PANELS[k]).classList.toggle('hidden', k !== which); });
    state.panel = which;
    $('mask').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    var h = $(PANELS[which]).querySelector('h2');
    if (h && which !== 'add') { try { h.focus({ preventScroll: true }); } catch (e) {} }
  }
  function closeSheet() {
    if ($('mask').classList.contains('hidden')) return;
    $('mask').classList.add('hidden');
    document.body.style.overflow = '';
    state.panel = '';
    state.editing = null;
    var o = state.opener;
    state.opener = null;
    if (o && o.focus && document.body.contains(o)) { try { o.focus({ preventScroll: true }); } catch (e) {} }
  }

  function fillCatList() {
    var seen = {}, html = '';
    var all = state.cats.slice();
    state.rows.forEach(function (r) { if (all.indexOf(r.category) < 0) all.push(r.category); });
    all.forEach(function (c) { if (c && !seen[c]) { seen[c] = true; html += '<option value="' + esc(c) + '"></option>'; } });
    $('catList').innerHTML = html;
  }

  /* 詳細 */
  function openDetail(r) {
    state.editing = r;
    var d = new Date(r.time), off = !isOn(r);
    $('dAmt').textContent = money(r.amount);
    $('dAmt').classList.toggle('off', off);
    $('dStore').textContent = r.store || '（沒有店名）';
    var sameN = 0, sameV = 0;
    if (r.store) {
      state.rows.forEach(function (x) {
        if (x.store === r.store && isOn(x) && inMonth(x.time, d.getFullYear(), d.getMonth())) { sameN++; sameV += x.amount; }
      });
    }
    var h = '';
    function add(k, v) { h += '<div class="drow"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
    add('日期', d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '（' + WEEK[d.getDay()] + '）');
    add('時間', pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()));

    add('來源', esc(r.source));
    if (r.card) add('卡片', esc(r.card));
    add('狀態', off ? '<span class="up">已取消</span>' : '正常');
    if (sameN > 1) add('本月同店', sameN + ' 筆，合計 ' + money(sameV));
    $('dRows').innerHTML = h;
    showPanel('detail');
  }

  /* 編輯 */
  function updateLearn() {
    var r = state.editing;
    var store = $('fStore').value.trim(), cat = $('fCat').value.trim();
    var show = !!(r && store && cat && cat !== '未分類' && cat !== r.category);
    $('learnRow').classList.toggle('hidden', !show);
    if (show) $('learnName').textContent = store;
    else $('fLearn').checked = false;
  }
  function openEdit(r) {
    state.editing = r;
    fillCatList();
    $('fAmount').value = r.amount;
    $('fStore').value = r.store;
    $('fCat').value = r.category;
    $('fStatus').value = isOn(r) ? '正常' : '已取消';
    $('fLearn').checked = false;
    updateLearn();
    showPanel('edit');
  }
  function afterAction(res, okMsg) {
    if (!res || !res.ok) { toast('失敗：' + ((res && res.msg) || '未知錯誤')); return false; }
    if (res.result === 'stale') { toast('資料已經變動，已重新載入，請再操作一次'); closeSheet(); refresh(true); return false; }
    if (res.result === 'bad amount') { toast('金額不對，請輸入數字'); return false; }
    toast(okMsg);
    closeSheet();
    refresh(true);
    return true;
  }
  function saveEdit() {
    var r = state.editing;
    var amount = parseFloat($('fAmount').value);
    if (!r) return;
    if (!amount || amount <= 0) { toast('請輸入金額'); return; }
    var learn = $('fLearn').checked, store = $('fStore').value.trim(), cat = $('fCat').value.trim();
    var btn = $('saveBtn');
    btn.disabled = true;
    apiPost({ action: 'update', row: r.row, time: r.time, oldAmount: r.amount, amount: amount, store: store, category: cat, status: $('fStatus').value })
      .then(function (res) {
        if (res && res.ok && res.result === 'updated' && learn) {
          return apiPost({ action: 'rule', keyword: store, category: cat }).then(function (r2) {
            var n = 0;
            if (r2 && r2.ok && /^ruled:(\d+)$/.test(r2.result)) n = Number(RegExp.$1);
            afterAction(res, '已儲存，以後「' + store + '」自動歸「' + cat + '」' + (n ? '，另外 ' + n + ' 筆舊紀錄也歸類了' : ''));
          });
        }
        afterAction(res, '已儲存');
      })
      .catch(function () { toast('連不上後端'); })
      .then(function () { btn.disabled = false; });
  }
  function deleteRow() {
    var r = state.editing;
    if (!r || !window.confirm('確定刪除這筆嗎？刪除後無法復原。')) return;
    var btn = $('deleteBtn');
    btn.disabled = true;
    apiPost({ action: 'delete', row: r.row, time: r.time, oldAmount: r.amount })
      .then(function (res) { afterAction(res, '已刪除'); })
      .catch(function () { toast('連不上後端'); })
      .then(function () { btn.disabled = false; });
  }

  /* 兩下記帳：輸入金額 → 點分類 → 自動存檔 */
  function topCats() {
    var cut = Date.now() - 60 * 86400000, cnt = {};
    state.rows.forEach(function (r) { if (r.time >= cut && r.category !== '未分類') cnt[r.category] = (cnt[r.category] || 0) + 1; });
    var names = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
    state.cats.forEach(function (c) { if (c !== '未分類' && names.indexOf(c) < 0) names.push(c); });
    if (!names.length) names = ['餐飲', '交通', '購物', '娛樂', '其他'];
    return names;
  }
  function buildAdd() {
    var all = topCats();
    var showAll = state.addAll || all.length <= 6;
    var shown = showAll ? all : all.slice(0, 5);
    var h = '';
    shown.forEach(function (c) {
      h += '<button class="a-cat" data-cat="' + esc(c) + '"><span class="cat-dot" style="background:' + colorOf(c) + '"></span>' + esc(c) + '</button>';
    });
    if (!showAll) h += '<button class="a-cat more" id="aMore">更多 ›</button>';
    $('aCats').innerHTML = h;

    var srcs = state.sources.length ? state.sources : ['現金'];
    var s = '';
    srcs.forEach(function (x) { s += '<button class="chip" data-src="' + esc(x) + '" aria-pressed="' + (x === state.addSource) + '">' + esc(x) + '</button>'; });
    $('aSrc').innerHTML = s;

    var keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3', '00', '0', '⌫'], k = '';
    keys.forEach(function (x) { k += '<button class="key" data-key="' + x + '" aria-label="' + (x === '⌫' ? '刪除一位' : x) + '">' + x + '</button>'; });
    $('aPad').innerHTML = k;
    updateAmt();
  }
  function updateAmt() {
    var a = $('aAmt');
    a.textContent = state.addBuf ? num(state.addBuf) : '0';
    a.classList.toggle('empty', !state.addBuf);
  }
  function openAdd() {
    state.addBuf = '';
    state.addAll = false;
    var last = lsGet(LS_SRC);
    var srcs = state.sources.length ? state.sources : ['現金'];
    state.addSource = srcs.indexOf(last) >= 0 ? last : srcs[0];
    buildAdd();
    showPanel('add');
  }
  function pressKey(k) {
    if (k === '⌫') state.addBuf = state.addBuf.slice(0, -1);
    else if (/^\d+$/.test(k)) {
      if (state.addBuf === '' && /^0+$/.test(k)) return;
      if ((state.addBuf + k).length <= 7) state.addBuf += k;
    }
    updateAmt();
    buzz();
  }
  function commitAdd(cat) {
    var amount = parseInt(state.addBuf, 10);
    if (!amount) {
      var a = $('aAmt');
      a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
      toast('先輸入金額');
      return;
    }
    var t = Date.now(), src = state.addSource;
    lsSet(LS_SRC, src);
    closeSheet();
    state.rows.push({ row: 0, time: t, amount: amount, store: '', category: cat, status: '正常', source: src, card: '' });
    state.tab = state.tab === 'ana' ? 'ana' : state.tab;
    var now = new Date();
    state.y = now.getFullYear(); state.m = now.getMonth();
    render();
    buzz();
    apiPost({ action: 'add', amount: amount, category: cat, source: src, store: '', time: t }).then(function (res) {
      if (res && res.ok && res.result === 'added') {
        state.lastAdd = { row: res.row, time: t, amount: amount };
        toast('已記 ' + cat + ' ' + num(amount), undoAdd);
      } else {
        toast('記帳失敗：' + ((res && (res.msg || res.result)) || '未知錯誤'));
      }
      refresh(true);
    }).catch(function () {
      toast('連不上後端，這筆沒有存到，請再試一次');
      state.rows = state.rows.filter(function (r) { return r.row !== 0; });
      render();
    });
  }
  function undoAdd() {
    var la = state.lastAdd;
    if (!la) return;
    apiList().then(function (d) {
      if (!d || !d.ok) { toast('復原失敗'); return; }
      applyData(d);
      var r = findRow(la.row);
      if (!r || r.amount !== la.amount || Math.abs(r.time - la.time) > 5000) { toast('找不到那一筆，請到明細手動刪除'); render(); return; }
      return apiPost({ action: 'delete', row: r.row, time: r.time, oldAmount: r.amount }).then(function (res) {
        toast(res && res.ok && res.result === 'deleted' ? '已復原' : '復原失敗，請到明細手動刪除');
        refresh(true);
      });
    }).catch(function () { toast('復原失敗'); });
  }

  /* 預算 */
  function openBudget() {

  }

  /* 整理未分類 */
  function buildTidy() {
    var list = uncategorized().slice(0, 15);
    var cats = topCats().slice(0, 6);
    var h = '';
    list.forEach(function (u) {
      h += '<div class="tidy"><div class="nm">' + esc(u.store) + '</div><div class="ct">' + u.n + ' 筆　共 ' + money(u.v) + '</div><div class="opts">';
      cats.forEach(function (c) {
        h += '<button class="chip" data-store="' + esc(u.store) + '" data-cat="' + esc(c) + '"><span class="cat-dot" style="background:' + colorOf(c) + '"></span>' + esc(c) + '</button>';
      });
      h += '</div></div>';
    });
    $('tidyList').innerHTML = h || '<div class="empty-box">全部都分類好了</div>';
  }
  function openTidy() { buildTidy(); showPanel('tidy'); }
  function applyRule(store, cat) {
    apiPost({ action: 'rule', keyword: store, category: cat }).then(function (res) {
      if (res && res.ok && /^ruled:(\d+)$/.test(res.result)) {
        toast('「' + store + '」歸為「' + cat + '」，' + RegExp.$1 + ' 筆已整理，以後自動歸類');
        refresh(true);
      } else {
        toast('失敗：' + ((res && (res.msg || res.result)) || '未知錯誤'));
      }
    }).catch(function () { toast('連不上後端'); });
  }

  /* 補記：讀 LINE 聊天紀錄檔，只補試算表裡還沒有的付款 */
  var impPending = [];

  function parseLineExport(text) {
    var lines = text.split(/\r?\n/), date = null, msgs = [], cur = null, i;
    var dh = /^(\d{4})\/(\d{2})\/(\d{2})（/, hdr = /^(\d{2}):(\d{2})\t([^\t]*)\t(.*)$/;
    for (i = 0; i < lines.length; i++) {
      var m = dh.exec(lines[i]);
      if (m) { date = m; cur = null; continue; }
      var h = hdr.exec(lines[i]);
      if (h && date) { cur = { y: +date[1], mo: +date[2], d: +date[3], hh: +h[1], mm: +h[2], body: h[4] }; msgs.push(cur); continue; }
      if (cur) cur.body += '\n' + lines[i];
    }
    var pays = [], cancels = [];
    msgs.forEach(function (g) {
      var a = /LINE Pay\s*付款\s*NT\$\s*([\d,]+)/.exec(g.body);
      if (!a) return;
      var sm = /商店名稱\s*[:：]\s*([^\r\n]+)/.exec(g.body);
      var store = sm ? sm[1].trim().replace(/^"+|"+$/g, '').trim() : '';
      var t = Date.UTC(g.y, g.mo - 1, g.d, g.hh, g.mm) - 8 * 3600000; // 聊天紀錄是台灣時間
      var amount = parseInt(a[1].replace(/,/g, ''), 10);
      if (/付款完成/.test(g.body)) pays.push({ t: t, amount: amount, store: store, status: '正常' });
      else if (/取消付款/.test(g.body)) cancels.push({ t: t, amount: amount, store: store });
    });
    return { pays: pays, cancels: cancels };
  }

  function planImport(parsed) {
    var used = {};
    var fresh = [];
    parsed.pays.forEach(function (p) {
      var hit = -1;
      for (var i = 0; i < state.rows.length; i++) {
        var r = state.rows[i];
        if (used[i] || r.amount !== p.amount || String(r.store || '').trim() !== p.store) continue;
        if (Math.abs(r.time - p.t) <= 180000) { hit = i; break; }
      }
      if (hit >= 0) used[hit] = true; else fresh.push(p);
    });
    // 取消付款：標記對應的新補記那一筆
    parsed.cancels.forEach(function (c) {
      for (var i = fresh.length - 1; i >= 0; i--) {
        var f = fresh[i];
        if (f.status === '正常' && f.amount === c.amount && f.store === c.store && f.t <= c.t && c.t - f.t <= 3 * 86400000) { f.status = '已取消'; break; }
      }
    });
    fresh.sort(function (a, b) { return a.t - b.t; });
    return fresh;
  }

  function openImport() {
    impPending = [];
    $('fFile').value = '';
    $('impResult').innerHTML = '';
    $('impGo').classList.add('hidden');
    showPanel('import');
  }

  function onFile() {
    var f = $('fFile').files && $('fFile').files[0];
    if (!f) return;
    $('impResult').textContent = '讀取中…';
    $('impGo').classList.add('hidden');
    var rd = new FileReader();
    rd.onerror = function () { $('impResult').textContent = '讀不到這個檔案，請再選一次。'; };
    rd.onload = function () {
      var parsed = parseLineExport(String(rd.result || ''));
      if (!parsed.pays.length) {
        $('impResult').innerHTML = '<div class="empty-box" style="padding:20px 0">這個檔案裡找不到 LINE Pay 付款。請確認是「LINE錢包」聊天室匯出的文字檔。</div>';
        return;
      }
      impPending = planImport(parsed);
      var h = '<div class="kv"><span>檔案內的付款</span><span>' + parsed.pays.length + ' 筆</span></div>' +
        '<div class="kv"><span>帳裡已經有</span><span>' + (parsed.pays.length - impPending.length) + ' 筆</span></div>' +
        '<div class="kv"><span>可以補記</span><span><b class="up">' + impPending.length + ' 筆</b></span></div>';
      if (!impPending.length) {
        h += '<div class="empty-box" style="padding:20px 0">沒有缺漏，帳已經是最新的。</div>';
      } else {
        var show = impPending.slice(-15).reverse();
        h += '<div style="margin-top:10px">';
        show.forEach(function (p) {
          var d = new Date(p.t);
          h += '<div class="imp-row"><span>' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)">' + esc(p.store || '（沒有店名）') + (p.status === '已取消' ? '　已取消' : '') + '</span><b>' + num(p.amount) + '</b></div>';
        });
        if (impPending.length > 15) h += '<div class="hero-sub" style="padding:8px 0">只列出最近 15 筆，其餘一起補記。</div>';
        h += '</div>';
        $('impGo').textContent = '補記 ' + impPending.length + ' 筆';
        $('impGo').classList.remove('hidden');
      }
      $('impResult').innerHTML = h;
    };
    rd.readAsText(f, 'UTF-8');
  }

  function doImport() {
    if (!impPending.length) return;
    var btn = $('impGo');
    btn.disabled = true;
    var rows = impPending.map(function (p) { return [p.t, p.amount, p.store, p.status]; });
    apiPost({ action: 'import', rows: rows }).then(function (res) {
      if (res && res.ok && /^imported:(\d+)$/.test(res.result)) {
        toast('已補記 ' + RegExp.$1 + ' 筆');
        closeSheet();
        refresh(true);
      } else if (res && res.ok && res.result === 'unknown action') {
        toast('後端還沒更新到 v5.1，請先更新 Apps Script 並部署新版本');
      } else {
        toast('補記失敗：' + ((res && (res.msg || res.result)) || '未知錯誤'));
      }
    }).catch(function () { toast('連不上後端，這次沒有補記'); })
      .then(function () { btn.disabled = false; });
  }

  /* 更多 */
  function buildMore() {
    var mins = Math.round((Date.now() - state.loadedAt) / 60000);
    $('mUpdated').textContent = state.loadedAt ? (mins < 1 ? '剛剛更新' : mins + ' 分鐘前') : '';
    $('mBudgetVal').textContent = state.budget ? money(state.budget) : '未設定';
    var n = uncategorized().length;
    $('mTidyVal').textContent = n ? n + ' 家待整理' : '都整理好了';
    $('verMore').textContent = versionText();
  }
  function openMore() { buildMore(); showPanel('more'); }

  /* ---------- 事件 ---------- */

  function gotoMonth(y, m) {
    state.y = y; state.m = m; state.cat = '';
    render();
    window.scrollTo(0, 0);
  }
  function setTab(t) {
    state.tab = t;
    render();
    window.scrollTo(0, 0);
  }
  function openRow(el) {
    var r = findRow(Number(el.getAttribute('data-row')));
    if (r) openDetail(r);
  }

  function bind() {
    $('loginBtn').addEventListener('click', doLogin);
    $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

    $('prevBtn').addEventListener('click', function () {
      var y = state.y, m = state.m - 1;
      if (m < 0) { m = 11; y--; }
      gotoMonth(y, m);
    });
    $('nextBtn').addEventListener('click', function () {
      var now = new Date();
      if (state.y === now.getFullYear() && state.m === now.getMonth()) return;
      var y = state.y, m = state.m + 1;
      if (m > 11) { m = 0; y++; }
      gotoMonth(y, m);
    });

    $('tbHome').addEventListener('click', function () { setTab('home'); });
    $('tbList').addEventListener('click', function () { setTab('list'); });
    $('tbAna').addEventListener('click', function () { setTab('ana'); });
    $('tbMore').addEventListener('click', openMore);
    $('addBtn').addEventListener('click', openAdd);

    $('sourceChips').addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      state.source = b.getAttribute('data-source');
      state.cat = '';
      render();
    });
    $('catChips').addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      state.cat = b.getAttribute('data-cat');
      render();
    });
    $('qInput').addEventListener('input', function () { state.q = $('qInput').value; render(); });

    $('vHome').addEventListener('click', function (e) {
      var it = e.target.closest('.item');
      if (it) { openRow(it); return; }
      var b = e.target.closest('button');
      if (!b) return;
      if (b.id === 'hBudget') openBudget();
      else if (b.id === 'hTidy') openTidy();
      else if (b.id === 'hAll') setTab('list');
    });
    $('list').addEventListener('click', function (e) {
      var it = e.target.closest('.item');
      if (it) openRow(it);
    });

    $('viewAna').addEventListener('click', function (e) {
      var sl = e.target.closest('.sl');
      if (sl) { selectSlice(Number(sl.getAttribute('data-i'))); return; }
      if (e.target.id === 'goCat' && state.ana && state.ana.sel >= 0) {
        state.cat = state.ana.entries[state.ana.sel].name;
        setTab('list');
        return;
      }
      var g = e.target.closest('.barg');
      if (g) {
        var p = g.getAttribute('data-ym').split('-');
        gotoMonth(Number(p[0]), Number(p[1]));
        return;
      }
      var c = e.target.closest('.catrow');
      if (c) { state.cat = c.getAttribute('data-cat'); setTab('list'); }
    });

    // 面板
    $('mask').addEventListener('click', function (e) {
      if (e.target === $('mask') || e.target.closest('[data-close]')) closeSheet();
    });
    $('editBtn').addEventListener('click', function () { openEdit(state.editing); });
    $('editBack').addEventListener('click', function () { if (state.editing) openDetail(state.editing); else closeSheet(); });
    $('saveBtn').addEventListener('click', saveEdit);
    $('deleteBtn').addEventListener('click', deleteRow);
    $('fStore').addEventListener('input', updateLearn);
    $('fCat').addEventListener('input', updateLearn);
    $('budgetSave').addEventListener('click', saveBudget);

    $('pAdd').addEventListener('click', function (e) {
      var k = e.target.closest('.key');
      if (k) { pressKey(k.getAttribute('data-key')); return; }
      if (e.target.id === 'aMore') { state.addAll = true; buildAdd(); return; }
      var c = e.target.closest('.a-cat');
      if (c && c.getAttribute('data-cat')) { commitAdd(c.getAttribute('data-cat')); return; }
      var s = e.target.closest('[data-src]');
      if (s) { state.addSource = s.getAttribute('data-src'); buildAdd(); }
    });
    $('tidyList').addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (b) applyRule(b.getAttribute('data-store'), b.getAttribute('data-cat'));
    });
    $('mRefresh').addEventListener('click', function () { refresh(); });
    $('mBudget').addEventListener('click', openBudget);
    $('mTidy').addEventListener('click', openTidy);
    $('mImport').addEventListener('click', openImport);
    $('fFile').addEventListener('change', onFile);
    $('impGo').addEventListener('click', doImport);
    $('mLogout').addEventListener('click', logout);

    document.addEventListener('keydown', function (e) {
      if (state.panel === 'add') {
        if (/^\d$/.test(e.key)) { pressKey(e.key); return; }
        if (e.key === 'Backspace') { pressKey('⌫'); return; }
      }
      if (e.key === 'Escape') closeSheet();
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && state.key && Date.now() - state.loadedAt > 60000) refresh(true);
    });
  }

  function init() {
    var now = new Date();
    state.y = now.getFullYear();
    state.m = now.getMonth();
    bind();
    var k = lsGet(LS_KEY);
    if (!k) { showLogin(''); return; }
    state.key = k;
    var cache = lsGet(LS_CACHE);
    if (cache) {
      try { applyData(JSON.parse(cache)); showApp(); render(); } catch (e) {}
    }
    refresh(true);
  }

  init();
})();
</script>
</body>
</html>
