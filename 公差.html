<title>幸運一指 · Lucky Touch</title>
<style>
  /* =========================================================
     基本設定
     ========================================================= */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg1: #1a1145;
    --bg2: #3b1d7a;
    --bg3: #7a2a8f;
    --yellow: #ffd23f; --yellow-d: #d19c00;
    --pink: #ff4fa3;   --pink-d: #c92a78;
    --cyan: #3be8ff;   --cyan-d: #139ab8;
    --green: #4cff9b;  --green-d: #1fae62;
    --purple: #9b6bff; --purple-d: #6236d1;
    --ink: #ffffff;
    --muted: #d3c8ff;
    --panel: rgba(38, 20, 88, .78);
    --panel-b: rgba(255, 255, 255, .18);
    --chip: rgba(255, 255, 255, .12);
    --danger: #ff3d6e;
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 100%);
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* =========================================================
     背景（用漸層代替模糊濾鏡，手機比較不耗電）
     ========================================================= */
  #bgDeco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
    animation: drift 16s ease-in-out infinite alternate;
  }
  .b1 { width: 90vmax; height: 90vmax; top: -45vmax; left: -40vmax;
        background: radial-gradient(circle, rgba(255,79,163,.42) 0%, transparent 62%); }
  .b2 { width: 85vmax; height: 85vmax; bottom: -45vmax; right: -40vmax;
        background: radial-gradient(circle, rgba(59,232,255,.26) 0%, transparent 62%);
        animation-delay: -6s; }
  .b3 { width: 60vmax; height: 60vmax; top: 30%; left: 25%;
        background: radial-gradient(circle, rgba(155,107,255,.3) 0%, transparent 62%);
        animation-delay: -10s; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(5vmax, 4vmax, 0) scale(1.12); }
  }
  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #ffffffaa, transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, #ffffffbb, transparent),
      radial-gradient(2px 2px at 40% 80%, #ffffff99, transparent),
      radial-gradient(1.5px 1.5px at 85% 65%, #ffffffaa, transparent),
      radial-gradient(1.5px 1.5px at 10% 75%, #ffffff88, transparent),
      radial-gradient(2px 2px at 55% 50%, #ffffff77, transparent),
      radial-gradient(1.5px 1.5px at 92% 12%, #ffffffaa, transparent),
      radial-gradient(1.5px 1.5px at 30% 55%, #ffffff88, transparent);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .35; } to { opacity: .9; } }
  .shape {
    position: absolute;
    font-weight: 900;
    opacity: .22;
    will-change: transform;
    animation: floaty linear infinite;
  }
  @keyframes floaty {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    50%  { transform: translate3d(0, -36px, 0) rotate(180deg); }
    100% { transform: translate3d(0, 0, 0) rotate(360deg); }
  }

  /* 圖層順序：背景 0 → 大數字 1 → 警戒 4 → 玩家 5 → 介面 20 → 結果 25 → 特效 30 → 封面 40 → 彈窗 60 → 提示 70 */
  #stage { position: fixed; inset: 0; z-index: 5; }
  #fx    { position: fixed; inset: 0; z-index: 30; pointer-events: none; }

  #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transition: opacity .4s;
    background: radial-gradient(ellipse at center, transparent 38%, #ff3d6e33 70%, #ff3d6e99 100%);
  }
  #vignette.on { opacity: 1; }
  #vignette.pulse { animation: vigPulse .5s ease-in-out infinite alternate; }
  @keyframes vigPulse { from { opacity: .55; } to { opacity: 1; } }

  #flash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }
  #flash.on { animation: flashHit .4s ease-out; }
  @keyframes flashHit { 0% { opacity: 0; } 20% { opacity: .9; } 100% { opacity: 0; } }

  /* =========================================================
     玩家光球
     ========================================================= */
  .player {
    position: absolute;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 6;
    transform: scale(var(--ps, 1));
    transition: opacity .35s, filter .35s, transform .3s;
  }
  .player .body {
    position: absolute;
    left: -46px; top: -46px;
    width: 92px; height: 92px;
    transition: transform .12s;
    animation: pop .45s cubic-bezier(.2,1.7,.5,1) backwards;
  }
  .player .orb {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffffff 0%, var(--c) 46%, var(--cd) 100%);
    border: 4px solid #fff;
    box-shadow: 0 0 0 5px var(--cg), 0 0 30px 8px var(--cg), inset 0 -8px 14px rgba(0,0,0,.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    animation: breathe 1.8s ease-in-out infinite;
  }
  .player .spin {
    position: absolute; inset: -15px;
    border-radius: 50%;
    border: 3px dashed var(--c);
    opacity: .8;
    animation: spin 3.2s linear infinite;
  }
  .player .tag {
    position: absolute;
    right: -8px; top: -10px;
    min-width: 30px; height: 30px;
    padding: 0 7px;
    border-radius: 15px;
    background: #fff;
    color: var(--cd);
    font-weight: 900; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--cd);
  }
  /* 光芒只在中選者身上播放，其他人不浪費效能 */
  .player .rays {
    position: absolute;
    left: -160px; top: -160px;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: repeating-conic-gradient(var(--cg) 0deg 10deg, transparent 10deg 30deg);
    -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%);
    mask: radial-gradient(circle, #000 25%, transparent 70%);
    opacity: 0;
    display: none;
  }
  .player.winner .rays { display: block; animation: spin 7s linear infinite, fadeIn .5s forwards; }
  .player .crown {
    position: absolute;
    left: 50%; top: -64px;
    margin-left: -26px;
    width: 52px;
    text-align: center;
    font-size: 46px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
    animation: crownDrop .6s cubic-bezier(.2,1.7,.5,1) both, bob .9s ease-in-out .6s infinite alternate;
  }
  @keyframes pop       { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes breathe   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes fadeIn    { to { opacity: 1; } }
  @keyframes crownDrop { from { transform: translateY(-80px) scale(.3); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes bob       { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-8px) rotate(6deg); } }

  .ripple {
    position: absolute;
    width: 30px; height: 30px;
    margin: -15px 0 0 -15px;
    border-radius: 50%;
    border: 3px solid var(--c);
    pointer-events: none;
    animation: rippleOut .9s ease-out forwards;
  }
  @keyframes rippleOut { to { transform: scale(7); opacity: 0; } }

  .player.dim { opacity: .2; filter: grayscale(.85); }
  .player.dim .orb, .player.dim .spin { animation-play-state: paused; }
  .player.hl  { opacity: 1; filter: none; z-index: 8; }
  .player.hl .body { transform: scale(1.3); }
  .player.hl .orb  { box-shadow: 0 0 0 7px #fff, 0 0 50px 18px var(--c); }
  .player.winner { opacity: 1; filter: none; z-index: 10; }
  .player.winner .body { animation: winPulse .55s ease-in-out infinite alternate; }
  @keyframes winPulse { from { transform: scale(1.3); } to { transform: scale(1.6); } }

  /* =========================================================
     封面
     ========================================================= */
  #intro {
    position: fixed; inset: 0;
    z-index: 40;
    display: flex; flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(var(--st) + 20px) 16px calc(var(--sb) + 20px);
    transition: opacity .45s, transform .45s;
  }
  #intro.hide { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .introInner {
    margin: auto 0;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .introTools {
    position: absolute;
    top: calc(var(--st) + 12px); right: 14px;
    display: flex; gap: 8px;
    z-index: 2;
  }
  .iconBtn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid var(--panel-b);
    background: var(--panel);
    color: #fff;
    font-size: 19px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    transition: transform .1s, opacity .2s;
  }
  .iconBtn:active { transform: translateY(2px); }
  .iconBtn.off { opacity: .45; }

  .logo {
    width: 80px; height: 80px;
    border-radius: 24px;
    border: 3px solid rgba(255,255,255,.85);
    background: linear-gradient(135deg, var(--pink), var(--purple)) center / cover no-repeat;
    box-shadow: 0 7px 0 var(--purple-d), 0 16px 34px rgba(255,79,163,.45);
    animation: floatLogo 3s ease-in-out infinite;
  }
  @keyframes floatLogo {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-6px) rotate(3deg); }
  }

  #titleBtn {
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: inherit;
  }
  #title {
    display: flex; gap: 4px;
    font-size: clamp(50px, 14vw, 88px);
    font-weight: 900;
    line-height: 1.1;
  }
  #title span {
    display: inline-block;
    color: var(--lc);
    text-shadow: 0 6px 0 var(--sd), 0 12px 24px rgba(0,0,0,.3);
    animation: jump 3.2s ease-in-out infinite;
  }
  #title span:nth-child(1) { --lc: var(--yellow); --sd: var(--yellow-d); animation-delay: 0s; }
  #title span:nth-child(2) { --lc: var(--pink);   --sd: var(--pink-d);   animation-delay: .15s; }
  #title span:nth-child(3) { --lc: var(--cyan);   --sd: var(--cyan-d);   animation-delay: .3s; }
  #title span:nth-child(4) { --lc: var(--green);  --sd: var(--green-d);  animation-delay: .45s; }
  @keyframes jump {
    0%, 70%, 100% { transform: translateY(0) rotate(0); }
    18%           { transform: translateY(-12px) rotate(-4deg); }
    36%           { transform: translateY(0) rotate(2deg); }
  }
  .en {
    font-size: clamp(12px, 3.2vw, 14px);
    font-weight: 900;
    letter-spacing: 8px;
    color: var(--muted);
  }
  .tagline {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }
  .tagline b { color: var(--yellow); }

  #card {
    width: min(92vw, 400px);
    background: var(--panel);
    border: 1px solid var(--panel-b);
    border-radius: 24px;
    padding: 18px 18px 16px;
    box-shadow: 0 16px 36px rgba(0,0,0,.28);
    display: flex; flex-direction: column;
    gap: 16px;
  }
  .setting { display: flex; flex-direction: column; gap: 9px; }
  .setting .head { display: flex; justify-content: space-between; align-items: baseline; }
  .setting .label { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
  .setting .value {
    font-size: 24px; font-weight: 900;
    color: var(--yellow);
    font-variant-numeric: tabular-nums;
  }
  .setting .value small { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 3px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg button {
    border: none; cursor: pointer;
    font-weight: 900; font-size: 15px;
    color: #fff;
    background: var(--chip);
    border-radius: 14px;
    padding: 11px 6px;
    box-shadow: 0 4px 0 rgba(0,0,0,.28);
    transition: transform .12s, background .2s, box-shadow .2s, color .2s;
  }
  .seg button:active { transform: translateY(3px); }
  .seg button.on.lucky   { background: var(--yellow); color: #4a2f00; box-shadow: 0 4px 0 var(--yellow-d); }
  .seg button.on.unlucky { background: var(--pink);   color: #fff;    box-shadow: 0 4px 0 var(--pink-d); }
  .seg button.on.join    { background: var(--cyan);   color: #06303a; box-shadow: 0 4px 0 var(--cyan-d); }
  .note { font-size: 12.5px; line-height: 1.55; color: var(--muted); opacity: .9; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 12px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--yellow), var(--pink)) 0 0 / var(--p, 50%) 100% no-repeat, rgba(255,255,255,.16);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid var(--pink);
    box-shadow: 0 3px 0 var(--pink-d), 0 6px 14px rgba(0,0,0,.3);
    transition: transform .15s;
  }
  input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.18); }
  input[type="range"]::-moz-range-thumb {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid var(--pink);
    box-shadow: 0 3px 0 var(--pink-d);
    cursor: pointer;
  }

  .btn-main {
    border: none; cursor: pointer;
    font-size: clamp(20px, 5.5vw, 23px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #4a2f00;
    background: linear-gradient(180deg, #ffe680, var(--yellow));
    padding: 15px 50px;
    border-radius: 999px;
    box-shadow: 0 7px 0 var(--yellow-d), 0 14px 26px rgba(255,210,63,.4);
    transition: transform .1s, box-shadow .1s;
  }
  .btn-main:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--yellow-d), 0 8px 16px rgba(255,210,63,.35); }
  #goBtn { animation: btnPulse 2s ease-in-out infinite; }
  #goBtn:active { animation: none; }
  @keyframes btnPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .btn-sub {
    border: 1px solid var(--panel-b); cursor: pointer;
    font-size: clamp(16px, 4.5vw, 19px);
    font-weight: 900;
    color: #fff;
    background: var(--panel);
    padding: 15px 26px;
    border-radius: 999px;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
    transition: transform .1s, box-shadow .1s;
  }
  .btn-sub:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }

  .shareRow {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    width: min(92vw, 400px);
  }
  .btn-mini {
    border: 1px solid var(--panel-b);
    background: var(--panel);
    color: #fff;
    font-weight: 900; font-size: 13.5px;
    padding: 11px 4px;
    border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,.28);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
    white-space: nowrap;
  }
  .btn-mini:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
  .btn-mini.done { opacity: .6; }

  .tipBar {
    width: min(92vw, 400px);
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,210,63,.13);
    border: 1px solid rgba(255,210,63,.5);
    color: #ffe9a8;
    border-radius: 14px;
    padding: 9px 8px 9px 12px;
    font-size: 13px; font-weight: 700; line-height: 1.5;
    cursor: pointer;
    animation: fadeUp .5s ease both;
  }
  .tipBar span { flex: 1; }
  .tipBar button {
    flex: none;
    width: 30px; height: 30px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,.1);
    color: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* =========================================================
     遊戲中介面
     ========================================================= */
  #timer {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(130px, 36vw, 260px);
    font-weight: 900;
    color: #fff;
    opacity: .2;
    z-index: 1;
    display: none;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    text-shadow: 0 10px 0 rgba(0,0,0,.25);
  }
  #timer.idle { opacity: .1; }
  #timer.tick { animation: tickPop .35s ease-out; }
  @keyframes tickPop {
    0%   { transform: translate(-50%,-50%) scale(1.2); opacity: .4; }
    100% { transform: translate(-50%,-50%) scale(1);   opacity: .2; }
  }
  #timer.warn { color: var(--yellow); opacity: .55; }
  #timer.warn.tick { animation: tickWarn .35s ease-out; }
  @keyframes tickWarn {
    0%   { transform: translate(-50%,-50%) scale(1.3); }
    60%  { transform: translate(-50%,-50%) scale(.95); }
    100% { transform: translate(-50%,-50%) scale(1); }
  }
  #timer.danger {
    color: var(--danger); opacity: .9;
    text-shadow: 0 10px 0 #8a0f33, 0 0 40px #ff3d6eaa;
  }
  #timer.danger.tick { animation: tickDanger .4s cubic-bezier(.2,1.6,.5,1); }
  @keyframes tickDanger {
    0%   { transform: translate(-50%,-50%) scale(1.55) rotate(-4deg); }
    50%  { transform: translate(-50%,-50%) scale(1.05) rotate(2deg); }
    100% { transform: translate(-50%,-50%) scale(1) rotate(0); }
  }
  #timer.final, #timer.final.tick { animation: shake .14s linear infinite; }
  @keyframes shake {
    0%, 100% { transform: translate(-50%,-50%); }
    25%      { transform: translate(calc(-50% - 7px), -50%) rotate(-2deg); }
    75%      { transform: translate(calc(-50% + 7px), -50%) rotate(2deg); }
  }

  #exitBtn {
    position: fixed;
    top: calc(var(--st) + 32px); left: 16px;
    z-index: 21;
    display: none;
  }

  #ringWrap {
    position: fixed;
    top: calc(var(--st) + 18px); left: 50%;
    transform: translateX(-50%);
    width: 72px; height: 72px;
    z-index: 20;
    display: none;
    border-radius: 50%;
    background: var(--panel);
  }
  #ringWrap svg { transform: rotate(-90deg); display: block; }
  #ringBg { stroke: rgba(255,255,255,.18); }
  #ringFg { stroke: url(#grad); stroke-linecap: round; }
  #ringWrap.danger #ringFg { stroke: url(#gradDanger); }
  #ringIcon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  #ringWrap.danger { animation: ringShake .3s linear infinite; }
  @keyframes ringShake {
    0%,100% { transform: translateX(-50%) rotate(0); }
    25%     { transform: translateX(-50%) rotate(-8deg); }
    75%     { transform: translateX(-50%) rotate(8deg); }
  }

  #hint, #count {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 800;
    letter-spacing: 1px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-b);
    z-index: 20;
    display: none;
    white-space: nowrap;
    pointer-events: none;
  }
  #hint {
    top: calc(var(--st) + 104px);
    font-size: clamp(15px, 4vw, 17px);
    padding: 10px 22px;
    animation: hintFloat 1.8s ease-in-out infinite alternate;
  }
  @keyframes hintFloat {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-5px); }
  }
  #count {
    bottom: calc(var(--sb) + 28px);
    font-size: 17px;
    padding: 12px 26px;
  }
  #count b { color: var(--yellow); font-size: 23px; margin: 0 3px; }
  #count.bump { animation: bump .3s cubic-bezier(.2,1.7,.5,1); }
  @keyframes bump {
    from { transform: translateX(-50%) scale(1.15); }
    to   { transform: translateX(-50%) scale(1); }
  }

  /* =========================================================
     結果
     ========================================================= */
  #result {
    position: fixed; inset: 0;
    z-index: 25;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s;
  }
  #result.show { opacity: 1; }
  #resultTop {
    position: absolute;
    top: calc(var(--st) + 34px); left: 0; right: 0;
    text-align: center;
    padding: 0 16px;
  }
  #result .big {
    display: inline-block;
    font-size: clamp(38px, 11vw, 80px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 6px 0 var(--wd, #6236d1), 0 0 36px var(--wc, #ff4fa3);
  }
  #result.show .big { animation: bannerIn .7s cubic-bezier(.2,1.7,.5,1) both; }
  @keyframes bannerIn {
    from { transform: scale(.2) rotate(-10deg); opacity: 0; }
    to   { transform: scale(1) rotate(0); opacity: 1; }
  }
  #result .sub {
    margin-top: 6px;
    font-size: clamp(14px, 3.8vw, 17px);
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--muted);
  }
  #result .who {
    margin-top: 10px;
    display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
  }
  #result .who span {
    font-size: 15px; font-weight: 900;
    padding: 5px 14px;
    border-radius: 999px;
    background: #fff;
    color: var(--cd);
    box-shadow: 0 3px 0 var(--cd);
  }
  #result .meta {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  #resultBtns {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(var(--sb) + 28px);
    display: flex; justify-content: center; gap: 12px;
    padding: 0 16px;
  }
  #result.show #resultBtns { pointer-events: auto; animation: slideUp .5s .35s both; }
  @keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  /* =========================================================
     彈窗與提示
     ========================================================= */
  #modal {
    position: fixed; inset: 0;
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(10,5,30,.65);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  #modal.show { opacity: 1; pointer-events: auto; }
  .mcard {
    width: min(92vw, 380px);
    max-height: 85vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(160deg, #3b1d7a, #1a1145);
    border: 1px solid var(--panel-b);
    border-radius: 24px;
    padding: 22px 20px 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
    transform: scale(.88);
    transition: transform .3s cubic-bezier(.2,1.7,.5,1);
    touch-action: pan-y;
  }
  #modal.show .mcard { transform: scale(1); }
  .mcard h3 {
    font-size: 21px; font-weight: 900;
    text-align: center;
    margin-bottom: 10px;
    color: var(--yellow);
  }
  .mstep {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    font-size: 14.5px; line-height: 1.6;
  }
  .mstep + .mstep { border-top: 1px dashed rgba(255,255,255,.15); }
  .mstep .num {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--pink);
    font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--pink-d);
  }
  .mstep .gicon {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 12px;
    background: rgba(255,255,255,.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .mstep b { color: var(--yellow); }
  .mnote {
    margin-top: 10px;
    font-size: 13px; line-height: 1.7;
    color: var(--muted);
    background: rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .mlink {
    margin-top: 10px;
    font-size: 13px; line-height: 1.6;
    word-break: break-all;
    background: rgba(0,0,0,.25);
    padding: 10px 12px;
    border-radius: 12px;
    -webkit-user-select: text;
    user-select: text;
  }
  #mclose {
    display: block;
    margin: 16px auto 0;
    padding: 12px 44px;
    font-size: 18px;
  }

  #toast {
    position: fixed;
    left: 50%;
    top: calc(var(--st) + 160px);
    transform: translate(-50%, -10px);
    z-index: 70;
    width: max-content;
    max-width: calc(100vw - 32px);
    background: #fff;
    color: #3b1d7a;
    font-weight: 900; font-size: 14.5px; line-height: 1.5;
    text-align: center;
    white-space: pre-line;
    padding: 11px 20px;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 系統設定「減少動態效果」時，關閉大部分動畫 */
  @media (prefers-reduced-motion: reduce) {
    .blob, .stars, .shape, .logo, #title span, #goBtn, #hint,
    .player .orb, .player .spin, #ringWrap.danger, #vignette.pulse { animation: none !important; }
  }
</style>
</head>
<body>

<div id="bgDeco">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="stars"></div>
</div>

<div id="timer">10</div>
<div id="stage"></div>
<div id="vignette"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<!-- 遊戲中介面 -->
<button class="iconBtn" id="exitBtn" aria-label="離開">✕</button>
<div id="ringWrap">
  <svg width="72" height="72" viewBox="0 0 72 72">
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#ffd23f"/>
        <stop offset="100%" stop-color="#ff4fa3"/>
      </linearGradient>
      <linearGradient id="gradDanger" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#ff3d6e"/>
        <stop offset="100%" stop-color="#ff8a3d"/>
      </linearGradient>
    </defs>
    <circle id="ringBg" cx="36" cy="36" r="30" fill="none" stroke-width="7"/>
    <circle id="ringFg" cx="36" cy="36" r="30" fill="none" stroke-width="7"
            stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
  </svg>
  <div id="ringIcon">⏱</div>
</div>
<div id="hint"></div>
<div id="count"></div>

<!-- 結果 -->
<div id="result">
  <div id="resultTop">
    <div class="big"></div>
    <div class="sub"></div>
    <div class="who"></div>
    <div class="meta"></div>
  </div>
  <div id="resultBtns">
    <button class="btn-main" id="againBtn">🔁 再來一局</button>
    <button class="btn-sub" id="menuBtn">🏠 選單</button>
  </div>
</div>

<!-- 封面 -->
<div id="intro">
  <div class="introTools">
    <button class="iconBtn" id="soundBtn" aria-label="音效">🔊</button>
    <button class="iconBtn" id="vibeBtn" aria-label="震動">📳</button>
  </div>

  <div class="introInner">
    <div class="logo" role="img" aria-label="幸運一指"></div>

    <button id="titleBtn" aria-label="開始遊戲">
      <span id="title"><span>幸</span><span>運</span><span>一</span><span>指</span></span>
      <span class="en">LUCKY&nbsp;TOUCH</span>
    </button>
    <p class="tagline">大家一起參加，倒數結束<b>隨機抽出</b>！</p>

    <div id="card">
      <div class="setting">
        <div class="head"><span class="label">🎲 遊戲模式</span></div>
        <div class="seg" id="modeSeg">
          <button class="lucky"   data-mode="lucky">🍀 抽幸運兒</button>
          <button class="unlucky" data-mode="unlucky">💣 抓倒楣鬼</button>
        </div>
      </div>

      <div class="setting">
        <div class="head"><span class="label">👆 加入方式</span></div>
        <div class="seg" id="joinSeg">
          <button class="join" data-join="hold">✋ 一起按住</button>
          <button class="join" data-join="tap">👉 輪流點一下</button>
        </div>
        <div class="note" id="joinNote"></div>
      </div>

      <div class="setting">
        <div class="head">
          <span class="label">⏱ 倒數時間</span>
          <span class="value"><span id="secVal">10</span><small>秒</small></span>
        </div>
        <input type="range" id="secRange" min="3" max="30" step="1" value="10">
      </div>

      <div class="setting">
        <div class="head">
          <span class="label">🎯 抽出人數</span>
          <span class="value"><span id="numVal">1</span><small>人</small></span>
        </div>
        <input type="range" id="numRange" min="1" max="10" step="1" value="1">
      </div>
    </div>

    <button class="btn-main" id="goBtn">開始遊戲 ▶</button>

    <div class="shareRow">
      <button class="btn-mini" id="installBtn">📲 存到桌面</button>
      <button class="btn-mini" id="shareBtn">🔗 分享</button>
      <button class="btn-mini" id="guideBtn">❓ 玩法</button>
    </div>

    <div class="tipBar hidden" id="tipBar">
      <span id="tipText"></span>
      <button id="tipClose" aria-label="關閉提示">✕</button>
    </div>
  </div>
</div>

<!-- 彈窗與提示 -->
<div id="modal">
  <div class="mcard">
    <h3 id="mtitle"></h3>
    <div id="mbody"></div>
    <button class="btn-main" id="mclose">知道了</button>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  /* =========================================================
     元件
     ========================================================= */
  const stage      = $('stage');
  const fxCanvas   = $('fx');
  const countEl    = $('count');
  const intro      = $('intro');
  const timerEl    = $('timer');
  const ringWrap   = $('ringWrap');
  const ringFg     = $('ringFg');
  const hint       = $('hint');
  const result     = $('result');
  const vignette   = $('vignette');
  const flash      = $('flash');
  const exitBtn    = $('exitBtn');
  const secRange   = $('secRange');
  const numRange   = $('numRange');
  const secVal     = $('secVal');
  const numVal     = $('numVal');
  const soundBtn   = $('soundBtn');
  const vibeBtn    = $('vibeBtn');
  const joinNote   = $('joinNote');
  const installBtn = $('installBtn');
  const shareBtn   = $('shareBtn');
  const modal      = $('modal');
  const mbody      = $('mbody');
  const toastEl    = $('toast');
  const tipBar     = $('tipBar');
  const tipText    = $('tipText');
  const tipClose   = $('tipClose');

  /* =========================================================
     常數
     ========================================================= */
  const PALETTE = [
    ['#ff4fa3', '#c92a78'], ['#3be8ff', '#139ab8'], ['#ffd23f', '#d19c00'],
    ['#4cff9b', '#1fae62'], ['#9b6bff', '#6236d1'], ['#ff8a3d', '#c95a12'],
    ['#ff5e5e', '#c22f2f'], ['#5e8bff', '#2f55c9'], ['#c46bff', '#8a2fc9'],
    ['#3dffd8', '#13b096']
  ];
  const FACES = ['😀','😎','🤩','😜','🥳','😺','🐶','🦊','🐼','🐸',
                 '🐵','🦄','🐯','🐰','🐻','🐧','🐨','🐷','🐙','🐳'];
  const CIRC = 2 * Math.PI * 30;
  const MAX_PARTICLES = 700;

  const UA = navigator.userAgent;
  const isIOS  = /iPhone|iPad|iPod/i.test(UA) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isLine = /\bLine\//i.test(UA);
  const SHARE_TITLE = '幸運一指 Lucky Touch';
  const SHARE_TEXT  = '👆 幸運一指 Lucky Touch\n' +
                      '大家一起把手指按在螢幕上，倒數結束隨機抽出幸運兒或倒楣鬼！\n' +
                      '免下載，點開就能玩 👇';

  /* =========================================================
     狀態
     ========================================================= */
  let phase = 'menu';            // menu / join / draw / result
  const players = new Map();
  let joinSeq = 0;
  let tapSeq  = 0;
  let faces   = FACES.slice();
  let ROUND   = 10;
  let PICK    = 1;
  let MODE    = 'lucky';         // lucky：抽幸運兒 / unlucky：抓倒楣鬼
  let JOIN    = 'hold';          // hold：一起按住 / tap：輪流點一下
  let soundOn = true;
  let vibeOn  = true;
  let startTime = null;
  let lastSec   = null;
  let rafId     = null;
  let drawTimer = null;
  let hideTimer = null;
  let roundTips = {};
  let cancelTimes = [];
  let interrupted = false;

  /* =========================================================
     存檔（設定＋看過的提醒）
     ========================================================= */
  try {
    const s = JSON.parse(localStorage.getItem('luckyTouch') || '{}');
    if (s.sec >= 3 && s.sec <= 30)  ROUND = s.sec;
    if (s.pick >= 1 && s.pick <= 10) PICK = s.pick;
    if (s.mode === 'lucky' || s.mode === 'unlucky') MODE = s.mode;
    if (s.join === 'hold' || s.join === 'tap') JOIN = s.join;
    if (typeof s.sound === 'boolean') soundOn = s.sound;
    if (typeof s.vibe  === 'boolean') vibeOn  = s.vibe;
  } catch (e) {}
  function save() {
    try {
      localStorage.setItem('luckyTouch', JSON.stringify({
        sec: ROUND, pick: PICK, mode: MODE, join: JOIN, sound: soundOn, vibe: vibeOn
      }));
    } catch (e) {}
  }

  let tips = {};
  try { tips = JSON.parse(localStorage.getItem('luckyTouchTips') || '{}') || {}; } catch (e) { tips = {}; }
  function tipSeen(k) { return !!tips[k]; }
  function markTip(k) {
    tips[k] = 1;
    try { localStorage.setItem('luckyTouchTips', JSON.stringify(tips)); } catch (e) {}
  }

  /* =========================================================
     音效
     ========================================================= */
  let actx = null, master = null, noiseBuf = null;
  function audio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain();
        master.gain.value = .9;
        master.connect(actx.destination);
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur = .12, type = 'sine', vol = .18, when = 0, slideTo = null) {
    if (!soundOn) return;
    const ac = audio(); if (!ac) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur = .08, vol = .15, freq = 2000, when = 0, type = 'bandpass') {
    if (!soundOn) return;
    const ac = audio(); if (!ac) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * .6), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime + when;
    const s = ac.createBufferSource();
    s.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + .02);
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31];
  const sfx = {
    ui()    { tone(880, .06, 'triangle', .1); },
    slide() { tone(720, .035, 'sine', .06); },
    join(n) {
      const f = 523.25 * Math.pow(2, PENTA[(n - 1) % PENTA.length] / 12);
      tone(f, .16, 'triangle', .16);
      tone(f * 2, .1, 'sine', .06, .04);
      noise(.05, .08, 4000);
    },
    leave()  { tone(500, .16, 'sine', .1, 0, 240); },
    tick()   { tone(660, .08, 'triangle', .1); noise(.03, .05, 6000); },
    tickHi() { tone(880, .08, 'triangle', .12); noise(.03, .06, 6000); },
    urgent() { tone(1175, .08, 'square', .08); },
    final()  { tone(1320, .06, 'square', .1); tone(1568, .06, 'square', .1, .12); },
    heart(s = 1) { tone(70, .14, 'sine', .3 * s); tone(55, .18, 'sine', .25 * s, .16); },
    start()  { [523, 659, 784, 1046].forEach((f, i) => tone(f, .16, 'triangle', .13, i * .07)); },
    whoosh() { tone(180, .4, 'sawtooth', .07, 0, 1800); noise(.4, .12, 1500, 0, 'highpass'); },
    roll(p)  { tone(420 + p * 900, .05, 'square', .05); noise(.04, .1, 1200 + p * 3000); },
    win() {
      const ch = [[523, 659, 784], [587, 740, 880], [659, 831, 988], [1046, 1318, 1568]];
      ch.forEach((c, i) => c.forEach(f => tone(f, i === 3 ? .7 : .18, 'triangle', .1, i * .13)));
      for (let i = 0; i < 10; i++) tone(1568 + Math.random() * 1600, .08, 'sine', .05, .55 + i * .06);
      noise(.5, .15, 3000, .39, 'highpass');
    },
    sad() {
      [392, 370, 349].forEach((f, i) => tone(f, .32, 'sawtooth', .08, i * .34, f * .96));
      tone(330, .9, 'sawtooth', .09, 1.02, 270);
      noise(.35, .14, 220, 0, 'lowpass');
    }
  };
  function buzz(p) {
    if (!vibeOn || !navigator.vibrate) return;
    try { navigator.vibrate(p); } catch (e) {}
  }

  /* =========================================================
     粒子特效（彩帶、爆點）
     ========================================================= */
  const ctx = fxCanvas.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    fxCanvas.width = W * dpr; fxCanvas.height = H * dpr;
    fxCanvas.style.width = W + 'px'; fxCanvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const parts = [];
  let fxRunning = false;
  function runFx() {
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
  }
  function burst(x, y, colors, n = 20, power = 6, confetti = false) {
    n = Math.min(n, MAX_PARTICLES - parts.length);
    for (let i = 0; i < n; i++) {
      const a  = Math.random() * Math.PI * 2;
      const sp = power * (.4 + Math.random() * .8);
      parts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (confetti ? power * .6 : 0),
        g: confetti ? .18 : .05,
        life: 1,
        decay: confetti ? .006 + Math.random() * .006 : .03 + Math.random() * .02,
        size: confetti ? 6 + Math.random() * 6 : 3 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 6,
        vr: (Math.random() - .5) * .3,
        rect: confetti && Math.random() < .5
      });
    }
    runFx();
  }
  function rain(colors, n = 120) {
    n = Math.min(n, MAX_PARTICLES - parts.length);
    for (let i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * .6,
        vx: (Math.random() - .5) * 2,
        vy: 2 + Math.random() * 3,
        g: .04,
        life: 1,
        decay: .003 + Math.random() * .003,
        size: 6 + Math.random() * 7,
        color: colors[i % colors.length],
        rot: Math.random() * 6,
        vr: (Math.random() - .5) * .25,
        rect: Math.random() < .6
      });
    }
    runFx();
  }
  function fxLoop() {
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vx *= .99;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;
      if (p.life <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      ctx.fillStyle = p.color;
      if (p.rect) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(fxLoop);
    else { fxRunning = false; ctx.clearRect(0, 0, W, H); }
  }

  (function makeShapes() {
    const deco = $('bgDeco');
    const SH = ['✦', '●', '▲', '★', '◆', '✚'];
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('span');
      s.className = 'shape';
      s.textContent = SH[i % SH.length];
      s.style.left = (5 + Math.random() * 90) + '%';
      s.style.top  = (5 + Math.random() * 90) + '%';
      s.style.fontSize = (14 + Math.random() * 18) + 'px';
      s.style.color = PALETTE[i % PALETTE.length][0];
      s.style.animationDuration = (10 + Math.random() * 10) + 's';
      s.style.animationDelay = (-Math.random() * 15) + 's';
      deco.appendChild(s);
    }
  })();

  /* =========================================================
     提醒：小提示條、吐司訊息、彈窗
     ========================================================= */
  let toastTimer = null;
  function toast(msg, ms = 2600) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }
  function escapeHtml(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function openModal(title, html, btnText = '知道了') {
    $('mtitle').textContent = title;
    mbody.innerHTML = html;
    $('mclose').textContent = btnText;
    modal.classList.add('show');
  }
  function closeModal() { modal.classList.remove('show'); }
  function mstep(n, html) {
    return `<div class="mstep"><span class="num">${n}</span><div>${html}</div></div>`;
  }
  function gstep(icon, html) {
    return `<div class="mstep"><span class="gicon">${icon}</span><div>${html}</div></div>`;
  }
  $('mclose').addEventListener('click', () => { sfx.ui(); closeModal(); });
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  function openGuide() {
    const html =
      gstep('🎲', '<b>選好模式</b><br>抽幸運兒或抓倒楣鬼，再設定倒數秒數和要抽幾人') +
      gstep('👆', '<b>加入遊戲</b><br>「一起按住」：大家同時按住螢幕，放開就退出（iPhone 最多 5 人）<br>' +
                  '「輪流點一下」：每人點一下就報名，人數不限，點自己的球可以取消') +
      gstep('⏳', '<b>開始倒數</b><br>第一個人加入就開始倒數，最後 3 秒畫面會變紅提醒') +
      gstep('🎉', '<b>揭曉結果</b><br>轉盤停下的就是被選中的人，按「再來一局」馬上重玩') +
      '<div class="mnote">🔈 iPhone 開著靜音模式時不會有音效<br>' +
      '📲 加到主畫面，打開就是全螢幕<br>' +
      '✕ 遊戲中按左上角可以隨時離開</div>';
    openModal('❓ 玩法說明', html, '開始玩吧！');
    markTip('guide');
  }
  $('guideBtn').addEventListener('click', () => { sfx.ui(); openGuide(); });

  /* =========================================================
     存到桌面／分享
     ========================================================= */
  let deferredPrompt = null;
  function isStandalone() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
           navigator.standalone === true;
  }

  (function setupAppMeta() {
    try {
      const icon180 = $('appIcon').href;
      const icon192 = $('appIcon192').href;
      document.querySelector('.logo').style.backgroundImage = 'url("' + icon180 + '")';
      const manifest = {
        name: SHARE_TITLE,
        short_name: '幸運一指',
        start_url: location.href.split('#')[0],
        display: 'standalone',
        background_color: '#1a1145',
        theme_color: '#1a1145',
        icons: [{ src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' }]
      };
      const m = document.createElement('link');
      m.rel = 'manifest';
      m.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      document.head.appendChild(m);
    } catch (e) {}
  })();

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
  });
  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    refreshInstall();
    tipBar.classList.add('hidden');
    toast('✅ 已加入主畫面！');
  });
  function refreshInstall() {
    if (isStandalone()) {
      installBtn.textContent = '✅ 已在桌面';
      installBtn.classList.add('done');
    }
  }

  function showInstallGuide() {
    if (isStandalone()) { toast('已經在主畫面囉 👍'); return; }
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; }).catch(() => {});
      return;
    }
    let html = '';
    if (isLine) {
      html += mstep(1, '點右下角的 <b>⋯</b>（或右上角選單）<br>選「<b>以預設瀏覽器開啟</b>」');
      html += mstep(2, '在瀏覽器打開後，再按一次「📲 存到桌面」看教學');
      html += '<div class="mnote">LINE 內建的瀏覽器不能加入主畫面，要先換到 Safari 或 Chrome。</div>';
    } else if (isIOS) {
      html += mstep(1, '點畫面下方（或上方）的 <b>分享按鈕</b> ⬆️');
      html += mstep(2, '往下滑，點「<b>加入主畫面</b>」➕');
      html += mstep(3, '按右上角「<b>新增</b>」，桌面就會出現遊戲圖示');
      html += '<div class="mnote">建議用 Safari。從桌面圖示打開會是全螢幕，沒有網址列。<br>' +
              '之前加過舊版的話，請先刪掉再重新加入，圖示才會更新。</div>';
    } else {
      html += mstep(1, '點瀏覽器右上角的 <b>⋮</b> 選單');
      html += mstep(2, '點「<b>加到主畫面</b>」或「<b>安裝應用程式</b>」');
      html += mstep(3, '按「<b>新增</b>」，桌面就會出現遊戲圖示');
    }
    openModal('📲 存到桌面', html);
  }
  installBtn.addEventListener('click', () => { sfx.ui(); showInstallGuide(); });

  function showLink(text) {
    openModal('🔗 分享給朋友',
      '<div style="font-size:15px;line-height:1.6">長按下面的文字複製，再貼給朋友：</div>' +
      '<div class="mlink">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>');
  }
  shareBtn.addEventListener('click', () => {
    sfx.ui();
    const url = location.href.split('#')[0];
    if (location.protocol === 'file:') {
      openModal('🔗 分享給朋友',
        '<div class="mnote">目前是直接打開手機裡的檔案，別人點不到這個位置。<br>' +
        '請先把檔案放到網路上（例如 GitHub Pages），再從網址打開後分享。</div>');
      return;
    }
    if (navigator.share) {
      navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url }).catch(() => {});
      return;
    }
    const full = SHARE_TEXT + '\n' + url;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full)
        .then(() => toast('✅ 已複製連結，貼給朋友吧！'))
        .catch(() => showLink(full));
    } else {
      showLink(full);
    }
  });

  /* 封面小提示條：LINE 提醒優先，其次是存到桌面 */
  function setupTipBar() {
    let key = null;
    if (isLine) {
      key = 'line';
      tipText.textContent = '在 LINE 裡打開？點右下角 ⋯ 改用 Safari 開啟，音效和存到桌面比較完整';
    } else if (!isStandalone() && !tipSeen('installTip')) {
      key = 'installTip';
      tipText.textContent = '📲 加到主畫面，打開就是全螢幕 App（點這裡看教學）';
    }
    if (!key) return;
    tipBar.classList.remove('hidden');
    tipBar.addEventListener('click', e => {
      if (e.target === tipClose) return;
      sfx.ui();
      showInstallGuide();
    });
    tipClose.addEventListener('click', e => {
      e.stopPropagation();
      tipBar.classList.add('hidden');
      if (key === 'installTip') markTip('installTip');
    });
  }

  /* =========================================================
     設定介面
     ========================================================= */
  function setFill(el) {
    const p = (el.value - el.min) / (el.max - el.min) * 100;
    el.style.setProperty('--p', p + '%');
  }
  function bindRange(el, valEl, onChange) {
    let last = +el.value;
    el.addEventListener('input', () => {
      const v = +el.value;
      valEl.textContent = v;
      setFill(el);
      if (v !== last) { last = v; sfx.slide(); buzz(5); }
      onChange(v);
      save();
    });
  }
  secRange.value = ROUND; secVal.textContent = ROUND; setFill(secRange);
  numRange.value = PICK;  numVal.textContent = PICK;  setFill(numRange);
  bindRange(secRange, secVal, v => { ROUND = v; });
  bindRange(numRange, numVal, v => { PICK = v; });

  const modeBtns = document.querySelectorAll('#modeSeg button');
  function refreshMode() {
    modeBtns.forEach(b => b.classList.toggle('on', b.dataset.mode === MODE));
  }
  modeBtns.forEach(b => b.addEventListener('click', () => {
    MODE = b.dataset.mode;
    refreshMode();
    sfx.ui(); buzz(10);
    save();
  }));

  const joinBtns = document.querySelectorAll('#joinSeg button');
  function refreshJoin() {
    joinBtns.forEach(b => b.classList.toggle('on', b.dataset.join === JOIN));
    joinNote.textContent = JOIN === 'hold'
      ? '大家同時按住螢幕，放開就退出。iPhone 最多只能同時偵測 5 根手指。'
      : '每人點一下就報名，手指可以放開，人數不限。點自己的球可以取消。';
  }
  joinBtns.forEach(b => b.addEventListener('click', () => {
    JOIN = b.dataset.join;
    refreshJoin();
    sfx.ui(); buzz(10);
    save();
  }));

  function refreshToggles() {
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    vibeBtn.textContent  = vibeOn  ? '📳' : '📴';
    soundBtn.classList.toggle('off', !soundOn);
    vibeBtn.classList.toggle('off', !vibeOn);
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    refreshToggles();
    if (soundOn) sfx.ui();
    toast(soundOn ? '🔊 音效已開啟' : '🔇 音效已關閉', 1400);
    save();
  });
  vibeBtn.addEventListener('click', () => {
    vibeOn = !vibeOn;
    refreshToggles();
    buzz(30);
    if (vibeOn && !navigator.vibrate) toast('📳 這台手機的瀏覽器不支援震動', 2200);
    else toast(vibeOn ? '📳 震動已開啟' : '📴 震動已關閉', 1400);
    save();
  });

  /* =========================================================
     遊戲畫面
     ========================================================= */
  function updateCount(bump) {
    const n = players.size;
    const icon = JOIN === 'hold' ? '👆' : '👉';
    countEl.innerHTML = n ? `${icon} <b>${n}</b> 人已加入` : '等待玩家加入…';
    if (bump) {
      countEl.classList.remove('bump');
      void countEl.offsetWidth;
      countEl.classList.add('bump');
    }
  }
  function setRing(p) {
    ringFg.style.strokeDashoffset = CIRC * (1 - p);
  }
  function idleUI() {
    timerEl.textContent = ROUND;
    timerEl.className = 'idle';
    setRing(0);
    ringWrap.classList.remove('danger');
    vignette.classList.remove('on', 'pulse');
    hint.textContent = JOIN === 'hold' ? '大家把手指放上來！☝️' : '輪流點一下螢幕報名！👉';
  }
  // 人多時自動把光球縮小，避免擠成一團
  function updateOrbScale() {
    const n = players.size;
    const s = n > 16 ? .6 : n > 10 ? .72 : n > 6 ? .86 : 1;
    stage.style.setProperty('--ps', s);
    return s;
  }

  function addPlayer(id, x, y) {
    const [c, cd] = PALETTE[joinSeq % PALETTE.length];
    const face = faces[joinSeq % faces.length];
    joinSeq++;

    const el = document.createElement('div');
    el.className = 'player';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.setProperty('--c', c);
    el.style.setProperty('--cd', cd);
    el.style.setProperty('--cg', c + '77');
    el.innerHTML =
      `<div class="rays"></div>` +
      `<div class="body"><div class="spin"></div>` +
      `<div class="orb"><span class="face">${face}</span></div>` +
      `<div class="tag">${joinSeq}</div></div>`;
    stage.appendChild(el);

    const rip = document.createElement('div');
    rip.className = 'ripple';
    rip.style.left = x + 'px';
    rip.style.top  = y + 'px';
    rip.style.setProperty('--c', c);
    stage.appendChild(rip);
    rip.addEventListener('animationend', () => rip.remove());

    players.set(id, { el, color: c, dark: cd, x, y, no: joinSeq });
    updateOrbScale();
    burst(x, y, [c, '#ffffff'], 14, 5);
    sfx.join(players.size);
    buzz(15);
    updateCount(true);

    // 提醒：iPhone 一起按住最多 5 人
    if (JOIN === 'hold' && isIOS && players.size === 5 && !roundTips.five) {
      roundTips.five = 1;
      toast('iPhone 最多同時偵測 5 根手指\n人更多請改用「輪流點一下」', 3200);
    }
    onPlayersChanged();
  }

  function removePlayer(id) {
    const p = players.get(id);
    if (!p) return;
    burst(p.x, p.y, [p.color], 8, 3);
    p.el.remove();
    players.delete(id);
    updateOrbScale();
    updateCount(true);
    sfx.leave();
    onPlayersChanged();
  }

  function onPlayersChanged() {
    if (phase !== 'join') return;
    if (players.size > 0 && startTime === null) {
      startTime = performance.now();
      lastSec = null;
      hint.textContent = JOIN === 'hold' ? '按住別放開！倒數中 ⏳' : '還沒點的快點！倒數中 ⏳';
    } else if (players.size === 0 && startTime !== null) {
      startTime = null;
      idleUI();
      if (JOIN === 'hold') toast('大家都放開了，倒數重新開始', 1800);
    }
  }

  /* =========================================================
     觸控
     ========================================================= */
  stage.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (phase !== 'join') return;

    if (JOIN === 'tap') {
      // 點到自己的球 → 取消；點空白處 → 新增一位
      const hitR = 46 * updateOrbScale();
      let hitId = null, best = Infinity;
      players.forEach((p, id) => {
        const d = Math.hypot(p.x - e.clientX, p.y - e.clientY);
        if (d < hitR && d < best) { best = d; hitId = id; }
      });
      if (hitId !== null) { removePlayer(hitId); return; }
      tapSeq++;
      addPlayer('tap' + tapSeq, e.clientX, e.clientY);
      return;
    }

    if (players.has(e.pointerId)) return;
    addPlayer(e.pointerId, e.clientX, e.clientY);
  });

  stage.addEventListener('pointermove', e => {
    if (JOIN !== 'hold') return;
    if (phase !== 'join' && phase !== 'draw') return;
    const p = players.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    p.el.style.left = p.x + 'px';
    p.el.style.top  = p.y + 'px';
  });

  function release(e) {
    if (JOIN !== 'hold' || phase !== 'join') return;
    removePlayer(e.pointerId);
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', e => {
    // 提醒：短時間內多根手指同時被取消，通常是超過系統上限
    if (JOIN === 'hold' && phase === 'join' && players.has(e.pointerId)) {
      const now = performance.now();
      cancelTimes = cancelTimes.filter(t => now - t < 250);
      cancelTimes.push(now);
      if (cancelTimes.length >= 2 && !roundTips.cancel) {
        roundTips.cancel = 1;
        toast('手指太多，系統取消了觸控 🙈\n人多請改用「輪流點一下」', 3500);
      }
    }
    release(e);
  });

  document.addEventListener('touchmove', e => {
    if (phase !== 'menu') e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  /* =========================================================
     流程：開始 → 倒數 → 抽選 → 結果
     ========================================================= */
  $('goBtn').addEventListener('click', startGame);
  $('titleBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', () => { sfx.ui(); backToMenu(); });
  exitBtn.addEventListener('click', e => { e.stopPropagation(); sfx.ui(); backToMenu(); });

  function clearTimers() {
    if (rafId)     { cancelAnimationFrame(rafId); rafId = null; }
    if (drawTimer) { clearTimeout(drawTimer); drawTimer = null; }
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  }
  function clearPlayers() {
    players.clear();
    stage.innerHTML = '';
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function setHud(show) {
    const d = show ? 'block' : 'none';
    timerEl.style.display = d;
    ringWrap.style.display = d;
    hint.style.display = d;
    countEl.style.display = d;
    exitBtn.style.display = show ? 'flex' : 'none';
  }

  function startGame() {
    if (phase === 'join' || phase === 'draw') return;
    audio();
    sfx.start();
    buzz(20);
    closeModal();

    clearTimers();
    clearPlayers();
    parts.length = 0;

    ROUND = +secRange.value;
    PICK  = +numRange.value;
    faces = shuffle(FACES.slice());
    joinSeq = 0;
    tapSeq = 0;
    roundTips = {};
    cancelTimes = [];
    updateOrbScale();
    startTime = null;
    lastSec = null;
    phase = 'join';

    intro.classList.add('hide');
    hideTimer = setTimeout(() => {
      if (phase !== 'menu') intro.classList.add('hidden');
    }, 480);

    result.classList.remove('show');
    setHud(true);
    idleUI();
    updateCount(false);

    // 提醒：iPhone 靜音模式沒有聲音（只提醒一次）
    if (isIOS && soundOn && !tipSeen('silent')) {
      markTip('silent');
      setTimeout(() => toast('🔈 沒聲音嗎？請確認 iPhone 沒有開靜音', 3000), 600);
    }

    rafId = requestAnimationFrame(loop);
  }

  function loop() {
    rafId = null;
    if (phase !== 'join') return;
    rafId = requestAnimationFrame(loop);
    if (startTime === null) return;

    const elapsed = (performance.now() - startTime) / 1000;
    const remain  = ROUND - elapsed;
    const sec     = Math.ceil(Math.max(0, remain));

    setRing(Math.min(1, elapsed / ROUND));

    if (sec !== lastSec) {
      lastSec = sec;
      if (sec > 0) {
        timerEl.textContent = sec;
        timerEl.className = '';
        void timerEl.offsetWidth;

        if (sec <= 1) {
          timerEl.classList.add('danger', 'final');
          sfx.final();
          sfx.heart(1.3);
          buzz([40, 40, 40]);
          vignette.classList.add('on', 'pulse');
          ringWrap.classList.add('danger');
        } else if (sec <= 3) {
          timerEl.classList.add('danger');
          sfx.urgent();
          sfx.heart(1);
          buzz(30);
          vignette.classList.add('on', 'pulse');
          ringWrap.classList.add('danger');
        } else if (sec <= 5) {
          timerEl.classList.add('warn');
          sfx.tickHi();
          vignette.classList.add('on');
          vignette.classList.remove('pulse');
          ringWrap.classList.remove('danger');
        } else {
          sfx.tick();
          vignette.classList.remove('on', 'pulse');
          ringWrap.classList.remove('danger');
        }
        timerEl.classList.add('tick');
      }
    }

    if (remain <= 0) endRound();
  }

  function endRound() {
    if (phase !== 'join') return;
    phase = 'draw';
    startTime = null;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    sfx.whoosh();
    buzz(60);
    flash.classList.remove('on');
    void flash.offsetWidth;
    flash.classList.add('on');

    timerEl.style.display = 'none';
    timerEl.className = '';
    ringWrap.style.display = 'none';
    ringWrap.classList.remove('danger');
    vignette.classList.remove('on', 'pulse');
    hint.textContent = '🎲 抽選中…';

    drawTimer = setTimeout(startDraw, 250);
  }

  function startDraw() {
    const list = [...players.values()];
    if (list.length === 0) { backToMenu(); return; }

    const n = list.length;
    const pick = Math.min(PICK, n);
    const winners = shuffle([...list.keys()]).slice(0, pick);

    // 提醒：人數太少的情況
    if (n === 1) toast('只有 1 人參加，直接中選 😆', 2200);
    else if (PICK >= n) toast('抽出人數 ≥ 參加人數，全部都中選！', 2400);

    list.forEach(p => p.el.classList.add('dim'));

    if (n === 1) {
      list[0].el.classList.add('hl');
      drawTimer = setTimeout(() => finish(winners, list), 600);
      return;
    }

    let cur = Math.floor(Math.random() * n);
    const target = winners[0];
    let steps = n * (n < 4 ? 4 : 2) + ((target - cur + n) % n);
    if (steps < 14) steps += n * Math.ceil((14 - steps) / n);
    if (steps > 60) steps -= n * Math.floor((steps - 40) / n);   // 人很多時別轉太久
    let s = 0;

    function step() {
      list.forEach(p => p.el.classList.remove('hl'));
      cur = (cur + 1) % n;
      list[cur].el.classList.add('hl');
      sfx.roll(s / steps);
      buzz(8);
      s++;
      if (s >= steps) {
        drawTimer = setTimeout(() => finish(winners, list), 450);
        return;
      }
      const delay = 55 + 380 * Math.pow(s / steps, 2.6);
      drawTimer = setTimeout(step, delay);
    }
    step();
  }

  function finish(winners, list) {
    phase = 'result';
    drawTimer = null;
    exitBtn.style.display = 'none';
    const lucky = MODE === 'lucky';

    list.forEach((p, idx) => {
      p.el.classList.remove('hl');
      if (winners.includes(idx)) {
        p.el.classList.remove('dim');
        p.el.classList.add('winner');
        const cr = document.createElement('div');
        cr.className = 'crown';
        cr.textContent = lucky ? '👑' : '💣';
        p.el.querySelector('.body').appendChild(cr);
        burst(p.x, p.y,
          lucky ? [p.color, '#ffffff', '#ffd23f'] : ['#ff3d6e', '#ff8a3d', '#555555'],
          40, 9, true);
      } else {
        p.el.classList.add('dim');
      }
    });

    if (lucky) {
      sfx.win();
      rain(['#ffd23f', '#ff4fa3', '#3be8ff', '#4cff9b', '#9b6bff', '#ffffff'], 140);
    } else {
      sfx.sad();
      rain(['#ff3d6e', '#ff8a3d', '#444444', '#888888'], 70);
    }
    buzz([80, 60, 80, 60, 220]);

    const n = winners.length;
    const big  = result.querySelector('.big');
    const sub  = result.querySelector('.sub');
    const who  = result.querySelector('.who');
    const meta = result.querySelector('.meta');
    if (lucky) {
      big.textContent = n === 1 ? '🎉 就是你！' : `🎉 ${n} 位幸運兒！`;
      sub.textContent = n === 1 ? 'LUCKY YOU!' : 'LUCKY WINNERS!';
    } else {
      big.textContent = n === 1 ? '💣 就是你啦！' : `💣 ${n} 位倒楣鬼！`;
      sub.textContent = 'SORRY～下次好運';
    }
    who.innerHTML = '';
    winners.forEach(i => {
      const p = list[i];
      const tag = document.createElement('span');
      tag.textContent = '#' + p.no;
      tag.style.setProperty('--cd', p.dark);
      who.appendChild(tag);
    });
    meta.textContent = `共 ${list.length} 人參加・抽出 ${n} 人`;

    const first = list[winners[0]];
    result.style.setProperty('--wc', first.color);
    result.style.setProperty('--wd', first.dark);

    hint.style.display = 'none';
    countEl.style.display = 'none';
    result.classList.remove('show');
    void result.offsetWidth;
    result.classList.add('show');
  }

  function backToMenu() {
    phase = 'menu';
    clearTimers();
    clearPlayers();
    startTime = null;

    result.classList.remove('show');
    setHud(false);
    timerEl.className = '';
    ringWrap.classList.remove('danger');
    vignette.classList.remove('on', 'pulse');

    intro.classList.remove('hidden');
    requestAnimationFrame(() => intro.classList.remove('hide'));
  }

  /* 提醒：遊戲中切到別的 App 或鎖螢幕，回來時告知已中斷 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (phase === 'join' || phase === 'draw') {
        interrupted = true;
        backToMenu();
      }
    } else if (interrupted) {
      interrupted = false;
      toast('遊戲中斷了，已回到選單', 2400);
    }
  });

  /* =========================================================
     啟動
     ========================================================= */
  refreshMode();
  refreshJoin();
  refreshToggles();
  refreshInstall();
  setupTipBar();

  // 第一次打開自動顯示玩法說明
  setTimeout(() => {
    if (!tipSeen('guide') && phase === 'menu') openGuide();
  }, 700);
})();
</script>
</body>
</html>
